융과 금융AI 융합전공이 같은 전공인가요? 같은 모집단위라고 생각하지 않습니다. 지원한 글로벌금융의 기초를 충실히 배우고, 별도 융합전공의 이수 조건을 확인해 학습을 확장하고 싶습니다."], "memory": "금융 기초 → 조건 확인 → 데이터 분석·검증", "caution": "", "source_refs": [1, 2, 74], "university": "중앙대", "kind": "답변", "glossary": [1, 36], "note": "이번 보강: 중앙대 금융AI 융합전공 공식 안내를 확인해 연결한 미래 학업계획입니다. 글로벌금융과 같은 전공이라는 뜻이 아닙니다."}, {"id": 163, "question": "경희대에서 무역실무와 AI를 어떻게 연결하고 싶습니까?", "category": "AI 시대의 실행·검증·협업", "answer": ["경희대에서는 무역실무를 먼저 이해한 뒤 AI를 시장조사와 정보 확인에 활용해 보고 싶습니다. 기업 인터뷰를 하며 실제 거래에서는 가격뿐 아니라 납기와 계약조건, 정보를 받은 시점도 중요하다는 걸 배웠습니다. 어떤 업무에 도움이 될지 알아야 기술도 제대로 선택할 수 있다고 생각합니다.", "GTEP에 지원할 조건을 갖추고 참여 기회를 얻는다면, 기업과 바이어의 질문을 정리하고 관련 자료를 확인하는 역할을 맡고 싶습니다. AI가 초안을 만들어도 원문과 적용 조건은 검토하고, 현장의 의견을 반영해 팀의 제안을 고치겠습니다. 저는 빠르게 조사하는 능력과 상대의 요구를 듣고 조율하는 능력을 함께 키우고 싶습니다."], "evidence": ["3학년 · 진로활동 | PDF 4–5쪽 / 인쇄 5–6쪽\n기업과 직접 소통하며 이론과 의사결정 조건을 비교한 경험. 질문지·영문 요청서 작성과 이메일 포함 세 건의 기업 인터뷰.", "3학년 · 실용 경제 | PDF 17쪽 / 인쇄 18쪽\n기업의 지불의사와 실제 수요를 검토한 활동. 유효수요와 지불의사로 사업성을 재검토.", "3학년 · 자율활동 | PDF 4쪽 / 인쇄 5쪽\n정보 문제를 RAG 도구 제작으로 확장."], "concepts": ["1. 현장 프로그램의 목적과 자신이 가져갈 도구를 구분합니다. GTEP의 기업 협력·무역 실무 경험에 관심이 있다는 말과 해당 프로그램이 특정 AI 개발과정을 보장한다는 주장은 다릅니다. 시장조사·바이어 요구 정리의 AI 활용은 학생이 제안한 역할입니다.", "2. 경희대 20기 모집 공지는 2026년 기준 이수학기 등 지원 조건을 제시합니다. 2027년 입학생이 같은 조건으로 즉시 참여할 수 있다는 뜻은 아닙니다. 기초와 언어를 준비하고 실제 지원 연도의 선발 공지를 확인하는 순서로 설명합니다."], "follow": ["GTEP에서 AI 개발을 배우는 것이 핵심인가요? 제가 관심을 둔 핵심은 기업의 수출 업무와 현장을 배우는 것입니다. AI는 필요한 조사와 정리를 돕는 수단으로 활용하고 싶습니다."], "memory": "실무 이해 → 기업 요구 → 근거 확인과 협업", "caution": "", "source_refs": [3, 5], "university": "경희대", "kind": "답변", "glossary": [31, 1]}, {"id": 164, "question": "한국외대에서 국제통상과 AI를 어떻게 연결하고 싶습니까?", "category": "AI 시대의 실행·검증·협업", "answer": ["한국외대에서는 AI를 통상문제의 근거를 찾는 도구로 활용하면서, 그 결과를 검증할 법과 경제의 기초를 갖추고 싶습니다. 제 도구를 만들며 관련 문서를 찾는 것과 그 조항이 해당 거래에 적용된다고 판단하는 것은 다르다는 점을 배웠습니다.", "국제통상법과 국제계약법으로 적용 조건을 읽고, 계량경제학과 국제금융시장분석으로 경제적 영향을 살펴보고 싶습니다. 이후에는 규범과 기업 자료를 연결해 설명하는 프로젝트를 해 보겠습니다. 제 강점인 구현과 발표 경험을 활용하되, 전공 지식으로 판단의 깊이를 채우는 것이 한국외대에서 하고 싶은 공부입니다."], "evidence": ["1학년 · 진로활동 교과 연계 자율 탐구 보고서 활동 | PDF 2쪽 / 인쇄 3쪽\n미중 반도체 갈등에서 안보예외의 의미와 한계를 탐구.", "3학년 · 경제 수학 | PDF 18쪽 / 인쇄 19쪽\n변수를 추가하며 환율 자료의 설명력과 계수 변화를 검토.", "3학년 · 진로활동 | PDF 4–5쪽 / 인쇄 5–6쪽\n관세 부담을 기업의 거래관계와 정보시차로 살펴본 인터뷰."], "concepts": ["1. 통상법·계약법과 계량분석은 다른 질문을 맡습니다. 법 과목으로 적용 범위를 확인하고, 자료 분석으로 경제적 관계와 영향을 검토할 수 있습니다. 규정이 허용되는지와 그 규정의 비용이 큰지는 같은 판단이 아닙니다.", "2. 한국외대 공식 학부교과목 개요에는 국제통상법, 국제계약법, Econometrics, 국제금융시장분석 등이 제시됩니다. Econometrics는 계량경제학을 뜻합니다. 이 과목을 연결한 프로젝트는 학생의 학업계획이며 학과의 확정된 필수 프로젝트 이름이 아닙니다."], "follow": ["AI 관련 학과 대신 국제통상학과를 선택한 이유는요? 제가 중심에 두는 문제는 국경을 넘는 거래의 규칙과 비용입니다. 그 문제를 판단할 법과 경제의 기초를 먼저 배우고 AI를 필요한 도구로 활용하고 싶습니다."], "memory": "규칙 읽기 → 자료 분석 → 검증 가능한 설명", "caution": "", "source_refs": [6, 7], "university": "한국외대", "kind": "답변", "glossary": [3, 20, 66], "note": "공식 페이지의 과목 표기는 Econometrics입니다. 본문에서는 계량경제학이라는 뜻을 함께 설명했습니다. 실제 개설과 수강 조건은 해당 학기 안내를 확인합니다."}], "glossary": [{"term": "AI", "full": "Artificial Intelligence", "ko": "인공지능", "context": "원기록·전공 전반", "explain": "사람의 지적 과업과 관련된 예측·분류·생성 등을 수행하도록 만든 시스템과 연구 분야입니다. 생성형 AI는 새로운 문장 등을 생성하는 AI의 한 부류이며, AI 전체가 언어모델은 아닙니다.", "example": "예시: 문서를 분류하는 모델과 문장을 쓰는 모델은 서로 다른 과업을 맡습니다. 경준의 도구는 통상정보의 검색과 설명에 AI를 연결했습니다.", "pitfall": "AI를 썼다는 사실만으로 자율적 연구능력이나 정확성이 입증되지는 않습니다. 목적·설계·검토에서 자신의 역할을 말합니다.", "qs": [61, 69, 70, 147, 148], "refs": [17, 28, 33]}, {"term": "LLM", "full": "Large Language Model", "ko": "대규모 언어모델", "context": "원기록·AI 해설", "explain": "많은 언어자료를 학습하여 입력 문맥에 맞는 토큰의 다음 출력을 계산하는 모델입니다. 언어 생성 능력과 세계의 사실을 정확히 확인하는 능력은 같지 않습니다. 크다는 말 자체가 신뢰의 보증도 아닙니다.", "example": "예시: 관세의 예외를 묻는 문장에 그럴듯한 설명을 만들 수 있어도, 적용 연도와 품목은 원문으로 대조해야 합니다.", "pitfall": "모델이 외부 자료를 전혀 사용할 수 없다고 정의하지 않습니다. 검색·도구·사용자 제공 문서가 결합될 수 있습니다.", "qs": [62, 66, 70], "refs": [28]}, {"term": "RAG", "full": "Retrieval-Augmented Generation", "ko": "검색 증강 생성", "context": "원기록·3학년 자율", "explain": "질문과 관련된 문서 또는 문서조각을 검색해 생성모델의 입력 문맥에 넣는 구조입니다. Retrieval은 검색, Augmented는 보강된, Generation은 생성을 뜻합니다. 문서 선택과 답변 해석을 따로 점검해야 합니다.", "example": "예시: 관세 질문 → 관련 조항 검색 → 모델에 근거 제공 → 조건을 포함해 답변. 경준은 근거 조항 공개와 질문분해·다중검색 등을 구현했습니다.", "pitfall": "검색이 맞아도 생성이 틀릴 수 있고, 출처가 있어도 모든 문장이 출처에 근거한 것은 아닙니다.", "qs": [1, 3, 61, 62, 66, 68], "refs": [28]}, {"term": "TF-IDF", "full": "Term Frequency–Inverse Document Frequency", "ko": "단어 빈도–역문서 빈도", "context": "원기록·3학년 자율", "explain": "TF는 한 문서 안의 단어 출현 정도, IDF는 전체 문서에서 흔하지 않은 단어의 구별력을 반영합니다. 문서를 단어별 가중치 벡터로 만든 뒤 질문과 비교합니다. 단어의 중요도이지 법적 타당성의 점수가 아닙니다.", "example": "가상 예시: 100개 문서 모두에 있는 “규정”보다 5개에만 있는 “원산지”가 문서를 가르는 데 유용할 수 있습니다.", "pitfall": "TF의 정규화, 로그·평활화의 적용 여부에 따라 수식은 달라집니다. 자신의 코드에서 실제 계산식을 확인합니다.", "qs": [3, 61, 63, 64, 65], "refs": [29]}, {"term": "TF", "full": "Term Frequency", "ko": "단어 빈도", "context": "TF-IDF 구성요소", "explain": "문서 안에 단어가 얼마나 나오는지를 나타내는 값입니다. 단순 출현횟수를 쓰거나 문서 길이로 나누거나 로그를 취할 수 있습니다. 어떤 방식을 썼는지 구현에 따라 확인해야 합니다.", "example": "가상 예시: 같은 단어가 10회 나와도 100단어 문서와 1만 단어 문서에서는 의미가 다를 수 있습니다.", "pitfall": "빈도가 높다고 중요한 법적 요건인 것은 아닙니다. 짧은 예외조항은 반복이 적어도 중요할 수 있습니다.", "qs": [63, 64], "refs": [29]}, {"term": "IDF", "full": "Inverse Document Frequency", "ko": "역문서 빈도", "context": "TF-IDF 구성요소", "explain": "전체 문서 수와 그 단어가 나타난 문서 수를 비교해 흔한 단어의 가중치를 줄입니다. 단순형은 log(N/df)로 설명할 수 있지만 실제 도구는 상수와 평활화를 넣을 수 있습니다.", "example": "가상 예시: N=100에서 df=10인 단어는 df=100인 단어보다 단순형 IDF가 큽니다. 로그의 밑은 비교 목적과 구현에 따라 다릅니다.", "pitfall": "드문 단어가 꼭 질문에 관련된 단어는 아닙니다. 오탈자나 고유명사도 드물 수 있습니다.", "qs": [63, 64], "refs": [29]}, {"term": "CAI", "full": "Constitutional AI (AI = Artificial Intelligence)", "ko": "헌법적 AI", "context": "원기록·3학년 추가 세특", "explain": "명시된 원칙을 이용해 모델 응답의 비판·수정 자료와 선호 피드백을 구성하는 접근입니다. 국가 헌법을 기계적으로 적용한다는 뜻이 아닙니다. 대표 연구에는 지도학습과 AI 피드백을 활용한 강화학습 단계가 있습니다.", "example": "예시: 정해 둔 안전 원칙에 비추어 응답을 평가하고 수정하도록 학습자료를 만들 수 있습니다. 경준은 원칙 내재화와 근거 공개 방식의 차이를 탐구했습니다.", "pitfall": "RAG와 배타적인 기술이 아닙니다. 원칙으로 학습한 모델에도 외부 근거 검색을 결합할 수 있습니다.", "qs": [38, 68, 131, 160], "refs": [17, 63]}, {"term": "RLAIF", "full": "Reinforcement Learning from AI Feedback", "ko": "AI 피드백 기반 강화학습", "context": "CAI 이해를 위한 보충", "explain": "AI가 평가한 선호 등의 피드백을 강화학습에 활용하는 접근입니다. 사람이 원칙과 평가방식을 정하는 단계까지 사라진다는 뜻은 아닙니다. 피드백 모델의 편향과 오류도 검토해야 합니다.", "example": "예시: 두 답 중 원칙에 더 부합하는 답을 AI가 평가한 자료로 선호모델을 만들고 학습의 보상에 활용합니다.", "pitfall": "경준이 RLAIF로 모델을 직접 훈련했다는 기록은 없습니다. 자신의 RAG 구현과 구분합니다.", "qs": [68, 131, 160], "refs": [17, 63]}, {"term": "RLHF", "full": "Reinforcement Learning from Human Feedback", "ko": "인간 피드백 기반 강화학습", "context": "RLAIF와 비교하는 보충", "explain": "사람의 선호평가 등으로 학습 신호를 구성하는 방식입니다. 대표적 방식은 사람의 비교평가로 보상모델을 만들고 이를 이용해 모델을 조정하는 것입니다. 모든 선호학습 방법이 같은 절차를 쓰지는 않습니다.", "example": "비교: RLHF와 RLAIF는 피드백을 주로 누가 만드는지의 차이를 설명할 때 유용합니다.", "pitfall": "사람이 평가했으니 완전히 객관적이거나 정확하다고 할 수 없습니다. 평가자와 기준의 영향을 받습니다.", "qs": [68, 160], "refs": [17]}, {"term": "NLP", "full": "Natural Language Processing", "ko": "자연어 처리", "context": "AI 논문을 읽기 위한 보충", "explain": "사람의 언어를 컴퓨터로 분석·생성·변환하는 분야입니다. 검색, 분류, 번역, 요약, 질문응답 등을 포함합니다. LLM은 자연어 처리의 여러 접근 가운데 하나입니다.", "example": "예시: 기업 문의를 주제별로 분류하는 일과 법규 문서를 검색하는 일은 서로 다른 NLP 과업입니다.", "pitfall": "언어를 유창하게 다루는 것과 법적 의미를 정확히 판단하는 것은 다릅니다.", "qs": [62, 63], "refs": [28, 29]}, {"term": "API", "full": "Application Programming Interface", "ko": "응용 프로그램 인터페이스", "context": "도구 구현 설명을 위한 보충", "explain": "프로그램 사이에서 기능을 요청하고 결과를 주고받기 위한 규칙과 접점입니다. 입력 형식, 인증, 반환 형식 등을 정합니다. API는 특정 AI 모델의 이름이 아닙니다.", "example": "가상 예시: 웹사이트가 모델 서비스에 질문을 보내고 응답을 받아 화면에 표시하는 연결에 API를 쓸 수 있습니다.", "pitfall": "현재 자료는 실제 사용한 API·모델·개발환경을 확정하지 않습니다. 본인의 코드로 확인합니다.", "qs": [70, 149], "refs": [28]}, {"term": "코사인 유사도", "full": "Cosine Similarity", "ko": "벡터 방향의 유사성", "context": "TF-IDF 이해 보충", "explain": "두 벡터의 내적을 두 벡터 길이의 곱으로 나눈 값입니다. 같은 방향이면 1이며 일반적인 범위는 -1부터 1입니다. 비음수 TF-IDF 벡터끼리는 보통 0부터 1 범위입니다.", "example": "가상 예시: 질문과 문서에 중요한 단어가 비슷하게 배치되면 벡터의 방향이 가까워져 점수가 높을 수 있습니다.", "pitfall": "0.9는 90% 정답확률이 아닙니다. 원 도구가 코사인 유사도를 썼는지는 코드로 확인합니다.", "qs": [63, 65], "refs": [29]}, {"term": "임베딩", "full": "Embedding", "ko": "벡터 표현", "context": "검색 개선안·보충", "explain": "문장·문서 등 대상을 숫자 벡터로 나타내는 방법입니다. 학습된 의미 표현은 단어가 달라도 관련 내용을 가깝게 나타낼 수 있습니다. 어떤 모델과 학습목적을 쓰는지에 따라 거리의 의미가 달라집니다.", "example": "가상 예시: “수입 제한”과 유사한 표현이 서로 가까운 벡터가 되어 단어기반 검색의 누락을 줄일 수 있습니다.", "pitfall": "의미가 가깝다고 적용 조항이 같은 것은 아닙니다. 경준의 현재 TF-IDF 구현과 미래 개선안을 구분합니다.", "qs": [64], "refs": [28, 29]}, {"term": "정밀도·재현율", "full": "Precision / Recall", "ko": "검색 결과의 적절성과 누락 정도", "context": "도구 평가를 위한 보충", "explain": "정밀도는 가져온 결과 중 관련 결과의 비율, 재현율은 실제 관련 결과 중 가져온 비율입니다. 둘은 다른 종류의 오류를 드러냅니다. 먼저 무엇을 관련 문서로 볼지 기준이 필요합니다.", "example": "가상 예시: 관련 문서가 4개인데 5개를 검색해 그중 3개가 관련되면 정밀도는 3/5, 재현율은 3/4입니다.", "pitfall": "F1은 두 값의 조화평균 2PR/(P+R)입니다. 경준의 측정된 성능 수치로 말하지 않습니다.", "qs": [64, 66, 67, 157], "refs": [28, 29]}, {"term": "할루시네이션", "full": "Hallucination", "ko": "근거·사실과 불일치하는 생성", "context": "원기록·AI 검증", "explain": "출력이 자연스러워도 사실과 맞지 않거나 제공된 근거를 벗어날 수 있는 현상입니다. 문서를 잘못 찾는 오류, 근거를 잘못 해석하는 오류, 근거 없이 덧붙이는 주장을 나눠 살펴봅니다.", "example": "가상 예시: 실제 문서에 없는 예외를 있다고 설명하거나 이미 바뀐 조항을 현재 규정으로 말하는 경우입니다.", "pitfall": "용어는 오류 현상을 뜻합니다. AI가 사람처럼 의도적으로 거짓말했다는 설명으로 단정하지 않습니다.", "qs": [62, 66, 150], "refs": [28]}, {"term": "골드스탠더드", "full": "Gold Standard", "ko": "검증에 쓰는 기준자료", "context": "원기록·신뢰 한계", "explain": "평가에서 정답이나 판단 기준으로 삼는 신뢰할 만한 자료입니다. 범위, 시점, 필수 근거, 허용 가능한 대안, 답변보류 조건을 정해야 합니다. 기준 자체도 수정될 수 있습니다.", "example": "예시: 법규 질문의 답뿐 아니라 적용 연도와 대상, 관련 예외까지 검토한 평가세트를 만드는 계획입니다.", "pitfall": "골드스탠더드가 있다는 사실이 절대적 진리를 뜻하지 않습니다. 개발 중 본 문제만 평가하면 과적합 우려가 있습니다.", "qs": [67, 150, 157], "refs": [28]}, {"term": "WTO", "full": "World Trade Organization", "ko": "세계무역기구", "context": "원기록·1~3학년 통상", "explain": "회원국 간 무역규칙과 협상·분쟁해결의 제도적 틀을 제공합니다. 협정상 의무의 주체와 개별 기업이 실제로 준수하는 국내 규정을 구별해야 합니다.", "example": "예시: 기업이 관세 부담을 호소하는 것과 회원국의 조치가 WTO 협정을 위반하는지는 다른 판단입니다.", "pitfall": "특정 조치의 위법성을 피해의 크기나 명칭만으로 확정하지 않습니다.", "qs": [33, 39, 40, 131], "refs": [10, 14, 18]}, {"term": "GATT", "full": "General Agreement on Tariffs and Trade", "ko": "관세 및 무역에 관한 일반협정", "context": "원기록·안보예외", "explain": "상품무역의 기본 규율을 담은 협정입니다. 최혜국대우, 내국민대우, 관세양허와 예외 등 여러 규칙을 포함합니다. WTO라는 기구와 GATT라는 협정은 같은 명칭이 아닙니다.", "example": "예시: 안보예외를 공부할 때에는 GATT 제21조의 어느 항목이 문제인지 먼저 정합니다.", "pitfall": "제21조가 모든 무역의무를 자동으로 면제하는 자유이용 조항은 아닙니다.", "qs": [33, 34, 35, 40], "refs": [10, 11]}, {"term": "GATS", "full": "General Agreement on Trade in Services", "ko": "서비스무역에 관한 일반협정", "context": "상품·서비스 구별 보충", "explain": "서비스무역에 대한 WTO 협정입니다. 상품의 특성·표준을 다루는 TBT와 검토의 출발점이 다르며, 서비스 공급방식과 양허 등도 확인해야 합니다.", "example": "예시: 순수한 AI 서비스 이용조건을 제품 안전규격과 똑같이 TBT만으로 판단하지 않습니다.", "pitfall": "디지털 형태라고 언제나 서비스 또는 언제나 상품으로 단정하지 않습니다. 대상과 조치의 성격을 봅니다.", "qs": [38, 39, 40], "refs": [18, 19]}, {"term": "TBT", "full": "Technical Barriers to Trade", "ko": "무역에 대한 기술장벽", "context": "원기록·AI 규범", "explain": "협정의 정식 명칭은 Agreement on Technical Barriers to Trade입니다. 제품 관련 기술규정·표준·적합성평가가 불필요한 무역장애가 되지 않도록 규율하는 틀입니다. 정당한 보호 목적과 구체적인 의무를 함께 검토합니다.", "example": "예시: 안전기준에 비용이 생긴다는 이유만으로 위반은 아닙니다. 대상·의무성·대우와 정당화 조건을 먼저 봅니다.", "pitfall": "비정부 표준화기관 관련 조항도 있습니다. 민간이 만들었다는 이유만으로 협정 밖이라고 결론내리지 않습니다.", "qs": [36, 37, 38, 39, 131], "refs": [14, 15, 16]}, {"term": "DS512", "full": "Dispute Settlement 사건번호 512", "ko": "러시아 통과운송 조치 분쟁", "context": "면접 대비 추가 학습", "explain": "DS는 WTO 분쟁사건 식별표기이고 512는 사건번호입니다. 이 사건은 GATT 제21조 (b)(iii)의 상황 요건과 선의 등 심사가능 범위를 이해하는 데 참고됩니다.", "example": "연결: 원래 생기부는 안보예외 탐구를 확인합니다. 이 사건을 직접 분석했다는 기록은 없으므로 추가로 공부한 사례라고 말합니다.", "pitfall": "이 판정으로 모든 반도체 통제가 적법 또는 위법하다고 결론내리지 않습니다.", "qs": [33, 34, 35], "refs": [11, 12]}, {"term": "FTA", "full": "Free Trade Agreement", "ko": "자유무역협정", "context": "원기록 연계 개념", "explain": "참여국 사이의 관세 인하와 시장접근 등 거래조건을 약속하는 협정입니다. 협정마다 대상·원산지·서비스·절차가 달라 존재 자체가 모든 기업의 혜택을 뜻하지 않습니다.", "example": "가상 예시: 관세를 절약할 수 있어도 원산지 증명에 드는 비용이 더 크면 활용 유인이 작을 수 있습니다.", "pitfall": "국내에서 마지막 조립을 했다고 자동으로 특혜 원산지가 인정되는 것은 아닙니다.", "qs": [40, 56, 118], "refs": [18, 19]}, {"term": "MFN", "full": "Most-Favoured-Nation Treatment", "ko": "최혜국대우", "context": "GATT 기초 보충", "explain": "한 회원국에 준 유리한 대우를 다른 회원국에도 적용한다는 비차별 원칙입니다. 가장 좋아하는 한 나라만 특별대우한다는 뜻이 아닙니다. 관련 예외와 조건이 있습니다.", "example": "예시: FTA의 참여국 특혜는 다자규범의 일반 원칙과 관련 예외를 함께 살펴야 합니다.", "pitfall": "모든 종류의 대우를 조건 없이 똑같이 해야 한다는 단순 명제로 설명하지 않습니다.", "qs": [40], "refs": [10, 18]}, {"term": "NT", "full": "National Treatment", "ko": "내국민대우", "context": "GATT·TBT 기초 보충", "explain": "해당 규율에서 수입품과 국내 동종상품 등의 대우를 비교하는 비차별 원칙입니다. 구체적인 판단은 조문과 사실관계에 따라 다릅니다.", "example": "가상 예시: 같은 위험의 상품인데 수입품에만 불리한 내부 절차가 적용되는지 검토할 수 있습니다.", "pitfall": "최혜국대우는 외국들 사이의 비교, 내국민대우는 국내·외국 대상의 비교라는 출발점을 구분합니다.", "qs": [36, 37, 40], "refs": [10, 14]}, {"term": "CBAM", "full": "Carbon Border Adjustment Mechanism", "ko": "탄소국경조정제도", "context": "원기록·정치와 법, 심화 수학Ⅰ", "explain": "EU가 적용대상 수입품의 내재배출에 탄소가격을 반영해 탄소누출을 줄이려는 제도입니다. 배출을 줄이는 일과 배출량을 측정·입증하는 비용은 구별됩니다. 세부 적용과 의무는 현재 규정을 확인해야 합니다.", "example": "연결: 정치와 법은 가상 인터뷰 기사, 심화 수학Ⅰ은 비용전가와 이윤의 모형입니다. 2026년 1월 1일 본 시행 단계 진입은 현재 공식자료로 보충한 내용입니다.", "pitfall": "모든 수입품에 동일 세율을 붙이는 일반 관세라고 설명하지 않습니다. 원 활동의 시점과 현재 제도도 나눕니다.", "qs": [119, 128], "refs": [54]}, {"term": "EU ETS", "full": "European Union Emissions Trading System", "ko": "유럽연합 배출권거래제", "context": "CBAM 연계 보충", "explain": "배출총량과 배출권 거래를 이용하는 탄소가격 제도입니다. 배출권 가격과 무상할당의 조정은 CBAM을 이해할 때 함께 살펴볼 요소입니다.", "example": "가상 예시: 배출에 비용이 생기면 기업은 감축투자와 가격조정 등을 비교할 수 있습니다.", "pitfall": "ETS는 배출권 거래 체계, CBAM은 수입품 관련 국경조정 장치입니다. 동일한 절차가 아닙니다.", "qs": [119, 128], "refs": [54]}, {"term": "AI-TPOI", "full": "AI Trade Policy Openness Index (AI = Artificial Intelligence)", "ko": "AI 무역정책 개방성 지수", "context": "원기록의 WTO 지표·영문 보충", "explain": "WTO 세계무역보고서 2025의 지표입니다. 108개 경제를 대상으로 상품·서비스·국경 간 데이터 흐름 관련 정책을 결합합니다. 이름에 개방성이 있어도 값이 1에 가까울수록 덜 개방적이라는 방향을 주의해야 합니다.", "example": "연결: 경준은 이런 정책 중심 지표에 민간 AI 원칙의 채택 영향이 얼마나 반영되는지 질문하고 보완지표를 제안했습니다.", "pitfall": "AI 성능 순위나 기업의 AI 보급률이 아닙니다. 제안한 점유율 가중 채택률과 공식 AI-TPOI를 혼합하지 않습니다.", "qs": [39, 131], "refs": [64, 79]}, {"term": "HS", "full": "Harmonized Commodity Description and Coding System", "ko": "통일상품명 및 부호체계", "context": "반도체 무역자료 이해 보충", "explain": "국제적으로 상품을 분류하는 품목코드 체계입니다. 공통 6자리 아래의 세분은 국가별로 달라질 수 있고 개정판에 따라 코드 범위도 확인해야 합니다.", "example": "예시: 반도체 자료를 비교할 때 품목코드가 같은 연도·분류판을 가리키는지 확인합니다. HS 8541과 8542를 모든 반도체의 동일 범위로 취급하지 않습니다.", "pitfall": "원 분석파일에서 실제 코드·개정판을 확인하기 전 세부 품목별 결과를 새로 만들지 않습니다.", "qs": [112], "refs": [8, 43]}, {"term": "NAFTA", "full": "North American Free Trade Agreement", "ko": "북미자유무역협정", "context": "원기록·세계지리", "explain": "미국·캐나다·멕시코 간의 과거 협정입니다. 국경 생산네트워크를 역사적으로 설명할 때 쓰며 현행 협정명과 구별해야 합니다.", "example": "연결: 마킬라도라의 위치와 생산체계를 살필 때 협정뿐 아니라 임금·물류·국내제도도 함께 봅니다.", "pitfall": "현재 북미 협정을 NAFTA라고 부르지 않습니다. USMCA는 2020년 7월 1일 발효했습니다.", "qs": [118], "refs": [53]}, {"term": "USMCA", "full": "United States–Mexico–Canada Agreement", "ko": "미국·멕시코·캐나다 협정", "context": "NAFTA 후속 보충", "explain": "북미 거래의 현재 협정 틀을 가리키는 명칭입니다. 국가별 명칭은 CUSMA·T-MEC 등 다를 수 있으며 구체적 규정은 현행 본문으로 확인합니다.", "example": "예시: 과거 생산입지의 배경은 NAFTA로 설명하되 현재 기업의 적용 규칙은 USMCA 기준으로 확인합니다.", "pitfall": "협정의 교체를 생산구조 전체가 즉시 바뀐 것처럼 설명하지 않습니다.", "qs": [118], "refs": [53]}, {"term": "GTEP", "full": "Global Trade Experts Incubating Program", "ko": "지역특화청년무역전문가양성사업", "context": "경희대 관심 프로그램", "explain": "무역교육과 기업의 해외시장 활동 등을 연결하는 인력양성사업입니다. 영어명에는 기관별 Expert/Experts 표기 차이가 보이지만 사업명과 실제 선발 공고를 기준으로 준비합니다.", "example": "경희대의 확인된 20기 모집은 2026년 기준 3·4학년 등 조건을 제시했습니다. 입학 후 기초를 쌓고 해당 연도 공고에 따라 지원하는 계획입니다.", "pitfall": "신입생 전원 참여나 2027년 이후 선발·활동·지원금이 보장된다고 말하지 않습니다.", "qs": [20, 21, 22, 31, 163], "refs": [5, 82]}, {"term": "7+1", "full": "학부 8학기 가운데 한 학기를 해외에서 공부하는 취지의 명칭", "ko": "한국외대 파견학생 프로그램", "context": "학교 프로그램·영어 약자 아님", "explain": "숫자로 표현한 프로그램명이며 영어 단어의 머리글자가 아닙니다. 지원 유형과 파견교에 따라 학업·언어·선발 조건이 있습니다.", "example": "확인한 2027-1 영어권 공고는 이수학기·평점·어학 등의 자격을 제시합니다. 경준이 입학 즉시 참여하는 계획은 아닙니다.", "pitfall": "지원 시점의 자격과 학점인정·비용 조건을 확인합니다. 특정 학교 배정이나 장학금은 확약하지 않습니다.", "qs": [27, 28], "refs": [9]}, {"term": "PPP", "full": "Purchasing Power Parity", "ko": "구매력평가", "context": "원기록·수학Ⅰ와 동아리", "explain": "같은 상품 바구니의 구매력을 기준으로 통화를 비교하는 개념입니다. 절대 PPP는 가격수준, 상대 PPP는 기준시점 이후의 물가 변화와 환율 변화를 연결합니다.", "example": "가상 예시: 같은 바구니가 한국 10만 원, 미국 100달러라면 절대 PPP 환율은 1달러당 1천 원입니다.", "pitfall": "각국 CPI를 그대로 나눈 값을 절대 적정환율이라고 하지 않습니다. 다른 분야의 Public–Private Partnership과도 구별합니다.", "qs": [41, 42, 43], "refs": [20]}, {"term": "CPI", "full": "Consumer Price Index", "ko": "소비자물가지수", "context": "원기록·PPP 분석", "explain": "소비자가 구입하는 재화·서비스 바구니의 가격 변화를 지수로 나타냅니다. 지수의 기준연도가 같아 보여도 국가 간 실제 가격수준이 같다는 뜻은 아닙니다.", "example": "가상 예시: 두 나라의 CPI가 모두 100에서 출발해도 한 나라의 같은 상품 가격이 다른 나라보다 높을 수 있습니다.", "pitfall": "지수수준의 비율과 물가상승률의 차이를 혼동하지 않습니다. 바구니 구성·기준연도·관측주기를 확인합니다.", "qs": [41, 43, 50], "refs": [20]}, {"term": "달러지수·DXY", "full": "U.S. Dollar Index / DXY는 통상적 시장 식별표기", "ko": "달러 가치 지표", "context": "원기록·경제 수학", "explain": "달러의 가치를 여러 통화와 비교하는 지표입니다. 지표별 통화 구성과 가중치가 다를 수 있습니다. DXY는 일반적으로 특정 달러지수를 가리키지만 모든 달러지수의 동의어는 아닙니다.", "example": "연결: 경제 수학에서 달러지수를 추가했다는 기록은 확인됩니다. 정확한 지표명과 자료 제공처는 원 데이터로 확인해야 합니다.", "pitfall": "생기부의 “달러지수”만으로 사용한 자료가 반드시 DXY라고 단정하지 않습니다.", "qs": [44, 127], "refs": [21]}, {"term": "OLS", "full": "Ordinary Least Squares", "ko": "보통최소제곱법", "context": "회귀 원리 보충", "explain": "관측값과 모형의 적합값 사이 차이의 제곱합을 최소화하도록 계수를 정하는 방법입니다. 제곱을 쓰면 양수·음수 오차가 단순 상쇄되지 않습니다.", "example": "기초식: yᵢ = a + bxᵢ + uᵢ. 추정 뒤 잔차는 eᵢ = yᵢ − ŷᵢ입니다. 오차항 uᵢ는 이론적이고 잔차 eᵢ는 계산 가능합니다.", "pitfall": "OLS 계산이 가능하다고 계수가 인과효과인 것은 아닙니다. 설명변수와 오차의 관계 등을 확인해야 합니다.", "qs": [44, 46, 48], "refs": [21, 22]}, {"term": "R²", "full": "Coefficient of Determination", "ko": "결정계수·약자가 아닌 수학 기호", "context": "원기록·회귀 설명력", "explain": "통상적인 절편 포함 OLS에서 평균을 기준으로 한 전체 변동 중 모형이 설명한 비중입니다. R² = 1 − SSE/SST로 쓸 수 있습니다.", "example": "경준의 기록: 같은 분석에서 약 0.54→0.88. 이는 표본 내 설명력 개선이며 금리차 계수의 변화와 함께 읽어야 합니다.", "pitfall": "88%의 관측값을 정확히 맞혔다는 뜻도, 환율 원인의 88%를 증명했다는 뜻도 아닙니다.", "qs": [44, 45, 85, 127], "refs": [21]}, {"term": "SSE·SST", "full": "Sum of Squared Errors / Total Sum of Squares", "ko": "잔차제곱합 / 총제곱합", "context": "R² 수식 이해 보충", "explain": "SSE는 관측값과 적합값의 차이를 제곱해 더한 값, SST는 관측값과 표본평균의 차이를 제곱해 더한 값입니다. 표기 SSR은 교재에 따라 회귀제곱합 또는 잔차제곱합으로 달라 정의를 확인해야 합니다.", "example": "가상 예시: SST=100, SSE=20이면 통상적 R²는 0.8입니다. 단위는 원래 종속변수 단위의 제곱입니다.", "pitfall": "기호가 같다고 서로 다른 자료·교재에서 정의까지 같다고 가정하지 않습니다.", "qs": [45], "refs": [21]}, {"term": "VIF", "full": "Variance Inflation Factor", "ko": "분산팽창계수", "context": "원기록·경제 수학", "explain": "한 설명변수가 다른 설명변수들과 선형으로 얼마나 겹치는지와 관련된 지표입니다. VIFⱼ = 1/(1−Rⱼ²)이며 여기서 Rⱼ²는 그 설명변수를 나머지 설명변수로 회귀한 보조회귀의 결정계수입니다.", "example": "가상 예시: Rⱼ²=0.8이면 VIF=5입니다. 경준은 VIF 5 미만을 확인했다는 기록이 있습니다.", "pitfall": "VIF<5가 내생성·자기상관·비정상성이 없다는 증거는 아닙니다. 5는 보편적인 법칙이 아닌 참고 기준입니다.", "qs": [16, 127], "refs": [21]}, {"term": "IV", "full": "Instrumental Variable", "ko": "도구변수", "context": "원기록의 개념 검토", "explain": "내생적인 설명변수와 관련되면서 결과에 다른 경로로 영향을 주지 않는 외생적 변동을 이용하려는 방법의 변수입니다. 관련성·배제제약·외생성의 논거가 필요합니다.", "example": "예시: 거리는 무역량에 운송비로 직접 영향을 줄 수 있으므로 외생적으로 보인다는 이유만으로 아무 회귀에서나 도구로 삼을 수 없습니다.", "pitfall": "이 문맥에서 IV는 Independent Variable이 아닙니다. 유효한 도구 확보와 완성된 추정이 기록됐다고 확대하지 않습니다.", "qs": [48, 49, 113], "refs": [8, 22]}, {"term": "2SLS", "full": "Two-Stage Least Squares", "ko": "2단계 최소제곱법", "context": "방법론 검토·실행 범위 구별", "explain": "1단계에서 내생 설명변수를 도구와 외생 통제변수로 설명해 예측값을 얻고, 2단계에서 그 예측값과 통제변수로 결과를 설명합니다. 실제 추정은 적절한 표준오차도 계산해야 합니다.", "example": "학습용 예시: X의 전체 변화 대신 타당한 Z가 설명한 변화로 Y와의 관계를 추정한다는 직관입니다.", "pitfall": "회귀를 두 번 실행했다고 인과성이 생기지 않습니다. 경준에게 유효한 도구 검증과 완성된 추정 수치가 확인되는 것은 아닙니다.", "qs": [26, 48, 49, 112], "refs": [8, 22]}, {"term": "CI", "full": "Confidence Interval", "ko": "신뢰구간", "context": "원기록·확률과 통계", "explain": "표본에서 계산한 추정의 불확실성을 구간으로 표현합니다. 신뢰수준은 반복표집으로 만든 구간의 장기적인 포함 비율에 관한 성질입니다. 이미 계산한 구간과 고정된 모수의 관계를 확률처럼 바꿔 말하지 않습니다.", "example": "99% 양측 구간: 표본평균 ± 임계값×표준오차. 모표준편차 미지이면 조건에 맞는 t값을 쓰는 것이 기본입니다.", "pitfall": "관측구간에 모평균이 99% 확률로 있다는 말과 표본의 99%가 들어 있다는 말을 모두 피합니다.", "qs": [50], "refs": [23]}, {"term": "SE", "full": "Standard Error", "ko": "표준오차", "context": "신뢰구간 보충", "explain": "추정량이 표본마다 달라지는 정도입니다. 독립·동일분포 표본의 평균에서는 보통 s/√n으로 추정합니다. 개별 관측값의 흩어짐인 표준편차 SD와 다릅니다.", "example": "가상 예시: 다른 조건이 같으면 표본 수를 4배로 늘릴 때 평균의 표준오차는 절반이 됩니다.", "pitfall": "표본이 편향되면 SE가 작아도 모집단을 정확히 대표하지 않을 수 있습니다.", "qs": [50], "refs": [23]}, {"term": "SD", "full": "Standard Deviation", "ko": "표준편차", "context": "통계 기초 보충", "explain": "관측값이 평균 주변에 얼마나 퍼져 있는지를 나타내는 지표입니다. 평균과 같은 단위로 표현합니다. 표본표준편차의 분모 n−1은 모분산 추정의 성질과 관련됩니다.", "example": "가상 예시: 평균 기대인플레이션이 같아도 응답이 넓게 퍼진 집단의 SD는 더 클 수 있습니다.", "pitfall": "SD는 표본평균의 불확실성인 SE와 다릅니다. 둘을 신뢰구간 계산에서 혼동하지 않습니다.", "qs": [50, 120], "refs": [23]}, {"term": "IQR", "full": "Interquartile Range", "ko": "사분위범위", "context": "원기록·이상치 민감도", "explain": "세 번째 사분위수 Q3에서 첫 번째 사분위수 Q1을 뺀 값입니다. 가운데 절반 자료의 범위를 나타내며 이상치 후보를 찾는 데도 활용됩니다.", "example": "통상적 탐색 기준: Q1−1.5IQR 아래 또는 Q3+1.5IQR 위의 관측값을 점검할 수 있습니다.", "pitfall": "기준 밖이라고 모두 오류는 아닙니다. 드물지만 유효한 응답을 삭제할 수 있어 처리 전후를 비교해야 합니다.", "qs": [50], "refs": [23]}, {"term": "z·t", "full": "Standard Normal / Student’s t", "ko": "정규 임계값·t 임계값", "context": "신뢰구간 기호", "explain": "99% 양측 표준정규 임계값은 약 2.576입니다. 모표준편차를 모르면 정규모집단 등의 조건 아래 자유도 n−1의 t값을 쓰며 표본이 작을수록 차이가 중요합니다.", "example": "연결: 기존 탐구의 실제 표본수와 모표준편차의 알려짐 여부를 확인한 뒤 어떤 공식을 사용했는지 말합니다.", "pitfall": "99%라고 2.576을 언제나 대입하지 않습니다. 정규근사와 표집 가정을 설명합니다.", "qs": [50], "refs": [23]}, {"term": "GDP", "full": "Gross Domestic Product", "ko": "국내총생산", "context": "거시경제 기초 보충", "explain": "일정 기간 한 경제영역 안에서 생산된 최종 재화·서비스의 가치를 측정합니다. 명목·실질, 총액·1인당, 시장환율·PPP 환산을 구분해야 합니다.", "example": "가상 예시: 달러 환산 GDP가 환율 때문에 줄어도 국내 생산량이 같은 비율로 줄었다는 뜻은 아닙니다.", "pitfall": "GDP 증가와 분배 개선은 다른 질문입니다. 삶의 질과 환경 비용을 모두 보여 주는 단일 지표도 아닙니다.", "qs": [109, 112, 129], "refs": [20, 50]}, {"term": "FDI", "full": "Foreign Direct Investment", "ko": "외국인직접투자·해외직접투자", "context": "사회자본·투자 유치 보충", "explain": "다른 경제의 기업에 지속적인 이해관계와 경영 영향력을 갖는 투자입니다. 통계에서는 일반적으로 의결권 10% 이상을 직접투자 관계의 기준으로 사용합니다. 단기 증권투자와 구분합니다.", "example": "예시: 해외 공장 지분을 통해 경영에 관여하는 투자와 단순한 소액 주식 보유는 통계 분류가 다를 수 있습니다.", "pitfall": "사회자본과 FDI가 함께 높다고 신뢰의 인과효과를 곧바로 확정하지 않습니다.", "qs": [113, 118], "refs": [44, 45]}, {"term": "CBDC", "full": "Central Bank Digital Currency", "ko": "중앙은행 디지털화폐", "context": "원기록·디지털 통화 탐구", "explain": "중앙은행의 직접 부채인 디지털 형태의 화폐입니다. 소매용·도매용 등 설계에 따라 이용자와 기능이 달라집니다. 반드시 블록체인으로 구현되는 것은 아닙니다.", "example": "비교: 일반 은행 예금은 상업은행의 부채이고 CBDC는 중앙은행의 부채라는 점을 먼저 구별합니다.", "pitfall": "CBDC가 존재한다고 익명성·프라이버시·오프라인 사용이 모두 같은 수준으로 보장되는 것은 아닙니다.", "qs": [123, 125], "refs": [58, 61]}, {"term": "스테이블코인", "full": "Stablecoin", "ko": "가치안정을 목표로 하는 디지털 토큰", "context": "원기록·디지털 통화 탐구", "explain": "기준통화나 자산 등에 가치가 안정되도록 설계된 토큰입니다. 준비자산·상환청구권·담보·알고리즘 등 구조에 따라 안정성과 위험이 다릅니다.", "example": "예시: 준비자산 기반 유형에서는 자산의 유동성과 상환가능성을 봐야 합니다. 가격이 안정적이라는 이름만 보고 보장으로 이해하지 않습니다.", "pitfall": "모든 유형을 100% 현금담보로 설명하지 않습니다. 특정 상품의 현재 준비자산을 검증한 것처럼 말하지 않습니다.", "qs": [123], "refs": [59]}, {"term": "ARA", "full": "Assessing Reserve Adequacy", "ko": "외환보유액 적정성 평가", "context": "외환보유액 보충", "explain": "IMF의 보유액 적정성 평가 틀을 가리킵니다. 경제구조와 대외 지급·자금유출 위험 등을 함께 고려하며 단순한 보유액 순위와 다릅니다.", "example": "가상 예시: 같은 보유액이라도 단기 외화부채와 수입 결제 수요가 다르면 대응 여력이 다릅니다.", "pitfall": "경준이 특정 국가의 최적 보유액이나 ARA 기준 충족을 직접 계산했다는 기록은 없습니다.", "qs": [51], "refs": [24]}, {"term": "EPS", "full": "Earnings per Share", "ko": "주당순이익", "context": "원기록·수학과제 탐구", "explain": "보통주 주주에게 귀속되는 이익을 가중평균 유통보통주 수로 나누는 지표입니다. 기본 EPS와 잠재주식의 희석을 고려한 희석 EPS는 구분됩니다.", "example": "가상 예시: 귀속이익 100, 주식 수 20이면 기본적인 EPS는 5입니다. 이익이 그대로여도 주식 수가 줄면 EPS는 올라갈 수 있습니다.", "pitfall": "EPS 증가율을 매출 증가율이나 주가 수익률과 동일시하지 않습니다.", "qs": [124], "refs": [39, 60]}, {"term": "ROE", "full": "Return on Equity", "ko": "자기자본이익률", "context": "EPS 성장모형 보충", "explain": "순이익을 자기자본과 비교하는 수익성 지표입니다. 실제 비교에서는 평균자기자본·연결범위 등 정의를 맞춥니다. 높은 ROE는 높은 효율뿐 아니라 부채 확대의 영향을 받을 수 있습니다.", "example": "단순한 안정 가정에서 성장률 g를 ROE×유보율로 설명할 수 있습니다. 이는 모형의 조건이지 모든 기업의 실제 성장률 공식은 아닙니다.", "pitfall": "회계이익·자본구조·유보의 사용처가 달라지면 관계가 달라집니다.", "qs": [124], "refs": [60]}, {"term": "BEP", "full": "Break-Even Point", "ko": "손익분기점", "context": "원기록의 사업성 계산·영문 보충", "explain": "총수입과 총비용이 같아 이익이 0이 되는 수준입니다. 고정비 F, 단가 p, 단위변동비 v인 단순모형에서 수량 BEP=F/(p−v)이며 p>v가 필요합니다.", "example": "가상 예시: F=10만 원, p=2만 원, v=1만 원이면 10명입니다. 경준의 4명→20명은 본인 시간 비용 반영에 따른 기존 탐구 결과입니다.", "pitfall": "필요 고객 수와 확보한 고객 수는 다릅니 소비용2를 더하면 π=18Q−Q²가 되어 Q=9가 최대입니다.", "pitfall": "이 식은 이해용 새 예시입니다. 원 탐구의 실제 수요함수·계수·최적전가율은 아니며 경쟁구조가 바뀌면 결과도 달라집니다.", "qs": [128], "refs": [62]}, {"term": "중력모형", "full": "Gravity Model of Trade", "ko": "경제 규모와 무역비용으로 거래 설명", "context": "원기록 · 2학년 진로", "explain": "경제 규모가 큰 시장 사이에는 거래가 많고, 거리 등 비용이 클수록 적어지는 경향을 설명하는 틀입니다. 구조적 중력모형에서는 양국 사이 비용뿐 아니라 다른 시장과 거래할 상대적 여건도 중요합니다.", "example": "가상 예시: 두 나라가 가까워도 수출통제로 거래가 줄 수 있습니다. 일정한 거리는 시점별 정책 충격을 직접 설명하지 못합니다.", "pitfall": "거리 사용과 타당한 도구변수 선정은 다릅니다. 거리가 운송비를 통해 무역량에 직접 영향을 주면 배제제약 문제가 생깁니다.", "qs": [48, 49, 112], "refs": [8, 43]}, {"term": "경제적 귀착", "full": "Economic Incidence", "ko": "납부의무와 실제 부담의 분배", "context": "원기록 · 관세 인터뷰", "explain": "법적으로 세금을 납부하는 주체와 가격·임금·이윤 조정 후 실제 부담을 지는 주체를 구분합니다. 시장구조와 수요·공급 탄력성, 계약기간 등에 따라 전가의 크기와 속도가 달라집니다.", "example": "가상 예시: 세금10이 생길 때 수출가격이4 내려가고 소비자가격이6 오르면 여러 주체가 부담을 나눕니다. 실제 거래는 환율과 과세표준도 달라질 수 있습니다.", "pitfall": "관세율·관세액의 부담 비중·매출 대비 손실률은 분모가 다릅니다. 인터뷰의 40%·50%·95%를 같은 산식이라고 가정하지 않습니다.", "qs": [52, 53, 54, 55, 56, 60], "refs": [25]}, {"term": "정규방정식", "full": "Normal Equations", "ko": "최소제곱 추정의 계산 조건", "context": "원기록 · 경제 수학", "explain": "잔차제곱합을 회귀계수에 대해 미분해 0으로 놓으면 X^T X b = X^T y가 됩니다. X^T X가 가역이면 b = (X^T X)^(-1) X^T y로 쓸 수 있습니다. 여기서 T는 전치, b는 추정계수 벡터입니다. 실제 수치계산에서는 다른 분해법을 쓰기도 합니다.", "example": "가상 예시: 선을 위아래로 조금 움직여도 잔차제곱합이 더 줄지 않는 지점을 찾는 것입니다. 제곱하면 양수·음수 오차가 상쇄되지 않습니다.", "pitfall": "식을 계산했다는 것과 오차의 외생성·시계열 가정이 충족된다는 것은 다릅니다. 소프트웨어 사용 여부와 직접 계산 범위는 원 작업기록에 맞춰 설명합니다.", "qs": [16, 44, 127], "refs": [21]}], "front": [{"title": "이 책을 읽는 방법", "kicker": "사용 안내", "blocks": [["먼저 말하고, 막힌 부분만 깊게 읽기", "말하기 편은 Q001–Q164를 한 문항씩 읽도록 구성했습니다. 기존 Q001–Q146은 모두 새로 썼고, Q147–Q164에는 AI 시대의 실행·검증·협업 질문을 추가했습니다. Q099–Q104는 준비 코칭, Q093–Q094는 선택 외국어 연습입니다."], ["문장보다 생각의 순서", "질문을 읽고 먼저 자신의 말로 답해 봅니다. 이어 두 문단 답변과 기억할 흐름을 확인합니다. 첫 문단은 결론과 직접 한 일, 둘째 문단은 생각의 변화와 다음 학습으로 이어집니다. 답변의 표현이 실제 생각과 다르면 본인의 말로 바꿉니다."], ["설명은 바로 아래, 깊이는 두 번째 책", "각 답변 아래에 학년·과목·페이지와 짧은 개념 연결을 두었습니다. 자세한 원리·예시·반론은 같은 질문 번호의 해설 편에서 읽습니다. 영어 약어와 전문용어 100항목은 별도 카드로 찾아볼 수 있습니다. 모바일 읽기판에서는 답변 아래 해설을 바로 펼칠 수 있습니다."], ["길이는 녹음으로 조절하기", "일반 답변은 40–60초를 연습 목표로 삼되 실제 말하기 속도로 확인합니다. 지원동기는 1분을 넘기지 않는 방향으로 조절합니다. 질문이 짧은 정의를 요구하면 첫 문장과 예시만 먼저 답합니다. 준비한 두 문단을 무조건 끝까지 말하지 않습니다."]]}, {"title": "질문에서 실행으로", "kicker": "나의 이야기 · 현재의 자기 해석", "blocks": [["출발은 국제경제에 대한 궁금증", "처음부터 모든 활동이 하나의 진로를 위해 설계돼 있었던 것은 아닙니다. 1학년에는 국제경제 뉴스와 금융, 미중 반도체 갈등을 공부하면서 같은 경제현상도 규칙과 조건에 따라 다르게 설명된다는 점에 관심을 가졌습니다. 방송과 수업 활동에서는 배운 내용을 다른 사람이 이해하게 만드는 경험도 쌓았습니다."], ["질문을 확인할 방법을 넓히다", "2학년에는 경제 동아리를 만들고 학습지를 제작했습니다. 환율을 로그함수로 표현하고, 지니계수를 적분으로 읽고, 설문과 면접에서 예상과 다른 반응을 살폈습니다. 자료를 얻었다는 사실만으로 결론이 완성되지는 않는다는 점이 여러 활동에서 반복됐습니다."], ["실제 사람의 문제와 만나다", "3학년에는 관세 부담을 수출기업에 직접 물었습니다. 거래관계와 정보시차를 살핀 경험은 근거를 찾는 통상정보 도구로 이어졌습니다. 구현 뒤에는 점수와 신뢰의 차이, 유료수요와 필요의 차이를 다시 검토했습니다. 생각을 실행했기 때문에 다음에 확인할 문제도 더 구체적으로 보였습니다."], ["대학에서 이어갈 질문", "지금 제가 붙잡고 싶은 질문은 “국제환경이 바뀔 때 기업은 무엇을 근거로 결정해야 하는가”입니다. 규범과 데이터, 실제 거래 조건을 함께 공부하고 싶습니다. AI는 그 과정을 돕는 도구로 쓰되, 목적을 정하고 근거를 검토하며 사람들과 함께 실행하는 역할은 제가 책임지고 싶습니다."]]}, {"title": "나를 설명하는 한 문장과 10개 키워드", "kicker": "자기소개·진로의 중심", "blocks": [["특화된 진로목표", "국제통상 규범과 경제데이터를 바탕으로 환율·정책 위험을 분석하고, AI를 근거 탐색과 검증에 활용해 한국 수출기업의 의사결정을 돕는 통상전략가가 되고 싶습니다. 생기부의 “국제통상 연구자”라는 방향을 현재의 관심으로 구체화한 표현입니다."], ["① 규범  ② 환율  ③ 귀착", "규범은 거래의 가능 범위, 환율은 비용과 자금의 변화, 귀착은 실제 부담의 분배를 묻는 키워드입니다. 연결 문항: Q033–060, Q119, Q127–130."], ["④ 정보격차  ⑤ 검증  ⑥ 구현", "누가 정보를 제때 이해할 수 있는지, 결과를 어느 범위에서 믿을 수 있는지, 발견한 문제를 어떤 기능으로 바꿨는지를 설명합니다. 연결 문항: Q044–049, Q054–067, Q126."], ["⑦ 책임  ⑧ 조율  ⑨ 전달", "AI가 내놓은 답의 책임, 팀의 서로 다른 관점 조율, 청중의 눈높이에 맞춘 설명입니다. 연결 문항: Q070–077, Q134–135, Q148–158."], ["⑩ 선택의 조건", "저에게 자유는 선택지가 있는 것에 더해 그 의미를 이해하고 책임질 수 있는 조건과 연결됩니다. 정보와 교육의 기회를 함께 보려는 가치관입니다. 연결 문항: Q013, Q086, Q089, Q092, Q110, Q121."], ["사용 원칙", "한 답변에는 중심 키워드 한두 개만 사용합니다. 열 개를 한꺼번에 나열하지 않습니다. 첫 질문에는 진로목표와 대표 경험 하나를 남기고, 후속질문에서 깊이를 보여줍니다."]]}, {"title": "AI 시대의 강점은 행동으로 보여주기", "kicker": "강점과 평가 가능한 근거", "blocks": [["문제를 정하는 힘", "기업이 필요한 정보를 제때 이해하기 어렵다는 문제를 듣고, 근거 조항을 찾는 기능으로 연결했습니다. “AI를 사용했다”보다 누구의 어떤 어려움에서 출발했는지를 먼저 말합니다. 근거: 3학년 진로·자율활동, PDF 4–5쪽."], ["생각을 구현하는 실행력", "노코드 방식의 설명 한계를 발견한 뒤 구현 방식을 바꾸고 웹사이트 배포와 시연으로 옮겼습니다. 실제 구현은 말하되 정확도와 사용자 효과가 검증됐다는 성과는 더하지 않습니다. 근거: 3학년 자율활동, PDF 4쪽."], ["결과를 점검하는 판단력", "환율 모형에서 변수 추가 후 계수가 달라지는 점을 살폈고, 검색점수와 정답 가능성을 구별했습니다. “항상 맞는다”보다 결과가 예상과 다를 때 무엇을 확인했는지를 설명합니다. 근거: 경제 수학 PDF 18쪽·자율활동 PDF 4쪽."], ["공동체를 움직이는 조율력", "경제 동아리 창설·학습지 제작, 질문탐구의 역할 배분과 논의 수렴이 근거입니다. 모든 일을 혼자 한 사람보다 함께 설명하고 참여할 조건을 만든 사람으로 말합니다. 근거: 2학년 창체 PDF 2–3쪽·행동특성 PDF 20쪽."], ["생각을 전달하는 소통력", "학술제에서 검색 원리와 한계를 설명했고, 강연 분석으로 발표의 흐름을 재설계했습니다. 기법을 과시하기보다 상대가 이해할 순서를 정한 행동이 중요합니다. 근거: 자율활동 PDF 4쪽·영어Ⅱ PDF 12쪽."], ["과장하지 않는 자신감", "대화에서 반복적으로 드러난 결과물의 목적·말투·구성을 구체화하고 수정하는 태도는 준비 과정의 강점입니다. 이것을 확인되지 않은 학교 활동이나 객관적 능력 순위로 바꾸지는 않습니다. AI 질문의 출제 자체도 확정할 수 없습니다."]]}, {"title": "중앙대에서 이어갈 공부", "kicker": "중앙대학교 · 글로벌금융", "blocks": [["내 경험 → 남은 질문", "환율 회귀와 관세 인터뷰는 각각 해 봤지만, 두 변화가 한 기업의 외화 매출·원가·결제에 함께 미치는 영향은 더 배우고 싶습니다. 이 연결이 금융을 공부하려는 이유입니다."], ["교육과정과 연결", "금융수학·금융통계로 계산과 가정을 익히고, 금융시계열로 시간에 따른 자료의 특성을 살피며, 국제재무관리에서 기업의 위험관리 선택으로 이어가겠습니다. 과목 목록의 확인과 2027년 개별 학기 개설 보장은 구별합니다. [01]"], ["AI 학습의 확장", "별도 금융AI 융합전공의 공식 안내에서 금융데이터분석·금융기계학습·금융인공지능·금융인공지능실습을 확인했습니다. 글로벌금융과 동일 전공이 아니며, 전공 기초를 갖춘 뒤 이수 조건을 확인할 학습 선택지입니다. [74]"], ["내가 제안할 프로젝트", "한 산업의 공개 기업자료를 이용해 관세·환율 변화별 현금흐름을 비교하고 싶습니다. 실제 계약을 모르면 가정을 명시합니다. 이는 학생이 제안한 프로젝트이지 학교의 확정 프로그램 명칭이 아닙니다."], ["면접 준비 초점", "성장형인재 면접은 학업준비도 40%, 학교생활충실도 40%, 의사소통능력 및 인성 20%입니다. 수업 개념, 교내 참여, 협업의 근거를 함께 준비합니다. 공식 요강의 면접일은 2026년 12월 5일이며 개인별 시간은 별도 안내를 확인합니다. [75]"], ["먼저 연습할 문항", "Q014 지원동기 → Q015 통상에서 금융으로 → Q016 기초 보완 → Q019 프로젝트 → Q162 금융과 AI → Q030 마지막 말. 해당 학교 답변 안에 다른 지원 대학 이름을 넣지 않습니다."]]}, {"title": "경희대에서 이어갈 공부", "kicker": "경희대학교 · 무역학과", "blocks": [["내 경험 → 남은 질문", "관세 인터뷰에서 부담의 차이를 확인했지만 실제 계약·결제·물류가 어떻게 연결되는지는 더 배워야 합니다. 이론의 질문을 실제 거래 과정으로 확장하려는 것이 지원동기의 중심입니다."], ["교육과정과 연결", "공개 교육과정에 제시된 무역상무론과 국제금융 관련 학습을 중심으로 계약과 환율을 연결합니다. 실증·데이터 과목으로 기업 간 차이를 살펴보고 싶다는 계획을 덧붙입니다. 최신 첨부 교육과정 본문은 이번 검토에서 완전히 열람하지 못해 세부 학년·학기와 전체 과목명은 확정하지 않았습니다. [03–04, 81]"], ["현장 프로그램 GTEP", "GTEP은 무역 실무와 기업 협력 경험을 쌓으려는 학습 기회입니다. 확인한 20기 모집은 2026년 기준 일정 학년·이수학기 조건이 있는 선발 프로그램입니다. 2027년 신입생의 즉시 참여를 보장하지 않으며 실제 지원 연도의 공고를 확인합니다. [05]"], ["내가 맡고 싶은 역할", "기업과 바이어가 무엇을 필요로 하는지 듣고, 조사 자료와 규정을 정리한 뒤 팀원들과 제안을 고치는 역할입니다. AI 활용은 조사·정리를 돕는 학생의 계획이며 GTEP의 특정 AI 교육이 보장된다는 뜻이 아닙니다."], ["일정에서 놓치지 않을 점", "기존 자료에는 무역학과 면접이 2026년 12월 5일 오후로 정리돼 있습니다. 이번에는 최신 요강 공지의 존재를 확인했지만 대용량 첨부표 전체를 재검증하지 못했습니다. 날짜·시간·평가비율은 최종 면접 안내에서 다시 확인해야 합니다. 다른 일정과의 충돌은 아래 준비 체크에 별도로 표시합니다. [76]"], ["먼저 연습할 문항", "Q020 지원동기 → Q021 GTEP → Q022 학업계획 → Q023 현장 질문과 실행 → Q163 무역과 AI → Q031 마지막 말."]]}, {"title": "한국외대에서 이어갈 공부", "kicker": "한국외국어대학교 · 국제통상학과", "blocks": [["내 경험 → 남은 질문", "규정을 읽는 것과 그 규정의 경제적 영향을 자료로 설명하는 것은 다른 일이라는 점을 배웠습니다. 법적 적용 조건과 기업의 비용을 함께 이해하고 싶다는 것이 학업의 중심입니다."], ["교육과정과 연결", "국제통상법·국제계약법은 거래의 규칙과 조건을, Econometrics(계량경제학)는 자료 분석을, 국제금융시장분석은 환율과 금융 선택을 공부하려는 연결점입니다. 과목을 나열하기보다 관세 인터뷰에서 남은 계약과 부담의 질문을 하나씩 대응시킵니다. [06]"], ["해외 학습 7+1", "공식 2027학년도 1학기 파견 모집 사례에는 이수학기·학점·어학과 파견교 조건이 있습니다. 이는 입학 즉시 참여하는 과정이 아닙니다. 언어와 전공 기초를 준비한 뒤 다른 제도 아래의 거래 사례를 비교하는 기회로 활용하고 싶다는 계획입니다. [09]"], ["면접 준비 초점", "확인한 2027학년도 대학 작성 요강의 면접 평가요소는 진로개발역량 60%, 협력적소통역량 40%입니다. 1단계 3배수, 2단계 서류 50%·면접 50%이며 수능최저는 적용하지 않습니다. 단, 사용한 확인본은 외부 서버에 보관된 대학 요강 사본이므로 입학처 최종 공지가 우선합니다. [77]"], ["블라인드·일정", "서울캠퍼스 면접일은 2026년 11월 21일이며 개인별 입실시간은 1단계 발표 안내를 따릅니다. 요강은 교복 착용을 금지합니다. 이름·고교명·수험번호 등 식별정보를 자기소개에 넣지 않는 방식으로 연습합니다. [77]"], ["먼저 연습할 문항", "Q025 지원동기 → Q026 계량 학습 → Q027 해외 학습 → Q028 학업계획 → Q164 통상과 AI → Q032 마지막 말."]]}, {"title": "말하기 규칙은 이렇게 적용하기", "kicker": "사용자 체크리스트를 실전에 맞게", "blocks": [["먼저 정확히 답하기", "질문이 이유를 묻는지, 정의를 묻는지, 실제 행동을 묻는지 구분합니다. 결론 한 문장 뒤에 가장 직접적인 사례 하나를 제시합니다. 다른 질문의 준비 답변을 억지로 끼워 넣지 않습니다."], ["자신감과 정직함을 함께", "주관적 판단은 “저는 …을 중요하게 생각합니다”라고 분명히 말합니다. 사실은 확인 범위에 맞춰 말합니다. “부족했다”라는 표현 자체를 금지할 필요는 없습니다. 변명 없이 인정하고 행동과 다음 과제로 이어가는 것이 중요합니다."], ["두 문단과 짧은 호흡", "첫 문단은 결론·상황·내 행동, 둘째 문단은 변화·배움·계획에 둡니다. 어려운 용어를 한 문장에 여러 개 넣지 않습니다. 꼬리질문에서 설명할 수 없는 내용을 실력을 드러내기 위해 먼저 던지지 않습니다."], ["시선·속도·몸짓", "질문한 면접관을 먼저 보고 다른 면접관에게도 자연스럽게 시선을 나눕니다. 간절해 보이려고 과도하게 응시하기보다 내용을 듣고 답하는 태도를 유지합니다. 중요한 연결을 설명할 때 작은 손동작을 사용하되 필수 연출로 외우지 않습니다."], ["복장과 준비", "검정 슬랙스처럼 단정하고 편한 복장을 선택하되 대학의 복장·블라인드 지침을 먼저 확인합니다. 신분증·수험표 소지 방식·입실 시각·전자기기 제한은 개인별 공식 공지를 따릅니다."], ["마지막 말", "감사 → 아직 전달하지 못한 핵심 하나 → 입학 후 학습으로 마무리합니다. 실제로 느끼지 않은 확신이나 아쉬움을 만들어 말하지 않습니다. 조언 요청은 면접관이 질문 기회를 열어 준 경우에만 상황에 맞게 사용합니다."]]}, {"title": "막히거나 지적받았을 때", "kicker": "상황별 실제 문장", "blocks": [["정리할 시간이 필요할 때", "“질문의 핵심을 정리해서 말씀드리고 싶습니다. 잠시 10초 정도 생각해도 괜찮겠습니까?” 허락을 받으면 결론과 사례 하나만 정리합니다. 모든 질문에 반복하지 않습니다."], ["정확한 사실을 모를 때", "“그 부분은 지금 정확하게 답변드리기 어렵습니다. 제가 확인한 범위는 …이며, …은 추가로 확인해야 합니다.” 모르는 이유를 긴장으로 꾸미지 않습니다. 아는 원리와 모르는 사실을 나눕니다."], ["질문한 관점을 탐구하지 않았을 때", "“그 관점으로 직접 분석하지는 않았습니다. 대신 …을 탐구했는데, 이 경험을 바탕으로 제 생각을 말씀드려도 괜찮겠습니까?” 질문을 피하는 습관이 되지 않도록 필요한 경우 한 번만 사용합니다."], ["오류를 지적받았을 때", "“말씀해 주신 조건을 제가 놓쳤습니다. 방금 설명은 …의 범위로 고치는 것이 맞겠습니다. 다시 분석한다면 …을 확인하겠습니다.” 먼저 오류를 인정한 뒤 무엇이 달라지는지 구체적으로 고칩니다."], ["답변이 길어졌을 때", "“정리하면 제가 확인한 핵심은 …입니다.” 말을 더 빨리 하기보다 설명 하나를 덜어냅니다. 질문에 대한 결론이 이미 전달됐다면 멈추고 후속질문을 듣습니다."], ["출처와 숫자를 기억하지 못할 때", "정확하지 않은 수치나 기관명을 만들지 않습니다. 원기록에 있는 결과와 설명용 예시를 분리하고, “정확한 산식은 원자료를 확인해야 합니다”라고 범위를 밝힙니다."]]}, {"title": "숫자와 경험의 경계", "kicker": "반드시 바로잡고 기억할 사실", "blocks": [["기업 인터뷰", "이메일을 포함한 세 건입니다. 15%는 조사 사례의 관세 조건이지 모든 품목의 현행 세율이 아닙니다. 40%·50%의 부담 비중과 실용 경제의 95% 사례는 맥락과 분모를 확인하기 전 합치지 않습니다. [학생부 PDF 4–5, 17쪽]"], ["환율 분석", "61개월, R² 약 54%→88%, 금리차 계수 크기 감소, VIF<5는 기록된 결과입니다. 예측 적중률·인과효과로 바꾸지 않습니다. 126원 격차의 약 8할 설명 역시 모형에 의존하며 남는 잔차가 곧 정치적 위험은 아닙니다. [PDF 18쪽]"], ["성적", "수학Ⅰ·Ⅱ는 모두 2학년 1학기입니다. 일본어Ⅰ 76점·C·5등급과 일본어 회화Ⅰ 89점·A는 다른 과목·평가체계입니다. 경제 수학 97점·A와 심화 수학Ⅰ 74점·B도 구별합니다. [PDF 10, 14, 18쪽]"], ["실제로 한 일과 제안", "CBAM 인터뷰는 가상 기사, 국제기구는 창립안, 여행지는 안내서 작성, 손익분기 4명→20명은 계산입니다. 실제 전문가 인터뷰·국제기구 설립·해외 방문·고객 확보로 바꾸지 않습니다."], ["탐구의 한계와 보충 학습", "도구변수 개념 검토를 완성된 2SLS로, CAI의 규범 공백 가설을 확정 판정으로 말하지 않습니다. DS512와 비정부 표준 관련 조문은 면접 준비에서 보충한 내용임을 구분합니다."], ["원자료 확인 범위", "이번에 확인한 생기부는 PDF 20쪽, 인쇄 번호 2–21쪽입니다. 과목명이 없는 추가 세특은 그 상태로 표시했습니다. 원본에 없는 활동·수치·감정·원인은 새 사실로 만들지 않았습니다."]]}, {"title": "준비의 우선순위와 남은 확인", "kicker": "오늘 읽을 순서를 정하기", "blocks": [["첫 바퀴 · 나를 설명하기", "Q001–004 → 지원 학교의 지원동기·학업계획 → Q052·054·061 → Q147. 진로목표와 대표 활동을 연결하고, 직접 한 행동을 한 문장으로 말합니다."], ["둘째 바퀴 · 개념을 설명하기", "Q033–070과 Q105–146에서 생기부의 전 과목을 복기합니다. 모든 문항에서 정의 하나·설명용 사례 하나·내 활동의 한계 하나를 자신의 말로 답합니다. 모르는 약어는 해설 편 100개 카드에서 찾습니다."], ["셋째 바퀴 · 질문 순서를 섞기", "Q078–086, Q095, Q134–135, Q148–161을 섞어 연습합니다. 정해진 순서가 바뀌어도 질문에 바로 답하는지 확인합니다. 읽기판의 연습 모드에서는 답변을 접고 질문부터 볼 수 있습니다."], ["반드시 본인이 확인할 세부 정보", "실제 AI 모델·코딩 도움 범위, 원 회귀파일의 기간·금리차 방향, 인터뷰 수치의 분모, 수학·일본어 성적이 아쉬웠던 구체적 원인, 국제기구 원 제안서의 명칭·절차를 확인합니다. 확인되지 않은 내용은 본문에서 단정하지 않았습니다."], ["면접 일정의 충돌", "기존 정리대로라면 중앙대와 경희대 면접일이 2026년 12월 5일로 겹칠 수 있습니다. 개인별 입실시간 발표 뒤 이동 가능성과 조정 절차를 확인해야 합니다. 중앙대 요강의 시간 조정 안내가 양교 참여를 보장한다는 뜻은 아닙니다. 경희대 시간표는 이번 재검증이 불완전합니다. [75–76]"], ["합격 답변이 아니라 설명 가능한 답변", "이 책의 가치판단 문장은 경험을 바탕으로 제안한 자기표현입니다. 실제 생각과 일치하는 문장만 사용합니다. 대학 이름·프로그램·결과 숫자를 외우는 것보다 왜 그 공부가 필요한지 설명하는 것이 목표입니다."]]}], "angles": [["관세 귀착 인터뷰", [52, 53, 54, 55, 56, 84], [["활동 과정", "관세 부담의 차이를 묻기 위해 질문지와 영문 요청서를 만들고 기업에 접촉했습니다. 이메일을 포함한 세 사례를 확보했습니다."], ["내 역할", "제가 질문을 구성하고 연락하며 거래관계·대체재·정보시차를 비교한 부분을 설명합니다. 기업이 제공한 진술과 제 해석을 나눕니다."], ["개념 이해", "법적 납부자와 경제적 부담자는 다를 수 있습니다. 관세율과 추가 부담의 분배 비중은 서로 다른 수치입니다."], ["반대 사례", "장기 거래라도 특정 바이어 의존도가 높으면 협상력이 약할 수 있습니다. 정보가 빨라도 가격을 바꿀 권한이 없으면 효과가 작을 수 있습니다."], ["세부 확인", "인터뷰 방식, 요청 내용, 부담 비율의 분모, 비교 시점과 계약조건을 원자료에서 확인합니다. 기업의 영업비밀은 공개하지 않습니다."], ["확장 질문", "같은 업종·규모의 기업을 비교하고 가격 변경 자료로 진술을 대조하는 후속 연구를 제안할 수 있습니다. 현재의 모든 수출기업으로 일반화하지 않습니다."]]], ["환율 회귀와 모형 수정", [44, 45, 46, 47, 48, 127], [["활동 과정", "61개월 금리차·환율 관계를 살핀 뒤 잔차의 패턴을 보고 달러지수를 추가했습니다. 표본 내 설명력과 계수 변화를 함께 확인했습니다."], ["내 역할", "자료의 정의·기간을 맞춘 과정과 직접 계산한 통계량을 실제 분석파일에 맞춰 설명합니다. 정규방정식을 단순히 용어로만 외우지 않습니다."], ["개념 이해", "R²는 표본 내 적합도, VIF는 설명변수의 선형 중복, 잔차는 관측값과 적합값의 차이입니다. 세 수치가 같은 문제를 진단하지 않습니다."], ["반대 사례", "같이 상승하는 두 시계열은 인과관계가 약해도 높은 R²를 보일 수 있습니다. 변수를 더 넣는다고 언제나 표본 밖 예측이 좋아지지는 않습니다."], ["세부 확인", "금리차의 부호, 환율의 표시 방식, 달러지수 종류, 결측치 처리, 학습·검증 기간을 확인합니다. 원파일에서 확인하지 않은 검정통계량은 만들지 않습니다."], ["확장 질문", "자료 밖 기간의 예측오차와 시계열 특성을 점검하고 싶습니다. 정치효과를 보려면 잔차에 이름을 붙이기보다 별도 식별 전략이 필요합니다."]]], ["통상정보 RAG 도구", [61, 62, 63, 64, 65, 66, 67, 70], [["활동 과정", "기업의 근거 접근 문제 → 설명 어려운 노코드 방식 → 직접 코딩 설계 → 검색·검증 기능 → 배포·시연 → 신뢰 기준의 한계로 정리합니다."], ["내 역할", "문제 설정·설계 선택·직접 수정한 기능·결과 해석을 나눕니다. AI 도움을 받은 범위는 작업기록대로 밝힙니다."], ["개념 이해", "RAG는 검색으로 생성 문맥을 보강합니다. TF-IDF는 단어 가중치이고 유사도는 정답 확률이 아닙니다. 검색과 생성의 오류를 구별합니다."], ["반대 사례", "정확한 조문을 찾아도 예외나 시행일을 잘못 읽을 수 있습니다. 그럴듯한 답보다 보류가 더 유용한 질문도 있습니다."], ["세부 확인", "질문 하나의 입력부터 검색 근거와 출력까지 직접 설명합니다. 실제 모델명·전처리·유사도 식·자체검증 세부 종류는 코드와 대조합니다."], ["확장 질문", "독립적인 정답·근거 자료와 범위 밖 질문을 포함해 평가하고 싶습니다. 사용자 시간 절감과 정확성·지불의사는 별도 기준입니다."]]], ["헌법적 AI와 통상규범", [37, 38, 39, 68, 131, 160], [["활동 과정", "모델에 원칙을 반영하는 방식에서 민간 기준이 시장 접근 조건처럼 작동할 가능성으로 질문을 넓혔습니다."], ["내 역할", "TBT 정의와 정책지표의 측정 범위를 검토하고 점유율을 반영한 채택률을 제안했습니다. 공식 지표를 새로 개발한 기관의 역할과 구별합니다."], ["개념 이해", "CAI는 원칙을 활용한 학습 접근입니다. 법적 표준 여부, 사실상 시장 영향, 지표가 포착하는 범위는 서로 다른 문제입니다."], ["반대 사례", "자발적 기준은 거래비용을 늘릴 수도 있지만 공통 규격과 신뢰로 비용을 줄일 수도 있습니다. 민간이라는 이유만으로 WTO 적용 밖은 아닙니다."], ["세부 확인", "원기록의 사각지대 가설을 보존하면서, 이번에 보충한 TBT 제4조·부속서3을 반영해 결론의 범위를 좁힙니다. 제안 지표의 시장·채택 정의도 확인합니다."], ["확장 질문", "실제 채택 범위와 준수 비용을 조사하고 기준의 투명성·참여·상호운용성을 검토하고 싶습니다. 특정 기업의 WTO 위반을 확정하지 않습니다."]]], ["경제 동아리·질문탐구·학술제", [71, 72, 73, 74, 75, 76, 77], [["활동 과정", "경제 동아리 창설과 학습지 제작, 질문탐구의 역할 배분과 논의 수렴, 학술제 시연은 서로 다른 활동입니다. 하나의 과제로 합쳐 말하지 않습니다."], ["내 역할", "모임을 만든 행동, 학습자료를 구성한 행동, 논의를 정리한 행동, 청중에게 원리를 설명한 행동을 구분합니다."], ["개념 이해", "리더십은 직책만이 아니라 공동 목표를 위해 참여와 역할을 조정하는 행동입니다. 의사소통은 유창함만이 아니라 상대가 이해할 근거를 전달하는 일입니다."], ["반대 사례", "가장 많이 일한 사람이 항상 가장 잘 이끈 것은 아닐 수 있습니다. 다른 사람이 설명하고 참여할 기회가 남는지 살펴봅니다."], ["세부 확인", "실제 선발 기준·지원자 수·친구들의 반응·갈등 장면은 기억과 자료를 대조합니다. 생기부에 없는 규모 변화와 성적 향상을 만들지 않습니다."], ["확장 질문", "대학 팀 과제에서는 질문·자료·검토 역할을 나누고 결정 이유를 공유하고 싶습니다. 이는 앞으로의 운영 계획입니다."]]], ["무역정보 앱의 사업성", [12, 13, 86, 126, 157], [["활동 과정", "만든 도구를 사업 아이템으로 검토하고, 직접 비용에 유지관리 시간의 기회비용을 더해 손익분기를 다시 계산했습니다."], ["내 역할", "잠재 고객의 필요를 유효수요로 바로 연결했던 판단을 수정했습니다. 만든 기능에 대한 애착과 앞으로의 편익을 나누어 보았습니다."], ["개념 이해", "BEP는 고정비를 이용자당 공헌이익으로 나누는 단순 모형입니다. 필요·지불의사·지불능력은 같지 않으며 자기 시간도 경제적 비용입니다."], ["반대 사례", "유용한 기능이라도 무료 공공정보가 충분하면 유료로 살 이유는 약할 수 있습니다. 고객 수가 늘어도 지원 비용이 커지면 이익은 줄 수 있습니다."], ["세부 확인", "월 4명→20명은 모형값입니다. 당시 가격·비용·시간단가를 실제 보고서에서 확인합니다. 별도 면접보고서 판매사업의 실적을 섞지 않습니다."], ["확장 질문", "작게 범위를 정해 지불의사와 반복사용을 확인하고 싶습니다. 과거 개발시간이 아깝다는 이유만으로 계속하는 선택은 경계합니다."]]], ["가치판단과 AI의 책임", [92, 121, 134, 148, 156], [["활동 과정", "자유와 정보비대칭, 시민불복종의 정당성을 읽으며 사실 확인과 가치 기준 선택을 함께 검토했습니다."], ["내 역할", "가치를 수치화하면 객관적 판단이 되는지 의문을 제기하고 가치 형량 기능 구상을 중단했습니다. 도덕적 정답 시스템을 완성한 것은 아닙니다."], ["개념 이해", "사실만으로 당위가 자동으로 도출되지 않습니다. 공개성·비폭력성·결과·장기 책임 등 기준은 서로 다른 윤리적 질문입니다."], ["반대 사례", "AI가 사실 정리와 기준별 쟁점 비교에 도움을 준다고 해서 최종 책임까지 대신할 수 있는 것은 아닙니다. 반대로 책임을 사람에게 둔다고 AI가 무용한 것도 아닙니다."], ["세부 확인", "사상가의 입장과 자신의 금융·통상 문제 적용을 나눕니다. “형량”은 가치와 이익을 저울질한 뜻이지 형벌 기간 계산이 아닙니다."], ["확장 질문", "원칙을 공개하고 영향을 받는 사람의 의견과 이의제기 절차를 반영하는 방향을 제안할 수 있습니다. 실행된 제도의 성과로 바꾸지 않습니다."]]], ["기초 교과·문학·예술·체육", [105, 107, 111, 116, 120, 137, 138, 139, 140, 141, 142, 143, 144, 145, 146], [["활동 과정", "과학·언어·역사·예술 활동도 질문 대상입니다. 경제 진로와 직접 연결되지 않은 활동은 그 과목에서 배운 내용으로 설명합니다."], ["내 역할", "촬영 설정을 탐구한 일, 프로그래밍 오류를 고친 일, 모둠원에 맞춰 편곡한 일, 동료의 연습을 도운 일의 구체적 행동을 떠올립니다."], ["개념 이해", "SOFC·mRNA·SI·ISO처럼 낯선 표기는 풀네임과 작동 원리를 먼저 이해합니다. 수학 표기와 지표는 단위·축·정의역을 함께 설명합니다."], ["반대 사례", "기술이 편리하다고 모두에게 접근 가능한 것은 아닙니다. 지표가 같다고 경험이 같지 않고, 역할을 나눴다고 협업이 자동으로 된 것도 아닙니다."], ["세부 확인", "여행안내서는 방문 경험이 아니고 3D 모델링은 실제 제작·성능 검증이 아닙니다. 문학 작품의 자신의 해석과 작가의 의도를 동일시하지 않습니다."], ["확장 질문", "국어의 표현, 과학의 측정, 체육의 동료 지원에서 얻은 배움이 현재의 탐구 태도에 어떤 영향을 줬는지 솔직히 설명합니다."]]]], "sources": [{"id": 1, "title": "중앙대학교 · 글로벌금융 교육과정", "urls": ["https://biz.cau.ac.kr/2016/sub03/sub03_0202.php"], "status": "2026-10-22 관련 본문 재확인."}, {"id": 2, "title": "중앙대학교 · 글로벌금융 프로그램 소개(현행 운영은 별도 확인)", "urls": ["https://biz.cau.ac.kr/2016/sub03/sub03_0302.php"], "status": "오래된 프로그램 소개입니다. 2027년 운영·지원·선발이 확정된 정보로 사용하지 않습니다."}, {"id": 3, "title": function evidence(q){return q.evidence.map(e=>{let [h,...rest]=e.split('\n');return `<p><strong>${esc(h)}</strong>${rest.length?'<br>'+esc(rest.join(' ')):''}</p>`}).join('')}
function gtags(ids){return ids.map(i=>`<button data-jump="${gid(i)}">G${String(i).padStart(3,'0')} ${esc(data.glossary[i-1].term)}</button>`).join('')}
function follow(q){return q.follow.map(x=>{let i=x.search(/[?？]/);return i>=0?`<p class="follow-q">${esc(x.slice(0,i+1))}</p><p>${esc(x.slice(i+1).trim())}</p>`:`<p>${esc(x)}</p>`}).join('')}
function qCard(q){let id=qid(q.id),kind=q.kind==='코칭'?'준비 코칭 · 실제 답변 아님':q.kind==='선택 외국어'?'선택 외국어 연습':q.university;
return `<article class="card" id="${id}"><div class="meta"><span>Q${String(q.id).padStart(3,'0')} · ${esc(kind)}</span><button class="star" data-star="${id}" aria-label="다시 볼 문항에 ${state.stars.has(id)?'해제':'추가'}" aria-pressed="${state.stars.has(id)}">${state.stars.has(id)?'★':'☆'}</button></div><h2>${esc(q.question)}</h2><p class="key">${esc(q.category)}</p><details class="answer" ${state.practice?'':'open'}><summary>${state.practice?'먼저 말한 뒤 답변 보기':'두 문단 답변 접기 / 펼치기'}</summary>${paras(q.answer)}</details><div class="flow">${esc(q.memory)}</div><div class="evidence"><strong>학생부 근거</strong>${evidence(q)}</div>${q.glossary.length?`<div class="tagrow">${gtags(q.glossary)}</div>`:''}<details><summary>개념·영어 약어를 깊게 읽기</summary><div class="explain">${q.note?`<p class="note">${esc(q.note)}</p>`:''}${q.glossary.map(i=>{let g=data.glossary[i-1];return `<div class="guideblock"><h3>${esc(g.term)} · ${esc(g.ko)}</h3><p class="full">${esc(g.full)}</p><p>${esc(g.explain)}</p><p>${esc(g.example)}</p><p class="note">${esc(g.pitfall)}</p></div>`}).join('')}<h3>활동과 연결한 상세 해설</h3>${paras(q.concepts)}</div></details><details><summary>꼬리질문·표현 확인</summary><div class="explain">${follow(q)}${q.caution?`<p class="note">확인: ${esc(q.caution)}</p>`:''}</div></details>${q.source_refs.length?`<details><summary>외부 보충 출처</summary><p class="source">${sourceLinks(q.source_refs)}</p><p class="note">새로 확인한 자료와 기존 판에서 이어 받은 출처의 상태는 ‘읽는 순서·학교별 준비’ 마지막 자료 안내에서 구분했습니다.</p></details>`:''}</article>`}
function gCard(g,i){return `<article class="card" id="${gid(i)}"><div class="meta"><span>G${String(i).padStart(3,'0')} · ${esc(g.context)}</span></div><h2>${esc(g.term)} — ${esc(g.ko)}</h2><p class="full">${esc(g.full)}</p><h3>뜻과 원리</h3><p>${esc(g.explain)}</p><h3>예시와 내 활동</h3><p>${esc(g.example)}</p><h3>헷갈리지 않기</h3><p>${esc(g.pitfall)}</p><div class="tagrow">${g.qs.map(n=>`<button data-jump="${qid(n)}">Q${String(n).padStart(3,'0')}</button>`).join('')}</div><p class="source">${sourceLinks(g.refs)}</p></article>`}
function guide(){let out=data.front.map((p,i)=>`<article class="card" id="guide${i}"><div class="eyebrow">${esc(p.kicker)}</div><h2>${esc(p.title)}</h2>${p.blocks.map(([h,b])=>`<h3>${esc(h)}</h3><p>${esc(b)}</p>`).join('')}</article>`).join('');out+=data.angles.map(([title,qs,blocks],i)=>`<article class="card" id="angle${i}"><div class="eyebrow">여섯 관점 심화 연습</div><h2>${esc(title)}</h2><div class="tagrow">${qs.map(n=>`<button data-jump="${qid(n)}">Q${String(n).padStart(3,'0')}</button>`).join('')}</div>${blocks.map(([h,b])=>`<h3>${esc(h)}</h3><p>${esc(b)}</p>`).join('')}</article>`).join('');out+=`<article class="card" id="sources"><h2>자료와 확인 범위</h2><p>기초 자료는 본인의 학생부 PDF 20쪽(인쇄 2–21쪽), 기존 146문항 해설집과 이번 대화입니다. 출처 상태를 아래에 구분했습니다. 최신 공고와 개인별 안내가 우선합니다.</p>${data.sources.map(s=>`<div class="guideblock source"><h3>[${String(s.id).padStart(2,'0')}] ${esc(s.title)}</h3><p>${esc(s.status)}</p>${s.urls.map((u,i)=>`<a href="${esc(u)}" target="_blank" rel="noopener noreferrer">${i?'추가 확인본':'원문 열기'}</a>`).join(' / ')}</div>`).join('')}</article>`;return out}
function render(){document.documentElement.style.setProperty('--base',state.font+'px');$('school').disabled=state.tab!=='questions';$('practice').classList.toggle('active',state.practice);$('practice').textContent=state.practice?'연습 모드 켜짐':'답변 가리고 연습';$('stars').classList.toggle('active',state.onlyStars);document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===state.tab));let s=state.search.trim().toLowerCase();let out='',count=0;
if(state.tab==='questions'){let qs=data.questions.filter(q=>(state.school==='전체'||q.university==='공통'||q.university===state.school)&&(!state.onlyStars||state.stars.has(qid(q.id)))&&(!s||JSON.stringify(q).toLowerCase().includes(s)||qid(q.id).includes(s)));count=qs.length;out=`<details class="qnav"><summary>표시된 질문 빠르게 찾기 (${count}개)</summary>${qs.map(q=>`<button data-jump="${qid(q.id)}">Q${String(q.id).padStart(3,'0')} ${esc(q.question)}</button>`).join('')}</details>`+qs.map(qCard).join('');$('status').textContent=`${count} / 164문항 · ${state.school==='전체'?'전체 학교':state.school+' + 공통'} · 질문에 먼저 답하고 근거를 이어 말하세요.`}
else if(state.tab==='glossary'){let gs=data.glossary.map((g,i)=>({g,i:i+1})).filter(x=>!s||JSON.stringify(x.g).toLowerCase().includes(s)||gid(x.i).includes(s));count=gs.length;out=gs.map(x=>gCard(x.g,x.i)).join('');$('status').textContent=`${count} / 100항목 · 풀네임 → 원리 → 예시 → 한계 → 내 활동.`}
else{out=guide();count=data.front.length;$('status').textContent='사용 안내 · 가치관·강점 · 학교별 학업계획 · 실전 원칙 · 활동별 심화 · 자료 출처'}
$('content').innerHTML=out||(count===0?'<p class="empty">검색 결과가 없습니다. 검색어 또는 학교·별표 필터를 바꿔 보세요.</p>':'');if(!count&&state.tab==='questions')$('content').innerHTML+='<p class="empty">검색 결과가 없습니다. 필터를 바꿔 보세요.</p>'}
function jump(id){if(id.startsWith('q')){state.tab='questions';let q=data.questions.find(q=>qid(q.id)===id);if(q&&q.university!=='공통'&&state.school!=='전체'&&state.school!==q.university)state.school=q.university;$('school').value=state.school;state.onlyStars=false}else if(id.startsWith('g')&&!id.startsWith('guide'))state.tab='glossary';else state.tab='guide';state.search='';$('search').value='';render();requestAnimationFrame(()=>{let e=$(id);if(e){e.scrollIntoView({behavior:'smooth',block:'start'});try{history.replaceState(null,'','#'+id)}catch(e){}}})}
$('content').addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.jump)jump(b.dataset.jump);if(b.dataset.star){let id=b.dataset.star;if(state.stars.has(id))state.stars.delete(id);else state.stars.add(id);safeSet('kj_stars',JSON.stringify([...state.stars]));b.textContent=state.stars.has(id)?'★':'☆';b.setAttribute('aria-pressed',state.stars.has(id));b.setAttribute('aria-label','다시 볼 문항에 '+(state.stars.has(id)?'해제':'추가'));}});
document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{state.tab=b.dataset.tab;state.search='';$('search').value='';render();window.scrollTo({top:0,behavior:'smooth'})}));
$('school').addEventListener('change',e=>{state.school=e.target.value;render()});let timer;$('search').addEventListener('input',e=>{clearTimeout(timer);timer=setTimeout(()=>{state.search=e.target.value;render()},160)});
$('practice').addEventListener('click',()=>{state.practice=!state.practice;render()});$('stars').addEventListener('click',()=>{state.onlyStars=!state.onlyStars;state.tab='questions';render()});
$('smaller').addEventListener('click',()=>{state.font=Math.max(16,state.font-1);safeSet('kj_font',state.font);document.documentElement.style.setProperty('--base',state.font+'px')});$('larger').addEventListener('click',()=>{state.font=Math.min(27,state.font+1);safeSet('kj_font',state.font);document.documentElement.style.setProperty('--base',state.font+'px')});
$('theme').addEventListener('click',()=>{document.body.classList.toggle('dark');safeSet('kj_dark',document.body.classList.contains('dark')?'1':'0')});$('top').addEventListener('click',()=>window.scrollTo({top:0,behavior:'smooth'}));
render();if(location.hash)jump(decodeURIComponent(location.hash.slice(1)));
</script></body></html>
