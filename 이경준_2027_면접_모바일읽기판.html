을 실질적인 분석 능력으로 키우고 싶습니다."], "evidence": ["1학년 · 진로활동 교과 연계 자율 탐구 보고서 활동 | PDF 2쪽 / 인쇄 3쪽\n미중 반도체 갈등과 GATT 제21조 탐구의 출발점.", "3학년 · 진로활동 | PDF 4–5쪽 / 인쇄 5–6쪽\n이메일 포함 세 건의 기업 인터뷰와 관세 부담·정보시차 분석.", "3학년 · 자율활동 | PDF 4쪽 / 인쇄 5쪽\n근거를 제시하는 RAG 도구 제작·배포와 신뢰도 검증의 한계 인식."], "concepts": ["1. 통상규범에서 기업의 선택까지  통상규범은 국가 간 거래에서 허용되거나 제한되는 행위의 기준입니다. 기업의 의사결정에는 그 기준뿐 아니라 계약, 원가, 수요, 정보가 도달하는 시점도 작용합니다. 가령 같은 관세가 생겨도 가격 재협상이 가능한 기업과 장기 고정가격 계약을 맺은 기업의 부담은 다를 수 있습니다. 이는 설명을 위한 가상 사례입니다. 경준의 기업 인터뷰는 이러한 차이를 확인하려는 활동입니다. 세 사례에서 발견한 작동 원리를 설명할 수는 있지만, 이를 전체 수출기업의 평균 효과로 일반화할 수는 없습니다.", "2. RAG와 근거 확인  RAG는 질문과 관련된 자료를 검색한 뒤 그 내용을 언어모델의 답변 생성에 활용하는 방식입니다. 예를 들어 가상의 수출 규정 질문에 관련 조문과 시행일을 함께 제공하면, 사용자는 답의 근거를 추적할 수 있습니다. 다만 오래된 조문을 검색하거나 검색된 내용을 모델이 잘못 해석할 수도 있습니다. 경준은 검색 점수 설명과 한계 고지까지 구현했으므로 ‘답변을 생성했다’와 ‘정확성을 입증했다’를 구별해 말해야 합니다. 출처 표시 자체가 법률 판단의 정답을 보증하지 않습니다."], "follow": ["가장 많이 성장한 순간은 언제였나요?  기업 인터뷰에서 이론의 예상과 다른 부담 구조를 접했을 때입니다. 제가 세운 설명을 지키기보다 계약과 정보시차 같은 빠진 조건을 살펴보게 됐습니다."], "memory": "규범에서 시작 → 기업에 질문 → 근거를 찾는 도구 → 검증의 한계", "caution": "", "source_refs": [], "university": "공통", "kind": "답변", "glossary": [3]}, {"id": 2, "question": "본인을 뽑아야 하는 이유는 무엇입니까?", "category": "나를 설명하는 질문", "answer": ["저는 궁금한 문제를 직접 확인하고, 사람들과 함께 결과물로 만들어 내는 학생이라는 점을 말씀드리고 싶습니다. 수출기업의 정보 문제를 발견한 뒤에는 통상정보 도구를 만들었고, 경제를 함께 배울 공간이 필요하다고 느꼈을 때는 동아리를 만들어 학습지를 제작했습니다. 제 생각을 실제 행동으로 옮겨 본 경험이 있습니다.", "AI가 자료와 초안을 빠르게 만들어 주더라도, 누구에게 어떤 도움이 필요한지 정하고 결과를 검토해 함께 실행하는 일은 중요하다고 생각합니다. 저는 도구의 검색점수가 정답을 보장하지 않는다는 점까지 확인하고 발표에서 설명했습니다. 대학에서도 아이디어만 많이 내는 데 그치지 않고, 팀원과 의견을 조율하면서 근거 있는 결과물을 끝까지 만드는 학생으로 기여하겠습니다."], "evidence": ["3학년 · 경제 수학 | PDF 18쪽 / 인쇄 19쪽\n달러지수 추가 후 설명력과 금리차 계수가 변한 환율 회귀 탐구.", "2학년 · 동아리활동 경제해부학2 | PDF 3쪽 / 인쇄 4쪽\n경제 동아리 창설과 개념·이론 학습지 제작.", "2학년 · 행동특성 및 종합의견 | PDF 20쪽 / 인쇄 21쪽\n디지털·AI 리터러시 활용, 자료 분석과 오류 검증, 근거 있는 의사 표현, 학급 의견을 대변하는 소통, 동아리 창설·선발 운영이 기록됩니다."], "concepts": ["1. 모형 수정과 누락변수  회귀모형에서 중요한 변수가 빠지고 그 변수가 포함된 설명변수와도 관련되면 계수 해석이 왜곡될 수 있습니다. 가령 세계적인 달러 강세가 한미 금리차와 원/달러 환율에 함께 연관된다면, 금리차만 넣은 계수에 다른 요인의 영향이 섞일 수 있습니다. 경준의 활동에서는 달러지수 추가 후 계수와 설명력이 변했습니다. 이는 모형의 민감성을 보여 주는 단서이지 달러지수가 환율 변화의 원인임을 최종 증명한 결과는 아닙니다. 추가한 변수의 이론적 이유와 자료의 기간을 함께 설명해야 합니다.", "2. 지식을 나누는 학습공동체  학습공동체는 공동의 질문을 놓고 설명과 피드백을 교환하며 이해를 높이는 집단입니다. 쉬운 학습지를 만드는 과정에서는 작성자도 개념의 정의와 예외를 점검하게 됩니다. 가령 ‘환율 상승이 수출기업에 유리하다’는 문장을 설명하다 수입 원재료 비중이 높은 기업의 예외를 발견할 수 있습니다. 이는 학습 효과를 보여 주는 가상 예시입니다. 경제 동아리 창설과 학습지 제작은 실제 기록에 있지만, 특정 인원 증가나 성적 향상까지 입증하는 자료는 아닙니다. 기여는 확인되는 행동을 중심으로 말합니다."], "follow": ["다른 지원자보다 뛰어나다는 뜻인가요?  다른 지원자와 직접 비교할 근거는 없습니다. 제가 보여 드릴 수 있는 강점은 모형의 부족함을 고치려 했던 과정과 배운 내용을 함께 나눈 경험입니다."], "memory": "모형을 고친 경험 + 함께 배우는 환경을 만든 경험", "caution": "", "source_refs": [], "university": "공통", "kind": "답변", "glossary": []}, {"id": 3, "question": "장점은 무엇입니까?", "category": "나를 설명하는 질문", "answer": ["제 장점은 생각한 것을 직접 만들어 보고, 막히면 방법을 바꾸는 실행력입니다. 통상정보 도구를 만들 때 처음에는 노코드 방식을 사용했는데, 내부에서 어떤 판단을 하는지 충분히 설명하기 어려웠습니다. 그래서 직접 코딩하는 방식으로 바꾸고 질문을 나눠 검색하는 기능과 검토 절차를 구현했습니다.", "그 과정에서 제가 중요하게 생각한 것은 기능을 많이 붙이는 것보다, 사용자가 결과의 근거를 확인할 수 있게 하는 일이었습니다. 이 장점은 기업의 문제를 듣고 필요한 분석이나 정보 도구로 구체화하려는 제 진로와도 연결됩니다. 대학에서는 전공 지식을 더 쌓아, 실행한 결과가 정말 도움이 되는지까지 확인하는 능력으로 발전시키고 싶습니다."], "evidence": ["3학년 · 자율활동 | PDF 4쪽 / 인쇄 5쪽\n노코드에서 직접 코딩으로 전환, 질문분해·다중검색·자체검증 구현, 배포·시연 및 한계 고지."], "concepts": ["1. 구현과 검증의 차이  구현은 설계한 기능이 실행되도록 만드는 일이고, 검증은 정해진 기준에 비추어 그 기능이 기대한 결과를 내는지 확인하는 일입니다. 가상의 질문 열 개에 답이 나왔다고 해서 모두 정확하다는 뜻은 아닙니다. 적용 법령, 시점, 인용 근거, 답변 내용 등을 별도로 확인해야 합니다. 경준의 자체검증 기능도 도구 내부의 점검 장치이지 독립적인 정답 자료를 대체하지 않습니다. 기록에 평가 문항 수와 정확도 수치는 없으므로 성능을 수치로 만들어 말하지 않는 것이 중요합니다.", "2. 설명 가능한 검색  TF-IDF는 한 문서에서 자주 나오면서 전체 문서에는 드문 단어에 상대적으로 높은 가중치를 주는 방법입니다. 이를 활용하면 어떤 단어 때문에 특정 문서가 검색됐는지 살펴볼 수 있습니다. 예를 들어 가상의 질문에 ‘원산지’가 포함되면 해당 단어가 중요한 문서가 더 높은 점수를 받을 수 있습니다. 경준은 검색 판단을 수치로 공개하려 이 방식을 사용했습니다. 그러나 단어가 비슷하다는 사실과 법적으로 적용할 수 있다는 판단은 다르며, 동의어·문맥·최신 개정 여부를 놓칠 수 있습니다."], "follow": ["실행력과 무리한 고집은 어떻게 구분하나요?  결과를 바꿀 수 있는 반대 증거를 받아들이는지로 구분하고 싶습니다. 도구의 정확도를 입증하지 못했을 때도 완성됐다고 주장하지 않고 한계를 표시했습니다."], "memory": "설명 안 되는 방식 발견 → 구현 방식 변경 → 신뢰 한계 공개", "caution": "", "source_refs": [], "university": "공통", "kind": "답변", "glossary": [3, 4]}, {"id": 4, "question": "단점은 무엇입니까?", "category": "나를 설명하는 질문", "answer": ["저는 관심 있는 문제를 만나면 해결하고 싶은 범위를 너무 넓히는 편입니다. 통상정보 도구를 탐구하면서 윤리적 판단까지 도울 수 있을지 생각했지만, 서로 다른 가치에 어떤 비중을 줄지는 계산만으로 정할 수 없었습니다. 결국 가치판단을 자동화하려던 구상을 멈추고, 근거를 찾는 기능과 사람이 책임질 판단을 나눴습니다.", "이 경험으로 좋은 목표를 세우는 것과 지금 완성할 범위를 정하는 일이 다르다는 걸 배웠습니다. 앞으로는 기능을 늘리기 전에 누구의 어떤 문제를 해결할지, 무엇을 확인하면 도움이 됐다고 말할 수 있을지부터 정하겠습니다. 목표를 낮추기보다는 한 단계씩 검증할 수 있는 크기로 나누는 것이 제가 보완해야 할 부분입니다."], "evidence": ["3학년 · 생활과 윤리 | PDF 17쪽 / 인쇄 18쪽\n가치판단을 RAG에 결합하려다 가치의 객관화 한계를 인식해 중단한 과정.", "3학년 · 실용 경제 | PDF 17쪽 / 인쇄 18쪽\n자기 시간의 기회비용 반영과 제한된 시간의 지불의사 검증 계획."], "concepts": ["1. 범위 통제와 검증 가능한 질문  범위를 통제한다는 것은 관심을 포기하는 일이 아니라, 현재 자료와 시간으로 판단할 수 있는 질문을 먼저 정하는 일입니다. 가령 가상의 통상 앱에서 ‘기업의 모든 판단을 돕는다’는 목표를 ‘최신 원문을 찾는 시간을 줄이는가’로 좁히면 확인할 자료와 평가 기준이 선명해집니다. 경준은 윤리 판단의 자동화 한계를 인식했고 사업성에서도 시간 비용을 고려했습니다. 다만 생기부에 없는 특정 시간관리 습관을 이미 꾸준히 실천한 사실처럼 말하지 않고, 앞으로의 개선 방법으로 제시합니다.", "2. 사실 판단과 가치 판단  사실 판단은 무엇이 발생했는지와 어떤 인과관계가 있는지를 묻고, 가치 판단은 무엇을 더 중요하게 여길지를 묻습니다. 가령 가상의 정책이 비용을 줄이지만 일부 사람의 선택권을 좁힌다면, 절감액을 정확히 계산해도 그 정책이 바람직한지는 별도의 논의가 필요합니다. 정보 검색 도구는 판단의 근거를 제공할 수 있으나 가치 사이의 우선순위를 자동으로 정당화하지 못합니다. 경준의 윤리 탐구에서 중단은 기술적 실패만이 아니라, 도구가 맡을 역할의 경계를 다시 정한 결정으로 설명할 수 있습니다."], "follow": ["지금 같은 탐구를 다시 한다면 무엇부터 바꾸겠나요?  먼저 한 가지 사용 상황과 성공 기준을 정하겠습니다. 그 기준을 확인하는 데 필요한 기능을 만든 뒤, 새로운 기능은 다음 단계의 과제로 남겨 두겠습니다."], "memory": "확장하려는 성향 → 가치판단 자동화 중단 → 질문과 범위를 먼저 정하기", "caution": "", "source_refs": [], "university": "공통", "kind": "답변", "glossary": [61, 79]}, {"id": 5, "question": "가장 중요한 과목은 무엇이라고 생각합니까?", "category": "나를 설명하는 질문", "answer": ["제 진로에서 질문의 출발점이 되는 과목은 경제라고 생각합니다. 관세가 생기면 실제로 누가 부담하는지, 환율이 바뀌면 기업의 선택이 왜 달라지는지 묻는 기준을 주기 때문입니다. 기업 인터뷰도 조세귀착을 배우고 나서, 그 설명이 실제 거래에서는 어떻게 나타나는지 확인하고 싶어 진행했습니다.", "다만 경제적 설명을 제 생각으로만 남기지 않으려면 수학과 통계가 필요했습니다. 환율을 분석할 때 변수를 추가하자 설명력뿐 아니라 기존 계수도 달라졌습니다. 그래서 저는 경제로 질문을 만들고 수학과 통계로 그 설명을 점검하는 공부를 하고 싶습니다. 한 과목을 잘하는 데서 그치지 않고 배운 내용을 서로 연결해 이해하는 것이 중요하다고 느꼈습니다."], "evidence": ["3학년 · 경제 수학 | PDF 18쪽 / 인쇄 19쪽\n금리차·달러지수를 활용한 환율 회귀와 설명력·계수 변화.", "3학년 · 진로활동 | PDF 4–5쪽 / 인쇄 5–6쪽\n관세 귀착의 경제이론을 기업 인터뷰로 살핀 활동."], "concepts": ["1. 경제이론이 만드는 질문  경제이론은 선택에 따르는 유인과 제약을 정리해 어떤 차이를 관찰해야 하는지 알려 줍니다. 조세귀착에서는 세금을 법적으로 내는 사람과 가격 조정 뒤 실제 소득을 잃는 사람이 다를 수 있다는 점이 핵심입니다. 가령 수입자가 관세를 납부해도 수출자가 판매가격을 낮추면 부담 일부를 수출자가 흡수합니다. 이 가상 예시는 경준의 기업 인터뷰 질문과 연결됩니다. 다만 실제 부담은 수요·공급 탄력성뿐 아니라 계약과 거래관계에도 좌우되므로 한 가지 변수로 설명하지 않습니다.", "2. 회귀의 설명력과 인과관계  결정계수 R²는 사용한 표본에서 종속변수 변동을 모형이 얼마나 설명하는지 나타내는 지표입니다. 값이 높아져도 미래에 잘 예측하거나 한 변수의 원인 효과를 알아냈다는 뜻은 아닙니다. 예를 들어 가상의 두 시계열이 시간에 따라 함께 오르면 직접적인 인과관계가 없어도 높은 적합도가 나올 수 있습니다. 경준의 54%에서 88%로의 변화는 같은 분석 자료 안에서 모형이 개선됐다는 관찰로 설명합니다. 대학에서 배울 시계열 진단과 식별전략은 이 해석을 더 엄밀하게 만드는 데 필요합니다."], "follow": ["경제와 수학 중 하나만 선택해야 한다면요?  무엇을 설명하고 싶은지 정하는 출발점으로 경제를 고르겠습니다. 다만 제 관심을 제대로 연구하려면 수학적 가정과 통계적 검증을 함께 배워야 한다고 생각합니다."], "memory": "경제가 질문을 만들고 수학·통계가 설명을 점검한다", "caution": "", "source_refs": [], "university": "공통", "kind": "답변", "glossary": []}, {"id": 6, "question": "경영학·경제학·무역·국제통상의 차이를 설명해보세요.", "category": "나를 설명하는 질문", "answer": ["경제학은 사람들이 제한된 자원 속에서 어떻게 선택하는지, 경영학은 조직이 목표를 이루기 위해 어떻게 의사결정하는지에 더 초점을 둔다고 이해합니다. 무역학은 국경을 넘는 거래의 이론과 실무를 함께 다루고, 국제통상은 그 거래를 둘러싼 정책과 규범, 협상까지 살펴보는 분야라고 생각합니다. 서로 겹치는 부분도 많습니다.", "제 관세 인터뷰를 예로 들면 부담이 나뉘는 원리는 경제학의 질문이고, 가격을 올릴지 거래를 유지할지는 기업의 경영 문제입니다. 여기에 어떤 규정과 계약이 적용되는지는 통상의 질문입니다. 저는 이 가운데 하나만으로 설명하기 어려운 기업의 선택에 관심이 있습니다. 필요한 분야의 기초를 연결해서 현실적인 대안을 제시하는 사람이 되고 싶습니다."], "evidence": ["3학년 · 진로활동 | PDF 4–5쪽 / 인쇄 5–6쪽\n관세 부담을 탄력성·거래관계·정보시차로 분석한 기업 인터뷰.", "2학년 · 창의 경영 | PDF 15쪽 / 인쇄 16쪽\n금융 플랫폼을 기획하며 고객 문제와 기업 의사결정을 다룬 활동."], "concepts": ["1. 분석 대상과 분석 수준  학문의 차이는 다루는 단어보다 어떤 질문을 중심에 놓는지로 설명하면 명확합니다. 경제학은 가격과 유인, 자원배분의 원리를 연구하고 경영학은 조직의 목표 달성을 위한 재무·마케팅·인사·운영 등을 다룹니다. 가령 가상의 관세 충격에 대해 경제학은 시장가격과 후생의 변화를, 기업재무는 현금흐름과 위험관리의 변화를 분석할 수 있습니다. 두 분야 모두 기업을 연구하므로 ‘경제학은 국가, 경영학은 기업’이라고 절대적으로 나누면 부정확합니다. 경준의 탐구가 여러 분야에 닿는 이유도 이 중첩에 있습니다.", "2. 무역과 국제통상의 연결  무역은 국경을 넘는 거래를 가리키며, 통상은 그 거래를 둘러싼 대외 경제관계와 정책·규범을 포함하는 말로 폭넓게 쓰입니다. 그러나 두 용어 사이에 모든 대학과 기관이 공유하는 하나의 엄격한 경계가 있는 것은 아닙니다. 예를 들어 가상의 수출계약에서는 운송·결제·원산지 확인과 상대국 규제를 함께 알아야 합니다. 경준이 관심을 가진 기업 인터뷰와 규정 검색은 이 접점에 있습니다. 전공 지원동기에서는 용어의 서열을 만들기보다 해당 학과에서 어떤 능력을 배울지 구체적으로 말하는 편이 설득력 있습니다."], "follow": ["그렇다면 본인의 중심은 무엇인가요?  국제환경의 변화가 수출기업의 비용과 선택에 미치는 영향입니다. 지원한 전공에 따라 금융 분석, 무역실무, 통상법과 실증분석을 더 깊게 배우고 싶습니다."], "memory": "경제: 선택 원리 / 경영: 조직의 결정 / 무역: 거래 / 통상: 거래의 제도", "caution": "", "source_refs": [], "university": "공통", "kind": "답변", "glossary": []}, {"id": 7, "question": "국제통상전문가는 어떤 일을 한다고 생각합니까?", "category": "나를 설명하는 질문", "answer": ["국제통상전문가는 바뀐 규칙을 전달하는 데서 그치지 않고, 그 변화가 실제 거래에 어떤 영향을 주는지 설명하는 사람이라고 생각합니다. 기업 인터뷰를 해 보니 같은 관세라도 가격을 다시 협상할 수 있는지, 언제 정보를 받았는지에 따라 대응이 달랐습니다. 정책의 내용과 기업의 상황을 함께 알아야 도움이 되는 설명을 할 수 있었습니다.", "저는 특히 한국 수출기업의 비용과 환위험을 분석하는 역할에 관심이 있습니다. 어떤 규정을 확인해야 하고, 어떤 선택을 하면 비용과 위험이 어떻게 달라지는지 정리하고 싶습니다. AI는 자료를 찾는 데 활용하되, 그 자료가 해당 기업에 맞는지 판단할 전공 지식과 다른 전문가와 협업할 능력을 갖추겠습니다."], "evidence": ["3학년 · 진로활동 | PDF 4–5쪽 / 인쇄 5–6쪽\n기업별 관세 부담과 정보시차를 조사한 경험.", "3학년 · 자율활동 | PDF 4쪽 / 인쇄 5쪽\n법규 근거를 찾는 도구 제작과 신뢰 한계 고지."], "concepts": ["1. 통상 위험의 전달 경로  정책 위험은 규정의 변화가 거래 조건과 비용에 영향을 줄 가능성을 뜻합니다. 관세, 수출통제, 인증 요구 등이 바뀌면 가격뿐 아니라 납기와 조달 가능성도 달라질 수 있습니다. 가령 가상의 신규 인증 의무로 납품이 늦어지면 검사 비용 외에도 재고와 계약 위약 위험이 생깁니다. 경준의 인터뷰가 보여 준 정보시차는 이런 전달 경로의 한 요소입니다. ‘정책 발표가 있었다’와 ‘모든 기업에 같은 손실이 발생했다’ 사이에는 적용 품목과 계약 등 여러 확인 단계가 있습니다.", "2. 의사결정을 돕는 분석 결과  의사결정에 유용한 결과는 정보의 나열보다 선택지와 조건이 명확해야 합니다. 예를 들어 가상의 수출기업에 가격 인상, 마진 흡수, 시장 전환이라는 대안을 제시한다면 각각의 수요 감소 가능성, 자금 부담, 전환 비용을 함께 비교해야 합니다. 필요한 자료가 없으면 범위와 시나리오를 제시할 수 있습니다. 이는 경준이 통상정보 도구를 기업 문제와 연결하려는 방향입니다. 다만 학습용 도구가 관세 분류나 법률 해석을 확정하는 것은 아니므로, 원문 확인과 전문가 검토가 필요한 판단을 구별합니다."], "follow": ["AI가 그 일을 대신하지 않을까요?  자료 검색과 비교는 크게 도울 수 있을 것입니다. 다만 어떤 정보가 해당 기업에 적용되는지 확인하고, 불완전한 자료 속에서 선택의 책임을 지는 일에는 전공 지식과 현장 이해가 필요하다고 생각합니다."], "memory": "적용 규칙 확인 → 기업 비용으로 번역 → 선택지와 한계 제시", "caution": "", "source_refs": [], "university": "공통", "kind": "답변", "glossary": []}, {"id": 8, "question": "진로 계획을 말해보세요.", "category": "나를 설명하는 질문", "answer": ["저는 통상정책과 환율 변화가 수출기업에 미치는 영향을 분석하고, 기업이 대응 방법을 선택하도록 돕는 일을 하고 싶습니다. 처음에는 반도체 갈등과 국제규범이 궁금했는데, 자료를 분석하고 기업에 직접 질문하면서 관심이 실제 기업의 비용과 의사결정으로 구체화됐습니다. 지금은 정책 연구와 정보 도구를 함께 활용하는 방향을 생각하고 있습니다.", "대학에서는 경제학·수학·통계의 기초를 다진 뒤 통상규범과 금융을 연결해 공부하겠습니다. 이후 기업과 관련된 프로젝트나 현장 경험을 통해 제가 만든 분석이 실제로 어떤 질문에 답해야 하는지 배우고 싶습니다. 직함을 먼저 정하기보다는 기업의 어려움을 정확히 듣고, 근거를 확인해 설명할 수 있는 실력을 쌓는 것이 제 계획입니다."], "evidence": ["1학년 · 진로활동 교과 연계 자율 탐구 보고서 활동 | PDF 2쪽 / 인쇄 3쪽\n반도체 갈등과 국제통상규범 탐구.", "3학년 · 경제 수학 | PDF 18쪽 / 인쇄 19쪽\n환율의 정량적 분석.", "3학년 · 진로활동 | PDF 4–5쪽 / 인쇄 5–6쪽\n기업 인터뷰로 계약·정보·협상력의 역할을 살핀 경험."], "concepts": ["1. 전공 관심과 직무 계획  전공 관심은 오래 탐구하고 싶은 문제이고, 직무 계획은 그 문제를 어떤 조직에서 어떤 역할로 다룰지에 대한 선택입니다. 둘을 연결하되 고등학생 단계에서 직무를 모두 경험한 것처럼 말할 필요는 없습니다. 가령 가상의 수출기업에서는 통상 규정 담당자와 재무 담당자가 같은 관세 충격을 다른 방식으로 분석할 수 있습니다. 경준의 기록은 규범·환율·기업조사의 관심을 뒷받침하지만 특정 직업의 실무 능력을 이미 갖췄다는 증거는 아닙니다. 대학에서 탐색할 목표로 설명하면 자연스럽습니다.", "2. 위험관리의 목표  위험관리는 불확실성을 완전히 없애는 일이 아니라, 발생 가능한 손실을 파악하고 감당할 수준으로 조정하는 일입니다. 가령 가상의 달러 매출 기업은 환율 변동에 대비해 결제 시점을 조정하거나 일부 금액을 선물환으로 고정할 수 있습니다. 그러나 헤지에는 조건과 비용이 있고 유리한 환율 변화의 이익도 줄어들 수 있습니다. 경준의 환율 분석을 기업의 선택으로 확장하려면 예측값 하나보다 노출 규모와 여러 상황의 결과를 비교해야 합니다. 분석 능력과 실무 경험을 단계적으로 쌓겠다는 계획이 여기에 연결됩니다."], "follow": ["직업명이 아직 명확하지 않은 것 아닌가요?  명칭보다 다루고 싶은 문제가 분명하다고 생각합니다. 수출기업의 정책·환율 위험을 분석하는 방향은 유지하면서, 대학에서 재무와 통상 실무를 경험한 뒤 역할을 구체화하겠습니다."], "memory": "수출기업의 선택이라는 관심 → 기초 공부 → 현장 경험 → 역할 구체화", "caution": "", "source_refs": [], "university": "공통", "kind": "답변", "glossary": []}, {"id": 9, "question": "본인만의 특화된 진로 목표를 한 문장으로 말해보세요.", "category": "나를 설명하는 질문", "answer": ["저는 국제통상 규범과 데이터 분석을 바탕으로, 한국 수출기업의 정책·환율 위험을 줄이는 의사결정을 돕는 통상전략가가 되고 싶습니다.", "이 목표는 기업마다 관세 부담이 다르다는 점을 직접 확인하면서 구체화됐습니다. 규정을 잘 아는 것뿐 아니라 기업의 거래조건을 이해하고, 분석 결과를 상대가 활용할 수 있게 설명하는 능력이 필요하다고 느꼈습니다. AI는 필요한 근거를 찾는 데 활용하되, 어떤 문제를 풀고 어디까지 믿을지는 제가 판단할 수 있는 사람이 되고 싶습니다."], "evidence": ["1학년 · 진로활동 교과 연계 자율 탐구 보고서 활동 | PDF 2쪽 / 인쇄 3쪽\n규범에 대한 관심의 출발점.", "3학년 · 경제 수학 | PDF 18쪽 / 인쇄 19쪽\n금융·데이터 분석으로 이어진 환율 탐구.", "3학년 · 진로활동 | PDF 4–5쪽 / 인쇄 5–6쪽\n기업의 실제 선택 조건을 파악한 관세 인터뷰.", "3학년 · 자율활동 | PDF 4쪽 / 인쇄 5쪽\nAI를 근거 검색 도구로 활용한 경험."], "concepts": ["1. 진로 목표의 구체성  구체적인 목표는 어려운 직업명보다 누구의 어떤 문제를 어떤 능력으로 돕고 싶은지 드러냅니다. 여기서는 대상이 수출기업, 문제가 환율·정책 불확실성, 수단이 규범 이해와 정량분석입니다. 예를 들어 가상의 기업이 새 시장 진출을 고민하면 관세율만 알려 주기보다 계약 통화와 비용 구조를 함께 비교하는 역할을 상상할 수 있습니다. 이는 앞으로의 직무 방향을 설명하는 예시이며 이미 제공한 자문 실적이 아닙니다. 한 문장을 요구한 질문에는 첫 문장만 답하고 추가 설명은 요청이 있을 때 사용합니다.", "2. 분석 도구와 판단 책임  도구는 자료를 빠르게 찾거나 계산을 반복할 수 있지만, 어떤 질문이 중요한지와 결과를 어디까지 믿을지는 별도로 판단해야 합니다. 가령 가상의 AI가 한 기업에 적용되지 않는 산업의 규정을 검색해도 문장은 그럴듯할 수 있습니다. 적용 대상과 시행일, 예외를 사람이 확인해야 하는 이유입니다. 경준은 RAG 도구를 만들고 한계 고지 기능도 구현했습니다. 이 경험을 ‘AI가 통상전문가를 대체한다’는 주장으로 확대하기보다, 전공 지식이 있어야 도구를 올바르게 사용할 수 있다는 학업 목표로 연결합니다."], "follow": ["그 목표에서 가장 먼저 배워야 할 것은 무엇인가요?  기업의 비용과 현금흐름을 이해하는 기초입니다. 규정이나 환율을 알아도 기업의 어떤 의사결정에 연결되는지 설명하지 못하면 도움이 제한적이기 때문입니다."], "memory": "누구: 수출기업 / 무엇: 환율·정책 변화 / 어떻게: 규범과 데이터", "caution": "", "source_refs": [], "university": "공통", "kind": "답변", "glossary": []}, {"id": 10, "question": "전공과 다른 분야를 어떻게 융합하고 싶습니까?", "category": "나를 설명하는 질문", "answer": ["저는 통상을 중심으로 금융과 데이터 분석을 연결하고 싶습니다. 관세가 바뀌면 규정만 달라지는 것이 아니라 기업의 판매가격과 이익, 자금이 들어오는 시점에도 영향을 줄 수 있습니다. 기업 인터뷰와 환율 분석을 하면서, 제도를 이해하는 능력과 기업의 돈의 흐름을 읽는 능력이 함께 필요하다고 느꼈습니다.", "AI와 프로그래밍은 그 과정에서 필요한 자료를 찾고 비교하는 데 활용하고 싶습니다. 다만 여러 분야를 한다는 사실 자체를 강점으로 내세우지는 않겠습니다. 수출기업이 어떤 결정을 해야 하는지 먼저 정하고, 그 질문을 풀기 위해 필요한 방법을 배우겠습니다. 제가 생각하는 융합은 분야를 많이 나열하는 것이 아니라 한 문제를 더 정확하게 이해하는 일입니다."], "evidence": ["3학년 · 진로활동 | PDF 4–5쪽 / 인쇄 5–6쪽\n기업별 관세 부담 차이와 협상·정보 조건 분석.", "3학년 · 자율활동 | PDF 4쪽 / 인쇄 5쪽\n통상지식과 검색·코딩을 연결한 도구 제작.", "3학년 · 경제 수학 | PDF 18쪽 / 인쇄 19쪽\n환율 및 통상정보 서비스의 수익모형을 수학과 연결."], "concepts": ["1. 질문을 중심으로 하는 융합  융합은 여러 학문 용어를 함께 쓰는 일이 아니라, 한 분야만으로 답하기 어려운 질문을 다른 분야의 방법으로 보완하는 일입니다. 가령 가상의 수출기업이 관세 충격을 받았다면 통상법은 적용 규정을, 경제학은 가격 전가를, 재무는 현금흐름을, 데이터 분석은 가정별 결과를 다룰 수 있습니다. 경준의 관세 인터뷰와 환율 분석은 이를 연결할 출발점입니다. 다만 각 분야의 기초를 건너뛴 채 모든 결론을 낼 수는 없으므로 중심 질문과 필요한 전문 지식을 분명히 해야 합니다.", "2. 현금흐름과 운전자금  현금흐름은 일정 기간 실제로 들어오고 나가는 돈의 흐름이고, 운전자금은 재고와 매출채권 등 일상적인 영업을 유지하는 데 필요한 자금과 관련됩니다. 가령 가상의 기업이 수출대금을 두 달 뒤 받는데 원재료 대금은 지금 내야 한다면, 장부상 이익이 있어도 자금 부족이 발생할 수 있습니다. 이는 앞으로 탐구할 설명용 사례입니다. 경준이 조사한 계약과 정보시차를 재무로 확장하면 비용의 크기뿐 아니라 발생 시점도 중요해집니다. 이익이 난다는 사실과 현금이 충분하다는 판단은 구별합니다."], "follow": ["융합하다가 전공이 얕아질 위험은 없나요?  있다고 생각합니다. 먼저 경제·통계와 지원 전공의 기초를 갖춘 뒤, 한 프로젝트에서 필요한 방법을 추가하는 순서로 공부하겠습니다."], "memory": "기업 문제 하나 → 금융·법규·통계가 각각 설명할 부분 → AI는 자료 도구", "caution": "", "source_refs": [], "university": "공통", "kind": "답변", "glossary": []}, {"id": 11, "question": "대학에서의 학업계획을 말해보세요.", "category": "나를 설명하는 질문", "answer": ["대학에서는 먼저 경제학과 수학·통계의 기초를 체계적으로 다지고 싶습니다. 고등학교에서 환율 회귀를 해 보니 식을 계산하는 것과 그 결과를 설명하는 것은 달랐습니다. 변수를 바꿨을 때 계수가 왜 달라지는지, 어떤 조건에서 결과를 믿을 수 있는지까지 이해하고 싶습니다.", "기초를 쌓은 뒤에는 관세와 환율이 함께 변할 때 기업의 비용이 어떻게 달라지는지 하나의 사례로 분석해 보겠습니다. 수업에서 배운 규범과 금융 지식을 연결하고, 가능한 현장 경험을 통해 제가 세운 가정도 점검하고 싶습니다. 학업계획의 중심은 많은 프로그램에 참여하는 것보다, 고등학교에서 남겨 둔 질문에 더 정확하게 답하는 것입니다."], "evidence": ["3학년 · 경제 수학 | PDF 18쪽 / 인쇄 19쪽\n환율 회귀를 수행하며 정량분석의 가정·해석을 더 공부할 필요를 확인.", "2학년 · 확률과 통계 | PDF 11–12쪽 / 인쇄 12–13쪽\n기대 인플레이션 신뢰구간과 민감도 탐구.", "3학년 · 진로활동 | PDF 4–5쪽 / 인쇄 5–6쪽\n기업 사례를 통해 모형 밖의 거래 조건을 살핀 경험."], "concepts": ["1. 학업계획의 단계와 선행 지식  기초 과목은 이후의 전문 분석을 이해하는 언어를 제공합니다. 통계의 표본과 추정, 수학의 함수와 최적화, 경제학의 유인과 제약을 알아야 회귀계수나 기업의 위험관리 결과를 해석할 수 있습니다. 가령 가상의 자료에서 환율과 매출이 함께 증가해도 수요 변화가 빠져 있다면 해석이 달라질 수 있습니다. 경준의 기존 회귀 활동은 이런 문제를 배울 동기입니다. 이미 고급 분석을 완전히 습득했다고 주장하기보다, 해 본 경험 때문에 무엇을 더 배워야 하는지 안다는 점을 드러냅니다.", "2. 시나리오 분석과 현장 자료  시나리오 분석은 불확실한 변수에 여러 값을 넣어 결과가 어떻게 달라지는지 비교하는 방법입니다. 가령 가상의 기업에 대해 환율 상승·유지·하락과 관세 전가율을 조합하면 취약한 조건을 찾을 수 있습니다. 이는 어느 상황이 실제로 발생할지 맞히는 예측과 다릅니다. 경준의 기업 인터뷰를 확장한다면 비용 구조와 계약 조건을 자료로 확인하고, 확인하지 못한 값은 가정으로 표시해야 합니다. 현장 경험은 모형의 가정을 점검하는 데 유용하지만 소수 사례가 전체 기업을 대표하지는 않습니다."], "follow": ["첫 학기에 바로 할 수 있는 일은 무엇인가요?  기초 수업을 충실히 듣고 기존 환율 분석의 자료와 식을 다시 정리하겠습니다. 계산을 재현하면서 설명하지 못하는 개념을 찾아 학습 우선순위를 세우고 싶습니다."], "memory": "기초 재정비 → 통상·금융·실증 → 조건 갖춘 현장 경험 → 수업으로 검토", "caution": "", "source_refs": [], "university": "공통", "kind": "답변", "glossary": []}, {"id": 12, "question": "왜 한국 중소 수출기업을 돕고 싶습니까?", "category": "나를 설명하는 질문", "answer": ["기업 인터뷰를 하면서, 필요한 정보를 제때 이해할 수 있는지도 경쟁의 조건이라는 생각이 들었습니다. 같은 정책이 발표돼도 어떤 기업은 가격을 조정할 기회가 있고, 어떤 기업은 정보를 늦게 알아 대응 시기를 놓칠 수 있었습니다. 그 차이를 모두 기업의 능력 부족으로만 설명하고 싶지는 않았습니다.", "그래서 정보와 인력의 제약이 있는 수출기업이 자신의 상황에 맞는 근거를 확인하도록 돕고 싶습니다. 제가 만든 도구도 그 관심에서 출발했습니다. 앞으로는 도움이 필요하다는 말과 실제로 유용하다는 평가를 구분해, 기업이 어떤 결정을 더 잘하게 되는지 확인하겠습니다. 상대에게 필요한 도움을 먼저 듣는 분석가가 되고 싶습니다."], "evidence": ["3학년 · 진로활동 | PDF 4–5쪽 / 인쇄 5–6쪽\n정보시차·거래관계에 따른 관세 부담 차이를 기업 인터뷰로 탐구.", "3학년 · 실용 경제 | PDF 17쪽 / 인쇄 18쪽\n정보 서비스의 지불의사·무료 공공정보·유효수요를 검토한 사업성 탐구.", "3학년 · 자율활동 | PDF 4쪽 / 인쇄 5쪽\n정보 접근 문제를 통상정보 도구 제작으로 확장."], "concepts": ["1. 정보 격차와 의사결정 비용  정보 격차는 필요한 정보를 얻는 시점과 내용, 해석 능력이 서로 다른 상태를 뜻합니다. 정보가 공개돼 있어도 찾고 적용하는 데 시간과 인력이 들면 기업마다 활용 가능성이 달라집니다. 가령 가상의 두 기업 중 하나가 계약 갱신 전에 관세 변경을 알고 다른 하나는 갱신 뒤에 알았다면 가격 조정의 여지가 다를 수 있습니다. 경준은 인터뷰에서 이러한 정보시차를 문제로 보았습니다. 다만 세 건의 사례만으로 모든 중소기업이 정보에 취약하다거나 대기업은 문제가 없다고 일반화할 수 없습니다.", "2. 필요와 지불의사의 차이  어떤 정보가 유용하다는 말과 그 정보를 얻기 위해 실제로 돈을 낼 의사가 있다는 말은 다릅니다. 지불의사는 대체 서비스, 사용 빈도, 예상 편익과 비용에 따라 달라집니다. 가령 가상의 기업이 공공기관에서 같은 자료를 무료로 찾을 수 있다면 유료 서비스에는 시간 절감이나 맞춤 적용 같은 추가 가치가 필요합니다. 경준은 실용 경제에서 무료 정보의 기준가격과 낮은 지불 여력을 검토했습니다. 사용자에게 도움이 된다는 가설을 사업성이 검증됐다는 결론으로 바꾸지 않아야 합니다."], "follow": ["기업이 무료 정보면 충분하다고 한다면요?  그렇다면 유료 서비스가 꼭 필요하다고 설득하기보다 어떤 과정에서 시간이 드는지 다시 확인하겠습니다. 차별화된 가치가 없다면 기능이나 사업 방향을 줄이는 판단도 필요합니다."], "memory": "같은 정책, 다른 대응 조건 → 정보시차 → 필요한 정보와 유료 가치 구별", "caution": "", "source_refs": [], "university": "공통", "kind": "답변", "glossary": [62]}, {"id": 13, "question": "경제적 자유를 중요하게 생각하는 이유는 무엇입니까?", "category": "나를 설명하는 질문", "answer": ["저에게 경제적 자유는 하고 싶은 공부와 일을 스스로 선택할 수 있는 기반입니다. 경제적으로 성취하고 싶은 마음도 있습니다. 다만 돈을 많이 버는 모습만 생각하기보다, 제가 어떤 문제를 해결해서 그 성취를 얻을 수 있을지를 중요하게 생각합니다. 금융 플랫폼과 통상정보 서비스를 구상하면서 그 질문을 해 봤습니다.", "특히 사업성을 검토할 때, 제가 좋다고 생각하는 기능과 이용자가 실제로 돈을 낼 만큼 필요로 하는 기능은 다를 수 있다는 걸 배웠습니다. 그래서 제 능력이 다른 사람에게 확인 가능한 도움이 되는 것이 먼저라고 생각합니다. 전문성을 쌓아 선택의 폭을 넓히고, 제가 가진 정보와 배움의 기회도 다른 사람과 나눌 수 있는 사람이 되고 싶습니다."], "evidence": ["2학년 · 창의 경영 | PDF 15쪽 / 인쇄 16쪽\n청년층 금융관리의 불편을 분석해 금융 플랫폼을 기획한 수업 활동.", "3학년 · 실용 경제 | PDF 17쪽 / 인쇄 18쪽\n지불의사·기회비용·유효수요로 통상정보 앱의 사업성을 재검토."], "concepts": ["1. 가치 창출과 가치 확보  가치 창출은 사용자의 시간·비용을 줄이거나 편익을 늘리는 일이며, 가치 확보는 그중 일부를 수익 등으로 얻는 일입니다. 가령 가상의 정보 도구가 기업의 조사 시간을 줄여도 무료 대체재가 충분하면 높은 가격을 받기 어려울 수 있습니다. 반대로 높은 가격을 받는다는 사실만으로 사회적 편익이 크다고 단정할 수도 없습니다. 경준의 금융 앱 기획과 통상정보 앱 사업성 탐구는 두 문제를 나눠 생각할 근거입니다. 수업의 모의 투자 유치를 실제 외부 투자나 사업 성공으로 설명하지 않습니다.", "2. 기회비용과 선택의 여유  기회비용은 어떤 선택 때문에 포기한 대안 가운데 가장 가치 있는 대안의 가치입니다. 실제로 돈을 지출하지 않아도 시간과 다른 활동의 기회를 사용하면 비용이 발생합니다. 가령 가상의 학생이 앱 개발에 쓴 시간을 공부나 유급 활동에 쓸 수 있었다면 그 대안도 사업 판단에 고려해야 합니다. 경준은 자기 시간의 비용을 반영하면서 손익분기 판단이 달라지는 경험을 했습니다. 이미 쓴 시간을 아까워하는 감정과 앞으로 투입할 시간의 가치를 구분해야 경제적 자유라는 목표도 현실적인 선택으로 연결됩니다."], "follow": ["수익성과 사회적 가치가 충돌하면 어떻게 하겠습니까?  지속 가능한 수익도 필요하지만, 이용자가 믿을 수 없는 정보를 제공해 얻는 수익은 피해야 한다고 생각합니다. 가치와 비용을 확인한 뒤 기능이나 가격을 조정하는 대안을 찾겠습니다."], "memory": "선택의 여유 → 사용자 가치 → 지불의사와 시간 비용 확인", "caution": "", "source_refs": [], "university": "공통", "kind": "답변", "glossary": [61]}, {"id": 14, "question": "중앙대 글로벌금융에 지원한 이유는 무엇입니까?", "category": "중앙대 글로벌금융", "answer": ["저는 관세와 환율의 변화를 기업의 재무적 선택으로 연결해 공부하고 싶어 중앙대 글로벌금융에 지원했습니다. 기업 인터뷰에서는 같은 관세라도 부담이 달랐고, 환율 탐구에서는 변수를 바꾸자 분석 결과가 달라졌습니다. 이 경험을 통해 정책을 설명하는 데서 더 나아가 기업의 현금흐름과 위험관리까지 이해하고 싶어졌습니다.", "중앙대의 금융통계와 금융시계열로 자료를 분석하는 기초를 갖추고, 국제재무관리에서 그 결과를 기업의 선택과 연결해 보고 싶습니다. 예를 들어 관세와 환율이 동시에 변할 때 수출대금과 원재료 비용을 함께 분석하는 과제입니다. 제가 고등학교에서 따로 탐구한 문제를 하나의 기업 사례 안에서 깊게 공부할 수 있다는 점이 지원한 이유입니다."], "evidence": ["3학년 · 경제 수학 | PDF 18쪽 / 인쇄 19쪽\n금리차·달러지수를 활용한 환율 분석과 해석의 한계.", "3학년 · 진로활동 | PDF 4–5쪽 / 인쇄 5–6쪽\n관세 부담의 계약·협상 조건을 살핀 기업 인터뷰."], "concepts": ["1. 국제재무관리  국제재무관리는 국경을 넘어 활동하는 기업의 투자, 자금조달, 현금흐름과 위험을 다루는 분야입니다. 국내 기업재무에 환율, 국가별 제도, 국제 자본이동 등이 더해집니다. 가령 가상의 한국 기업이 달러로 수출하고 원화로 비용을 내면 환율 변화가 원화 기준 현금흐름을 바꿉니다. 해외 투자라면 자금 회수와 정치적 위험도 고려할 수 있습니다. 경준은 관세와 환율을 각각 탐구했으므로 이를 하나의 재무 문제로 연결하는 학업 동기가 자연스럽습니다. 실제 기업 자문을 이미 수행했다는 뜻으로 확대하지 않습니다.", "2. 환위험과 환노출  환노출은 환율이 바뀔 때 기업의 가치나 현금흐름이 얼마나 영향을 받는지를 뜻합니다. 외화 매출만이 아니라 외화 원가, 부채, 결제 시점도 함께 봐야 합니다. 가령 가상의 기업이 달러 매출과 달러 원재료 대금을 동시에 갖고 있다면 두 흐름이 일부 상쇄될 수 있습니다. 그래서 원화 약세가 모든 수출기업에 같은 이익을 주지는 않습니다. 경준의 환율 회귀는 환율의 움직임을 살핀 활동이고, 기업의 환노출을 직접 추정한 기록은 아닙니다. 대학에서 배우고 싶은 다음 단계로 구분해 말합니다."], "follow": ["교육과정 중 가장 연결하고 싶은 두 과목은 무엇인가요?  금융시계열과 국제재무관리입니다. 환율 자료의 특성을 제대로 분석하고, 그 결과를 기업의 결제와 위험관리 선택으로 연결해 보고 싶습니다."], "memory": "환율·관세 경험 → 기업 재무의 질문 → 금융수학·통계와 국제재무관리", "caution": "", "source_refs": [1], "university": "중앙대", "kind": "답변", "glossary": [63]}, {"id": 15, "question": "통상 활동이 많은데 왜 중앙대 글로벌금융입니까?", "category": "중앙대 글로벌금융", "answer": ["저는 통상에 대한 관심을 바꾼 것이 아니라, 그 문제를 기업의 재무 관점에서 더 깊게 이해하고 싶어졌습니다. 기업에 관세 부담을 물어보니 가격을 올릴지, 이익을 줄여 거래를 유지할지 같은 선택이 중요했습니다. 규정이 무엇인지 아는 것만으로는 어느 선택이 적절한지 설명하기 어려웠습니다.", "그래서 중앙대 글로벌금융에서 국제재무관리와 기업가치분석을 배우고 싶습니다. 환율과 관세의 변화가 당장의 이익뿐 아니라 미래 현금흐름과 기업의 위험에 어떻게 이어지는지 살펴보고 싶습니다. 제 관심의 출발은 국제경제였고, 지금 더 알고 싶은 질문은 그 변화 속에서 기업이 어떤 재무적 결정을 해야 하는가입니다."], "evidence": ["3학년 · 진로활동 | PDF 4–5쪽 / 인쇄 5–6쪽\n관세 부담을 거래관계와 협상 조건으로 해석한 경험.", "3학년 · 경제 수학 | PDF 18쪽 / 인쇄 19쪽\n환율의 금융·통계적 분석."], "concepts": ["1. 마진에서 기업가치로 이어지는 경로  마진은 매출에서 일정한 비용을 뺀 이익의 크기나 비율을 말하며, 어떤 비용을 포함했는지 명확히 해야 합니다. 기업가치는 현재 이익만이 아니라 미래 현금흐름과 그 위험을 함께 고려합니다. 가령 가상의 관세 충격으로 당장 마진이 낮아져도 장기 거래를 유지해 미래 매출을 지킬 수 있고, 반대 결과도 가능합니다. 경준이 기업 인터뷰에서 본 부담 차이를 기업가치로 확장하려면 이런 시간적 효과까지 살펴야 합니다. 관세 부담 비율을 곧바로 이익률 감소나 기업가치 하락률로 바꾸면 안 됩니다.", "2. 자연헤지와 금융헤지  자연헤지는 외화 수입과 지출을 맞추는 등 영업 구조로 환위험을 줄이는 방식이고, 금융헤지는 선물환이나 옵션 등의 계약을 활용하는 방식입니다. 가령 가상의 기업이 달러 매출의 일부를 달러 원재료 결제에 쓰면 순노출이 줄 수 있습니다. 남는 노출을 선물환으로 고정하는 선택도 가능하지만 계약 조건과 비용을 확인해야 합니다. 경준의 기존 탐구는 이러한 전략을 실제로 실행한 기록은 아닙니다. 글로벌금융에서 배우고 싶은 후속 주제로 제시하며, 헤지를 하면 모든 손실이 사라진다는 오해를 피합니다."], "follow": ["금융을 공부하면 통상에 대한 관심이 약해지는 것 아닌가요?  통상정책이 기업에 미치는 영향을 이해하려는 질문은 같습니다. 그중 제가 더 배우고 싶은 부분이 현금흐름과 환위험을 평가하는 금융적 방법입니다."], "memory": "정책이 바뀜 → 가격·마진 선택 → 현금흐름·기업가치 → 금융 공부", "caution": "", "source_refs": [1], "university": "중앙대", "kind": "답변", "glossary": [63]}, {"id": 16, "question": "중앙대에서 가장 먼저 보완하고 싶은 부분은 무엇입니까?", "category": "중앙대 글로벌금융", "answer": ["금융수학과 금융통계로 분석의 기초를 가장 먼저 보완하고 싶습니다. 환율을 분석할 때 계산 결과는 얻었지만, 설명력이 높아졌다는 이유만으로 충분한 분석이 됐다고 말할 수는 없었습니다. 달러지수를 추가하자 금리차 계수도 달라져서, 변수와 가정을 더 정확히 이해해야겠다고 느꼈습니다.", "중앙대에 입학하면 기존 분석을 다시 계산하면서 제가 설명하지 못하는 부분을 찾아 공부하겠습니다. 이후 금융시계열을 통해 시간에 따라 이어지는 자료의 특성도 배우고 싶습니다. 이미 어려운 분석을 할 수 있다고 보이기보다, 해 본 경험을 바탕으로 무엇을 더 배워야 하는지 알고 시작하는 학생이 되고 싶습니다."], "evidence": ["3학년 · 경제 수학 | PDF 18쪽 / 인쇄 19쪽\n정규방정식 계산, 잔차 패턴, 달러지수 추가, VIF 확인의 범위."], "concepts": ["1. 회귀 가정과 진단  회귀계수를 신뢰하려면 자료와 오차에 관한 가정이 얼마나 타당한지 살펴야 합니다. 설명변수와 오차가 관련되면 계수의 인과적 해석이 어려워지고, 오차의 분산이나 상관 구조가 잘못 처리되면 불확실성 평가도 달라질 수 있습니다. 가령 가상의 환율 자료에서 빠진 정책 요인이 금리차와 함께 움직인다면 다른 변수를 넣었다고 모든 편향이 사라지는 것은 아닙니다. 경준은 잔차의 패턴을 발견한 경험이 있으므로 진단을 배울 동기가 분명합니다. 검정 하나로 분석 전체의 타당성을 보증하지 않습니다.", "2. VIF와 시계열 문제의 구별  VIF는 한 설명변수가 다른 설명변수들과 얼마나 겹치는지와 관련된 다중공선성 진단 지표입니다. 값이 낮아도 오차의 자기상관, 비정상성, 역인과관계가 없어졌다는 뜻은 아닙니다. 가령 가상의 월별 자료에서 환율 충격이 여러 달 지속되면 잔차에도 연속성이 나타날 수 있는데, 이는 설명변수 사이의 상관과 다른 문제입니다. 경준의 VIF 5 미만 확인은 다중공선성의 한 측면을 살핀 결과로 말합니다. 금융시계열 학습은 이런 시간적 특성을 별도로 분석하는 다음 단계에 해당합니다."], "follow": ["그러면 고교 분석은 잘못됐다는 뜻인가요?  탐구한 자료에서 확인한 관계는 의미가 있지만, 그 관계를 인과효과나 미래 예측력으로 확대하면 안 된다는 뜻입니다. 결과의 범위를 더 정확히 설명하고 싶습니다."], "memory": "계산은 해 봄 → 가정·진단은 더 배워야 함 → VIF의 범위 구별", "caution": "", "source_refs": [1], "university": "중앙대", "kind": "답변", "glossary": [39, 100]}, {"id": 17, "question": "중앙대 입학 후 구체적인 학업계획을 말해보세요.", "category": "중앙대 글로벌금융", "answer": ["처음에는 금융수학과 금융통계로 기초를 다지고, 다음에는 국제재무관리와 금융시계열을 연결해 공부하고 싶습니다. 고등학교에서 분석한 환율이 기업의 외화 매출과 원가, 결제 시점에 어떤 영향을 주는지 살펴보는 것이 목표입니다. 기업의 위험을 이해하려면 숫자뿐 아니라 회계와 재무의 기본도 충실히 배워야 한다고 생각합니다.", "이후에는 관세·환율 변화에 따라 기업의 현금흐름이 어떻게 달라지는지 비교하는 프로젝트를 해 보고 싶습니다. 중앙대의 금융AI 융합전공에도 관심이 있어, 전공 기초를 갖춘 뒤 이수 조건을 확인해 보겠습니다. AI를 활용하는 데 그치지 않고 분석을 검증하고 설명할 수 있는 금융 역량을 갖추는 것이 제 학업계획입니다."], "evidence": ["3학년 · 경제 수학 | PDF 18쪽 / 인쇄 19쪽\n환율 회귀 경험을 금융수학·통계·시계열 학습으로 이어가는 근거.", "3학년 · 진로활동 | PDF 4–5쪽 / 인쇄 5–6쪽\n기업별 관세 부담을 재무 시나리오로 확장할 근거."], "concepts": ["1. 금융시계열의 질문  시계열은 시간 순서대로 관측된 자료이고, 금융시계열 분석은 수익률·환율·변동성 등에 나타나는 시간적 구조를 다룹니다. 가령 가상의 환율 충격이 다음 달에도 이어지는지, 변동이 큰 시기가 모이는지 분석할 수 있습니다. 이는 자료의 순서를 무시한 단순한 관계 분석과 다른 정보를 줍니다. 경준은 잔차가 한쪽으로 이어지는 모습을 관찰했으므로 시간적 의존성을 배울 구체적인 계기가 있습니다. 시계열 모형을 쓴다고 미래를 확실히 예측할 수 있는 것은 아니며 자료 밖에서의 검증도 필요합니다.", "2. 교육과정과 프로그램 확인  공식 공개 교육과정에는 금융수학·금융통계·국제재무관리·금융시계열·기업가치분석·파생상품론 등이 제시돼 있습니다. 과목을 나열하기보다 기초, 분석, 기업 의사결정의 순서로 연결하면 학업계획이 구체적입니다. 가령 가상의 프로젝트에서 환율 분포를 분석한 뒤 헤지 선택별 현금흐름을 비교할 수 있습니다. 국제 금융중심지 방문 연수 소개에는 오래된 선발 문구도 있어 2027년 운영과 지원을 보장할 수 없습니다. 경준의 계획에서는 학습 목표를 중심에 두고 연수는 해당 시점의 공고와 조건을 확인할 선택지로 남깁니다."], "follow": ["연수에 선발되지 않으면 계획이 달라지나요?  해외 현장을 배울 방법은 달라질 수 있지만 핵심 학업 목표는 같습니다. 수업 프로젝트와 공개 기업 자료 분석을 먼저 진행하고, 가능한 현장 기회를 추가하겠습니다."], "memory": "금융수학·통계 → 국제재무·시계열 → 가치평가·위험관리 과제", "caution": "국제 금융중심지 방문 연수는 오래된 소개 페이지의 존재만으로 2027학년도 운영·선발·지원금이 확정된 것으로 말하지 않는다.", "source_refs": [1, 2, 74], "university": "중앙대", "kind": "답변", "glossary": [], "note": "이번 보강: 중앙대 금융AI 융합전공 공식 안내를 확인해 연결한 미래 학업계획입니다. 글로벌금융과 같은 전공이라는 뜻이 아닙니다."}, {"id": 18, "question": "중앙대가 왜 본인을 선발해야 합니까?", "category": "중앙대 글로벌금융", "answer": ["저는 분석에서 발견한 문제를 직접 구현하고, 다른 사람에게 이해시키는 경험을 함께 쌓아 왔습니다. 환율 모형의 결과를 다시 검토했고, 통상정보 도구를 만들어 학교 학술제에서 검색 원리와 한계를 설명했습니다. AI가 결과를 빠르게 만드는 시대에도 그 결과가 무엇을 뜻하는지 설명할 수 있어야 한다고 생각합니다.", "중앙대 글로벌금융에서는 금융의 기초를 체계적으로 배우며 이 강점을 발전시키고 싶습니다. 경제 동아리에서 학습지를 만들었던 것처럼 팀원과 개념을 나누고, 서로 다른 해석이 나오면 근거를 함께 확인하겠습니다. 생각을 결과물로 만들고 그 결과를 책임 있게 설명하는 학생으로 수업과 팀 프로젝트에 기여하고 싶습니다."], "evidence": ["3학년 · 경제 수학 | PDF 18쪽 / 인쇄 19쪽\n누락변수 가능성을 살피며 환율 모형을 수정한 과정.", "3학년 · 진로활동 | PDF 4–5쪽 / 인쇄 5–6쪽\n현장 인터뷰로 분석의 범위를 확장한 경험.", "2학년 · 동아리활동 경제해부학2 | PDF 3쪽 / 인쇄 4쪽\n경제 학습지를 제작하고 동아리에서 함께 배운 경험."], "concepts": ["1. 계수의 민감성과 해석  회귀계수가 분석 조건에 따라 얼마나 바뀌는지는 결과의 안정성을 살피는 단서입니다. 가령 가상의 금리차 계수가 달러지수를 추가한 뒤 작아졌다면, 처음 계수가 다른 요인과 함께 움직였을 가능성을 검토할 수 있습니다. 그러나 계수가 바뀌었다는 사실만으로 특정 편향의 크기를 확정할 수는 없습니다. 경준의 기록에는 계수 크기가 절반으로 줄었다는 내용이 있습니다. 이를 ‘금리차의 진짜 영향이 정확히 절반임을 발견했다’고 말하지 않고, 모형 선택에 따라 해석이 달라질 수 있음을 배운 사례로 사용합니다.", "2. 성장 가능성을 보여 주는 근거  성장 가능성은 추상적인 자신감보다 처음의 접근, 발견한 한계, 수정한 행동으로 설명할 때 구체적입니다. 가령 가상의 팀 과제에서 결과를 잘 아는 사람도 오류를 지적받았을 때 근거를 다시 확인해야 합니다. 경준에게는 환율 변수 추가와 현장 인터뷰라는 실제 수정 경험이 있습니다. 또한 학습지 제작은 자신의 이해를 다른 사람에게 설명한 근거입니다. 이 경험들이 대학의 평가를 보장하지는 않으므로 ‘반드시 뽑아야 한다’는 주장보다 입학 후 어떤 학습 태도로 기여할 수 있는지 연결합니다."], "follow": ["결과가 틀렸다는 비판을 받으면 어떻게 하겠나요?  자료와 계산, 해석 중 어디에 문제가 있는지 나눠 확인하겠습니다. 비판이 타당하면 결론을 수정하고, 아직 확인되지 않은 부분은 보류하겠습니다."], "memory": "변수 추가로 달라진 계수 → 해석 수정 → 중앙대에서 기초와 협업 강화", "caution": "", "source_refs": [1], "university": "중앙대", "kind": "답변", "glossary": []}, {"id": 19, "question": "중앙대에서 하고 싶은 프로젝트는 무엇입니까?", "category": "중앙대 글로벌금융", "answer": ["관세와 환율이 동시에 변할 때 수출기업의 현금흐름이 어떻게 달라지는지 비교해 보고 싶습니다. 고등학교에서는 관세 부담을 기업에 묻고 환율은 자료로 분석했는데, 실제 기업은 두 변화를 함께 겪습니다. 그래서 매출을 받는 통화와 원재료를 사는 통화, 결제 시점을 함께 놓고 보고 싶습니다.", "처음에는 한 산업의 공개 자료로 범위를 좁히겠습니다. 확인할 수 없는 계약조건은 가정으로 구분하고, 그 가정을 바꾸면 결과가 얼마나 달라지는지 비교하겠습니다. 중앙대에서 국제재무관리와 금융통계를 배우면서, 환율을 맞히는 것보다 기업이 어떤 상황에 취약한지 설명하는 프로젝트로 발전시키고 싶습니다."], "evidence": ["3학년 · 진로활동 | PDF 4–5쪽 / 인쇄 5–6쪽\n관세 부담과 기업별 가격 조정 조건을 조사한 활동.", "3학년 · 경제 수학 | PDF 18쪽 / 인쇄 19쪽\n환율 분석 및 가격·이윤·한계비용 탐구.", "3학년 · 심화 수학Ⅰ | PDF 18쪽 / 인쇄 19쪽\n탄소비용 전가에 따른 이윤 변화와 최적 생산량 분석."], "concepts": ["1. 공헌이익과 가격 전가  공헌이익은 매출에서 변동비를 뺀 금액으로, 고정비를 충당하고 이익을 만드는 데 얼마나 기여하는지 살필 때 쓰입니다. 가령 가상의 제품 가격이 100, 변동비가 70인데 새 비용이 10 생기면 판매량이 같다는 가정에서 단위당 공헌이익은 30에서 20으로 줄어듭니다. 가격을 올리면 판매량도 바뀔 수 있어 그 반응을 함께 봐야 합니다. 이 숫자는 설명용 가정입니다. 경준의 관세 귀착과 이윤 최적화 탐구를 연결할 수 있지만, 실제 기업의 마진이나 부담 비율과 혼동하면 안 됩니다.", "2. 민감도 분석과 시나리오 설계  민감도 분석은 다른 조건을 고정하거나 정해 둔 조합 안에서 특정 입력값 변화가 결과에 얼마나 영향을 주는지 보는 방법입니다. 가령 가상의 수출기업에서 수입 원재료 비중을 20%와 60%로 달리하면 같은 환율 변화의 효과도 달라질 수 있습니다. 이를 통해 더 중요한 자료와 취약한 조건을 찾을 수 있습니다. 경준이 제안하는 프로젝트는 미래 환율을 맞히는 대회가 아니라 기업의 노출 구조를 이해하려는 과제입니다. 조건별 결과에 발생 확률을 부여하지 않았다면 기대수익이나 실제 예측값이라고 부르지 않습니다."], "follow": ["필요한 기업 자료를 구하지 못하면요?  공개된 재무자료와 산업 자료로 확인할 부분을 먼저 분석하고, 알 수 없는 계약 조건은 범위를 둔 가정으로 표시하겠습니다. 자료 부족 자체도 결과의 한계로 설명하겠습니다."], "memory": "관세+환율 → 매출·원가·전가율 → 가정을 공개한 시나리오", "caution": "", "source_refs": [1], "university": "중앙대", "kind": "답변", "glossary": [63]}, {"id": 20, "question": "경희대 무역학과에 지원한 이유는 무엇입니까?", "category": "경희대 무역학과", "answer": ["저는 이론으로 설명한 관세 부담이 실제 거래에서는 왜 다르게 나타나는지 배우고 싶어 경희대 무역학과에 지원했습니다. 기업 인터뷰를 해 보니 세율과 탄력성뿐 아니라 계약과 거래관계, 정보를 받은 시점도 중요했습니다. 무역을 이해하려면 시장의 원리와 거래가 이루어지는 과정을 함께 알아야겠다고 느꼈습니다.", "경희대에서 무역상무론으로 계약과 결제의 기본을 배우고, 국제금융과 데이터 분석으로 기업의 대응을 더 구체적으로 살펴보고 싶습니다. 이후에는 지원 자격을 갖춰 GTEP에도 도전하고 싶습니다. 기업의 실제 질문을 듣고 수업에서 분석한 뒤 다시 현장에서 확인하는 공부를 하고 싶다는 것이 제 지원 이유입니다."], "evidence": ["3학년 · 진로활동 | PDF 4–5쪽 / 인쇄 5–6쪽\n관세 귀착을 현장 인터뷰로 확장하고 계약·정보 조건의 중요성을 확인.", "3학년 · 경제 수학 | PDF 18쪽 / 인쇄 19쪽\n환율의 정량적 분석.", "1학년 · 진로활동 교과 연계 자율 탐구 보고서 활동 | PDF 2쪽 / 인쇄 3쪽\n국제통상규범 탐구의 기반."], "concepts": ["1. 무역이론과 무역실무의 연결  무역이론은 국가 간 거래의 원인과 효과를 설명하고, 무역실무는 계약·결제·운송·보험·통관 등 거래를 실행하는 절차와 조건을 다룹니다. 가령 가상의 수출기업이 시장에서 경쟁력이 있어도 결제조건이 불리하거나 인증이 늦으면 거래가 어려워질 수 있습니다. 경준의 관세 인터뷰는 같은 정책 아래에서도 기업별 결과가 다른 이유를 보여 주는 출발점입니다. 다만 소수 인터뷰로 실무 전반을 경험한 것은 아닙니다. 이론에서 생긴 질문을 구체적인 거래 과정으로 확인하고 싶다는 지원동기로 연결합니다.", "2. 경희대 교육과정과 현장 경험  공식 공개 자료에는 무역상무론·국제경영론·국제금융론·무역통상법규·무역실증패널분석 등이 제시됩니다. 개설 학기와 수강 조건은 입학 후 확인해야 하지만, 실무와 규범·실증분석을 연결하려는 방향의 근거가 됩니다. 가령 가상의 기업 사례에서 계약 조건을 확인하고 환율과 비용의 관계를 자료로 분석하는 과제를 구상할 수 있습니다. GTEP은 별도 선발과 이수 조건이 있는 프로그램입니다. 경준은 즉시 참여가 확정된 것처럼 말하지 않고, 기초를 쌓은 뒤 지원할 학습 기회로 설명합니다."], "follow": ["무역학과에서 가장 먼저 알고 싶은 거래 단계는 무엇인가요?  계약과 결제 조건입니다. 인터뷰에서 가격 조정 시점과 거래관계가 부담에 영향을 주는 것을 봐서, 그 조건이 실제 계약에 어떻게 반영되는지 배우고 싶습니다."], "memory": "기업 인터뷰의 질문 → 무역상무·국제금융·통상법규 → 현장에서 확인", "caution": "", "source_refs": [3, 4, 5], "university": "경희대", "kind": "답변", "glossary": [31]}, {"id": 21, "question": "경희대에서 가장 해보고 싶은 경험은 무엇입니까?", "category": "경희대 무역학과", "answer": ["저는 기업이 실제로 해외시장에 진출할 때 무엇을 준비하고 어떤 질문을 받는지 배워 보고 싶습니다. 고등학교의 인터뷰는 기업의 경험을 듣는 단계였다면, 대학에서는 시장을 조사하고 바이어의 요구를 정리하는 과정에도 참여해 보고 싶습니다. 제가 궁금한 것만 묻는 데서 나아가 기업에 필요한 정보를 찾는 경험을 하고 싶습니다.", "그런 점에서 경희대의 GTEP에 관심이 있습니다. 별도 선발과 이수 조건이 있으므로 먼저 무역실무와 외국어를 준비하겠습니다. 참여하게 된다면 조사 자료를 바이어의 질문과 연결해 정리하는 역할을 맡고 싶습니다. 해외에 다녀왔다는 사실보다, 현장에서 받은 반응으로 제 설명과 제안을 어떻게 바꿨는지가 남는 경험을 하고 싶습니다."], "evidence": ["3학년 · 진로활동 | PDF 4–5쪽 / 인쇄 5–6쪽\n기업과 직접 소통하며 이론과 의사결정 조건을 비교한 경험.", "3학년 · 실용 경제 | PDF 17쪽 / 인쇄 18쪽\n기업의 지불의사와 실제 수요를 검토한 활동."], "concepts": ["1. GTEP을 활용하는 현실적인 계획  경희대가 공개한 20기 GTEP 모집은 2026년 기준 3·4학년 등 이수 조건을 갖춘 학생을 대상으로 하며 별도 선발을 거칩니다. 따라서 신입생부터 참여가 확정된 교육과정으로 설명하면 부정확합니다. 가령 입학 후 무역 기초와 외국어를 준비하고, 해당 연도의 공고를 확인해 지원하는 계획을 세울 수 있습니다. 경준의 인터뷰 경험은 기업과 소통할 동기가 되지만 선발이나 성과를 보장하지 않습니다. 구체적인 활동 기간과 자격은 실제 지원 시점의 공고를 기준으로 다시 확인합니다.", "2. 기업 간 거래의 질문  기업 간 거래에서는 상품의 매력뿐 아니라 가격, 납기, 품질, 인증, 결제조건, 안정적인 공급 가능성이 함께 중요합니다. 가령 가상의 바이어가 가격보다 일정 준수를 더 중시한다면, 저렴하다는 설명만으로는 설득력이 부족할 수 있습니다. 경준이 기업 인터뷰에서 살핀 장기 거래관계와 정보시차도 이런 조건에 닿아 있습니다. 시장조사에서 소비자 선호를 아는 것과 바이어의 구매 조건을 아는 것은 구별해야 합니다. 현장 경험의 목표를 막연한 해외 방문보다 실제 질문을 듣고 제안을 수정하는 일로 잡습니다."], "follow": ["프로그램에서 맡고 싶은 역할을 하나만 고른다면요?  바이어의 요구를 조사 자료와 연결해 정리하는 역할입니다. 기업이 확인해야 할 규정과 가격·납기 조건을 구분해서 다음 상담에 활용할 수 있도록 돕고 싶습니다."], "memory": "기업의 당장 질문 듣기 → 자격 갖춰 GTEP 지원 → 바이어 반응으로 개선", "caution": "", "source_refs": [5], "university": "경희대", "kind": "답변", "glossary": [31]}, {"id": 22, "question": "경희대 입학 후 구체적인 학업계획을 말해보세요.", "category": "경희대 무역학과", "answer": ["먼저 경제·통계의 기초와 무역상무론을 공부해 거래의 전체 흐름을 이해하고 싶습니다. 기업 인터뷰에서 가격 조정과 계약조건이 중요하다는 걸 알았지만, 실제 계약과 결제 절차를 충분히 아는 것은 아닙니다. 경희대에서 그 기초를 배운 뒤 국제금융과 통상 관련 법규를 연결해 공부하겠습니다.", "이후에는 무역 데이터를 다루는 수업에서 관세 변화와 기업의 대응을 분석해 보고 싶습니다. 현장 프로그램에 참여할 기회가 생기면 제가 세운 가정이 실제 기업의 상황과 맞는지도 확인하겠습니다. 수업과 현장을 별개의 경험으로 쌓기보다, 현장에서 생긴 질문을 수업으로 가져오고 배운 내용을 다시 적용하는 방식으로 공부하고 싶습니다."], "evidence": ["3학년 · 진로활동 | PDF 4–5쪽 / 인쇄 5–6쪽\n기업별 관세 부담을 조사한 경험.", "3학년 · 경제 수학 | PDF 18쪽 / 인쇄 19쪽\n환율 회귀로 자료 분석을 시도한 경험.", "2학년 · 진로활동 진로 연계 심층 탐구 프로젝트 | PDF 3쪽 / 인쇄 4쪽\n국가 간 반도체 무역변화를 모형으로 설명한 탐구."], "concepts": ["1. 무역통상법규와 국제금융의 역할  무역통상법규는 거래에 적용되는 법적 기준과 제도를, 국제금융은 환율·국제 자본이동·금융시장의 관계를 이해하는 데 연결됩니다. 가령 가상의 기업이 같은 상품을 수출해도 관세 적용 조건과 결제 통화가 다르면 예상 비용과 수익이 달라집니다. 경준은 관세와 환율을 모두 탐구했으므로 두 관점을 함께 배우려는 이유를 설명할 수 있습니다. 다만 공식 공개 교육과정에서 확인한 과목명은 무역통상법규이며, 확인하지 않은 ‘WTO법’ 과목이 현재 반드시 개설된다고 바꾸어 말하지 않습니다.", "2. 패널자료와 실증분석  패널자료는 여러 기업이나 국가를 여러 시점에 걸쳐 관측한 자료입니다. 가령 가상의 국가 10곳의 5년 수출을 관찰하면 국가별 차이와 시간에 따른 변화를 함께 살펴볼 수 있습니다. 고정효과 같은 방법은 관측되지 않는 일정한 특성을 통제하는 데 도움이 되지만, 모든 내생성을 자동으로 없애지는 않습니다. 경준의 반도체 무역과 환율 탐구를 발전시킬 학습 도구입니다. 데이터가 많다는 사실만으로 인과관계가 증명되지는 않으며, 정책 변화와 다른 충격을 구별하는 분석 설계가 필요합니다."], "follow": ["패널분석을 왜 배우고 싶나요?  기업이나 국가마다 다른 조건과 시간에 따라 달라지는 환경을 함께 보고 싶기 때문입니다. 다만 모형을 적용하기 전에 어떤 차이를 통제할 수 있는지부터 배우겠습니다."], "memory": "무역·경제·통계 기초 → 법규·국제금융 → 패널·빅데이터 → 현장 검토", "caution": "", "source_refs": [4, 3], "university": "경희대", "kind": "답변", "glossary": [31, 65]}, {"id": 23, "question": "경희대가 왜 본인을 선발해야 합니까?", "category": "경희대 무역학과", "answer": ["저는 책과 자료에서 생긴 질문을 실제 사람에게 묻고, 그 답을 다음 행동으로 이어 가는 학생입니다. 관세 부담을 알아보려고 질문지와 영문 요청서를 작성해 기업에 연락했고, 이메일을 포함한 세 건의 인터뷰를 진행했습니다. 그 과정에서 정보 접근의 차이가 기업의 선택에 영향을 줄 수 있다는 점을 발견했습니다.", "이후에는 필요한 근거를 찾는 도구를 만들고, 기업이 그 서비스에 실제로 비용을 지불할지도 검토했습니다. 경희대에서도 기업의 요구를 듣고 팀원들과 분석을 구체화하는 역할을 하고 싶습니다. 경제 동아리를 운영하고 팀의 의견을 조율했던 경험을 살려, 각자의 생각을 실행 가능한 제안으로 모으는 학생이 되겠습니다."], "evidence": ["3학년 · 진로활동 | PDF 4–5쪽 / 인쇄 5–6쪽\n질문지·영문 요청서 작성과 이메일 포함 세 건의 기업 인터뷰.", "3학년 · 자율활동 | PDF 4쪽 / 인쇄 5쪽\n정보 문제를 RAG 도구 제작으로 확장.", "3학년 · 실용 경제 | PDF 17쪽 / 인쇄 18쪽\n유효수요와 지불의사로 사업성을 재검토."], "concepts": ["1. 기업 인터뷰를 탐구로 바꾸는 방법  인터뷰는 당사자가 어떤 조건에서 선택했는지 자세히 파악하는 데 도움이 됩니다. 다만 질문 방식과 응답자의 기억, 자신을 설명하려는 동기에도 영향을 받습니다. 가령 가상의 기업이 관세 부담을 크게 느꼈다고 말해도 그것이 실제 단가 변화인지 마진 감소인지 다시 구분해야 합니다. 경준의 질문지 작성과 인터뷰는 현장조사를 실행한 근거입니다. 세 사례는 원리를 탐색하고 새 질문을 만드는 자료로 활용하되, 모집단을 대표하는 추정치나 확정된 인과효과로 제시하지 않습니다.", "2. 탐구 결과를 실제 제안으로 바꾸기  제안은 발견한 문제와 해결 방식, 필요한 자료, 예상 비용을 연결해야 합니다. 가령 가상의 기업이 규정 검색에 시간이 많이 든다면 검색 기능을 제시할 수 있지만, 사용 빈도가 낮고 무료 대체재가 편리하면 별도 서비스의 편익이 작을 수 있습니다. 경준은 도구를 만든 뒤 실용 경제에서 지불의사와 시간 비용을 살폈습니다. 이는 아이디어의 매력과 사용자의 선택이 다를 수 있음을 배운 근거입니다. 대학에서의 기여도 이미 성공한 서비스를 갖고 있다는 주장보다 반응을 듣고 개선하는 과정으로 설명합니다."], "follow": ["팀원이 기업 인터뷰 결론에 동의하지 않으면요?  어떤 표현과 자료에서 다르게 해석했는지 먼저 확인하겠습니다. 추가로 물어볼 질문을 함께 만들고, 확인할 수 없는 부분은 서로 다른 가능성으로 남겨 두겠습니다."], "memory": "질문지·영문 요청서 → 기업의 답 → 도구와 사업성 검토 → 팀과 개선", "caution": "", "source_refs": [3], "university": "경희대", "kind": "답변", "glossary": []}, {"id": 24, "question": "경희대 교환학생을 간다면 무엇을 연구하고 싶습니까?", "category": "경희대 무역학과", "answer": ["기회가 주어진다면 같은 종류의 한국 제품이 현지에서 어떤 가격과 유통 경로로 판매되는지 조사하고 싶습니다. 저는 같은 상품도 국가에 따라 거래조건이 달라지는 이유에 관심이 있습니다. 기업 인터뷰에서도 가격 하나를 이해하려면 계약과 거래관계를 함께 알아야 했습니다.", "먼저 비교할 품목을 좁히고, 세금과 배송비를 포함했는지 같은 기준부터 맞추겠습니다. 이후 현지 규정과 판매자의 설명을 비교해 가격 차이의 원인을 살펴보고 싶습니다. 경희대에서 배운 무역과 마케팅 지식을 활용해 한국 기업이 어떤 조건을 확인해야 하는지 보고서로 정리하겠습니다. 교환학생 경험을 하나의 질문을 깊게 확인하는 기회로 만들고 싶습니다."], "evidence": ["3학년 · 진로활동 | PDF 4–5쪽 / 인쇄 5–6쪽\n기업 인터뷰에서 거래관계와 조건을 파악한 경험.", "3학년 · 마케팅과 광고 | PDF 19쪽 / 인쇄 20쪽\nSWOT·STP 등을 활용하고 경영모형의 설명 한계를 검토한 활동."], "concepts": ["1. 현지 가격 비교의 조건  국가 간 가격을 비교하려면 동일한 상품인지, 세금과 배송비가 포함되는지, 판매 시점과 환율이 같은지 확인해야 합니다. 가령 가상의 두 국가에서 같은 이름의 제품을 팔더라도 용량이나 품질, 보증 조건이 다르면 가격 차이를 그대로 비교하기 어렵습니다. 경준이 조사하려는 것은 차이가 나타난다는 사실과 그 이유를 구별하는 작업입니다. 관세 외에도 유통 마진과 경쟁 구조가 작용할 수 있으므로, 가격 차이 전체를 특정 규제의 인과효과로 설명하지 않습니다. 비교 기준을 먼저 정하는 것이 핵심입니다.", "2. 현지화와 시장 진입 전략  현지화는 상품과 전달 방식을 현지의 제도·문화·수요 조건에 맞추는 과정입니다. 가령 가상의 식품기업은 언어 표시와 인증을 맞추고, 유통업체가 선호하는 포장 단위를 검토할 수 있습니다. 규정 준수와 소비자 선호에 따른 변경은 서로 다른 이유이므로 구분해야 합니다. 경준의 마케팅 탐구에서 다룬 세분화와 목표시장 선택을 현장 조사와 연결할 수 있습니다. 다만 교환학생 파견과 특정 조사 대상의 협조가 확정된 것은 아닙니다. 프로그램 선발과 현지 여건에 맞춰 실행 범위를 조정할 계획입니다."], "follow": ["어느 나라를 가고 싶나요?  현재 특정 파견교가 정해진 것은 없습니다. 조사하고 싶은 품목과 수업, 어학 조건을 먼저 살핀 뒤 한국 기업의 거래 사례를 비교할 수 있는 곳을 선택하고 싶습니다."], "memory": "같은 품목 → 가격·유통·규제 조건 비교 → 현지 조사 → 진입전략 보고서", "caution": "", "source_refs": [3], "university": "경희대", "kind": "답변", "glossary": []}, {"id": 25, "question": "왜 한국외대 국제통상학과입니까?", "category": "한국외대 국제통상학과", "answer": ["저는 국제규범을 읽는 능력과 경제적 효과를 분석하는 능력을 함께 기르고 싶어 한국외대 국제통상학과에 지원했습니다. 안보예외를 탐구할 때는 규정의 적용 기준이 궁금했고, 기업 인터뷰를 할 때는 그 규정이 실제 비용과 선택으로 어떻게 이어지는지 궁금했습니다. 두 질문을 함께 공부하고 싶습니다.", "한국외대의 국제통상법과 국제계약법에서 거래의 규칙을 배우고, 계량경제학과 국제금융시장분석에서 그 영향을 자료로 확인하고 싶습니다. 특히 관세 부담이 계약조건에 따라 달라졌던 제 인터뷰를 더 깊게 분석해 보고 싶습니다. 규정과 숫자, 기업의 설명을 연결해 판단하는 공부가 제가 이 학과에 들어오고 싶은 이유입니다."], "evidence": ["1학년 · 진로활동 교과 연계 자율 탐구 보고서 활동 | PDF 2쪽 / 인쇄 3쪽\n안보예외와 첨단기술 수출통제를 탐구한 경험.", "1학년 · 국제 경제 2학기 공동교육과정 | PDF 9쪽 / 인쇄 10쪽\n국제 경제 수업에서 GATT와 무역기구의 역할·한계를 분석.", "3학년 · 경제 수학 | PDF 18쪽 / 인쇄 19쪽\n환율의 실증적 분석.", "3학년 · 진로활동 | PDF 4–5쪽 / 인쇄 5–6쪽\n기업별 관세 부담과 계약·정보 조건 탐구."], "concepts": ["1. 규범 분석과 경제효과 분석  규범 분석은 어떤 의무와 예외가 적용되는지를 확인하고, 경제효과 분석은 그 제도가 가격·거래량·비용 등에 어떤 변화를 주는지 살펴봅니다. 가령 가상의 규제가 기업의 비용을 높인다고 해서 자동으로 국제규범 위반이 되는 것은 아니며, 법적으로 허용돼도 경제적 부담이 작다는 뜻은 아닙니다. 경준의 안보예외 탐구와 기업 인터뷰를 연결할 때 이 차이가 중요합니다. 법적 평가와 경제적 평가를 구분한 뒤 함께 제시해야 가능한 대응을 현실적으로 설명할 수 있습니다.", "2. 국제계약법을 배우려는 이유  국제거래 계약에서는 당사자의 의무, 가격·결제·인도 조건, 준거법과 분쟁해결 방식 등이 중요합니다. 가령 가상의 관세 인상 때 어느 당사자가 비용을 부담하는지는 거래 조건과 적용 규칙을 확인해야 합니다. 경제학적 부담 분석과 법적으로 약속한 의무는 관련되지만 동일하지 않습니다. 경준은 인터뷰에서 장기 거래관계와 가격 조정 시점의 역할을 살폈습니다. 국제계약법은 이 경험을 구체적인 권리·의무의 구조로 이해하는 데 연결되는 과목이며, 이미 전문적인 계약 자문을 했다는 뜻은 아닙니다."], "follow": ["법과 경제 중 어느 쪽에 더 관심이 있나요?  기업의 선택을 설명하려는 관심이 중심입니다. 법은 가능한 행동의 조건을, 경제는 그 선택의 비용과 효과를 알려 준다고 생각해서 두 관점을 연결해 배우고 싶습니다."], "memory": "안보예외의 질문 → 경제효과도 확인 → 통상법·계약법·계량·금융 연결", "caution": "", "source_refs": [6, 7], "university": "한국외대", "kind": "답변", "glossary": [], "note": "공식 페이지의 과목 표기는 Econometrics입니다. 본문에서는 계량경제학이라는 뜻을 함께 설명했습니다. 실제 개설과 수강 조건은 해당 학기 안내를 확인합니다."}, {"id": 26, "question": "한국외대에서 계량경제학을 배우고 싶은 이유는 무엇입니까?", "category": "한국외대 국제통상학과", "answer": ["자료에서 관계를 찾는 것과 실제 원인을 설명하는 것이 어떻게 다른지 배우고 싶기 때문입니다. 환율 분석에서 달러지수를 추가하자 금리차 계수가 달라졌고, 사회자본 탐구에서도 투자와 신뢰 중 무엇이 먼저 영향을 주는지 구분하기 어려웠습니다. 계산을 할수록 어떤 비교가 타당한지가 더 궁금해졌습니다.", "한국외대에서 계량경제학을 배우며 회귀의 가정과 인과관계를 구분하는 방법을 익히고 싶습니다. 도구변수도 이름과 원리를 아는 데서 나아가, 왜 그 변수가 적절한지 설명할 수 있는 수준으로 배우겠습니다. 앞으로 통상정책의 효과를 분석할 때 제가 기대한 결론을 찾기보다, 자료가 실제로 말해 주는 범위를 정확히 판단하고 싶습니다."], "evidence": ["3학년 · 경제 수학 | PDF 18쪽 / 인쇄 19쪽\n변수 추가에 따라 환율 회귀 결과가 달라진 경험.", "2학년 · 진로활동 진로 연계 심층 탐구 프로젝트 | PDF 3쪽 / 인쇄 4쪽\n중력모형과 거리변수로 반도체 무역전환을 탐구.", "2학년 · 독서 | PDF 11쪽 / 인쇄 12쪽\n사회자본 탐구에서 도구변수를 인과 분리의 분석 틀로 접한 기록."], "concepts": ["1. 인과효과와 식별  인과효과는 어떤 조건을 바꿨을 때 결과가 어떻게 달라지는지를 뜻합니다. 같은 대상이 동시에 정책을 적용받고 받지 않는 상황을 관찰할 수 없으므로, 비교 가능한 집단이나 시점과 타당한 가정이 필요합니다. 가령 가상의 관세 인상 뒤 수출이 줄어도 세계 수요가 동시에 감소했다면 전체 감소를 관세 탓으로 돌릴 수 없습니다. 경준의 회귀와 무역 탐구는 이 문제를 배울 출발점입니다. 변수를 많이 넣거나 높은 설명력을 얻었다는 사실만으로 인과효과가 식별되지는 않습니다.", "2. 도구변수의 조건  도구변수는 관심 있는 설명변수와 관련되면서, 다른 경로로 결과나 오차와 연결되지 않아야 합니다. 관련성뿐 아니라 배제제약과 외생성이 설득돼야 하며, 약한 도구도 문제가 됩니다. 가령 무역량을 분석할 때 거리는 운송비를 통해 무역에 직접 영향을 줄 수 있어 아무 설명 없이 도구로 삼기 어렵습니다. 이는 경준의 반도체 탐구와 연결되는 점검 사례입니다. 생기부에는 개념을 적용한 탐구 틀이 있으나 타당성 검정과 완성된 2단계 최소제곱 추정 결과가 확인되지는 않습니다."], "follow": ["2SLS를 실제로 완성했다고 말할 수 있나요?  도구변수의 원리와 적용 가능성은 검토했지만, 유효한 도구를 확보해 2SLS 추정까지 완성한 것은 아닙니다. 타당한 도구를 어떻게 찾고 검증하는지는 대학에서 더 배우고 싶은 부분입니다."], "memory": "관계와 인과의 차이 → 빠진 조건 → 식별·도구변수·시계열 학습", "caution": "도구변수의 개념 검토를 유효한 도구 선정과 완성된 2SLS 인과추정으로 확대하지 않는다.", "source_refs": [6, 8], "university": "한국외대", "kind": "답변", "glossary": [41, 65], "note": "공식 페이지의 과목 표기는 Econometrics입니다. 본문에서는 계량경제학이라는 뜻을 함께 설명했습니다. 실제 개설과 수강 조건은 해당 학기 안내를 확인합니다."}, {"id": 27, "question": "한국외대의 해외 프로그램을 활용한다면 어떤 목표를 세우겠습니까?", "category": "한국외대 국제통상학과", "answer": ["저는 다른 나라에서 공부할 기회를 얻으면 같은 규정이 실제 거래에서 어떻게 적용되는지 비교해 보고 싶습니다. 데이터 현지화를 탐구하면서 규정의 문장을 읽는 것과 기업이 그 규정에 대응하는 방식을 아는 것은 다르다고 느꼈습니다. 원문 자료와 현장의 설명을 함께 살펴보고 싶습니다.", "한국외대의 7+1 파견학생 프로그램에 관심이 있습니다. 입학 직후 참여가 보장되는 제도는 아니므로 전공과 외국어를 준비하고, 지원할 때의 자격과 파견교 조건을 확인하겠습니다. 기회를 얻으면 품목이나 서비스를 하나 정해 조사하고, 귀국 후 관찰한 차이와 제 해석을 구분한 보고서로 정리하고 싶습니다."], "evidence": ["2학년 · 문학 | PDF 11쪽 / 인쇄 12쪽\n문학에서 출발해 데이터 현지화와 디지털무역의 규제 비용을 탐구.", "3학년 · 진로활동 | PDF 4–5쪽 / 인쇄 5–6쪽\n기업 의견과 제도·이론을 비교한 인터뷰 경험."], "concepts": ["1. 7+1 파견학생의 조건  한국외대의 공식 파견학생 공고는 이수학기와 성적·어학·파견교 조건 등을 제시하고 선발 절차를 운영합니다. 확인한 2027학년도 1학기 공고에도 지원 자격이 있으므로 입학 즉시 참가가 보장되는 프로그램으로 말하면 안 됩니다. 가령 학업과 언어 준비를 먼저 하고, 지원 시점에 가능한 학교의 전공 수업과 학점 인정 조건을 비교하는 계획을 세울 수 있습니다. 경준의 해외 학습 목표는 탐구를 확장할 미래 계획입니다. 특정 국가·기업 조사가 이미 승인됐거나 참여가 확정된 사실과 구분합니다.", "2. 현장 관찰과 비교 가능성  현장 관찰은 자료만으로 놓치기 쉬운 제도 적용과 거래 관행을 이해하는 데 유용합니다. 그러나 다른 나라에서 한 사례를 봤다는 이유로 국가 전체의 특징을 결론 내릴 수는 없습니다. 가령 가상의 두 온라인 서비스가 가격이 달라도 세금, 기능, 고객층이 달라 직접 비교가 어려울 수 있습니다. 경준은 규정의 원문과 적용 대상, 관찰 시점을 먼저 맞추고 관계자의 설명을 교차 확인하는 방식으로 탐구를 설계할 수 있습니다. 관찰한 차이와 원인이라고 추측한 내용을 분리하면 보고서의 신뢰도가 높아집니다."], "follow": ["해외에서 꼭 조사해야 하는 이유가 있나요?  원문 규정은 국내에서도 볼 수 있지만, 실제 판매자나 이용자가 어떤 조건을 중요하게 여기는지는 현장에서 더 배울 수 있다고 생각합니다. 온라인 조사와 현장 관찰을 함께 쓰고 싶습니다."], "memory": "지원 조건 준비 → 조사 대상 하나 → 원문·현장 비교 → 관찰과 가설 분리", "caution": "", "source_refs": [9], "university": "한국외대", "kind": "답변", "glossary": [32]}, {"id": 28, "question": "한국외대 입학 후 구체적인 학업계획을 말해보세요.", "category": "한국외대 국제통상학과", "answer": ["기초 경제학과 경제수학·통계학부터 탄탄하게 공부하겠습니다. 고등학교에서 환율 회귀와 이윤함수를 다뤘지만, 결과를 더 정확히 설명하려면 추정과 최적화의 원리를 체계적으로 배워야 한다고 느꼈습니다. 그다음 국제통상법과 국제계약법으로 기업이 선택할 수 있는 법적 조건을 배우고 싶습니다.", "심화 단계에서는 계량경제학과 국제금융시장분석을 연결해 관세 변화가 기업의 가격과 외화 결제에 미치는 영향을 분석해 보고 싶습니다. 한국외대의 해외교류 기회도 자격을 갖춰 준비하겠습니다. 과목을 각각 이수하는 데서 끝내지 않고, 한 수출 거래를 규범·계약·데이터의 관점에서 설명할 수 있는 것이 제 목표입니다."], "evidence": ["3학년 · 경제 수학 | PDF 18쪽 / 인쇄 19쪽\n환율 회귀와 가격·이윤 모형 탐구.", "3학년 · 심화 수학Ⅰ | PDF 18쪽 / 인쇄 19쪽\n탄소비용과 최적 생산량을 미분으로 살핀 활동.", "3학년 · 진로활동 | PDF 4–5쪽 / 인쇄 5–6쪽\n기업의 관세 부담과 가격 조정 조건을 조사."], "concepts": ["1. 경제수학과 최적화  최적화는 주어진 목표와 제약 아래에서 가장 나은 선택을 찾는 방법입니다. 기업의 단순한 이윤 모형에서는 추가 생산의 수입과 비용을 비교하지만, 내부해와 미분 가능성 등 조건을 확인해야 합니다. 가령 가상의 생산량을 늘려 얻는 추가 수입보다 추가 비용이 커지면 생산 확대가 이익을 줄일 수 있습니다. 경준은 심화 수학Ⅰ에서 탄소비용 전가와 이윤을 분석했습니다. 대학의 경제수학에서 배우는 미분·선형대수·최적화는 이런 사고를 확장하는 기초이며, 모든 현실 문제에 같은 공식을 적용한다는 뜻은 아닙니다.", "2. 거래 사례를 통합하는 학업 방식  하나의 사례를 여러 과목의 질문으로 나누면 학업계획이 구체적입니다. 가령 가상의 수출계약에서 통상법은 적용 규정을, 계약법은 당사자의 약속을, 국제금융은 외화 결제를, 계량분석은 자료에 나타난 효과를 다룹니다. 각 분석은 서로 보완하지만 동일한 결론을 자동으로 내리지는 않습니다. 경준의 관세 인터뷰와 환율 탐구를 연결할 때에도 법적 의무와 경제적 부담을 구별해야 합니다. 공식 교육과정은 공부의 방향을 뒷받침하며, 실제 개설과 선수과목은 입학 후 학사 안내에 따라 확인합니다."], "follow": ["법 과목과 계량 과목을 어떻게 함께 활용하겠나요?  먼저 규정의 적용 대상과 시점을 정리해 분석 대상을 정하겠습니다. 그다음 자료에서 변화를 살피고, 다른 원인과 구별할 수 있는 설계를 검토하겠습니다."], "memory": "경제·통계·수학 → 규칙과 계약 → 계량·금융 → 한 거래 사례로 연결", "caution": "", "source_refs": [6, 7], "university": "한국외대", "kind": "답변", "glossary": [32], "note": "공식 페이지의 과목 표기는 Econometrics입니다. 본문에서는 계량경제학이라는 뜻을 함께 설명했습니다. 실제 개설과 수강 조건은 해당 학기 안내를 확인합니다."}, {"id": 29, "question": "한국외대가 왜 본인을 선발해야 합니까?", "category": "한국외대 국제통상학과", "answer": ["저는 규정과 숫자를 읽는 데서 멈추지 않고, 그것을 실제 기업의 질문과 연결해 본 학생입니다. 안보예외를 탐구했고, 환율 모형을 수정했으며, 기업에 직접 연락해 관세 부담을 물었습니다. 서로 다른 자료를 비교하면서 하나의 설명만으로는 놓치는 조건이 있다는 점을 배웠습니다.", "한국외대에서 국제통상법과 계량경제학을 공부하며 이 경험을 더 깊게 만들고 싶습니다. 또 경제 동아리에서 개념을 풀어 설명하고 학술제에서 도구를 시연했던 경험을 살려, 팀원들이 같은 내용을 이해할 수 있도록 소통하겠습니다. AI가 만든 결과도 그대로 전달하지 않고 근거를 확인해 자신의 말로 설명하는 학생으로 기여하고 싶습니다."], "evidence": ["1학년 · 진로활동 교과 연계 자율 탐구 보고서 활동 | PDF 2쪽 / 인쇄 3쪽\n안보예외의 의미와 적용 한계 탐구.", "3학년 · 경제 수학 | PDF 18쪽 / 인쇄 19쪽\n환율 자료로 설명을 점검한 활동.", "3학년 · 진로활동 | PDF 4–5쪽 / 인쇄 5–6쪽\n현장 인터뷰에서 계약과 정보 조건을 살핀 활동.", "2학년 · 동아리활동 경제해부학2 | PDF 3쪽 / 인쇄 4쪽\n동아리 학습지 제작을 통한 설명과 공유."], "concepts": ["1. 자료의 성격에 맞는 해석  법령, 통계, 인터뷰는 서로 다른 종류의 근거를 제공합니다. 법령은 규정의 문언을, 통계는 관측된 관계를, 인터뷰는 당사자가 경험한 조건과 해석을 보여 줍니다. 가령 가상의 기업이 규제를 부담스럽다고 말해도 그것만으로 규정 위반이나 국가 전체의 피해 규모를 확정할 수 없습니다. 경준은 여러 자료를 사용했으므로 각각 무엇을 말할 수 있는지 구별하는 태도가 중요합니다. 자료가 다양하다는 사실보다 서로의 빈틈을 어떻게 보완하고 충돌할 때 어떻게 다시 확인하는지를 설명합니다.", "2. 전공 지식을 설명하는 의사소통  의사소통은 전문용어를 많이 쓰는 것보다 상대가 판단할 수 있게 근거와 조건을 전달하는 일입니다. 가령 가상의 기업 담당자에게 회귀계수만 제시하기보다 어떤 자료에서 나온 값이며 회사의 비용에 어떻게 연결되는지 설명해야 합니다. 경준의 학습지 제작은 어려운 경제 개념을 다른 학생과 나누려 한 경험입니다. 대학에서는 법과 경제의 용어를 정확히 배우고, 상대의 이해를 확인하며 설명하는 능력으로 발전시킬 수 있습니다. 말하기의 유창함과 분석의 정확성은 함께 갖춰야 하며 어느 하나가 다른 하나를 대신하지 않습니다."], "follow": ["본인의 활동을 관통하는 질문은 무엇인가요?  국제환경이 변할 때 기업은 무엇을 근거로 결정해야 하는가입니다. 규정과 데이터, 당사자의 설명을 함께 확인해야 그 질문에 더 잘 답할 수 있다고 생각합니다."], "memory": "규정의 말 + 자료의 관계 + 기업의 조건 → 함께 설명하는 학생", "caution": "", "source_refs": [6, 7], "university": "한국외대", "kind": "답변", "glossary": [], "note": "공식 페이지의 과목 표기는 Econometrics입니다. 본문에서는 계량경제학이라는 뜻을 함께 설명했습니다. 실제 개설과 수강 조건은 해당 학기 안내를 확인합니다."}, {"id": 30, "question": "중앙대 면접에서 마지막으로 하고 싶은 말은 무엇입니까?", "category": "대학별 마지막 말", "answer": ["제 이야기를 들어주셔서 감사합니다. 저는 환율을 분석하면서 처음 세운 설명이 달라졌을 때 오히려 더 공부하고 싶어졌습니다. 숫자가 높게 나오는 것보다 그 숫자가 왜 달라졌는지 이해하는 일이 중요하다는 걸 배웠습니다.", "중앙대 글로벌금융에서 금융통계와 국제재무관리를 배우며, 이런 질문을 기업의 현금흐름과 위험관리로 이어 가고 싶습니다. 직접 시도하고, 결과를 검토하고, 함께 공부하는 사람에게 분명하게 설명하는 학생이 되겠습니다. 감사합니다."], "evidence": ["3학년 · 경제 수학 | PDF 18쪽 / 인쇄 19쪽\n환율 모형의 결과와 해석을 수정한 경험.", "3학년 · 진로활동 | PDF 4–5쪽 / 인쇄 5–6쪽\n기업의 계약·거래관계를 분석에 포함해야 함을 배운 인터뷰."], "concepts": ["1. 마지막 말에서 남길 한 가지 인상  마지막 말은 새로운 활동을 많이 추가하기보다 면접에서 보여 준 사람의 특징을 한 번 더 선명하게 만드는 기회입니다. 이 답변의 중심은 결과가 예상과 다를 때 설명을 다시 검토한 태도입니다. 가령 시간이 짧게 주어진 상황에서는 환율 탐구 한 문장과 대학에서 배우고 싶은 방향만 남길 수 있습니다. 경준의 실제 경험이 근거이므로 막연한 열정이나 다른 지원자와의 비교가 필요하지 않습니다. 면접에서 충분히 설명한 활동은 줄이고, 면접관이 지정한 시간을 우선해 답변 길이를 조정합니다.", "2. 분석 경험을 금융 학습으로 연결하기  환율을 설명하는 모형과 기업의 위험관리 모형은 질문이 다릅니다. 전자는 환율 변화의 관계를 살피고, 후자는 그 변화에 대한 기업의 노출과 대응을 다룹니다. 가령 가상의 기업이 달러 매출을 갖고 있어도 원재료 수입과 결제 시점에 따라 실제 위험은 달라질 수 있습니다. 경준은 환율 분석과 기업 인터뷰를 각각 수행했으므로 두 경험을 연결할 학업 동기가 있습니다. 중앙대의 금융수학·금융통계·국제재무관리라는 확인된 교육과정을 이 다음 단계와 연결하면 구체적인 마무리가 됩니다."], "follow": ["마지막으로 자신을 한 단어로 표현한다면요?  ‘수정하는 사람’이라고 표현하고 싶습니다. 처음의 설명을 고집하기보다 자료와 현장의 질문을 받아들여 더 나은 설명으로 발전시키려 했기 때문입니다."], "memory": "감사 → 환율 분석의 수정 → 국제재무로 연결 → 배우고 실행할 태도", "caution": "", "source_refs": [1], "university": "중앙대", "kind": "답변", "glossary": []}, {"id": 31, "question": "경희대 면접에서 마지막으로 하고 싶은 말은 무엇입니까?", "category": "대학별 마지막 말", "answer": ["제 경험을 말씀드릴 기회를 주셔서 감사합니다. 기업에 직접 연락해 관세 부담을 물었던 경험을 통해, 제가 아는 이론보다 먼저 상대의 실제 상황을 들어야 한다는 걸 배웠습니다. 그때 생긴 질문을 대학에서 더 깊게 이어 가고 싶습니다.", "경희대 무역학과에서 거래의 이론과 실무를 배우고, 자격을 갖춰 GTEP 같은 현장 기회에도 도전하겠습니다. 배운 지식을 실제 기업의 문제와 연결하고, 팀원들과 의견을 조율해 실행하는 학생으로 성장하겠습니다. 감사합니다."], "evidence": ["3학년 · 진로활동 | PDF 4–5쪽 / 인쇄 5–6쪽\n기업 인터뷰에서 계약과 정보시차의 역할을 확인.", "2학년 · 동아리활동 경제해부학2 | PDF 3쪽 / 인쇄 4쪽\n경제 동아리를 만들고 학습지를 통해 함께 배운 경험."], "concepts": ["1. 현장 경험을 지원동기로 마무리하기  기업을 만났다는 사실 자체보다 그 경험이 질문을 어떻게 바꿨는지가 중요합니다. 경준은 관세의 부담을 알아보려다가 가격 협상과 정보시차에도 관심을 넓혔습니다. 가령 가상의 인터뷰에서 기업이 세율보다 계약 갱신일을 먼저 말한다면 분석에 시간 조건을 추가할 수 있습니다. 이러한 태도는 경희대에서 무역실무와 이론을 함께 배우려는 동기로 연결됩니다. 다만 세 사례로 모든 기업의 상황을 이해했다고 확대하지 않으며, 마지막 말에서는 배운 점과 다음 학습 방향을 간결하게 남깁니다.", "2. 수업과 실무가 서로 보완하는 과정  이론은 어떤 차이를 볼지 알려 주고 현장은 이론의 가정이 현실에 맞는지 점검하게 합니다. 가령 가상의 가격 전가 모형은 계약을 즉시 바꿀 수 있다고 가정할 수 있지만 실제로는 일정 기간 가격이 고정될 수 있습니다. 이런 조건을 반영하면 분석의 의미가 달라집니다. 경준의 기업 인터뷰와 사업성 검토를 대학의 무역상무·국제금융·실증분석으로 연결할 수 있습니다. GTEP 등 프로그램은 지원 자격과 선발이 있으므로 참여를 확정해서 말하기보다 준비와 지원의 계획으로 표현합니다."], "follow": ["현장 경험으로 어떤 태도를 가장 먼저 배우고 싶나요?  제가 알고 싶은 것을 묻는 데서 나아가 상대가 실제로 결정해야 하는 문제를 듣는 태도입니다. 그 질문을 정확히 이해해야 자료 조사도 도움이 된다고 생각합니다."], "memory": "감사 → 기업이 바꿔 준 질문 → 실무와 금융 공부 → 듣고 고치는 기여", "caution": "", "source_refs": [3, 5], "university": "경희대", "kind": "답변", "glossary": [31]}, {"id": 32, "question": "한국외대 면접에서 마지막으로 하고 싶은 말은 무엇입니까?", "category": "대학별 마지막 말", "answer": ["제 이야기를 들어주셔서 감사합니다. 저는 국제규범의 문장을 읽을 때도, 환율 자료를 볼 때도 결국 그 변화 속에서 기업이 무엇을 근거로 선택해야 하는지 궁금했습니다. 그 질문이 기업 인터뷰와 정보 도구 제작까지 이어졌습니다.", "한국외대 국제통상학과에서 국제통상법과 계량경제학을 배우며, 규칙의 의미와 실제 효과를 함께 설명하는 실력을 쌓고 싶습니다. 모르는 부분은 정확히 배우고, 배운 내용은 다른 사람이 활용할 수 있게 전달하는 학생이 되겠습니다. 감사합니다."], "evidence": ["1학년 · 진로활동 교과 연계 자율 탐구 보고서 활동 | PDF 2쪽 / 인쇄 3쪽\n안보예외와 국제규범의 의미를 탐구.", "3학년 · 경제 수학 | PDF 18쪽 / 인쇄 19쪽\n환율 자료와 모형의 설명 범위를 살핀 분석.", "3학년 · 진로활동 | PDF 4–5쪽 / 인쇄 5–6쪽\n실제 거래 조건을 기업 인터뷰로 확인."], "concepts": ["1. 일관된 관심을 보여 주는 연결  일관성은 모든 활동이 처음부터 하나의 직업을 위해 설계됐다고 말하는 데서 나오지 않습니다. 각 활동에서 생긴 질문이 다음 활동으로 어떻게 이어졌는지 설명하면 됩니다. 가령 가상의 규범 탐구가 기업 비용의 질문으로 이어지고, 자료 분석만으로 부족해 인터뷰를 시도하는 흐름을 말할 수 있습니다. 경준에게는 실제로 안보예외·환율·기업 인터뷰라는 기록이 있습니다. 그 관심을 현재의 학업 목표로 묶되, 어린 시절의 계기나 오래된 확신을 새로 만들어 과거 사실처럼 덧붙이지 않습니다.", "2. 통상법·계량·금융을 연결하는 의미  통상법은 거래에 적용되는 의무와 예외를, 계량분석은 자료에서 효과와 관계를, 국제금융은 환율과 자금의 흐름을 다룹니다. 가령 가상의 새로운 무역조치가 발생하면 적용 범위부터 확인한 뒤 기업 비용과 환위험의 변화를 살펴볼 수 있습니다. 경준의 활동을 이 순서로 발전시키려는 계획은 한국외대의 공개 교육과정과 연결됩니다. 과목 이름을 외우는 것보다 각 과목으로 무엇을 더 잘 설명하고 싶은지 이해해야 후속 질문에 답하기 쉽습니다. 실제 수강은 개설과 선수 조건을 확인합니다."], "follow": ["입학 후에도 계속 붙잡고 싶은 질문은 무엇인가요?  규정과 시장이 함께 바뀔 때 기업이 어떤 근거로 결정해야 하는지입니다. 법적 조건과 경제적 영향을 함께 설명할 수 있도록 공부하고 싶습니다."], "memory": "감사 → 문장·자료·기업의 연결 → 통상법·계량·금융 학습 → 설명하는 분석", "caution": "", "source_refs": [6, 7], "university": "한국외대", "kind": "답변", "glossary": [], "note": "공식 페이지의 과목 표기는 Econometrics입니다. 본문에서는 계량경제학이라는 뜻을 함께 설명했습니다. 실제 개설과 수강 조건은 해당 학기 안내를 확인합니다."}, {"id": 33, "question": "GATT 제21조는 어떤 조항입니까?", "category": "통상규범과 안보예외", "answer": ["GATT 제21조는 국가의 본질적인 안보이익 등을 보호하기 위한 안보예외 조항입니다. 국제무역의 기본 의무가 있더라도 조문에서 정한 안보 관련 상황에서는 예외가 문제될 수 있습니다. 저는 반도체 갈등을 탐구하면서, 경제적 상품인 기술이 안보를 이유로 제한되는 기준이 궁금했습니다.", "핵심은 안보라는 이유를 내세우면 모든 제한이 자동으로 허용되는 것은 아니라는 점입니다. 어떤 항목에 해당하고 실제로 어떤 상황인지 확인해야 합니다. 면접을 준비하며 추가로 살펴본 DS512에서는 전쟁이나 국제관계의 비상사태 같은 상황 요건과 선의의 적용을 심사할 수 있다고 보았습니다. 국가의 재량과 규칙의 예측가능성을 함께 봐야 한다고 이해합니다."], "evidence": ["1학년 · 진로활동 교과 연계 자율 탐구 보고서 활동 | PDF 2쪽 / 인쇄 3쪽\n미중 반도체 갈등에서 GATT 제21조의 적용과 한계를 탐구.", "1학년 · 국제 경제 2학기 공동교육과정 | PDF 9쪽 / 인쇄 10쪽\n국제 경제에서 안보예외와 기술 수출통제, 적용 기준을 후속 과제로 검토.", "1학년 · 과목명이 표시되지 않은 별도 세부능력 및 특기사항 단락 | PDF 9쪽 / 인쇄 10쪽\n1학년 추가 세특의 미중 분쟁과 국제규범 탐구입니다. 원문에 교과목명이 별도로 붙어 있지 않습니다."], "concepts": ["1. 제21조의 구조  제21조 (a)는 본질적 안보이익에 반하는 정보 공개, (b)는 본질적 안보이익을 보호하기 위해 필요하다고 여기는 조치, (c)는 국제평화·안보를 위한 유엔헌장 의무와 관련됩니다. (b)에는 핵분열성 물질, 군수 공급과 관련된 거래, 전쟁 또는 국제관계의 비상사태라는 구체적인 항목이 있습니다. 가령 가상의 첨단 제품 제한을 평가하려면 어느 항목과 어떤 사실에 근거하는지 살펴야 합니다. 경준의 반도체 탐구도 그 질문에 해당하지만, 첨단기술이라는 이유만으로 모든 요건이 충족되지는 않습니다.", "2. DS512를 활용하는 정확한 범위  DS512는 러시아의 통과운송 제한을 다룬 분쟁으로 제21조 (b)(iii)의 해석을 제시했습니다. 패널은 조문상의 상황이 존재하는지 등을 심사할 수 있고, 안보이익과 조치의 관계에는 선의와 최소한의 개연성이 요구된다고 보았습니다. 가령 단순한 경제적 불만을 곧바로 국제관계의 비상사태라고 부를 수는 없습니다. 경준의 생기부에 이 판례를 직접 분석했다는 기록은 없으므로 면접 대비를 위한 보충 개념으로 구분합니다. 이 판정이 모든 반도체 수출통제의 적법성을 확정한 것은 아닙니다."], "follow": ["안보예외는 국가가 스스로 판단하는 조항 아닌가요?  국가가 안보이익과 필요한 조치를 판단하는 재량은 있습니다. 다만 DS512에서는 조문상 상황과 선의의 적용까지 전혀 심사할 수 없는 것은 아니라고 봤습니다."], "memory": "안보예외의 구조 → 적용 항목과 사실관계 → 재량에도 심사 가능한 범위", "caution": "", "source_refs": [10, 11], "university": "공통", "kind": "답변", "glossary": [17, 18, 21, 94], "note": "원기록의 탐구 가설과 이번 면접 대비에서 보충한 규범 해설을 구분합니다. DS512·TBT 관련 보충 학습을 당시 모두 수행했다고 말하지 않습니다."}, {"id": 34, "question": "GATT 제21조는 국가가 마음대로 사용할 수 있습니까?", "category": "통상규범과 안보예외", "answer": ["국가가 중요한 재량을 갖지만, 안보예외를 아무 제한 없이 사용할 수 있는 것은 아니라고 이해합니다. 면접 대비로 보충한 DS512에서는 제21조의 관련 상황이 실제로 존재하는지까지 전부 국가의 일방적 판단에 맡기지는 않았습니다. 주장한 안보이익과 조치 사이의 연결도 살폈습니다.", "저는 이 점이 기업에도 중요하다고 생각합니다. 안보라는 말만으로 거래조건이 언제든 바뀐다면 계획을 세우기 어렵기 때문입니다. 다만 모든 안보조치에 가장 덜 제한적인 대안을 의무적으로 선택해야 한다는 뜻으로 확대하지는 않겠습니다. 구체적인 조항과 사실관계를 구분해 판단하는 것이 제가 이 탐구에서 더 배우고 싶은 부분입니다."], "evidence": ["1학년 · 진로활동 교과 연계 자율 탐구 보고서 활동 | PDF 2쪽 / 인쇄 3쪽\n안보예외 조항의 모호성과 남용 가능성을 탐구.", "1학년 · 국제 경제 2학기 공동교육과정 | PDF 9쪽 / 인쇄 10쪽\n안보예외의 적용 기준을 후속 과제로 제안.", "3학년 · 논리학 | PDF 17쪽 / 인쇄 18쪽\n통상 주장의 전제와 논증을 재검토한 활동."], "concepts": ["1. 객관적 상황과 국가의 재량  DS512는 제21조 (b)(iii)의 상황 요건 전체를 국가의 일방적인 판단에 맡기지 않았습니다. 전쟁이나 국제관계의 비상사태에 해당하는 객관적 상황과 조치의 시간적 관계 등을 심사할 수 있다고 보았습니다. 가령 가상의 경쟁국이 산업 경쟁력을 높였다는 사실만으로 곧바로 제21조 (b)(iii)의 국제관계 비상사태가 되는 것은 아닙니다. 다만 모든 갈등에 같은 결론이 나오는 것도 아니므로 사실관계를 살펴야 합니다. 경준의 안보예외 탐구는 국가 재량과 규범의 예측가능성이 만나는 지점의 문제로 설명할 수 있습니다.", "2. 선의·개연성과 최소제한성의 구별  선의는 협정의 의무를 회피하려는 방식으로 예외를 이용하지 않아야 한다는 원칙과 관련됩니다. DS512는 주장한 안보이익과 조치 사이에 최소한의 개연성이 있는지도 살폈습니다. 가령 가상의 안보이익과 전혀 관계없는 거래 제한을 정당화하려면 그 연결이 문제될 수 있습니다. 그러나 이 판단을 TBT식 필요성 비교나 자동적인 최소무역제한 대안 심사와 동일시하면 부정확합니다. 경준이 정책적으로 대안을 비교하자는 의견을 내는 것은 가능하지만 그것과 판례가 요구한 법적 기준을 구별해야 합니다."], "follow": ["패널이 국가의 안보 판단을 모두 대신하나요?  그렇지는 않습니다. 국가의 재량을 인정하면서도 조문상 상황과 선의·개연성처럼 심사할 수 있는 부분을 구분한 것으로 이해합니다."], "memory": "무제한 자기판단 아님 → 상황·선의·개연성 → 최소제한성 심사와 구별", "caution": "DS512의 법적 기준을 TBT 제2.2조의 필요성 판단이나 자동적인 최소제한 대안 심사로 설명하지 않는다.", "source_refs": [11, 12], "university": "공통", "kind": "답변", "glossary": [18, 21, 94], "note": "원기록의 탐구 가설과 이번 면접 대비에서 보충한 규범 해설을 구분합니다. DS512·TBT 관련 보충 학습을 당시 모두 수행했다고 말하지 않습니다."}, {"id": 35, "question": "안보와 자유무역이 충돌하면 무엇을 우선해야 합니까?", "category": "통상규범과 안보예외", "answer": ["저는 실제 안보 위협에는 대응하되, 그 위협과 관계없는 거래까지 넓게 제한하는 것은 신중해야 한다고 생각합니다. 반도체 갈등을 공부하며 기술이 경제와 안보 양쪽에 중요하다는 점을 알게 됐습니다. 그래서 어느 한쪽을 무조건 우선하기보다 무엇을 보호하려는 조치인지부터 분명히 해야 한다고 봅니다.", "정책을 설계한다면 적용 대상과 기간, 재검토 절차를 구체화해 기업이 예측할 수 있는 여지를 늘리고 싶습니다. 안보를 보호하면서 불필요한 부담을 줄이는 방법을 찾는 것입니다. 이것은 제 정책적 의견이며, 실제 WTO 적법성은 해당 조항의 요건을 따로 확인해야 합니다. 저는 보호의 필요성과 설명의 책임을 함께 생각하고 싶습니다."], "evidence": ["1학년 · 진로활동 교과 연계 자율 탐구 보고서 활동 | PDF 2쪽 / 인쇄 3쪽\n반도체 기술패권과 안보예외의 한계를 탐구하고 구체적 기준을 제안.", "1학년 · 국제 경제 2학기 공동교육과정 | PDF 9쪽 / 인쇄 10쪽\n무역기구의 중재 한계와 수출통제 기준을 살핀 경험."], "concepts": ["1. 정책 판단과 법적 판단  정책 판단은 여러 목표와 비용을 비교해 어떤 제도가 바람직한지 묻고, 법적 판단은 특정 협정의 의무와 예외 요건을 충족하는지 묻습니다. 가령 가상의 수출통제를 더 좁게 설계하면 기업 부담이 줄 수 있다는 의견은 정책적으로 검토할 수 있습니다. 그러나 대안의 존재만으로 현재 조치가 곧바로 위법해지는지는 적용 조항의 법적 기준에 달려 있습니다. 경준의 기준 구체화 제안도 바람직한 설계에 관한 의견으로 설명하며, 아직 판단되지 않은 특정 조치의 WTO 위반을 확정하지 않습니다.", "2. 범위·기간·목적의 투명성  투명한 기준은 기업이 어떤 거래가 허용되는지 예측하고 계획하는 데 도움이 됩니다. 가령 가상의 안보 규제가 민감한 용도의 범위와 재검토 시점을 밝히면 불필요한 거래 중단을 줄일 수 있습니다. 다만 안보 관련 정보가 모두 공개될 수 있는 것은 아니므로 보호할 정보와 공개 가능한 절차를 구분해야 합니다. 경준은 국제기구 협력을 통한 기준 마련을 제안한 경험이 있습니다. 생기부의 ‘바세나르 협약’은 일반적으로 바세나르 체제로 부르는 수출통제 협력체이며, WTO 규범을 대체하는 협정으로 설명하지 않습니다."], "follow": ["안보 위협을 공개할 수 없다면 어떻게 하나요?  민감한 정보까지 모두 공개하라는 뜻은 아닙니다. 공개 가능한 적용 범위와 절차, 재검토 장치를 제시해 기업의 불확실성을 줄일 방법을 찾아야 한다고 생각합니다."], "memory": "실제 위협 확인 → 목적과 조치 연결 → 부담 줄이는 정책 → 법적 기준은 별도", "caution": "", "source_refs": [10, 11, 13], "university": "공통", "kind": "답변", "glossary": [18, 21]}, {"id": 36, "question": "비관세장벽과 정당한 규제는 어떻게 구분해야 합니까?", "category": "통상규범과 안보예외", "answer": ["거래비용이 생긴다는 사실만으로 부당한 규제라고 판단하지는 않겠습니다. 안전이나 환경을 위한 규제도 필요하기 때문입니다. 먼저 어떤 위험을 줄이려는지, 국내외 기업을 어떻게 대우하는지, 목적에 비해 불필요한 제한이 있는지 확인해야 한다고 생각합니다.", "데이터 현지화와 AI 규범을 탐구할 때도 기업의 부담과 보호하려는 가치를 나누어 봤습니다. 예를 들어 같은 안전 목적이라도 외국 기업에만 불리한 절차가 있다면 그 이유를 따져야 합니다. 저는 규제를 찬성하거나 반대하는 말부터 하기보다 실제 의무와 비용을 확인하고 싶습니다. 그래야 필요한 보호는 유지하면서 개선할 부분을 구체적으로 말할 수 있습니다."], "evidence": ["2학년 · 문학 | PDF 11쪽 / 인쇄 12쪽\n데이터 현지화 규제와 디지털무역 비용 탐구.", "3학년 · 과목명 없이 이어지는 추가 세특 문단 | PDF 17–18쪽 / 인쇄 18–19쪽\nAI 원칙과 기술규정·표준의 범위 및 규범 공백 가설 탐구."], "concepts": ["1. 비관세조치와 비관세장벽  비관세조치는 관세 외에 거래에 영향을 주는 정책이나 규제를 포괄하는 중립적인 표현입니다. 비관세장벽은 그중 무역을 제약하는 측면을 강조할 때 쓰지만, 비용이 발생한다는 사실과 부당성이 동일하지는 않습니다. 가령 가상의 식품 안전검사는 검사비를 만들면서 소비자를 보호할 수 있습니다. 경준의 데이터 현지화 탐구에서도 비용과 보호 목적을 함께 살펴야 합니다. 상품의 기술규정, 위생검역조치, 서비스 규제는 적용되는 협정과 분석 조건이 다를 수 있어 하나의 잣대로 모두 판단하지 않습니다.", "2. TBT의 비차별성과 필요성  TBT의 기술규정 규율에는 비차별 대우와 정당한 목적을 위해 필요한 정도를 넘는 무역 제한을 피하라는 원칙 등이 있습니다. 목적을 달성하지 못할 위험도 고려합니다. 가령 가상의 제품 안전규정에서 같은 위험을 가진 수입품만 추가 절차를 요구한다면 그 차별과 정당화 근거를 살펴야 합니다. 경준은 규범의 영향과 적용 범위를 질문했으므로 이런 구분을 후속 개념으로 익힐 수 있습니다. ‘안전 목적이면 항상 허용’이나 ‘더 간단한 대안이 있으면 무조건 위반’처럼 자동적인 결론으로 단순화하지 않습니다."], "follow": ["환경 규제가 개발도상국에 더 큰 비용을 주면 부당한가요?  부담이 다르다는 점은 중요한 검토 요소지만 그것만으로 결론을 내리기는 어렵습니다. 목적과 적용 방식, 대안과 지원 가능성, 해당 협정의 의무를 함께 확인해야 합니다."], "memory": "비용 발생≠자동 위법 → 목적·대우·필요성 → 조치와 협정의 범위 확인", "caution": "", "source_refs": [14, 15], "university": "공통", "kind": "답변", "glossary": [20, 24, 83]}, {"id": 37, "question": "TBT의 기술규정과 표준의 차이는 무엇입니까?", "category": "통상규범과 안보예외", "answer": ["가장 먼저 구분할 점은 준수가 의무적인지입니다. TBT에서 기술규정은 제품 특성 등 관련 요건의 준수가 의무적인 문서이고, 표준은 인정된 기관이 공통적으로 사용하도록 승인한 비의무적 기준입니다. 다만 비의무적이라고 시장에서 영향이 없다는 뜻은 아닙니다.", "제가 AI 원칙을 탐구할 때 궁금했던 것도 이 지점입니다. 법이 아니어도 많은 기업이 따르면 다른 기업에 거래조건처럼 작용할 수 있습니다. 생기부에서는 이를 규범의 사각지대라는 가설로 다뤘습니다. 이후 면접 대비에서 비정부 표준화기관 관련 규정도 확인하며, 민간 원칙이라는 이유만으로 TBT 밖이라고 단정하기보다는 정의와 적용 범위를 더 따져야 한다고 정리했습니다."], "evidence": ["3학년 · 과목명 없이 이어지는 추가 세특 문단 | PDF 17–18쪽 / 인쇄 18–19쪽\n헌법적 AI와 TBT 부속서의 정의, 민간 준표준의 시장 영향에 관한 가설 탐구."], "concepts": ["1. 의무적 규정과 자발적 표준  TBT 부속서 1은 기술규정을 준수가 의무적인 문서로, 표준을 인정된 기관이 승인하고 준수가 의무적이지 않은 문서로 정의합니다. 대상은 제품이나 관련 공정·생산방법 등 정의에 맞아야 합니다. 가령 가상의 제품 안전기준을 법이 강제로 요구하면 기술규정 문제가 되고, 자발적 인증 기준은 표준에 해당할 가능성을 검토할 수 있습니다. 경준의 민간 AI 원칙도 문서 이름만으로 분류할 수 없습니다. 시장에서 따르지 않기 어렵다는 경제적 압박과 협정상 의무성의 판단은 구분해야 합니다.", "2. 비정부 표준화기관과 회원국의 의무  TBT 제4.1조와 부속서 3은 비정부 표준화기관도 다룹니다. 회원국은 자국 내 관련 비정부기관이 모범관행규약을 수락·준수하도록 이용 가능한 합리적 조치를 취할 의무 등을 갖습니다. 따라서 가상의 민간기관이 만든 제품 표준도 민간이라는 이유만으로 검토 대상에서 빠지지는 않습니다. 경준이 제기한 규범 공백은 인정된 기관의 의미, 상품·서비스 범위, 정부와의 연결 등을 확인해야 하는 가설입니다. 회원국의 국제적 의무가 문제되는 구조와 민간기업에 WTO 의무가 곧바로 직접 부과된다는 주장을 구별합니다."], "follow": ["민간 표준을 법에서 의무화하면 어떻게 되나요?  구체적인 문서와 적용 방식이 제품 관련 요건을 의무적으로 정하는지 살펴 기술규정 해당 여부를 검토해야 합니다. 원래 민간이 만들었다는 출처만으로 분류가 끝나지는 않습니다."], "memory": "의무성의 차이 → 인정된 기관은 정부만 아님 → 제4조·부속서3 확인", "caution": "‘민간 AI 원칙은 정부가 만들지 않았으므로 TBT 밖이다’라는 표현을 사용하지 않는다.", "source_refs": [14, 16, 79], "university": "공통", "kind": "답변", "glossary": [20, 24], "note": "원기록의 탐구 가설과 이번 면접 대비에서 보충한 규범 해설을 구분합니다. DS512·TBT 관련 보충 학습을 당시 모두 수행했다고 말하지 않습니다."}, {"id": 38, "question": "민간기업의 AI 원칙이 왜 통상문제가 될 수 있습니까?", "category": "통상규범과 안보예외", "answer": ["민간기업의 AI 원칙도 다른 기업이 시장에 들어오기 위해 따라야 하는 조건처럼 작동할 수 있기 때문입니다. 규모가 큰 플랫폼이 특정 기준을 요구하면 해외 기업도 설계나 검증 방식을 바꿔야 할 수 있습니다. 저는 법으로 정해진 규칙 외에 이런 시장의 기준이 만드는 비용에 관심을 가졌습니다.", "다만 그런 원칙은 안전과 신뢰를 높여 거래를 돕기도 합니다. 그래서 민간 기준을 모두 장벽이라고 보기보다 누가 만들고 얼마나 채택하며 어떤 비용과 편익이 생기는지 확인하고 싶습니다. 법적으로 TBT의 표준인지와 경제적으로 영향력이 있는지도 다른 질문입니다. 제 탐구는 그 차이를 구분해 더 정확히 측정해 보려는 시도였습니다."], "evidence": ["3학년 · 과목명 없이 이어지는 추가 세특 문단 | PDF 17–18쪽 / 인쇄 18–19쪽\n헌법적 AI의 원칙 내재화와 민간 준표준, 기존 규범·측정 범위의 공백 가능성 탐구.", "3학년 · 자율활동 | PDF 4쪽 / 인쇄 5쪽\n원문 근거를 찾는 RAG를 구현하며 AI의 기능과 신뢰를 구별한 경험."], "concepts": ["1. 헌법적 AI와 시장의 기준  헌법적 AI는 명시된 원칙을 활용해 모델의 응답을 비판·수정하거나 피드백을 구성하는 학습 접근입니다. 여기서 ‘헌법’은 국가 헌법과 같은 법적 지위를 뜻하지 않습니다. 가령 가상의 플랫폼이 자체 AI 원칙 준수를 거래 조건으로 요구하면 공급기업에 설계와 검증 부담이 생길 수 있습니다. 경준의 탐구는 원칙 내재화와 외부 근거를 검색하는 RAG의 차이에서 민간 기준의 영향으로 확장됐습니다. 특정 기업의 원칙이 실제 국제표준이 됐거나 WTO 위반이라는 결론은 별도의 증거와 법적 검토가 필요합니다.", "2. 경제적 영향과 법적 적용 범위  경제적으로 시장 진입에 영향을 준다는 사실과 특정 협정의 적용 대상이라는 판단은 다릅니다. 가령 가상의 AI 서비스 이용조건은 순수한 서비스 조건인지 제품 관련 규격인지에 따라 분석의 출발점이 달라집니다. TBT는 상품 범위와 표준의 정의를 확인해야 하며 비정부기관 관련 규율도 있습니다. 경준이 말하는 공백은 이 검토 이후에도 설명되지 않는 부분이 있는지에 대한 가설입니다. 채택률이나 시장점유율을 지표에 넣는 제안도 가중치의 타당성과 실제 비용을 검증해야 측정 도구로 설득력을 얻습니다."], "follow": ["그렇다면 민간 AI 원칙을 모두 정부가 통제해야 하나요?  그렇게 단정하지는 않습니다. 먼저 안전상의 편익과 시장 접근 비용을 확인하고, 투명성이나 상호운용성처럼 문제를 줄일 수 있는 방안을 검토할 필요가 있다고 생각합니다."], "memory": "거래 조건이 될 가능성 → 비용과 편익 → 법적 범위 확인 → 공백은 가설", "caution": "민간이라는 이유만으로 TBT 적용 밖이라고 단정하거나, 자신의 규범 공백 가설을 확정된 WTO 판정으로 말하지 않는다.", "source_refs": [14, 17, 79], "university": "공통", "kind": "답변", "glossary": [7, 19, 20], "note": "원기록의 탐구 가설과 이번 면접 대비에서 보충한 규범 해설을 구분합니다. DS512·TBT 관련 보충 학습을 당시 모두 수행했다고 말하지 않습니다."}, {"id": 39, "question": "WTO 규범의 가장 큰 한계는 무엇이라고 생각합니까?", "category": "통상규범과 안보예외", "answer": ["제가 탐구하며 느낀 한계는 기술과 거래방식이 바뀔 때, 기존 규정이 무엇을 다루고 무엇을 놓치는지 판단하기 어렵다는 점입니다. 기업의 AI 원칙처럼 정부가 직접 만들지 않은 기준도 시장에 영향을 줄 수 있는데, 정부정책 중심의 지표만으로는 그 영향을 충분히 보기 어려울 수 있습니다.", "그래서 저는 법적 규율의 공백과 측정 지표의 공백을 나눠 보고 싶습니다. 지표에 잡히지 않는다고 법도 전혀 적용되지 않는 것은 아니기 때문입니다. 기존 조항의 적용 가능성을 먼저 검토하고, 남는 문제를 실제 채택 범위와 기업 비용으로 보여 주는 연구를 하고 싶습니다. 제도의 한계를 말할수록 그 근거도 더 구체적이어야 한다고 생각합니다."], "evidence": ["3학년 · 과목명 없이 이어지는 추가 세특 문단 | PDF 17–18쪽 / 인쇄 18–19쪽\n민간 AI 원칙과 WTO 규범·정부 중심 측정 지표의 공백 가능성을 탐구.", "3학년 · 화법과 작문 | PDF 16쪽 / 인쇄 17쪽\nAI 규제의 역외 적용과 규칙 형성에 참여할 필요를 탐구."], "concepts": ["1. 규범의 공백과 측정의 공백  규범의 공백은 특정 문제를 다루는 의무나 적용 근거가 충분한지에 관한 질문이고, 측정의 공백은 사용한 지표가 현실의 변화를 얼마나 포착하는지에 관한 질문입니다. 가령 가상의 민간 기준이 기존 협정의 검토 대상이지만 정부 법령만 세는 지표에는 잡히지 않을 수 있습니다. 이 경우 지표의 한계를 법적 무규율 상태라고 부르면 부정확합니다. 경준의 추가 세특 탐구에서도 두 문제를 나눠 설명해야 합니다. 새로운 현상이 발견됐다는 사실만으로 협정에 아무 관련 규정이 없다고 결론 내리지 않습니다.", "2. 회원국 의무와 민간 행위의 연결  WTO 협정의 분쟁은 기본적으로 회원국의 의무를 중심으로 구성됩니다. 그러나 그 때문에 민간 행위가 언제나 분석에서 제외되는 것은 아니며, TBT의 비정부기관 관련 조항처럼 회원국이 취해야 할 조치를 정한 규율도 있습니다. 가령 가상의 민간 표준을 검토할 때는 기관의 성격과 기준의 대상, 정부와의 관계를 함께 확인해야 합니다. 경준의 문제 제기는 이 연결을 확인할 출발점입니다. 제도의 속도에 대한 비판은 가능하지만 개별 조항의 적용 가능성을 먼저 검토해야 비판이 정확해집니다."], "follow": ["가장 먼저 개선하고 싶은 것은 무엇인가요?  정책과 민간 기준이 실제 기업에 주는 부담을 구분해 볼 자료를 늘리고 싶습니다. 어떤 현상이 기존 규범으로 설명되는지부터 확인해야 필요한 개선도 구체적으로 제안할 수 있습니다."], "memory": "빠른 기술 변화 → 적용 범위 확인 → 규범 공백과 지표 공백 구별", "caution": "", "source_refs": [14, 15, 79], "university": "공통", "kind": "답변", "glossary": [17, 19, 20, 27], "note": "원기록의 탐구 가설과 이번 면접 대비에서 보충한 규범 해설을 구분합니다. DS512·TBT 관련 보충 학습을 당시 모두 수행했다고 말하지 않습니다."}, {"id": 40, "question": "FTA와 WTO 다자규범의 차이를 어떻게 봅니까?", "category": "통상규범과 안보예외", "answer": ["WTO는 여러 회원국이 공유하는 기본적인 무역규칙을 제공하고, FTA는 참여한 국가들이 더 높은 개방이나 구체적인 협력을 약속하는 틀이라고 이해합니다. FTA가 생겨도 WTO와 완전히 별개의 체제가 되는 것은 아니며, 특혜를 허용하는 관련 요건을 살펴야 합니다.", "기업 입장에서는 FTA가 있다는 사실보다 자기 제품이 실제로 혜택을 받을 수 있는지가 중요합니다. 원산지 기준을 충족하고 증명하는 데 비용이 들기 때문입니다. 기업 인터뷰를 하며 제도를 아는 것과 활용할 수 있는 것은 다르다는 생각을 했습니다. 그래서 통상정보를 제공할 때도 협정 이름만 알려 주기보다 적용 조건과 준비할 사항을 함께 설명하고 싶습니다."], "evidence": ["1학년 · 국제 경제 2학기 공동교육과정 | PDF 9쪽 / 인쇄 10쪽\nGATT와 무역기구 발전 과정 및 역할·한계 탐구.", "3학년 · 진로활동 | PDF 4–5쪽 / 인쇄 5–6쪽\n제도와 기업의 실제 대응 조건을 연결해 본 인터뷰.", "3학년 · 자율활동 | PDF 4쪽 / 인쇄 5쪽\n적용 가능한 규정을 찾는 정보 도구 제작."], "concepts": ["1. 다자규범과 지역무역협정  WTO의 최혜국대우는 원칙적으로 한 회원국에 주는 유리한 대우를 다른 회원국에도 적용하는 규칙입니다. FTA는 참여국끼리 특혜를 주므로 상품의 GATT 제24조, 서비스의 GATS 제5조 등 관련 법적 근거와 요건을 살펴야 합니다. 가령 가상의 두 국가가 관세를 낮추는 협정을 맺어도 WTO 의무가 모두 사라지는 것은 아닙니다. 경준의 무역기구 탐구를 협정 간 관계로 확장하는 개념입니다.", "2. 원산지 규정과 활용 비용  특혜 원산지 규정은 상품이 협정상 어느 국가의 원산지로 인정되는지 정하는 기준입니다. 가령 가상의 수출품을 협정국에서 최종 조립했어도 사용한 부품과 가공 정도에 따라 특혜를 받지 못할 수 있습니다. 기준 충족과 증빙에는 비용이 들므로 관세 절감액보다 준비 비용이 클 수도 있습니다. 경준의 정보시차 탐구와 연결하면 협정의 존재뿐 아니라 기업이 요건을 제때 확인할 수 있는지가 중요합니다.", "3. 무역창출과 무역전환  무역창출은 FTA로 관세가 낮아지면서 비효율적인 국내 생산이 더 효율적인 회원국의 수입으로 대체되는 효과이고, 무역전환은 특혜 때문에 더 효율적인 비회원국 대신 회원국 상품으로 바뀔 수 있는 효과입니다. 가상의 회원국 상품이 관세 특혜로 더 싸 보여도 생산비는 비회원국보다 높을 수 있습니다. FTA의 효과를 평가할 때 교역량 증가만으로 전체 후생이 반드시 늘었다고 단정하지 않습니다. 경준의 반도체 탐구에서 쓴 넓은 의미의 수출 전환과 이 고전적 개념도 구분합니다."], "follow": ["FTA가 많아지면 기업에 무조건 좋은가요?  시장 접근 기회는 늘 수 있지만 협정별 원산지와 절차를 확인하는 비용도 생깁니다. 실제 절감액과 준수 비용을 비교해야 기업에 유리한 활용 방법을 판단할 수 있습니다."], "memory": "공통 기본규칙과 참여국 특혜 → 원산지 요건 → 편익과 준수 비용", "caution": "", "source_refs": [18, 19], "university": "공통", "kind": "답변", "glossary": [17, 18, 19, 22, 23, 24, 96]}, {"id": 41, "question": "PPP가 무엇입니까?", "category": "환율·통계·인과관계", "answer": ["PPP는 Purchasing Power Parity, 구매력평가입니다. 서로 다른 나라에서 같은 상품 바구니를 살 수 있는 구매력을 기준으로 환율을 생각하는 방식입니다. 저는 수학Ⅰ에서 물가와 환율 자료를 살펴보면서, 환율이 왜 움직이는지 설명할 하나의 기준을 세워 보고 싶었습니다.", "다만 제가 사용한 소비자물가지수는 각 나라가 기준시점을 정한 지수이기 때문에, 두 지수를 그냥 나눈 값을 적정환율이라고 할 수는 없습니다. 기준시점 이후 물가의 상대적인 변화와 환율을 연결해야 합니다. 이론과 실제값의 차이를 보면서, 저는 그 차이를 없애려 하기보다 어떤 조건을 더 살펴야 하는지 질문하게 됐습니다."], "evidence": ["2학년 · 수학Ⅰ | PDF 11쪽 / 인쇄 12쪽\n2학년 수학Ⅰ의 물가지수 수집과 PPP 로그함수 모형이 직접 근거입니다.", "3학년 · 동아리활동 글로브 | PDF 4쪽 / 인쇄 5쪽\n3학년 동아리에서 PPP 잔차를 제도변수로 확장한 기록입니다.", "3학년 · 경제 수학 | PDF 18쪽 / 인쇄 19쪽\n3학년 경제 수학에서 금리차 회귀에 달러지수를 추가한 별도 후속 탐구입니다. 2학년 PPP 모형과 같은 회귀식이라는 뜻은 아닙니다."], "concepts": ["1. 절대 구매력평가와 상대 구매력평가  절대 구매력평가는 같은 상품 바구니의 나라별 가격을 비교합니다. 가상 예시로 한국에서 10만 원, 미국에서 100달러라면 구매력을 같게 하는 환율은 달러당 1천 원입니다. 상대 구매력평가는 기준시점 이후 두 나라 물가가 얼마나 달라졌는지와 환율변화를 연결합니다. 국가별 CPI가 모두 100으로 시작한다는 이유만으로 당시 물가수준이 같았다는 뜻은 아닙니다.", "2. 현실 환율과 차이가 나는 이유  상품 운송비와 관세, 교역되지 않는 서비스, 상품구성의 차이 때문에 가격이 완전히 같아지기 어렵습니다. 금융자산 거래와 기대도 단기 환율을 움직입니다. 경준의 탐구는 이론값을 곧 정답으로 선언하기보다 실제 환율과의 차이를 해석하는 데 의미가 있습니다. 계산에 쓴 환율이 원화 표시인지 달러 표시인지에 따라 절상·절하의 부호도 달라집니다. 한 나라의 기준연도를 바꾸어 CPI 수치가 달라져도 실제 물가가 그 순간 변한 것은 아닙니다. 따라서 지수의 단위와 기준연도를 정리한 뒤 변화율을 비교하는 것이 먼저이며, 이를 설명하면 단순 공식 암기보다 모형에 대한 이해가 드러납니다."], "follow": ["원달러 환율이 오른다는 것은 어떤 뜻인가요?  1달러를 사는 데 필요한 원화가 늘어난다는 뜻이므로 원화 가치가 달러에 대해 하락한 것입니다."], "memory": "물가의 기준과 실제 환율의 간격", "caution": "", "source_refs": [20], "university": "공통", "kind": "답변", "glossary": [33, 34, 82]}, {"id": 42, "question": "PPP가 현실과 다르면 쓸모없는 이론 아닙니까?", "category": "환율·통계·인과관계", "answer": ["저는 현실과 다르다는 이유만으로 쓸모없는 이론이라고 생각하지는 않습니다. PPP는 다음 달 환율을 정확하게 맞히는 공식이라기보다 물가와 환율이 어떤 조건에서 연결되는지 보여 주는 기준으로 활용했습니다. 실제 자료와 어긋나는 부분은 그 조건을 다시 살펴볼 이유가 됐습니다.", "이후에는 잔차와 환율보고서의 제도적 기준까지 관심을 넓혔습니다. 여기서 배운 것은 이론을 지키기 위해 현실을 억지로 맞추면 안 된다는 점입니다. 설명되지 않는 부분을 인정하고 다른 변수나 제도를 검토해야 합니다. 저에게 PPP의 의미는 정답을 얻은 데보다 다음에 무엇을 확인해야 하는지 알려 준 데 있습니다."], "evidence": ["2학년 · 수학Ⅰ | PDF 11쪽 / 인쇄 12쪽\nPPP 모형의 수학적 관계와 실제 자료 적용이 출발점입니다.", "3학년 · 동아리활동 글로브 | PDF 4쪽 / 인쇄 5쪽\nPPP 잔차를 환율보고서의 제도적 기준으로 확장한 기록입니다."], "concepts": ["1. 모형은 조건을 단순화한 설명  경제모형은 모든 현실을 복사하는 대신 몇 가지 관계를 뚜렷하게 드러냅니다. 가상 예시로 운송비가 없을 때 같은 물건의 가격차가 차익거래로 줄어든다는 설명은 유용하지만, 실제 운송비가 크면 차이가 남을 수 있습니다. 틀린 예측을 무시하면 안 되지만, 예측이 틀린 이유를 찾으면 어느 가정을 바꿔야 하는지 배울 수 있습니다.", "2. 괴리를 설명하는 것과 원인을 증명하는 것  실제값과 기준값의 차이는 추가 설명이 필요한 부분이지 특정 원인의 이름표가 아닙니다. PPP 잔차가 큰 시기에 정책갈등이 있었다고 해서 잔차 전체를 정책갈등의 효과로 부를 수 없습니다. 금리, 자본이동, 측정오차도 함께 검토해야 합니다. 경준이 후속 질문을 만든 과정은 의미가 있지만, 새 가설의 인과 검증은 별도 단계입니다. 모형을 평가할 때는 무엇을 설명하려 했는지도 중요합니다. 장기 물가비교의 기준을 만드는 모형과 다음 달 환율을 예측하는 모형에 같은 평가기준을 적용하면, 이론이 원래 답하려던 질문까지 놓칠 수 있습니다."], "follow": ["이론을 버려야 할 때도 있습니까?  중요한 예측이 여러 조건에서 반복해서 어긋나고 보완한 설명도 검증을 통과하지 못하면 수정하거나 다른 모형과 비교해야 합니다."], "memory": "모형의 실패에서 다음 질문을 찾기", "caution": "", "source_refs": [20], "university": "공통", "kind": "답변", "glossary": [33]}, {"id": 43, "question": "왜 로그를 사용했습니까?", "category": "환율·통계·인과관계", "answer": ["물가와 환율의 비율 관계를 더 쉽게 해석하려고 로그를 사용했습니다. 로그를 취하면 곱셈은 덧셈으로, 나눗셈은 뺄셈으로 바꿀 수 있습니다. 수학Ⅰ에서 배운 성질이 경제자료를 읽는 데 실제로 쓰인다는 점이 흥미로웠습니다.", "예를 들어 두 시점의 값에 로그를 취해 차이를 구하면 상대적인 변화를 살펴보기 편합니다. 다만 작은 변화에서 퍼센트 변화와 비슷하다는 것이지 항상 정확히 같지는 않습니다. 저는 로그를 썼다는 사실보다 왜 이 관계에 적합한지 설명하는 것이 중요하다고 생각합니다. 변환을 해도 자료에 빠진 요인이나 인과관계 문제가 자동으로 해결되는 것은 아닙니다."], "evidence": ["2학년 · 수학Ⅰ | PDF 11쪽 / 인쇄 12쪽\n지수·로그를 활용한 PPP 모형과 정의역·변화율 검토가 확인됩니다."], "concepts": ["1. 곱셈과 비율을 덧셈과 차이로 바꾸기  양수인 두 값 A와 B에 대해 ln(A/B)는 ln(A)에서 ln(B)를 뺀 값입니다. 따라서 물가비율을 로그로 바꾸면 각 물가의 변화 기여를 분리해 읽기 쉬워집니다. 예를 들어 값이 100에서 110으로 늘면 증가율은 10%지만 로그 차이는 약 0.0953입니다. 여기에 100을 곱한 9.53%는 10%와 가까우나 정확히 같지는 않습니다.", "2. 함수의 성질과 경제적 해석  로그함수는 양수에서 정의되고 증가하지만 입력이 커질수록 같은 절대 증가에 대한 변화폭은 작아집니다. 이것이 큰 값과 작은 값의 상대적 변화를 비교하는 데 도움이 됩니다. 다만 0이나 음수에 그대로 로그를 취할 수 없고, 변환 후 회귀의 계수 해석도 원래 수준값 회귀와 달라집니다. 경준의 PPP 탐구에서는 변환 전후 무엇이 달라지는지 설명해야 합니다. 두 변수에 모두 로그를 취한 관계에서 기울기는 작은 변화에 대해 한 변수의 1% 변화와 다른 변수의 몇 % 변화가 연결되는지를 읽는 데 쓰일 수 있습니다. 이것이 탄력성 해석의 직관이며 모든 로그모형의 계수를 같은 방식으로 읽지는 않습니다."], "follow": ["로그를 취하면 인과관계도 더 분명해지나요?  아닙니다. 로그는 변수의 표현과 함수형태를 바꾸는 도구이며 누락변수나 역인과 문제를 해결하지는 않습니다."], "memory": "비율을 차이로 바꾸되 정확도는 별개", "caution": "", "source_refs": [20], "university": "공통", "kind": "답변", "glossary": [33, 34]}, {"id": 44, "question": "한미 금리차와 원달러 환율의 관계를 어떻게 분석했습니까?", "category": "환율·통계·인과관계", "answer": ["한미 금리차와 원달러 환율의 61개월 자료로 시작했습니다. 처음에는 금리차 하나로 환율을 설명하는 회귀식을 만들었는데, 설명력이 약 54%였고 잔차가 같은 방향으로 이어지는 구간이 있었습니다. 그래서 금리차 외의 공통 요인이 빠졌을 수 있다고 보고 달러지수를 추가해 비교했습니다.", "설명력은 약 88%로 높아졌지만, 더 인상적이었던 것은 금리차 계수의 크기도 절반 정도로 줄었다는 점입니다. 처음 금리차에 연결했던 변화의 일부를 다른 변수와 함께 봐야 했던 것입니다. 이 경험으로 숫자가 잘 맞는 것만큼 해석이 왜 달라지는지가 중요하다는 걸 배웠습니다. 이 수치는 표본 안의 설명력이며 미래 환율의 예측 적중률은 아닙니다."], "evidence": ["3학년 · 경제 수학 | PDF 18쪽 / 인쇄 19쪽\n경제 수학에 61개월, 설명력 54%→88%, 계수 크기 절반 감소, 정규방정식 계산이 기록되어 있습니다."], "concepts": ["1. 단순회귀와 다중회귀  단순회귀는 한 설명변수와 결과변수의 관계를 맞추고, 다중회귀는 여러 설명변수를 함께 넣어 조건부 관계를 살핍니다. 가상 예시로 금리차가 같은 두 달이라도 세계적인 달러강세가 다르면 원달러 환율이 다를 수 있습니다. 달러지수를 추가하면 이런 차이를 일부 반영할 수 있지만, 추가한 변수의 정의와 관측시점을 일관되게 맞춰야 합니다.", "2. 계수 변화가 알려주는 것  금리차 계수가 달러지수 추가 뒤 줄었다는 것은 두 모형이 금리차와 환율의 관계를 다르게 배분한다는 신호입니다. 누락변수를 의심할 근거가 될 수 있으나, 그 자체로 어느 계수가 참된 인과효과인지 결정하지는 못합니다. 경준의 분석은 설명력 상승과 함께 계수 안정성을 살핀 점이 핵심입니다. 금리차를 한국에서 미국을 뺀 값으로 정의했는지도 반드시 통일해야 합니다. 정규방정식은 관측값과 모형값의 차이를 제곱해 더한 값을 최소화하는 조건에서 나옵니다. 오차가 음수와 양수로 상쇄되지 않도록 제곱한다는 직관부터 이해하면, 계산한 통계량과 모형의 목적을 연결해 설명할 수 있습니다."], "follow": ["추가 검증을 한다면 무엇을 하겠습니까?  모형을 만들 때 쓰지 않은 기간에서 예측오차를 비교하고, 시계열의 추세와 잔차 상관을 확인하고 싶습니다. 이번 표본의 적합도가 다른 기간에도 유지되는지 살피는 단계입니다."], "memory": "61개월의 설명력보다 계수 변화 보기", "caution": "금리차의 방향과 자료 기간은 원 분석파일에서 확인해 말합니다. 88%는 예측 적중률이 아닙니다.", "source_refs": [21], "university": "공통", "kind": "답변", "glossary": [35, 36, 37, 100]}, {"id": 45, "question": "R²가 높으면 좋은 모형입니까?", "category": "환율·통계·인과관계", "answer": ["R²가 높다는 것은 자료에 잘 맞는다는 한 가지 신호이지, 좋은 모형의 모든 조건은 아닙니다. 제 환율 분석에서도 달러지수를 추가한 뒤 R²가 약 54%에서 88%로 높아졌습니다. 동시에 금리차 계수도 달라져서, 숫자의 크기보다 설명이 바뀐 이유를 함께 봐야 한다고 느꼈습니다.", "같은 자료에 변수를 더 넣으면 R²가 높아질 수 있으므로, 그 변수를 넣을 경제적 이유와 다른 기간에서도 결과가 유지되는지를 확인해야 합니다. 저는 모형을 평가할 때 잘 맞는가뿐 아니라 무엇을 설명하며 어디까지 믿을 수 있는가도 묻고 싶습니다. 높은 설명력을 곧바로 원인을 밝혔다는 말로 바꾸지는 않겠습니다."], "evidence": ["3학년 · 경제 수학 | PDF 18쪽 / 인쇄 19쪽\nR² 상승과 계수 변화 및 VIF 확인의 실제 근거입니다."], "concepts": ["1. R²가 재는 대상  통상적인 절편 포함 최소제곱회귀에서 R²는 평균만 사용하는 기준과 비교해 결과변수의 표본 내 변동을 얼마나 줄여 설명하는지 나타냅니다. 가상 예시로 R²가 0.8이어도 모든 개별 예측이 실제값의 80%에 맞는다는 뜻은 아닙니다. 큰 흐름을 잘 따라도 특정 시점의 오차는 클 수 있으며, R² 자체는 원인과 결과의 방향을 말해주지 않습니다.", "2. 높은 적합도와 일반화의 차이  같은 자료로 변수를 계속 늘리면 그 자료의 우연한 특징까지 맞추는 과적합이 생길 수 있습니다. 수정 R²는 변수 수에 대한 부담을 반영하지만 이것도 만능 기준은 아닙니다. 시계열에서는 시간순서를 유지한 검증과 잔차 점검이 중요합니다. 경준의 88%는 의미 있는 표본 내 개선이지만 다른 기간의 성능을 별도로 확인해야 할 출발점입니다. 공통 추세를 가진 두 시계열은 직접적인 원인관계가 약해도 높은 R²를 만들 수 있습니다. 따라서 시계열의 성질을 확인하는 일은 표본에 잘 맞는 선을 찾는 작업과 별도로 필요하며, 자신의 자료에서 그런 문제가 확인되었다고 단정할 필요는 없습니다."], "follow": ["변수를 넣었는데 R²가 내려갈 수도 있나요?  같은 관측치에 절편을 포함한 통상적 최소제곱모형이라면 일반 R²는 내려가지 않습니다. 수정 R²나 다른 표본의 성능은 내려갈 수 있습니다."], "memory": "설명력과 예측력과 인과를 구별하기", "caution": "", "source_refs": [21], "university": "공통", "kind": "답변", "glossary": [37, 38]}, {"id": 46, "question": "잔차가 여러 달 같은 부호로 이어지는 것이 왜 문제입니까?", "category": "환율·통계·인과관계", "answer": ["같은 부호의 잔차가 이어진다는 것은 모형이 일정 기간 계속 높게 또는 낮게 예측하고 있다는 뜻입니다. 제 환율 모형에서도 그런 패턴이 보여서, 우연한 오차만이 아니라 빠진 요인이나 시간적 특성이 있는지 살펴볼 필요가 있다고 생각했습니다.", "그래서 글로벌 달러 흐름을 반영하는 변수를 추가해 비교했습니다. 다만 부호가 이어졌다는 관찰 자체가 자기상관을 정식으로 검증한 결과는 아닙니다. 저는 잔차를 실패한 숫자로 버리기보다 모형을 고칠 단서로 보게 됐습니다. 대학에서는 시계열 분석을 배워 이런 패턴을 어떤 방법으로 점검해야 하는지 더 정확히 알고 싶습니다."], "evidence": ["3학년 · 경제 수학 | PDF 18쪽 / 인쇄 19쪽\n잔차의 부호 연속에서 생략변수를 의심하고 달러지수를 추가한 기록입니다."], "concepts": ["1. 잔차와 오차항의 차이  잔차는 관측된 실제값에서 적합된 예측값을 뺀 계산 가능한 값입니다. 오차항은 참된 관계에서 관측되지 않는 요인을 나타내는 이론적 요소로, 둘은 같은 말이 아닙니다. 가상 예시로 실제 환율이 1,400원이고 모형값이 1,350원이면 잔차는 50원입니다. 이것이 여러 달 양수이면 모형이 그 기간 환율수준을 반복해서 낮게 잡았다는 뜻입니다.", "2. 자기상관과 빠진 설명  자기상관은 서로 다른 시점의 오차가 연관되는 현상입니다. 연속된 부호는 점검할 신호지만 짧은 구간에서는 우연히도 나타날 수 있습니다. 누락된 공통요인, 구조변화, 잘못된 함수형태 등 여러 이유가 가능합니다. 경준은 달러지수를 후보로 비교했지만, 추가변수 하나로 시계열 문제가 모두 해결되었다고 말하지 않아야 합니다. 시계열의 관측치는 시간순서가 의미를 갖습니다. 같은 값들을 임의로 섞어 놓으면 연속된 오차라는 정보가 사라집니다. 따라서 잔차를 크기순으로만 보는 대신 시간축 위에 놓고 살피는 이유를 설명하면 탐구의 출발점을 이해하기 쉽습니다."], "follow": ["잔차를 모두 국내 정치의 영향으로 볼 수 있나요?  그럴 수 없습니다. 측정오차와 다른 누락요인도 잔차에 포함되므로 정치효과를 구분하려면 별도의 연구설계가 필요합니다."], "memory": "반복되는 오차는 점검할 신호", "caution": "", "source_refs": [21], "university": "공통", "kind": "답변", "glossary": [36]}, {"id": 47, "question": "상관관계와 인과관계의 차이는 무엇입니까?", "category": "환율·통계·인과관계", "answer": ["상관관계는 두 변수가 함께 움직인다는 것이고, 인과관계는 한 변수의 변화가 다른 변화를 일으켰다는 설명입니다. 예를 들어 금리차와 환율이 함께 움직여도 둘에 영향을 주는 다른 요인이 있다면 금리차만의 효과라고 할 수는 없습니다.", "제 환율 탐구에서도 달러지수를 추가하자 금리차 계수가 달라졌습니다. 그때 자료에 관계가 보인다는 이유만으로 원인을 찾았다고 말하면 안 되겠다고 느꼈습니다. 기업 인터뷰도 마찬가지입니다. 정보를 늦게 안 기업의 부담이 컸더라도 계약과 협상력이 함께 작용할 수 있습니다. 저는 관찰한 관계를 먼저 설명하고, 원인을 말하려면 어떤 비교가 더 필요한지 구분하겠습니다."], "evidence": ["3학년 · 경제 수학 | PDF 18쪽 / 인쇄 19쪽\n회귀의 설명변수 추가와 계수 변화가 상관과 인과를 구분하는 실제 사례입니다.", "3학년 · 진로활동 | PDF 4–5쪽 / 인쇄 5–6쪽\n기업 인터뷰는 관계변수를 탐색한 소수 사례라는 근거입니다."], "concepts": ["1. 같이 움직이는 세 가지 이유  X와 Y가 함께 움직이는 데에는 X가 Y를 바꾸는 경우, Y가 X를 바꾸는 경우, Z가 둘을 동시에 바꾸는 경우가 있습니다. 가상 예시로 더운 날 아이스크림 판매와 물놀이 사고가 함께 늘어도 아이스크림이 사고의 원인은 아닐 수 있습니다. 경제자료에서도 공통 충격이 금리와 환율을 함께 움직일 수 있습니다.", "2. 인과효과를 묻는 비교  인과효과는 다른 조건이 같을 때 어떤 조치가 있었던 경우와 없었던 경우의 결과 차이를 묻습니다. 같은 대상에서 두 상황을 동시에 볼 수 없으므로 타당한 비교집단이나 외생적 변화를 찾는 연구설계가 필요합니다. 경준의 모형 개선과 인터뷰는 다음 가설을 만드는 데 유용하지만, 관찰자료에서 변수 몇 개를 통제했다고 모든 혼란요인이 사라지는 것은 아닙니다. 중요한 것은 서로 다른 설명이 같은 관찰결과를 만들 수 있다는 점입니다. 새로운 자료나 설계를 추가해 대안설명을 얼마나 배제했는지를 보여주어야 원인에 대한 주장이 강해지며, 단순히 사례를 더 많이 모았다고 문제가 자동으로 해결되지는 않습니다."], "follow": ["변수를 많이 통제하면 인과관계가 되나요?  통제변수의 선택과 측정이 타당해야 하고 관측하지 못한 혼란요인도 남을 수 있습니다. 경우에 따라 결과 이후 변수를 통제해 오히려 편향이 생길 수도 있습니다."], "memory": "함께 변했다와 바꾸었다는 다르다", "caution": "", "source_refs": [22], "university": "공통", "kind": "답변", "glossary": [66]}, {"id": 48, "question": "내생성이란 무엇입니까?", "category": "환율·통계·인과관계", "answer": ["내생성은 설명변수가 모형에서 빠진 요인을 담은 오차항과 관련돼, 회귀계수를 순수한 인과효과로 해석하기 어려워지는 문제입니다. 저는 반도체 수출과 정책의 관계를 탐구하면서 정책도 이미 변하고 있는 산업 상황에 반응해 만들어질 수 있다는 점이 궁금했습니다.", "가령 수출이 줄어 지원정책이 나왔다면, 지원받은 산업의 수출이 적다는 이유로 정책이 수출을 줄였다고 볼 수는 없습니다. 이런 문제 때문에 도구변수의 원리를 알아봤습니다. 제게 중요한 배움은 어려운 추정법의 이름을 익힌 것보다, 눈에 보이는 관계와 제가 설명하고 싶은 효과가 다를 수 있다는 점을 이해한 것입니다."], "evidence": ["2학년 · 진로활동 진로 연계 심층 탐구 프로젝트 | PDF 3쪽 / 인쇄 4쪽\n2학년 진로활동의 중력모형과 수출전환 탐구가 문제 배경입니다.", "2학년 · 독서 | PDF 11쪽 / 인쇄 12쪽\n2학년 독서에서 도구변수 개념을 인과분리의 분석틀로 검토한 기록이 있습니다."], "concepts": ["1. 내생성이 생기는 경로  누락변수, 역인과 또는 동시결정, 설명변수 측정오차 등이 내생성의 대표적 원인입니다. 가상 예시로 기업의 경영능력을 관측하지 못한 채 교육투자와 이익을 회귀하면, 경영능력이 둘에 영향을 주어 교육투자 계수에 섞일 수 있습니다. 회귀선이 자료를 잘 따라가는지와 계수가 순수한 원인효과인지가 다른 질문인 이유입니다.", "2. 도구변수를 찾는 조건  도구변수는 관심 설명변수를 실제로 움직이면서 결과변수에는 그 경로를 통해서만 영향을 주어야 합니다. 여기에 결과의 관측되지 않은 원인과 연결되지 않는다는 외생성도 필요합니다. 경준의 무역탐구에서 지리적 거리는 교역비용 자체에 영향을 줄 수 있으므로, 단지 외생적으로 보인다는 이유로 어떤 식에서나 적합한 도구라고 할 수 없습니다. 빠진 변수가 있다고 모든 회귀계수가 반드시 편향되는 것은 아닙니다. 그 변수가 결과에 영향을 주고 포함된 설명변수와도 연관되는 조건이 핵심입니다. 그래서 빠진 변수의 목록을 늘어놓기보다 어떤 경로로 계수에 섞이는지 설명하는 것이 중요합니다."], "follow": ["상관관계가 약하면 내생성이 없는 것입니까?  아닙니다. 내생성은 설명변수와 오차항의 관계이고, 설명변수와 결과변수의 단순 상관이 크고 작은 것과 다른 문제입니다."], "memory": "정책도 현실에 반응한다", "caution": "", "source_refs": [22], "university": "공통", "kind": "답변", "glossary": [36, 40, 41, 66, 98]}, {"id": 49, "question": "2SLS를 실제로 완성한 것입니까?", "category": "환율·통계·인과관계", "answer": ["유효한 도구변수를 확보해 인과효과를 추정하는 단계까지 완성한 것은 아닙니다. 제가 한 것은 반도체 무역과 사회자본 탐구에서 단순한 상관으로 설명하기 어려운 문제를 찾고, 도구변수와 2SLS가 어떤 방식으로 도움을 줄 수 있는지 검토한 것입니다.", "2SLS는 Two-Stage Least Squares, 2단계 최소제곱법입니다. 적절한 도구로 설명변수의 변화를 추려 결과와 연결하는 방식인데, 두 번 회귀를 한다는 것보다 그 도구가 왜 타당한지가 더 중요합니다. 예를 들어 거리는 운송비를 통해 무역량에 직접 영향을 줄 수 있습니다. 대학에서는 이런 조건을 자료와 논리로 설득할 수 있는 수준까지 배우고 싶습니다."], "evidence": ["2학년 · 진로활동 진로 연계 심층 탐구 프로젝트 | PDF 3쪽 / 인쇄 4쪽\n반도체 수출전환과 모형의 타당성 검토가 출발점입니다.", "2학년 · 독서 | PDF 11쪽 / 인쇄 12쪽\n독서의 사회자본·투자유치 탐구에서 도구변수 개념을 적용한 분석틀이 기록됩니다."], "concepts": ["1. 두 단계 최소제곱법의 직관  첫 단계에서는 내생적인 설명변수를 도구변수와 외생 통제변수로 설명하여 예측값을 얻습니다. 두 번째 단계에서는 그 예측값과 통제변수로 결과변수를 설명합니다. 가상 예시로 어떤 외생적 제도가 교육기회만 변화시켰다면 그 부분의 교육변화를 활용해 결과를 살필 수 있습니다. 실제 추정에서는 두 단계에서 생성된 값임을 반영한 표준오차 계산도 필요합니다.", "2. 계산 가능성과 식별 타당성  두 번 회귀를 돌리는 것만으로 좋은 2SLS가 완성되지는 않습니다. 도구가 설명변수를 거의 움직이지 않으면 약한 도구 문제가 생기고, 결과에 직접 영향을 주면 배제제약이 무너집니다. 일부 진단검정도 모든 가정을 증명해주지는 못합니다. 경준의 답변은 방법론 학습과 완성된 인과추정을 분리하여 연구경험을 정확하게 보여주는 데 목적이 있습니다. 두 번째 회귀의 예측값은 첫 번째 회귀에서 만든 값이므로, 보통의 회귀를 두 번 실행한 뒤 마지막 표준오차만 그대로 읽는 방식은 적절하지 않을 수 있습니다. 실제 연구에서는 2SLS에 맞는 추정과 불확실성 계산을 함께 해야 합니다."], "follow": ["그렇다면 이번 탐구에서 배운 핵심은 무엇입니까?  변수 사이에 관계가 보인다고 원인까지 알 수 있는 것은 아니라는 점입니다. 도구변수로 인과효과를 추정하려면 그 도구가 왜 적절한지를 자료와 논리로 뒷받침해야 한다는 과제가 남았습니다."], "memory": "두 번 계산보다 도구의 이유", "caution": "실행한 모형 파일이 확인되지 않는 상태에서 2SLS 회귀계수나 검정통계량을 만들지 않습니다.", "source_refs": [22], "university": "공통", "kind": "답변", "glossary": [40, 41, 66, 90, 98]}, {"id": 50, "question": "99% 신뢰구간을 사용한 이유는 무엇입니까?", "category": "환율·통계·인과관계", "answer": ["기대인플레이션을 평균값 하나로만 제시하면 추정의 불확실성이 드러나지 않는다고 생각했기 때문입니다. 그래서 99% 신뢰수준의 구간을 구하고 표본크기와 표준편차, 이상치 처리에 따라 폭이 어떻게 달라지는지 살펴봤습니다.", "다만 99%가 95%보다 무조건 좋은 선택은 아닙니다. 같은 자료라면 더 넓은 구간을 얻게 되기 때문입니다. 99%라는 말도 같은 방식으로 표본을 반복해 구간을 만들 때 약 99%가 참값을 포함한다는 뜻입니다. 저는 이 활동에서 하나의 숫자를 내는 것보다 결과가 어떤 가정과 자료처리에 기대고 있는지 함께 설명하는 것이 중요하다고 배웠습니다."], "evidence": ["2학년 · 확률과 통계 | PDF 11–12쪽 / 인쇄 12–13쪽\n2학년 확률과 통계의 기대인플레이션, 99% 신뢰구간, IQR 등 전처리 민감도 분석이 근거입니다."], "concepts": ["1. 구간의 폭을 결정하는 요소  평균의 신뢰구간은 대체로 표본평균을 중심으로 임계값과 표준오차를 곱한 폭만큼 펼칩니다. 표준오차는 표본표준편차를 표본크기의 제곱근으로 나눈 값입니다. 가상 예시로 다른 조건이 같다면 표본 수를 네 배로 늘려야 표준오차가 절반이 됩니다. 99%는 95%보다 큰 임계값을 쓰므로 구간이 넓어집니다.", "2. 정규분포와 t분포의 선택  모집단 표준편차를 알고 정규성 등 조건을 만족하면 99% 양측 z 임계값 약 2.576을 사용합니다. 모집단 표준편차를 표본에서 추정한다면 정규모집단 가정 아래 자유도에 맞는 t값을 사용하는 것이 기본입니다. 임의표집이 아니거나 이상치가 심하면 공식만으로 대표성이 생기지 않습니다. 경준의 전처리 비교는 이런 가정이 결과를 바꾸는 과정을 보여줍니다. 이상치를 지울수록 구간이 좁아질 수 있지만 그것이 더 정확한 추정이라는 뜻은 아닙니다. 실제로 드물게 나타나는 유효한 응답을 제거할 수 있기 때문입니다. 제거기준의 이유와 처리 전후 결과를 함께 제시하는 민감도 분석이 필요한 이유입니다."], "follow": ["99% 구간이 겹치면 두 집단이 같다고 말해도 되나요?  그렇게 단정할 수 없습니다. 집단 차이 자체의 신뢰구간이나 자료구조에 맞는 검정을 살펴야 하며, 차이를 발견하지 못한 것과 같음을 증명한 것은 다릅니다."], "memory": "높은 신뢰수준에는 넓은 구간의 대가", "caution": "원자료의 표본수·표준편차·표집방식을 확인하기 전에는 2.576을 무조건 적용하거나 실제 구간 수치를 만들어 말하지 않습니다.", "source_refs": [23], "university": "공통", "kind": "답변", "glossary": [34, 42, 43, 44, 45, 46, 86]}, {"id": 51, "question": "외환보유액은 많을수록 좋은 것 아닙니까?", "category": "환율·통계·인과관계", "answer": ["외환보유액은 위기에 대응할 여력이지만, 많을수록 무조건 좋다고 보지는 않습니다. 경제 수업에서 외환당국의 순거래 자료를 보며 외환시장 개입이 늘 수출경쟁력을 높이려는 행동은 아니라는 점을 생각했습니다. 외화가 필요한 상황에 대비하는 역할도 봐야 했습니다.", "동시에 안전한 외화자산을 보유하는 데에는 다른 용도로 자원을 쓸 기회를 포기하는 비용이 있습니다. 그래서 총액의 순위보다 단기외채나 외화 지급 수요와 비교해 적절한지를 살펴야 한다고 생각합니다. 저는 이 문제를 많이 쌓을지 적게 쌓을지의 단순한 선택이 아니라, 위기 대응의 편익과 비용을 함께 판단하는 문제로 이해했습니다."], "evidence": ["3학년 · 경제 | PDF 16–17쪽 / 인쇄 17–18쪽\n3학년 경제의 외환순거래 자료, 비기축통화국 달러수요, 보유액 기회비용 탐구가 직접 근거입니다."], "concepts": ["1. 외환보유액의 보험 기능  외환보유액은 당국이 대외지급과 외환시장 대응 등에 사용할 수 있는 외화자산입니다. 가상 예시로 해외자금 조달이 갑자기 막히면 외화유동성이 있는 나라가 급한 지급수요에 대응할 여지가 큽니다. 다만 모든 외화자산이 즉시 같은 비용으로 현금화되는 것은 아니므로 총액과 함께 자산의 유동성과 만기도 중요합니다.", "2. 기회비용과 적정성  기회비용은 선택 때문에 포기한 가장 가치 있는 대안의 가치입니다. 안전한 보유자산의 수익이 다른 가능한 사용보다 낮을 수 있지만, 더 높은 수익률은 대개 더 큰 위험을 동반하므로 단순 수익률 비교로 끝낼 수 없습니다. IMF도 수입과 단기외채 등 여러 위험을 함께 봅니다. 경준의 탐구는 보험의 편익과 비용을 모두 고려하는 선택의 문제로 이해하면 됩니다. 같은 보유액이어도 단기 외화부채가 큰 나라와 작은 나라의 안전여력은 다릅니다. 보유자산의 통화구성과 지급수요의 통화가 맞는지, 시장에서 자금을 다시 조달할 수 있는지도 영향을 주므로 국가 간 총액 비교만으로 결론을 내리기는 어렵습니다."], "follow": ["보유액이 충분하면 외환위기는 막을 수 있나요?  보유액이 대응력을 높일 수 있지만 금융기관의 부채구조와 정책 신뢰 같은 요인도 중요하므로 위기를 완전히 보장해서 막는 것은 아닙니다."], "memory": "달러 안전망에도 비용이 있다", "caution": "", "source_refs": [24], "university": "공통", "kind": "답변", "glossary": [51, 80]}, {"id": 52, "question": "관세 귀착이 무엇입니까?", "category": "관세와 기업 인터뷰", "answer": ["관세 귀착은 관세를 법적으로 내는 사람과 실제로 부담하는 사람이 어떻게 달라지는지 보는 개념입니다. 수입자가 세금을 내더라도 수출자에게 납품가격을 낮춰 달라고 하거나 소비자가격을 올리면 부담이 나뉠 수 있습니다. 저는 그 과정이 실제 기업에서는 어떻게 나타나는지 궁금했습니다.", "그래서 질문지와 영문 요청서를 작성해 기업에 연락했고, 이메일을 포함한 세 건의 인터뷰를 진행했습니다. 같은 관세 조건에서도 부담이 달랐고 거래관계와 정보시차가 중요했습니다. 이 활동으로 저는 세율이라는 숫자 뒤에 실제 협상과 선택이 있다는 걸 배웠습니다. 더 많은 기업을 조사한다면 세율뿐 아니라 그런 조건도 함께 물어보고 싶습니다."], "evidence": ["3학년 · 진로활동 | PDF 4–5쪽 / 인쇄 5–6쪽\n3학년 진로활동의 이메일 포함 세 건 인터뷰와 부담차이 분석이 근거입니다."], "concepts": ["1. 법적 납부와 경제적 부담  법적 납부의무는 누가 세관에 세금을 내는가의 문제이며, 경제적 귀착은 가격과 소득 조정 후 누가 실질손실을 지는가의 문제입니다. 가상 예시로 수입자의 세금이 10원 늘었는데 수출자가 가격을 4원 낮추고 소비자가격이 6원 오르면 여러 주체가 부담을 나눕니다. 실제로는 환율과 유통마진 변화도 함께 있어 단순 합산 전 비교기준을 맞춰야 합니다.", "2. 탄력성과 협상조건  수요나 공급이 가격변화에 덜 반응하는 쪽은 거래를 피하기 어려워 더 많은 부담을 질 수 있다는 것이 기본모형의 직관입니다. 그러나 특정 기업의 계약기간, 대체 공급처, 거래관계는 전가의 속도와 가능성을 바꿉니다. 경준의 소수 인터뷰는 이 현장조건을 탐색한 자료입니다. 관세율 15%와 기업이 부담한 관세의 비중 40%는 서로 다른 분모를 가진 수치입니다. 기본적인 경쟁시장 모형에서는 거래를 줄이기 어려운 쪽에 부담이 더 많이 남는 경향이 있습니다. 그러나 특정 기업의 인터뷰에서는 시장 전체의 탄력성과 그 기업이 마주한 수요의 탄력성이 다를 수 있으므로 두 수준을 나누어 질문해야 합니다."], "follow": ["탄력성만 알면 실제 부담비율을 구할 수 있나요?  시장구조와 함수형태 등 가정이 맞을 때 이론적 비율을 구할 수 있지만, 실제 기업에는 계약과 환율 등의 추가 조건이 있어 자료 확인이 필요합니다."], "memory": "납부자와 부담자를 따로 묻기", "caution": "기록의 15%는 조사사례 조건이며 모든 품목에 현재 적용되는 세율이라는 뜻이 아닙니다.", "source_refs": [25], "university": "공통", "kind": "답변", "glossary": [59, 99]}, {"id": 53, "question": "같은 관세가 기업마다 다른 부담을 만든 이유는 무엇입니까?", "category": "관세와 기업 인터뷰", "answer": ["기업마다 가격을 바꾸거나 다른 거래처를 선택할 수 있는 여지가 달랐기 때문이라고 생각합니다. 제 인터뷰에서는 동일한 15% 관세 조건에서도 기업이 설명한 부담비중이 40%, 50%로 달랐습니다. 대체재가 있는지, 바이어와 어떤 관계인지, 정보를 언제 받았는지를 함께 살펴봤습니다.", "저는 이 차이를 보며 같은 정책을 모든 기업이 똑같이 겪는 것은 아니라는 점을 더 구체적으로 이해했습니다. 다만 정보시차나 협상력 중 하나의 효과를 따로 분리해 계산한 것은 아닙니다. 앞으로는 부담을 계산한 기준과 계약조건을 맞춰 비교하고 싶습니다. 기업에 필요한 대응도 평균적인 설명보다 각자의 조건에서 찾아야 한다고 생각합니다."], "evidence": ["3학년 · 진로활동 | PDF 4–5쪽 / 인쇄 5–6쪽\n3학년 진로활동에 동일 15% 관세, 40%·50%의 기업부담과 대체재·거래관계·정보시차가 기록됩니다."], "concepts": ["1. 협상력은 대안의 차이에서 생기기  협상력은 상대의 요구를 거절하고 다른 거래를 택할 수 있는 여지와 관련됩니다. 가상 예시로 바이어에게 동일 제품 공급자가 여러 곳 있지만 수출기업은 그 바이어를 잃으면 주문이 크게 줄어든다면 가격협상은 비대칭적일 수 있습니다. 장기 거래는 신뢰를 주기도 하지만 특정 상대에 대한 의존을 높이기도 하므로 항상 유리하다고 할 수 없습니다.", "2. 기업부담 비율을 읽는 방법  관세율은 과세가격에 세금을 매기는 비율이고 기업부담 비율은 늘어난 부담 중 기업이 떠안은 부분의 비중입니다. 가상 예시에서 100원 상품에 15원 세금이 생겼다고 가정할 때 그중 40%는 6원입니다. 그러나 실제 자료는 가격 조정으로 과세표준도 달라질 수 있어 이 단순 계산을 그대로 적용할 수 없습니다. 인터뷰의 비율은 분모와 계약조건을 확인해 읽어야 합니다. 단기에는 계약과 생산설비가 고정되어 있어 부담을 피하기 어렵지만 장기에는 거래처와 제품을 바꿀 수 있습니다. 따라서 같은 기업의 부담도 관세가 생긴 직후와 시간이 지난 뒤 달라질 수 있으며, 비교할 때 관측기간을 맞추는 것이 필요합니다."], "follow": ["장기 거래관계는 항상 수출기업에 유리한가요?  신뢰로 공동 대응이 쉬워질 수 있지만 거래의존도가 높아져 양보를 요구받을 수도 있습니다. 관계의 기간만으로 방향을 단정하지 않겠습니다."], "memory": "같은 세율과 다른 대안", "caution": "40%·50%는 생기부상 사례 비교값입니다. 실용 경제의 95% 사례와 같은 기업인지 또는 같은 계산기준인지 임의로 맞추지 않습니다.", "source_refs": [25], "university": "공통", "kind": "답변", "glossary": [59, 99]}, {"id": 54, "question": "기업 인터뷰에서 가장 예상 밖이었던 점은 무엇입니까?", "category": "관세와 기업 인터뷰", "answer": ["저는 정보를 언제 알았는지가 가격을 바꿀 기회와 연결된다는 점이 가장 기억에 남습니다. 처음에는 제품의 대체 가능성과 협상력에 주목했는데, 인터뷰에서 정책을 늦게 알아 가격 조정 시기를 놓친 사례를 보며 질문이 달라졌습니다. 정보를 받는 시점 자체도 기업의 선택을 제한할 수 있었습니다.", "그래서 정보 접근성을 단순히 편리함의 문제가 아니라 대응할 시간을 확보하는 조건으로 생각하게 됐습니다. 통상정보 도구를 만들 때 근거 조항을 확인할 수 있게 하려 한 것도 그 때문입니다. 제가 관심을 가진 것은 정보를 많이 보여 주는 서비스보다, 결정이 필요한 순간에 믿고 확인할 자료를 찾도록 돕는 일이었습니다."], "evidence": ["3학년 · 진로활동 | PDF 4–5쪽 / 인쇄 5–6쪽\n정책을 늦게 파악해 가격조정 시기를 놓친 사례와 정보격차를 기록했습니다.", "3학년 · 자율활동 | PDF 4쪽 / 인쇄 5쪽\n기업의 법적 근거 확인 어려움을 통상정보 도구 구축으로 연결했습니다."], "concepts": ["1. 정보를 아는 시점과 행동 가능한 시점  유용한 정보라도 의사결정이 끝난 뒤 도착하면 바꿀 수 있는 선택이 줄어듭니다. 가상 예시로 납품가격을 정하기 전에 비용변화를 알면 협상을 시도할 수 있지만 고정가격 계약 뒤에 알면 즉시 조정하기 어렵습니다. 정보의 내용, 정확성, 도착시점이 모두 중요하며 경준은 그중 시차가 비용으로 이어지는 경로를 사례에서 발견했습니다.", "2. 사례에서 얻은 가설을 검증하기  정보가 늦은 기업의 부담이 컸다면 다음에는 거래조건과 규모가 비슷한 기업끼리 비교해볼 수 있습니다. 계약체결일, 정보인지일, 가격변경일을 구분하면 어떤 시차가 중요한지 더 분명해집니다. 이것은 후속 연구안이며 이미 그런 자료를 모두 확보했다는 뜻이 아닙니다. 도구를 제공하는 것만으로 계약협상력이나 지불여력까지 해결되는 것도 아닙니다. 정보인지일을 확인할 때도 담당자가 처음 기사를 본 날과 자신의 계약에 적용된다는 사실을 이해한 날은 다를 수 있습니다. 후속조사에서는 단순히 빨리 알았는가를 묻기보다 어떤 내용을 어느 단계에서 이해했는지 나누어 물어야 합니다."], "follow": ["정보를 빨리 주는 앱이면 문제를 해결할 수 있나요?  대응 시간을 확보하는 데 도움을 줄 수 있지만, 정보 해석능력과 협상권한, 자금여력도 필요하므로 앱 하나로 해결된다고 보지 않습니다."], "memory": "늦게 안 정보는 선택지를 줄인다", "caution": "", "sour
