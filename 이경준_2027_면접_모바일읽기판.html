 → 수익성·가격·위험을 구별", "caution": "모의투자의 실제 수익률은 학생부에 확인되지 않으므로 당시 거래기록을 확인한 뒤 답합니다.", "source_refs": [39, 40], "university": "공통", "kind": "답변", "glossary": [87]}, {"id": 109, "question": "감세와 규제 완화 정책을 어떻게 비교하고 평가했습니까?", "category": "학생부 확장 Ⅰ · 기초 탐구와 경제적 시각", "answer": ["저는 감세와 규제 완화를 하나의 찬반으로 평가하지 않으려고 네 가지 관점을 제안했습니다. 환경·회계·거시경제·경영의 관점으로 역할을 나누고, 경제보고서와 학술자료를 비교했습니다. 기업의 비용이 줄어드는 효과와 재정이나 환경에 생기는 부담은 따로 살펴야 한다고 생각했습니다.", "또 감세와 관세가 함께 바뀌면 투자 유인이 서로 다른 방향으로 움직일 수 있었습니다. 그래서 정책 하나의 장점만 강조하기보다 누가 언제 어떤 비용과 편익을 얻는지 비교했습니다. 이 활동은 제게 분석의 폭뿐 아니라 협업의 방식도 가르쳐 줬습니다. 서로 다른 관점을 나눠 검토한 뒤 함께 설명할 결론으로 모으는 과정이 중요했습니다."], "evidence": ["2학년 · 자율활동 팀별 주제 탐구 | PDF 2–3쪽 / 인쇄 3–4쪽\n팀 리더로 네 관점을 제안하고 경제보고서·학술자료를 비교하며 단기 부양과 재정·공급망 효과를 분석."], "concepts": ["1. 감세의 여러 전달 경로  감세는 가계의 가처분소득이나 기업의 세후 수익을 늘려 소비·투자에 영향을 줄 수 있습니다. 효과는 경기 상황과 감세 대상, 저축 성향, 재정 조달 방식에 따라 다릅니다. 가령 가상의 기업이 세금은 줄었지만 수요가 불확실하면 투자를 바로 늘리지 않을 수 있습니다. 경준의 탐구에서는 단기 부양과 장기 재정의 상충을 살폈습니다. 감세를 언제나 한 학파의 정책으로만 분류하거나 세수 감소가 성장만으로 반드시 상쇄된다고 단정하지 않습니다.", "2. 규제 완화와 외부효과  규제를 줄이면 준수 비용이나 진입 장벽이 낮아질 수 있지만, 규제가 막고 있던 사회적 비용이 커질 수도 있습니다. 가령 가상의 환경 규제를 없애 기업 비용이 줄어도 오염 피해가 다른 사람에게 넘어가면 전체 편익을 따져야 합니다. 이를 외부효과의 관점에서 볼 수 있습니다. 경준이 환경과 경영을 함께 본 이유를 설명하는 예시입니다. 규제가 있다는 사실이 효율적이라는 뜻도, 규제를 없앤다는 사실이 효율적이라는 뜻도 아니므로 목적과 실제 작동을 확인해야 합니다.", "3. 정책 묶음의 효과  감세·관세·규제는 서로 다른 방향의 유인을 동시에 만들 수 있습니다. 가령 가상의 감세가 투자 수익을 높여도 관세로 수입 부품 비용이 오르면 효과가 일부 상쇄될 수 있습니다. 경준은 이런 조합과 공급망 변화를 살폈습니다. 각 정책의 개별 효과를 분리하려면 다른 변화들을 통제할 자료와 분석 설계가 추가로 필요합니다."], "follow": ["케인즈주의는 감세에 반대하나요?  반드시 그렇지는 않습니다. 경기 침체기에 수요를 늘리는 수단으로 감세를 논의할 수도 있습니다. 정책 수단 하나보다 어떤 상황과 작동 경로를 강조하는지로 구별해야 합니다."], "memory": "네 관점 → 단기·장기 구분 → 감세·규제·관세의 조합 → 조건부 평가", "caution": "", "source_refs": [], "university": "공통", "kind": "답변", "glossary": [47]}, {"id": 110, "question": "성과에 따른 격차와 부당한 불평등을 어떻게 구분했습니까?", "category": "학생부 확장 Ⅰ · 기초 탐구와 경제적 시각", "answer": ["저는 결과가 다르다는 이유만으로 모두 부당하다고 보지는 않습니다. 노력과 혁신에 보상이 있어야 도전할 이유가 생길 수 있습니다. 다만 교육과 정보에 접근하는 기회가 크게 다른데 결과를 전부 개인의 노력으로만 설명하는 것도 충분하지 않다고 생각했습니다.", "질문탐구 활동에서는 이 두 관점을 함께 검토해 성과에 대한 유인은 인정하되 기회의 격차는 보완해야 한다는 결론을 정리했습니다. 이후 관세 부담과 지니계수를 보면서도 결과의 숫자와 그 결과를 만든 조건을 나눠 보려고 했습니다. 제가 중요하게 생각하는 것은 모든 결과를 같게 만드는 것보다, 각자가 능력을 발휘할 기회를 실질적으로 가질 수 있는가입니다."], "evidence": ["2학년 · 자율활동 질문탐구 활동 | PDF 3쪽 / 인쇄 4쪽\n불평등의 조건을 팀으로 탐구하고 성과 유인과 교육·정보 격차 보정을 함께 제안.", "3학년 · 사회문제 탐구 | PDF 18–19쪽 / 인쇄 19–20쪽\n관세 부담과 지니계수, 발언권을 함께 살피며 분배 지표의 한계를 검토."], "concepts": ["1. 기회의 공정성과 결과의 격차  기회의 공정성은 출발 조건과 선택 가능성에 대한 문제이고, 결과의 격차는 소득·성과 등이 어떻게 나뉘었는지를 말합니다. 가령 가상의 두 학생이 다른 성과를 냈어도 교육 자원과 정보 접근이 크게 달랐다면 차이를 노력만으로 해석하기 어렵습니다. 경준의 팀 탐구는 성과 보상과 기회 보정을 함께 보려는 시도였습니다. 결과를 모두 같게 만드는 정책만이 공정성의 해법인 것도 아니며, 형식적으로 같은 규칙을 적용하면 언제나 공정한 것도 아닙니다. 어떤 차이를 허용할지는 가치 판단도 포함합니다.", "2. 유인과 지표의 한계  유인은 선택의 기대 편익과 비용을 바꿔 행동에 영향을 줍니다. 성과 보상은 노력의 동기가 될 수 있지만, 결과가 규칙의 특혜나 정보 독점에서 비롯됐을 가능성도 살펴야 합니다. 가령 가상의 시장에서 허가를 독점한 기업의 높은 수익을 모두 혁신 성과라고 볼 수는 없습니다. 경준의 후속 지니계수 탐구는 소득분배 수치가 부담과 발언권을 모두 담지 못한다는 질문으로 이어졌습니다. 지표가 작게 변했다고 모든 집단의 부담이 작다고 결론 내리지 않고 다른 자료를 함께 확인합니다."], "follow": ["교육 지원도 노력할 유인을 줄일 수 있지 않나요?  제도 설계에 따라 그런 문제가 생길 수 있어 살펴야 합니다. 다만 출발의 제약을 줄이는 지원은 사람들이 노력의 성과를 얻을 가능성을 높일 수도 있으므로 방식과 대상을 구체적으로 비교해야 합니다."], "memory": "성과 보상의 유인 → 교육·정보의 기회 → 결과를 만든 규칙까지 살피기", "caution": "", "source_refs": [], "university": "공통", "kind": "답변", "glossary": []}, {"id": 111, "question": "청소년 충동구매 탐구에서 최초 가설이 어떻게 바뀌었습니까?", "category": "학생부 확장 Ⅰ · 기초 탐구와 경제적 시각", "answer": ["처음에는 청소년의 소비를 합리적인 선택으로 설명해 보려고 했지만, 질문지와 면접 결과를 보며 그 가정을 수정했습니다. 정보가 어떻게 표현되는지, 기회를 놓친다고 느끼는지가 선택에 영향을 줄 수 있었습니다. 그래서 프레이밍 효과와 손실회피를 통해 결과를 다시 해석했습니다.", "저에게 중요한 점은 처음 세운 가설을 지키기 위해 다른 응답을 제외하지 않았다는 것입니다. 예상과 다르다면 제가 놓친 조건을 찾아야 했습니다. 이후에는 행동경제학과 넛지로 관심을 넓혀 충동구매를 줄일 방법도 생각했습니다. 다만 제 조사로 모든 청소년의 행동이나 특정 심리효과의 인과관계를 확정한 것은 아니라는 점은 구분합니다."], "evidence": ["2학년 · 동아리활동 경제해부학2 | PDF 3쪽 / 인쇄 4쪽\n질문지·면접을 병행하고 프레이밍·손실회피 경향을 관찰해 최초 가설을 기각.", "2학년 · 진로활동 진로 수행 | PDF 3쪽 / 인쇄 4쪽\n뇌과학·행동경제학·넛지를 연결해 충동구매 원인과 예방법을 발표."], "concepts": ["1. 프레이밍 효과와 손실회피  프레이밍 효과는 실질적으로 같은 선택도 표현 방식에 따라 판단이 달라질 수 있다는 뜻입니다. 손실회피는 기준점에 비해 같은 크기의 이익보다 손실을 더 크게 느끼는 경향을 말합니다. 가령 가상의 할인 안내를 ‘지금 사면 절약’과 ‘지금 놓치면 기회 상실’로 제시할 때 반응이 다를 수 있습니다. 이 예시는 이해를 돕기 위한 것이며 실제 설문 문항은 아닙니다. 경준은 관련 경향을 관찰했지만, 두 효과의 독립적인 인과효과를 통제실험으로 확정했다고 확대하지 않습니다.", "2. 제한된 합리성과 가설 수정  제한된 합리성은 시간·정보·인지 능력의 제약 속에서 사람이 판단한다는 관점으로 허버트 사이먼이 개척했습니다. 카너먼의 연구는 판단의 편향과 불확실성 아래 선택을 이해하는 데 기여했습니다. 가령 가상의 소비자가 모든 상품을 비교할 시간이 없어 간단한 단서에 의존할 수 있습니다. 경준의 기록에 카너먼과 연결된 표현이 있어도 개념의 귀속은 구분합니다. 가설 기각은 자신의 모든 생각이 틀렸다는 뜻이 아니라, 수집한 자료에 맞게 더 세밀한 설명을 찾는 과정으로 이해합니다."], "follow": ["도파민 때문에 충동구매를 한다고 보면 되나요?  그렇게 단일 원인으로 설명하기는 어렵습니다. 보상 기대와 학습에 관련된 신경 과정뿐 아니라 정보의 표현, 환경, 개인의 상황이 함께 작용할 수 있습니다."], "memory": "합리적 소비 가설 → 질문지·면접 → 표현과 손실의 영향 → 가설 수정", "caution": "확인되지 않은 설문·면접 인원 수를 붙이지 않으며, 제한된 합리성의 선구자를 카너먼으로만 설명하지 않는다.", "source_refs": [41, 42], "university": "공통", "kind": "답변", "glossary": [74, 75]}, {"id": 112, "question": "반도체 무역전환을 중력모형으로 분석한 이유와 한계는 무엇입니까?", "category": "학생부 확장 Ⅰ · 기초 탐구와 경제적 시각", "answer": ["국가 간 반도체 거래를 비교할 기본 틀이 필요해 중력모형을 활용했습니다. 경제 규모가 크면 거래가 많고 거리와 무역비용이 크면 거래가 줄어드는 경향을 바탕으로, 한국의 수출 변화와 중국의 수입 관계를 살펴봤습니다. 사건을 나열하는 것보다 거래의 조건을 함께 보고 싶었습니다.", "하지만 거리만으로 특정 시기의 갈등이나 기업의 협상관계를 충분히 설명할 수는 없었습니다. 그 한계는 나중에 실제 기업에 거래조건을 물어보는 관심으로 이어졌습니다. 저는 모형의 빈틈을 발견했을 때 탐구가 끝난다고 생각하지 않습니다. 다음에 필요한 자료와 방법을 찾을 수 있다는 점에서 의미가 있었고, 대학에서는 그 분석을 더 엄밀하게 발전시키고 싶습니다."], "evidence": ["2학년 · 진로활동 진로 연계 심층 탐구 프로젝트 | PDF 3쪽 / 인쇄 4쪽\n중력모형과 지리적 거리를 활용한 반도체 수출전환 탐구.", "3학년 · 진로활동 | PDF 4–5쪽 / 인쇄 5–6쪽\n중력모형의 관계변수 한계에서 출발해 현장 인터뷰로 확장."], "concepts": ["1. 중력모형의 직관  무역의 중력모형은 경제 규모가 큰 시장 사이에는 거래가 많고, 거리 등 무역 비용이 크면 거래가 줄어드는 경향을 설명하는 틀입니다. 구조적 모형에서는 다른 시장과 거래할 여건도 중요합니다. 가령 가상의 두 나라가 가까워 운송비가 낮아도 제재나 수출통제가 있으면 거래가 제한될 수 있습니다. 경준은 반도체 수출의 변화를 해석하는 틀로 활용했습니다. 거리 계수나 특정 자료 기간이 생기부에 확인되지 않으므로 실제로 추정한 수치처럼 새로 넣지 않으며 이론의 설명 범위와 실행한 분석을 구분합니다.", "2. 거리변수와 인과 해석의 한계  거리에는 운송비와 정보 비용 등 여러 경로가 담길 수 있어 무역량에 직접 영향을 줄 수 있습니다. 따라서 가상의 분석에서 거리를 도구변수로 사용하려면 배제제약이 특히 문제가 됩니다. 일정한 양국 간 거리는 시간에 따른 갈등 변화 자체를 설명하지도 못합니다. 경준의 기록은 거리변수의 역할을 검토한 탐구이며 완성된 도구변수 추정과 타당성 검정을 증명하지 않습니다. 이 연구에서 말하는 넓은 의미의 수출 경로 전환과 FTA 특혜로 공급처가 바뀌는 고전적인 무역전환 개념도 구별해야 합니다."], "follow": ["다시 분석한다면 무엇을 더 확인하겠나요?  정책의 적용 시점과 품목, 세계 반도체 수요와 다른 공급국의 변화를 함께 확인하겠습니다. 비교 가능한 자료를 만든 뒤 어떤 가정에서 정책 효과를 분리할 수 있는지 검토하겠습니다."], "memory": "국가 간 거래의 틀 → 규모·거리 → 지정학·협상력의 빈틈 → 현장 조사", "caution": "HS코드·자료 제공기관·추정계수·2SLS 결과처럼 생기부에 없는 세부 사항을 수행 사실로 만들지 않는다.", "source_refs": [43, 8], "university": "공통", "kind": "답변", "glossary": [28, 41, 47, 65, 98]}, {"id": 113, "question": "사회자본과 인적자본은 어떻게 다르며 투자 유치와 어떻게 연결됩니까?", "category": "학생부 확장 Ⅰ · 기초 탐구와 경제적 시각", "answer": ["인적자본은 개인이 가진 지식과 기술이고, 사회자본은 사람들 사이의 신뢰와 네트워크, 협력을 돕는 규범이라고 이해합니다. 독서 수업에서 지역의 투자 유치를 살펴보며 숙련된 사람이 있는 것과 그 역량이 협력으로 연결되는 것은 다른 조건이라는 점에 관심을 가졌습니다.", "정부 통계와 보고서를 활용해 신뢰와 시민참여를 살폈지만, 무엇으로 사회자본을 측정할지부터 쉽지 않았습니다. 투자가 늘어 네트워크가 좋아졌을 가능성도 생각해야 했습니다. 그래서 도구변수의 원리를 검토했고, 개념을 제시하는 것과 자료로 그 효과를 확인하는 것이 다르다는 걸 배웠습니다. 개인의 역량과 함께 일할 환경을 함께 보는 시각을 얻었습니다."], "evidence": ["2학년 · 독서 | PDF 11쪽 / 인쇄 12쪽\n신뢰·네트워크·시민참여와 인적자본을 연결한 다국적기업 투자 유치 보고서 및 측정·인과 해석의 한계 인식."], "concepts": ["1. 개인의 역량과 관계의 자원  인적자본은 교육과 경험 등으로 축적된 개인의 지식·기술·능력을, 사회자본은 협력을 돕는 네트워크와 공유된 규범·신뢰 등을 가리킵니다. 가령 가상의 지역에 숙련된 기술자가 많아도 기업과 인력 사이의 정보가 막히면 채용과 협업이 어려울 수 있습니다. 두 자본은 서로 보완할 수 있지만 동일한 지표는 아닙니다. 경준의 탐구는 이런 연결을 투자 유치와 연관 지었습니다. 강한 내부 네트워크가 외부인을 배제할 수도 있으므로 사회적 유대가 강하면 항상 경제적으로 좋은 결과가 난다고 단정하지 않습니다.", "2. 거래비용과 측정의 어려움  거래비용은 상대를 찾고 협상하며 약속을 확인·집행하는 데 드는 비용입니다. 가령 가상의 기업이 지역 협력업체의 신뢰도를 쉽게 확인하면 탐색 비용이 낮아질 수 있습니다. 그러나 신뢰가 투자 유치의 원인인지, 소득과 제도 같은 다른 요인이 둘 모두를 높였는지는 따로 확인해야 합니다. 경준은 정부 자료의 지표와 해석 한계를 검토했습니다. 신뢰 설문 하나가 사회자본 전체를 대표하지 않으며, 도구변수라는 방법 이름을 안다고 유효한 인과 추정이 완성되는 것도 아니라는 점이 핵심입니다."], "follow": ["사회자본을 어떻게 측정할 수 있나요?  신뢰 설문, 시민참여, 네트워크 관련 지표 등을 검토할 수 있습니다. 다만 서로 다른 측면을 담으므로 하나의 수치가 사회자본 전체를 완벽히 대표한다고 보지는 않겠습니다."], "memory": "개인의 능력과 관계의 자원 → 협력·거래비용 → 지표와 인과의 한계", "caution": "", "source_refs": [44, 45], "university": "공통", "kind": "답변", "glossary": [40, 48, 66, 76, 82]}, {"id": 114, "question": "관내분실을 읽고 데이터 현지화 문제로 관심을 넓힌 이유는 무엇입니까?", "category": "학생부 확장 Ⅰ · 기초 탐구와 경제적 시각", "answer": ["『관내분실』에서는 기억을 데이터로 남기면 그 사람의 자아도 그대로 보존되는지 궁금했습니다. 저는 자아가 저장된 정보만이 아니라 그 정보를 해석하는 감정과 관계 속에서 만들어진다고 생각해 글을 썼습니다. 먼저 작품 자체가 던지는 인간과 기억의 질문에 관심이 있었습니다.", "이후에는 데이터를 어디에 저장하고 이동시킬지 정하는 사회의 규칙이 궁금해져 데이터 현지화로 탐구를 넓혔습니다. 기업의 비용뿐 아니라 개인정보와 안보를 보호하려는 목적도 함께 봤습니다. 문학이 통상정책의 답을 준 것은 아닙니다. 작품에서 시작한 질문이 데이터를 다루는 제도의 문제로 이어졌다는 점에서 제게 의미가 있었습니다."], "evidence": ["2학년 · 문학 | PDF 11쪽 / 인쇄 12쪽\n자아와 기억 데이터에 관한 문학 에세이에서 데이터 현지화 규제와 디지털무역으로 확장한 탐구.", "3학년 · 자율활동 | PDF 4쪽 / 인쇄 5쪽\n문학의 데이터 현지화 비용분석을 통상정보 도구 구축으로 연결한 기록."], "concepts": ["1. 데이터 저장과 자아의 문제  자아에 관한 질문은 기억의 내용뿐 아니라 그것을 누가 어떻게 해석하며 관계를 맺는지까지 묻는 철학적 문제입니다. 가령 가상의 저장 장치에 한 사람의 기록이 남아도 그것이 살아 있는 사람의 경험과 동일한지는 별도로 논의해야 합니다. 경준은 작품을 읽고 감정과 해석을 통한 자아의 구성에 주목했습니다. 이는 자신의 독서 해석이며 과학적으로 자아의 정의를 확정한 결론은 아닙니다. 작품의 설정과 후속 정책 탐구를 나누어 말하면 문학을 억지로 경제에 끼워 맞췄다는 인상을 줄일 수 있습니다.", "2. 데이터 현지화와 신뢰  데이터 현지화는 특정 데이터를 국내에 저장하거나 처리하도록 요구하는 조치 등을 말합니다. 가령 가상의 해외 서비스 기업이 현지 서버를 따로 운영해야 한다면 중복 설비와 관리 비용이 생길 수 있습니다. 반면 규제는 감독·보안·개인정보 보호 등 목적을 가질 수 있어 비용만으로 정당성을 판단하지 않습니다. 경준은 원문 자료를 통해 디지털무역과 규범의 예측가능성을 살폈습니다. 저장 장소를 정하는 규제와 국외 이전의 조건을 정하는 규제가 항상 같은 것은 아니므로 구체적인 의무와 적용 대상을 확인합니다."], "follow": ["문학과 통상을 너무 멀리 연결한 것 아닌가요?  작품 자체가 통상정책을 설명한다고 생각하지는 않습니다. 작품에서는 데이터와 인간의 관계를 질문했고, 그 뒤 데이터를 다루는 사회의 규칙이라는 별도의 질문으로 확장했습니다."], "memory": "기억 데이터와 자아 → 데이터의 사회적 의미 → 저장·이동 규칙 → 보호와 비용", "caution": "", "source_refs": [46, 47], "university": "공통", "kind": "답변", "glossary": []}, {"id": 115, "question": "미스터 방을 렌트시킹과 정책포획으로 해석한 이유는 무엇입니까?", "category": "학생부 확장 Ⅰ · 기초 탐구와 경제적 시각", "answer": ["저는 방삼복의 행동을 개인의 성격만이 아니라 어떤 환경이 그런 행동에 보상을 주는지의 문제로 읽었습니다. 생산적인 능력보다 권력에 가까이 가는 일이 이익이 되는 구조에 주목했고, 이를 렌트시킹과 정책포획의 개념으로 해석해 봤습니다.", "그 과정에서 공정한 경쟁에는 좋은 개인뿐 아니라 특혜에 유리하지 않은 규칙도 필요하다고 생각했습니다. 물론 작품을 현대 경제학의 사례와 완전히 같다고 볼 수는 없습니다. 제가 가져온 것은 사람의 행동과 제도의 유인을 함께 묻는 관점입니다. 이후 통상규범을 볼 때도 규칙이 누구에게 기회를 주고 누구의 목소리를 놓치는지 살펴보게 됐습니다."], "evidence": ["2학년 · 문학 | PDF 11쪽 / 인쇄 12쪽\n작품의 출세구조를 렌트시킹·정책포획과 제도적 유인으로 해석하고 공정경쟁을 성찰.", "2학년 · 진로활동 진로 독서 프로젝트 | PDF 3쪽 / 인쇄 4쪽\n국부론을 통해 특정 계층에 편향된 정책의 효율성·공정성 문제를 탐구."], "concepts": ["1. 렌트시킹  렌트시킹은 새로운 가치를 생산하기보다 제도적 특혜나 독점적 지위 등을 확보해 이익을 얻으려 자원을 쓰는 행동을 뜻합니다. 가령 가상의 기업이 품질 개선 대신 경쟁자의 진입을 막는 허가 규칙을 얻는 데 힘을 쏟을 수 있습니다. 모든 이윤이나 모든 정치적 의견 표명이 렌트시킹인 것은 아닙니다. 경준은 방삼복의 출세구조를 권력 접근의 유인으로 해석했습니다. 이는 작품을 읽는 자신의 분석 틀이며, 작가가 해당 현대 경제학 용어를 직접 사용했다는 뜻으로 설명하지 않습니다.", "2. 정책포획과 정당한 참여  정책포획은 공적 결정이 반복적으로 공익보다 특정 집단의 이익을 향하도록 기울어지는 현상을 말합니다. 불법 행위뿐 아니라 정보와 영향력의 불균형을 통해서도 문제가 생길 수 있습니다. 가령 가상의 규제 논의에서 한 집단의 자료만 계속 반영되고 피해 집단의 목소리는 빠지면 그 구조를 점검할 수 있습니다. 경준의 독서 해석과 특정 계층에 편향된 정책에 대한 관심이 연결됩니다. 이해관계자의 의견 제출 자체를 포획으로 단정하지 않고, 투명성·참여의 균형·책임성을 함께 살펴야 합니다."], "follow": ["기업이 정부에 의견을 내는 것도 잘못인가요?  그 자체로 잘못이라고 생각하지 않습니다. 현장의 정보를 전달할 수 있기 때문입니다. 다만 과정이 투명한지, 다른 집단의 의견도 반영되는지, 특정 이익이 공익을 밀어내는지 확인해야 합니다."], "memory": "인물의 출세 → 권력 접근에 보상하는 규칙 → 특혜 추구와 공적 결정의 왜곡", "caution": "", "source_refs": [48, 49], "university": "공통", "kind": "답변", "glossary": [77]}, {"id": 116, "question": "로렌츠곡선과 지니계수를 적분으로 어떻게 설명하겠습니까?", "category": "학생부 확장 Ⅰ · 기초 탐구와 경제적 시각", "answer": ["로렌츠곡선은 소득이 낮은 사람부터 놓고 누적 인구 비율에 따른 누적 소득 비율을 나타낸 곡선입니다. 모두 소득이 같다면 인구의 20%가 소득의 20%를 가지므로 완전평등선은 y=x입니다. 지니계수는 그 선과 로렌츠곡선 사이의 면적을 이용해 불평등을 요약합니다.", "두 축이 0부터 1이면 완전평등선 아래 면적은 1/2입니다. 그래서 지니계수는 1에서 로렌츠곡선 아래 면적의 두 배를 뺀 값으로 구할 수 있습니다. 수학Ⅱ에서 적분이 사회현상을 측정하는 데 쓰인다는 점이 흥미로웠습니다. 이후에는 같은 지니계수라도 특정 계층의 부담은 다를 수 있다는 점을 생각하며 지표의 한계까지 살펴봤습니다."], "evidence": ["2학년 · 수학Ⅱ | PDF 11쪽 / 인쇄 12쪽\n로렌츠곡선과 완전평등선 사이 면적을 적분으로 이해하고 지니계수를 비교.", "3학년 · 사회문제 탐구 | PDF 18–19쪽 / 인쇄 19–20쪽\n관세 부담과 지니계수 변화가 다른 문제를 보여 줄 수 있음을 탐구."], "concepts": ["1. 면적에서 지니계수를 구하는 과정  로렌츠곡선을 L(x)라 할 때 0부터 1까지의 적분은 곡선 아래 면적입니다. 완전평등선 아래 면적은 삼각형이므로 1/2이고, 두 선 사이 면적은 1/2에서 L(x)의 적분을 뺀 값입니다. 이를 1/2로 나누면 지니계수는 ‘1−2×곡선 아래 면적’이 됩니다. 가상의 곡선 L(x)=x²를 사용하면 적분값이 1/3이므로 지니계수도 1/3입니다. 실제 국가의 분포를 뜻하는 숫자는 아닙니다. 경준의 수학Ⅱ 탐구에서 면적과 불평등을 연결하는 원리를 말로 설명하는 데 사용할 수 있습니다.", "2. 지니계수의 비교 조건  통상적인 비음수 소득 분포에서 지니계수는 0에 가까울수록 평등하며, 0~1 또는 0~100 척도를 사용합니다. 국가를 비교할 때는 시장소득인지 처분가능소득인지, 개인인지 가구인지, 조사 시점이 같은지 확인해야 합니다. 가령 가상의 두 분포가 같은 면적을 가져도 저소득층과 중간층의 모습은 다를 수 있습니다. 경준의 생기부에 있는 한국 2023년 0.323은 탐구에서 사용한 값이며 여기서 자료 정의까지 확인되지는 않습니다. 최신 확정 통계나 비교대상 없는 ‘중위권’이라는 결론으로 확대하지 않습니다."], "follow": ["지니계수가 같으면 같은 정도로 공정한 사회인가요?  소득분포의 한 측면이 같다는 뜻이지 기회나 발언권, 특정 계층의 부담까지 같다는 뜻은 아닙니다. 분포의 모양과 다른 지표를 함께 봐야 합니다."], "memory": "누적 인구·소득 → y=x와 면적 차이 → 1−2×적분 → 비교 조건 확인", "caution": "", "source_refs": [50, 51], "university": "공통", "kind": "답변", "glossary": [64]}, {"id": 117, "question": "금융위기와 공유경제의 관계를 영어 발표에서 어떻게 설명했습니까?", "category": "학생부 확장 Ⅱ · 실무·제도·계산", "answer": ["금융위기 하나가 공유경제를 만들었다기보다, 경제적 압박과 새로운 연결기술이 함께 작용한 배경으로 설명했습니다. 영어Ⅰ에서 소유한 자산을 활용해 소득을 얻으려는 사람과 더 저렴하게 이용하려는 사람이 플랫폼으로 만날 수 있다는 점에 주목했습니다.", "또 이용자가 늘면 공급자가 참여할 이유가 커지고, 공급자가 늘면 이용자의 선택지가 넓어지는 네트워크효과를 살폈습니다. 다만 거래가 늘어나는 것과 노동조건이나 소비자보호가 좋아지는 것은 같은 문제가 아닙니다. 저는 새로운 사업모델을 볼 때 편리함과 성장 가능성뿐 아니라 누가 책임지고 어떤 제도가 필요한지도 함께 봐야 한다고 배웠습니다."], "evidence": ["2학년 · 영어Ⅰ | PDF 12쪽 / 인쇄 13쪽\n2학년 영어Ⅰ의 금융위기·공유경제 영어발표와 네트워크효과 분석입니다."], "concepts": ["1. 양면 플랫폼과 네트워크효과  플랫폼은 서로 다른 집단의 거래를 연결합니다. 가상 예시로 숙소 제공자가 늘면 이용자의 선택지가 커지고 이용자가 늘면 제공자의 참여유인이 높아지는 간접 네트워크효과가 나타날 수 있습니다. 참여자가 많아지면 언제나 품질이 좋아지는 것은 아니며 혼잡과 낮은 품질, 정보오류가 생길 수도 있습니다. 네트워크효과와 생산량 증가에 따른 원가하락은 다른 개념입니다.", "2. 공유경제의 이익과 제도적 과제  유휴자산을 더 많이 쓰면 자원활용과 접근성이 좋아질 수 있습니다. 그러나 개인 간 공유처럼 보여도 상업적인 사업자가 활동할 수 있어 책임과 규제범위를 확인해야 합니다. 경준의 발표는 금융위기, 소비패턴, 기술발전을 함께 고려한 점에 의미가 있습니다. 어떤 플랫폼이 위기 직후 성장했다는 시간적 순서만으로 금융위기의 인과효과를 입증할 수는 없습니다. 플랫폼은 서로 다른 집단에게 다른 가격을 받을 수 있습니다. 한쪽 참여자를 늘리려고 무료나 낮은 가격을 적용하는 전략도 가능하지만, 이것만으로 수익성이 보장되는 것은 아닙니다. 참여자 증가가 매칭과 반복사용으로 이어지는지 확인해야 합니다."], "follow": ["네트워크효과가 강하면 어떤 문제가 생길 수 있습니까?  이용자가 큰 플랫폼에 모이면서 신규 진입이 어려워지고 시장지배력이 커질 수 있습니다. 다만 전환비용과 경쟁플랫폼 이용가능성에 따라 정도는 다릅니다."], "memory": "위기의 유인과 연결기술을 함께", "caution": "", "source_refs": [52], "university": "공통", "kind": "답변", "glossary": []}, {"id": 118, "question": "스위스와 마킬라도라를 통해 지리와 경제의 관계를 어떻게 이해했습니까?", "category": "학생부 확장 Ⅱ · 실무·제도·계산", "answer": ["지리는 경제활동의 조건이지만 결과를 혼자 결정하는 요인은 아니라는 점을 배웠습니다. 스위스 여행안내서를 만들면서 지형과 역사·제도가 경제와 어떻게 연결되는지 살폈고, 금융 중심지라는 결과만 다른 지역에 옮길 수 있는지 질문했습니다. 실제 방문 경험이 아니라 자료를 바탕으로 만든 과제입니다.", "마킬라도라에서도 국경에 가깝다는 위치와 무역협정, 생산네트워크를 함께 봤습니다. 도린 매시의 글을 읽으며 산업 변화가 지역과 여성 노동에 어떤 경험이 되는지도 생각했습니다. 제게 세계지리는 나라의 특징을 외우는 과목보다, 같은 성장이나 제도가 왜 장소와 사람에 따라 다르게 작동하는지 묻는 과목이었습니다."], "evidence": ["2학년 · 세계지리 | PDF 12쪽 / 인쇄 13쪽\n2학년 세계지리의 스위스 안내서, 마킬라도라와 NAFTA·USMCA, 도린 매시 독서가 근거입니다."], "concepts": ["1. 위치와 제도를 함께 보는 경제지리  기업의 입지는 시장과의 거리, 교통, 노동력, 제도, 축적된 기술 등 여러 조건에 영향을 받습니다. 가상 예시로 같은 국경지역이라도 통관절차와 도로망, 인력교육이 다르면 공장이 들어설 유인은 달라집니다. 마킬라도라는 멕시코의 수출가공·조립 생산을 이해하는 맥락이며, 가까운 위치만으로 설명하기보다 북미 생산관계와 규칙을 함께 봐야 합니다.", "2. 성공모델의 이전과 분배의 문제  한 지역의 금융산업이나 제조업 성공을 다른 곳에 적용하려면 필요한 신뢰·인력·시장접근 조건을 확인해야 합니다. 또한 총생산이 늘어도 일자리의 질과 이익이 지역주민에게 어떻게 분배되는지는 별도 문제입니다. 경준의 공간과 노동에 대한 독서는 같은 성장이 집단에 따라 다른 경험이 될 수 있음을 살피게 합니다. 여행안내서 작성은 실제 해외방문 경험과 구분해야 합니다. 같은 무역협정 안에서도 산업별 원산지규정과 생산조건은 다를 수 있습니다. 따라서 협정이 있다는 이유만으로 모든 거래가 같은 혜택을 받는다고 볼 수 없습니다. 지리적 가까움이 제도적 접근성과 결합되는 조건을 살피는 것이 통상분석의 질문입니다."], "follow": ["NAFTA와 USMCA는 같은 협정인가요?  USMCA는 NAFTA를 대체해 2020년 발효한 협정으로, 원산지·노동·디지털무역 등 여러 규칙을 갱신했습니다. 같은 이름의 협정으로 설명하지 않겠습니다."], "memory": "장소의 조건과 규칙이 함께 만든 경제", "caution": "스위스·아이슬란드·홋카이도 관련 과제는 실제 여행 경험으로 서술하지 않습니다.", "source_refs": [53], "university": "공통", "kind": "답변", "glossary": [22, 29, 30, 48]}, {"id": 119, "question": "정치와 법의 탄소국경조정제도 가상 인터뷰에서 무엇을 쟁점으로 삼았습니까?", "category": "학생부 확장 Ⅱ · 실무·제도·계산", "answer": ["저는 탄소국경조정제도의 환경 목적과 기업이 그 목적에 대응하는 비용을 함께 쟁점으로 삼았습니다. 정치와 법에서 작성한 것은 실제 전문가 인터뷰가 아니라 자료를 토대로 구성한 가상 인터뷰 기사였습니다. 배출을 줄이려는 제도가 수출기업에 어떤 의무를 만드는지 질문과 답으로 정리했습니다.", "특히 배출량을 줄이는 것과 그 사실을 측정해 입증하는 것은 다르다는 점에 관심이 갔습니다. 작은 기업에는 그 준비 비용도 부담일 수 있기 때문입니다. 이후 심화 수학Ⅰ에서는 탄소비용을 가격에 얼마나 반영할지 분석했습니다. 제도의 정당성과 기업의 대응을 각각 살펴보며, 좋은 목적을 실제로 실행하는 조건까지 생각하게 됐습니다."], "evidence": ["2학년 · 정치와 법 | PDF 12–13쪽 / 인쇄 13–14쪽\n2학년 정치와 법의 CBAM 가상 인터뷰 기사와 법적 쟁점 분석입니다.", "3학년 · 심화 수학Ⅰ | PDF 18쪽 / 인쇄 19쪽\n3학년 심화 수학Ⅰ의 탄소비용 전가 및 이윤극대화 후속 탐구입니다."], "concepts": ["1. 탄소누출과 CBAM의 작동원리  탄소누출은 기후규제가 강한 지역의 생산이 규제가 약한 곳으로 옮겨가는 등 배출감축 효과가 줄어드는 문제입니다. CBAM은 일부 수입품의 내재배출량과 EU의 탄소가격을 연결하는 제도입니다. 가상 예시로 같은 철강이라도 생산과정의 배출량과 인정되는 탄소가격 납부에 따라 부담이 달라질 수 있습니다. 상품 전체에 같은 관세율을 붙이는 방식과 동일하지 않습니다.", "2. 규범과 기업대응을 나누어 보기  환경목적이 있다는 사실만으로 모든 차별이 정당해지거나, 수출비용이 늘었다는 사실만으로 위법한 장벽이 되는 것은 아닙니다. 적용방식과 동종상품 취급, 입증부담과 대안을 구체적으로 검토해야 합니다. 경준의 가상 인터뷰는 이런 관점을 정리한 과제이며 실제 법적 판정을 내린 것은 아닙니다. 기업대응에는 배출량 관리와 생산기술 개선, 가격과 물량 조정이 각각 포함됩니다. 배출량이 적다는 주장과 이를 거래상대가 인정할 방식으로 입증하는 일은 다릅니다. 측정과 검증에 고정비용이 들면 작은 기업에 상대적 부담이 클 수 있습니다. 환경기준의 필요성을 인정하면서도 접근성과 입증지원의 문제를 제기할 수 있습니다."], "follow": ["석유화학 제품도 모두 CBAM 직접 대상입니까?  그렇게 일반화하면 안 됩니다. 공식 적용품목과 산업 전반의 간접영향·확대논의를 구분해야 하며, 현재 품목과 세부코드는 공식자료로 확인해야 합니다."], "memory": "환경목적과 입증비용과 가격대응", "caution": "정치와 법의 인터뷰는 가상 과제입니다. 3학년 진로활동의 실제 기업 인터뷰와 구분합니다.", "source_refs": [54], "university": "공통", "kind": "답변", "glossary": [25, 26]}, {"id": 120, "question": "브랜드 인지도와 제품 신뢰도를 조사한 설문은 어떻게 설계했습니까?", "category": "학생부 확장 Ⅱ · 실무·제도·계산", "answer": ["브랜드를 안다는 것, 제품을 믿는다는 것, 구매하고 싶다는 것을 나눠 측정하려고 했습니다. 사회·문화에서 개념적 정의와 조작적 정의를 구분하고, 인지도와 신뢰도를 1~5점 척도로 조사했습니다. 처음에는 익숙한 브랜드를 더 믿고 구매하려 할 것이라는 설명을 생각했습니다.", "그런데 신뢰도는 높아도 구매의향이 낮은 집단이 나타났습니다. 그래서 추가설문과 면접으로 가격 대비 가치 같은 조건을 살펴봤습니다. 저는 이 집단을 예외로 빼기보다 제 설명을 고칠 단서로 보았습니다. 소비자가 무엇을 믿는지와 실제로 무엇을 선택하는지는 다를 수 있다는 점, 비슷한 개념도 측정할 때는 분명히 나눠야 한다는 점을 배웠습니다."], "evidence": ["2학년 · 사회·문화 | PDF 13쪽 / 인쇄 14쪽\n2학년 사회·문화의 1~5점 척도, 인지도·신뢰도·구매의향 구분과 추가조사가 근거입니다."], "concepts": ["1. 개념적 정의와 조작적 정의  개념적 정의는 무엇을 의미하는지 설명하고, 조작적 정의는 실제로 무엇을 물어 숫자로 기록할지 정합니다. 가상 예시로 신뢰도를 제품이 약속한 성능을 낼 것이라는 기대라고 정의하고 관련 문항에 1~5점 응답을 받는 방식입니다. 한 문항만으로 복합개념이 충분히 측정되는지는 별도 문제이며, 문항의 표현과 응답척도가 결과에 영향을 줍니다.", "2. 인지도와 구매의향 사이의 다른 조건  브랜드를 알고 신뢰해도 가격이나 필요성 때문에 구매하지 않을 수 있습니다. 가성비가 신뢰와 구매의향의 관계를 바꾸면 조절변인 가설로 살펴볼 수 있지만, 추가인터뷰만으로 통계적 상호작용이 증명되는 것은 아닙니다. 경준의 탐구는 예외집단을 찾아 가설을 수정한 사례입니다. 원문에 없는 표본수와 유의확률을 추가하지 말고 관찰과 정식 검정을 구분해야 합니다. 신뢰도와 구매의향을 같은 문장으로 물으면 두 개념이 구분되지 않을 수 있습니다. 응답자가 듣기 좋은 답을 하거나 특정 브랜드를 떠올리지 못하는 문제도 고려해야 합니다. 설문문항을 실제로 어떤 경험을 묻는지 분명하게 쓰는 것이 측정의 출발입니다."], "follow": ["1~5점 척도의 평균을 내도 되나요?  점수 간 간격을 어떻게 해석할지와 척도의 구성을 먼저 검토해야 합니다. 평균만 보지 않고 응답분포나 문항별 차이도 함께 확인하는 것이 좋습니다."], "memory": "안다와 믿는다와 산다를 나누기", "caution": "32명 설문·8명 면접이라는 수는 이 사회·문화 기록에서 확인되지 않습니다. 다른 활동의 표본을 옮겨 적지 않습니다.", "source_refs": [], "university": "공통", "kind": "답변", "glossary": [44]}, {"id": 121, "question": "사르트르의 자유와 책임을 정보비대칭 문제에 어떻게 연결했습니까?", "category": "학생부 확장 Ⅱ · 실무·제도·계산", "answer": ["저는 선택에 책임이 있다는 말과 그 선택을 이해할 정보가 충분했는지를 함께 물었습니다. 사르트르의 자유와 책임을 배우며, 금융상품을 고르는 상황에서도 스스로 결정한다는 것은 무엇인지 생각했습니다. 손실 가능성을 이해하기 어려운 상태의 선택을 온전히 자유롭다고 볼 수 있는지 궁금했습니다.", "그래서 정보의 비대칭을 줄이면서 개인의 자기결정을 존중하는 사회를 구상했습니다. 이것은 사르트르가 제안한 금융정책이 아니라 제가 그의 관점을 확장한 생각입니다. 저는 개인의 책임을 없애고 싶지는 않습니다. 다만 책임 있게 판단할 조건을 함께 마련해야 한다는 생각이 기업의 정보 접근 문제에 대한 관심과도 이어졌습니다."], "evidence": ["2학년 · 윤리와 사상 | PDF 13쪽 / 인쇄 14쪽\n2학년 윤리와 사상의 청년 디지털금융, 사르트르, 연대자기결정사회와 정책제안이 직접 근거입니다."], "concepts": ["1. 실존과 선택의 책임  사르트르의 실존은 본질에 앞선다는 생각은 인간을 미리 정해진 역할이나 성질로만 설명하지 않고 선택과 행동의 책임을 묻는 관점입니다. 무엇이든 원하는 대로 결과를 통제할 수 있다는 뜻은 아닙니다. 가상 예시로 사회가 정한 성공의 모습을 따른다는 이유만으로 자신의 선택을 전혀 검토하지 않는 태도는 자유를 회피하는 문제와 연결해 생각해볼 수 있습니다.", "2. 정보조건과 책임의 배분  정보비대칭은 거래당사자가 중요한 정보를 서로 다르게 갖는 상황입니다. 위험을 설명받지 못한 선택과 충분히 이해한 선택은 책임을 논할 조건이 다를 수 있습니다. 경준의 제안은 개인책임을 완전히 없애기보다 설명의무와 교육 등으로 선택조건을 개선하려는 방향입니다. 정보공개가 이해를 보장하지 않고 규제가 접근기회를 줄일 수도 있어, 제도의 효과와 부작용을 함께 검토해야 합니다. 제도적 조건을 강조한다고 개인이 아무 선택도 할 수 없다는 결정론을 받아들일 필요는 없습니다. 반대로 선택할 수 있다는 사실만으로 모든 불평등한 조건을 정당화할 수도 없습니다. 경준의 탐구는 이 두 주장 사이에서 책임과 연대를 함께 묻는 시도입니다."], "follow": ["정보가 부족했다면 개인의 책임은 없나요?  정보부족이 모든 책임을 없애는 것은 아닙니다. 제공자의 설명책임과 개인이 확인할 수 있었던 범위, 제도적 보호의 적절성을 함께 살펴야 합니다."], "memory": "선택의 책임과 선택할 조건", "caution": "", "source_refs": [55], "university": "공통", "kind": "답변", "glossary": [78]}, {"id": 122, "question": "일본의 버블경제와 금리정책 탐구에서 가장 조심해야 할 설명은 무엇입니까?", "category": "학생부 확장 Ⅱ · 실무·제도·계산", "answer": ["플라자합의나 저금리 한 가지로 버블의 발생과 붕괴를 모두 설명하는 것을 조심해야 한다고 생각합니다. 엔화 강세에 대한 대응과 금융정책, 자산가격 기대가 함께 작용할 수 있기 때문입니다. 일본어Ⅰ에서 이를 조사하며 환율정책이 국내 금융과 기업의 선택으로 연결되는 과정을 살펴봤습니다.", "또 같은 정책도 시점과 다른 조건에 따라 효과가 달라질 수 있다는 점이 중요했습니다. 경기와 자산시장을 함께 보지 않으면 대응의 부작용을 놓칠 수 있습니다. 이 탐구를 통해 저는 경제 사건을 한 문장의 원인으로 외우기보다 어떤 경로로 연결됐는지 설명하려고 했습니다. 지금의 정책을 비교할 때도 당시 상황과 다른 점을 먼저 확인하겠습니다."], "evidence": ["2학년 · 일본어Ⅰ | PDF 13쪽 / 인쇄 14쪽\n2학년 일본어Ⅰ의 일본 금융정책·버블경제·장기침체 탐구가 근거입니다."], "concepts": ["1. 금리와 자산가격의 여러 경로  금리가 낮아지면 돈을 빌리는 부담이 줄고 미래수익을 현재가치로 할인할 때 적용하는 기준도 달라져 자산수요를 자극할 수 있습니다. 가상 예시로 임대수익이 같아도 요구수익률이 낮아지면 그 자산에 지불하려는 가격이 높아질 수 있습니다. 다만 기대수익과 위험, 대출규제도 영향을 주므로 낮은 금리가 언제나 버블을 만든다는 법칙은 아닙니다.", "2. 버블의 형성과 붕괴 이후  가격상승이 담보가치를 높이고 대출을 늘려 추가매수를 부르는 고리가 생길 수 있습니다. 반대로 가격이 떨어지면 부채는 남아 대출회수와 지출축소가 이어질 수 있습니다. 일본은행 연구도 금융완화뿐 아니라 금융기관 행동과 대출구조를 함께 살핍니다. 경준은 장기침체를 버블 발생의 한 사건에 모두 환원하지 않고 사후 정책대응과 구조적 조건을 나누어 설명해야 합니다. 자산가격 상승과 소비자물가 상승은 서로 다른 현상입니다. 생활물가가 안정되어 보여도 토지나 주식가격과 대출이 빠르게 늘어날 수 있습니다. 따라서 인플레이션이 낮았다는 이유만으로 금융불균형도 작았다고 판단하면 일본 사례의 중요한 쟁점을 놓칩니다."], "follow": ["그럼 플라자합의는 중요하지 않았나요?  환율과 정책환경을 바꾼 중요한 배경으로 볼 수 있지만, 이후 자산가격과 장기침체의 모든 과정을 단독으로 설명할 수는 없습니다."], "memory": "환율과 대출과 기대와 사후대응", "caution": "", "source_refs": [56, 57], "university": "공통", "kind": "답변", "glossary": [89]}, {"id": 123, "question": "CBDC와 스테이블코인의 신뢰는 어디에서 나옵니까?", "category": "학생부 확장 Ⅱ · 실무·제도·계산", "answer": ["CBDC는 Central Bank Digital Currency, 중앙은행 디지털화폐로 중앙은행의 부채라는 점이 핵심입니다. 반면 스테이블코인은 기준 자산에 가격을 안정시키려는 토큰이며, 어떤 담보와 상환 구조를 갖는지에 따라 신뢰의 근거가 다릅니다. 디지털 형태라는 공통점만으로 같은 돈이라고 볼 수는 없습니다.", "저는 발행 주체의 공적 신뢰와 민간 시스템의 투명성·프라이버시를 비교했습니다. 제도가 편리하더라도 누가 정보를 보고 문제가 생기면 누가 책임지는지가 중요하다고 생각했습니다. 그래서 기술 자체보다 운영 규칙을 함께 봤습니다. 모든 스테이블코인이 충분한 준비자산을 갖거나 항상 같은 가격을 유지한다고 가정하지는 않겠습니다."], "evidence": ["2학년 · 역량키움 프로젝트가 기재된 과목명 없는 별도 세특 단락 | PDF 13–14쪽 / 인쇄 14–15쪽\n2학년 과목명 없는 별도 세특의 역량키움 프로젝트, 신뢰기제 비교와 교내설문이 직접 근거입니다."], "concepts": ["1. 중앙은행 화폐와 민간의 상환약속  CBDC는 중앙은행의 직접적인 부채인 디지털화폐로 이해할 수 있습니다. 법정통화의 제도적 기반이 중요하지만 디지털시스템의 장애나 개인정보 문제까지 자동으로 해결되지는 않습니다. 법정통화 담보형 스테이블코인은 보통 특정 화폐가치 유지와 상환을 약속합니다. 모든 스테이블코인이 같은 담보와 구조를 쓰는 것은 아니므로 발행방식별로 구분해야 합니다.", "2. 준비자산과 유동성 위험  가상 예시로 100원을 돌려주겠다는 약속을 뒷받침할 자산이 있어도 당장 팔기 어렵거나 가격이 하락하면 동시에 몰린 상환요구를 충족하지 못할 수 있습니다. 준비금의 존재뿐 아니라 질, 보관, 공개, 법적 청구권이 중요합니다. 경준이 제안한 준비금 공개와 공론화는 이런 신뢰조건을 다루지만, 공개만으로 지급불능이나 정책충격이 완전히 사라지는 것은 아닙니다. 가치가 한 통화에 고정되어도 다른 통화로 생활하는 이용자에게는 환위험이 남습니다. 가상 예시로 달러가치가 안정된 코인을 한국 원화로 환산한 값은 원달러 환율에 따라 달라질 수 있습니다. 가격안정의 기준통화가 무엇인지 항상 함께 설명해야 합니다."], "follow": ["스테이블코인은 익명성이 보장되나요?  설계와 거래경로에 따라 다르며 거래소의 신원확인과 공개된 거래기록으로 추적될 수 있습니다. 제가 조사한 익명성에 관한 응답도 사람들이 어떻게 인식하는지를 보여주는 것이지, 모든 코인의 실제 특성을 확인한 결과는 아닙니다."], "memory": "디지털 형태보다 발행자와 상환구조", "caution": "역량키움 프로젝트가 기재된 단락에는 과목명이 따로 표시되지 않습니다. 일본어Ⅰ이나 국제 관계와 국제기구에 임의로 배정하지 않습니다.", "source_refs": [58, 59], "university": "공통", "kind": "답변", "glossary": [49, 50, 81]}, {"id": 124, "question": "환전 비용과 EPS 성장률을 함수로 분석한 방법을 설명해보세요.", "category": "학생부 확장 Ⅱ · 실무·제도·계산", "answer": ["환전에서는 고정 수수료가 있을 때 거래금액에 따른 평균 부담을 함수로 나타냈습니다. 같은 고정비용이라도 작은 금액을 바꾸는 사람에게 상대적 부담이 더 클 수 있다는 점을 보고 싶었습니다. 그래서 금액과 평균 비용의 관계, 손익분기 조건을 살폈습니다.", "주당순이익인 EPS의 성장에서는 일정한 성장률을 가정한 지수함수와 목표에 도달하는 기간을 구하는 로그를 연결했습니다. 이때 성장률의 가정이 바뀌면 결과도 달라집니다. 저는 함수가 미래를 확실하게 알려 주는 도구라기보다, 어떤 가정 아래에서 선택이 달라지는지 분명하게 보여 주는 도구라는 점을 배웠습니다."], "evidence": ["2학년 · 수학과제 탐구 | PDF 14쪽 / 인쇄 15쪽\n2학년 수학과제 탐구의 평균환전비용, 경계금액, EPS 성장과 로그·삼각함수 모델이 근거입니다."], "concepts": ["1. 정액비용과 금액당 평균비용  총비용을 고정수수료와 환전금액에 비례하는 비용의 합으로 두면, 평균비용은 비례비용률에 고정수수료를 금액으로 나눈 값을 더한 형태가 됩니다. 가상 예시로 A은행이 2천 원과 금액의 1%, B은행이 1만 원과 0.5%를 받으면 160만 원에서 총비용이 같습니다. 이는 설명용 수치이며 실제 비교한 은행의 조건이 아닙니다. 환율우대율은 원금 자체 할인율이 아닙니다.", "2. EPS 성장모형의 조건  EPS는 보통주 한 주에 해당하는 이익입니다. 일정한 자기자본이익률과 유보율을 가정하면 이익성장률을 두 값의 곱으로 근사하는 기초모형을 만들 수 있습니다. 가상 예시로 ROE 10%, 이익유보율 60%이면 성장률은 6%입니다. 그러나 주식수, 수익성, 배당과 투자효율이 바뀌면 결과도 달라집니다. 로그로 구한 목표도달 시점은 이 가정이 유지된다는 조건부 결과입니다. 목표에 도달하는 시간을 로그로 풀려면 시작값과 목표값이 양수이고 성장률 조건이 타당해야 합니다. 성장률이 0이면 더 높은 목표에 도달하지 못하고 음수이면 다른 해석이 필요합니다. 식을 계산하기 전에 가능한 상황인지 점검하는 습관이 중요합니다."], "follow": ["왜 같은 은행이 모든 금액에서 유리하지 않습니까?  정액비용과 비례비용률의 조합이 다르기 때문입니다. 소액에서는 정액비용이, 큰 금액에서는 비례비용률이 선택에 더 크게 작용할 수 있습니다."], "memory": "우대율보다 총비용이고 성장률에는 가정", "caution": "은행명, 실제 수수료, 실제 경계금액은 생기부에 없습니다. 개념해설의 숫자는 가상 예시입니다.", "source_refs": [60], "university": "공통", "kind": "답변", "glossary": [52, 53, 60]}, {"id": 125, "question": "직접 구상한 국제기구는 어떤 문제를 해결하며 어떻게 운영됩니까?", "category": "학생부 확장 Ⅱ · 실무·제도·계산", "answer": ["국제거래에 참여할 때 디지털 결제와 환율의 변화에 취약한 국가나 기업이 배제되지 않도록 돕는 협력구조를 구상했습니다. 국제 관계와 국제기구에서 공급망과 디지털무역의 불균형을 보며, 효율적인 시스템이 생겼다고 모두가 같은 기회를 얻는 것은 아니라는 점에 관심이 생겼습니다.", "그래서 디지털통화 기반 결제뿐 아니라 의결 절차와 참여의 접근성도 생각했습니다. 실제 기구를 설립한 것은 아니며, 결제를 빠르게 한다고 환율위험이 없어지는 것도 아닙니다. 저는 새로운 기술을 제안할 때 누가 운영비를 내고 손실을 부담하며 의견을 낼 수 있는지까지 함께 설계해야 한다고 배웠습니다."], "evidence": ["2학년 · 국제 관계와 국제기구 | PDF 14쪽 / 인쇄 15쪽\n2학년 국제 관계와 국제기구의 공급망·디지털무역 불균형과 국제기구 창립안 구상입니다."], "concepts": ["1. 결제의 효율성과 환율위험의 구별  결제시스템은 돈을 보내고 최종적으로 지급을 완료하는 절차를 다룹니다. 가상 예시로 송금이 즉시 완료되어도 계약일부터 지급일까지 달러가치가 바뀌었다면 환율위험이 남을 수 있습니다. 거래비용과 결제시간 감소가 환율의 가치변동 자체를 제거하는 것은 아닙니다. 경준의 제안은 결제단위와 유동성, 환위험을 누가 맡을지까지 검토할 필요가 있습니다.", "2. 국제기구의 운영을 결정하는 질문  국제기구를 설계할 때는 누가 참여하고 투표권을 갖는지, 재원을 누가 내며 규칙위반을 어떻게 처리하는지 정해야 합니다. 가상 예시로 분담금을 많이 낸 국가가 모든 결정을 하면 운영은 빠를 수 있지만 소국의 참여목적과 충돌할 수 있습니다. 경준의 기록은 의결절차와 접근성을 검토한 창립안이며 실제 기구설립이나 회원국 합의를 이끌었다는 뜻은 아닙니다. 기술이 여러 국가에서 연결되려면 각국의 법적 결제완결성과 개인정보 규칙, 금융기관 역할도 조정해야 합니다. 공동 시스템의 이름을 정하는 것만으로 이 문제가 해결되지는 않습니다. 참여국이 왜 비용을 부담하고 규칙을 따를 유인이 있는지도 설계해야 합니다."], "follow": ["디지털 결제가 환율위험을 어떻게 줄일 수 있습니까?  처리시간이 줄어 노출기간 일부를 줄일 수는 있지만 가치변동 자체는 남습니다. 위험을 줄이려면 계약통화와 정산방식, 필요하면 헤지수단을 별도로 설계해야 합니다."], "memory": "결제기술과 참여규칙을 함께 설계", "caution": "기구 명칭과 세부 의결규칙은 현재 생기부에 없으므로 이전 제안서가 확인되지 않으면 새 숫자나 규정을 실제 구상처럼 말하지 않습니다.", "source_refs": [61], "university": "공통", "kind": "답변", "glossary": [49]}, {"id": 126, "question": "무역정보 앱의 손익분기점이 월 네 명에서 스무 명으로 달라진 이유는 무엇입니까?", "category": "학생부 확장 Ⅱ · 실무·제도·계산", "answer": ["처음에는 직접 지출하는 비용을 중심으로 봤지만, 이후 유지관리에 쓰는 제 시간도 비용에 넣었기 때문입니다. 실용 경제에서 무역정보 앱의 손익분기 이용자를 월 네 명으로 계산했다가 시간의 기회비용을 포함하니 스무 명으로 늘었습니다. 같은 서비스도 비용의 범위를 어떻게 정하는지에 따라 판단이 달라졌습니다.", "기업 인터뷰를 다시 보니 정보가 필요한 기업이 반드시 비용을 지불할 여력이 있는 것도 아니었습니다. 저는 제가 만든 기능에 대한 애착과 실제 수요를 구분해야겠다고 느꼈습니다. 이 숫자는 고객을 확보한 실적이 아니라 모형의 계산값입니다. 이후에는 기능을 더 늘리기 전에 지불의사를 확인하는 계획을 세웠습니다."], "evidence": ["3학년 · 실용 경제 | PDF 17쪽 / 인쇄 18쪽\n3학년 실용 경제의 월 4명→20명 재계산과 유지관리 시간, 유효수요 검토가 직접 근거입니다."], "concepts": ["1. 회계비용과 기회비용  돈으로 지출한 비용 외에 자신의 시간과 자원을 다른 일에 쓸 기회를 포기한 가치도 경제적 비용입니다. 가상 예시로 월 고정지출이 20만 원이고 이용자당 남는 금액이 5만 원이면 네 명이 필요합니다. 여기에 시간의 가치 80만 원을 더하면 스무 명이 됩니다. 이 숫자는 구조를 설명하는 예시이며 원 보고서의 가격과 시간단가가 아닙니다.", "2. 손익분기와 지불 가능한 수요  단순모형에서 손익분기 수량은 고정비용을 이용자당 공헌이익으로 나누어 구합니다. 공헌이익은 매출에서 이용자가 추가될 때 늘어나는 변동비용을 뺀 값입니다. 이 값이 양수이고 비용구조가 일정하다는 조건이 필요합니다. 서비스가 필요하다는 응답과 실제 결제는 다르므로, 경준의 후속과제는 시장의 크기를 주장하기보다 부담 가능한 가격과 반복사용의 가치를 확인하는 일입니다. 이미 지출해 되돌릴 수 없는 비용은 매몰비용이지만, 만든 코드와 자료가 앞으로 다른 용도로 가치가 있다면 그 부분은 남아 있는 자산입니다. 계속 운영할지 판단할 때는 과거의 노력 자체와 미래에 재사용할 수 있는 가치를 분리해 보아야 합니다."], "follow": ["이미 시간을 많이 썼으니 계속해야 하지 않나요?  돌이킬 수 없는 과거비용만으로 계속할 이유는 없습니다. 앞으로 얻을 편익과 추가비용을 비교하되 이미 만든 코드와 자료가 재사용될 수 있는 가치는 따로 보겠습니다."], "memory": "내 시간도 비용이고 필요도 결제는 아니다", "caution": "4명과 20명은 모형의 손익분기값이며 실제 판매실적이 아닙니다. 별도의 면접보고서 판매사업과 섞지 않습니다.", "source_refs": [], "university": "공통", "kind": "답변", "glossary": [54, 60, 61, 62]}, {"id": 127, "question": "환율 모형에 달러지수를 추가한 뒤 무엇이 달라졌고 VIF는 왜 확인했습니까?", "category": "학생부 확장 Ⅱ · 실무·제도·계산", "answer": ["설명력은 약 54%에서 88%로 높아졌고 금리차 계수의 크기는 절반 정도로 줄었습니다. 저는 후자의 변화가 특히 중요했습니다. 처음 금리차에 연결했던 설명의 일부가 글로벌 달러 흐름과 겹쳐 있었을 가능성을 생각하게 됐기 때문입니다.", "VIF는 Variance Inflation Factor, 분산팽창계수로 설명변수 사이의 선형 중복을 살피는 지표입니다. 5 미만인지 확인했지만 이것으로 내생성이나 시계열 문제가 모두 해결되는 것은 아닙니다. 저는 이 활동에서 한 숫자를 잘 얻는 것보다 각 지표가 어떤 질문에 답하는지 구분하는 것이 중요하다고 배웠습니다. 더 정교한 진단은 대학에서 배워 이어 가고 싶습니다."], "evidence": ["3학년 · 경제 수학 | PDF 18쪽 / 인쇄 19쪽\n경제 수학의 설명력·계수·VIF·126원 격차 약 8할 분해가 직접 기록된 근거입니다.", "3학년 · 국제 정치 | PDF 19쪽 / 인쇄 20쪽\n국제 정치에서 고유 잔차와 외교·제도 변수의 관계를 후속으로 검토했습니다."], "concepts": ["1. VIF가 알려주는 것  VIF는 다른 설명변수와의 선형적 연관 때문에 특정 계수 추정의 분산이 얼마나 커지는지 나타냅니다. 해당 설명변수를 나머지 설명변수로 회귀한 R²를 1에서 뺀 값의 역수입니다. 가상 예시로 그 R²가 0.8이면 VIF는 5입니다. 이는 공선성 점검의 수치이지 모든 회귀가정이 충족됐다는 점수는 아닙니다. 5라는 기준도 상황에 따라 해석해야 합니다.", "2. 격차의 설명과 원인의 분리  모형에 변수를 넣어 예측값이 실제값에 가까워졌다면 특정 표본의 차이를 통계적으로 더 설명한 것입니다. 그러나 달러지수 자체도 여러 경제충격을 반영하므로 그것이 모든 원인의 이름은 아닙니다. 경준의 126원과 약 8할은 모형·기간·변수정의에 의존합니다. 나머지 잔차에도 측정오차와 누락요인이 섞이므로 이를 순수한 한국 고유위험이나 정치비용으로 확정할 수 없습니다. 여러 설명변수의 정보가 겹치면 각각의 효과를 나누기 어려워 계수가 불안정해질 수 있지만 전체 예측은 비교적 잘 맞을 수도 있습니다. 계수해석이 목적일 때와 예측이 목적일 때 공선성의 의미가 달라질 수 있다는 점도 함께 이해하면 좋습니다."], "follow": ["VIF가 낮으면 계수가 인과효과인가요?  아닙니다. VIF는 설명변수끼리의 선형 중복을 살피며 오차항과의 관계나 역인과 문제를 해결해주지 않습니다."], "memory": "R²는 적합도 VIF는 변수의 중복", "caution": "126원 격차의 약 80%를 실제 원인의 정확한 분해로 표현하지 않습니다. 모형을 바꿨을 때의 표본 내 설명입니다.", "source_refs": [21], "university": "공통", "kind": "답변", "glossary": [35, 37, 39, 100]}, {"id": 128, "question": "탄소비용을 판매가격에 전부 반영하면 기업에 유리하지 않습니까?", "category": "학생부 확장 Ⅱ · 실무·제도·계산", "answer": ["가격을 올려 단위당 부담을 줄여도 판매량이 더 크게 줄면 전체 이윤은 낮아질 수 있습니다. 저는 심화 수학Ⅰ에서 탄소비용을 이윤함수에 반영하고 미분을 이용해 적절한 생산량과 가격 전가를 살펴봤습니다. 비용을 전부 고객에게 넘기는 것이 항상 가장 유리한 선택은 아니었습니다.", "이때 중요한 것은 수요가 가격에 얼마나 민감한지와 어떤 비용을 가정했는지였습니다. 저는 식을 통해 기업의 선택을 구체적으로 비교할 수 있다는 점이 흥미로웠습니다. 다만 실제 기업의 최적 전가율을 확정한 것은 아닙니다. 모형의 조건을 밝히고, 계약과 경쟁자의 반응처럼 추가로 볼 부분을 함께 설명하겠습니다."], "evidence": ["3학년 · 심화 수학Ⅰ | PDF 18쪽 / 인쇄 19쪽\n3학년 심화 수학Ⅰ의 이윤함수 미분, 전가율과 수요·비용조건, 완전전가의 물량감소 분석입니다."], "concepts": ["1. 단위당 이익과 전체 이윤  전체 이윤은 한 개당 남는 금액과 판매량을 함께 봐야 합니다. 가상 예시로 원래 가격은 20원, 단위비용은 10원이고 고정비용은 없다고 두겠습니다. 단위비용이 12원으로 오를 때 가격을 22원으로 올려 80개를 팔면 이윤은 800원입니다. 가격을 21원으로 덜 올려 90개를 팔 수 있다면 이윤은 810원입니다. 비용을 전부 가격에 반영하지 않아도 더 유리할 수 있습니다. 이 예시는 가격이 1원 오를 때 수요가 10개 줄어드는 단순조건입니다.", "2. 한계수입과 한계비용의 일치 조건  한계수입은 한 단위를 더 팔 때 수입이 늘어나는 정도이고 한계비용은 그때 비용이 늘어나는 정도입니다. 내부 최적점에서는 둘이 같아지는 지점을 찾지만, 최대인지 확인하려면 곡선의 형태와 경계조건도 봐야 합니다. 선형수요와 일정한 한계비용 같은 가정에서 얻은 전가결과는 다른 시장구조에서 달라집니다. 경준의 분석은 비용변화에 대한 기업선택을 조건부로 설명한 것입니다. 판매량을 줄여 한계수입과 비용을 맞추더라도 고정비용까지 회수되는지는 별도 확인이 필요합니다. 단기에는 변동비용을 감당하며 생산을 계속할 수 있지만 장기에는 투자와 퇴출의 선택도 생깁니다. 경준의 함수모형이 다루는 기간과 비용범위를 먼저 밝혀야 합니다."], "follow": ["왜 한계수입이 가격보다 작아질 수 있습니까?  더 많이 팔기 위해 기존 판매분까지 같은 가격으로 낮춰야 하는 경우, 추가 판매의 수입에서 기존 물량의 가격하락분을 함께 고려해야 하기 때문입니다."], "memory": "한 개의 마진보다 전체 이윤", "caution": "", "source_refs": [62, 54], "university": "공통", "kind": "답변", "glossary": [25, 26, 55, 59, 60, 97]}, {"id": 129, "question": "관세 부담은 큰데 지니계수는 거의 변하지 않았다는 결과를 어떻게 해석했습니까?", "category": "학생부 확장 Ⅲ · 규범·언어·학교생활", "answer": ["두 지표가 서로 다른 질문에 답하고 있기 때문이라고 해석했습니다. 제 탐구의 부담 지표에서는 최하위층이 최상위층보다 약 2.8배 큰 부담을 보였지만 지니계수 변화는 0.0022였습니다. 전체 분포를 요약한 수치가 작게 움직인다고 특정 집단의 부담까지 작다고 볼 수는 없었습니다.", "그래서 소득별 부담과 정책에 의견을 낼 조건을 함께 보는 평가표를 구상했습니다. 저는 지표를 버리기보다 무엇을 보여 주고 무엇을 놓치는지 설명하는 것이 중요하다고 생각합니다. 이 수치들은 제가 사용한 자료와 가정 안의 결과입니다. 앞으로도 정책을 평가할 때 평균이나 한 계수 뒤에 가려지는 차이를 함께 살피고 싶습니다."], "evidence": ["3학년 · 사회문제 탐구 | PDF 18–19쪽 / 인쇄 19–20쪽\n3학년 사회문제 탐구에 2.8배의 부담비율, 지니계수 변화 0.0022, 소득·발언권 평가표와 인과해석 수정이 기록되어 있습니다.", "2학년 · 수학Ⅱ | PDF 11쪽 / 인쇄 12쪽\n2학년 수학Ⅱ의 로렌츠곡선·지니계수 탐구가 연결됩니다."], "concepts": ["1. 역진성과 전체 불평등은 다른 질문  역진성은 소득이 낮을수록 소득 대비 부담비율이 커지는 성질입니다. 가상의 예로 소득 100에서 부담 3을 내면 3%이고, 소득 1000에서 10을 내면 1%입니다. 부유한 쪽이 더 많은 금액을 내더라도 상대적 부담은 저소득층이 큽니다. 지니계수는 전체 소득분포의 불평등을 한 값으로 요약하므로 세금의 규모, 대상집단과 계산방식에 따라 변화가 작게 나타날 수 있습니다. 두 지표는 서로 대체하는 답이 아니라 함께 해석해야 하는 정보입니다.", "2. 지표의 작은 변화가 말해주지 않는 것  상대적 소득불평등을 보는 지니계수는 모든 사람의 소득이 같은 비율로 줄면 그대로일 수 있지만, 그 상황에서도 생활에 쓸 수 있는 소득은 줄어듭니다. 따라서 계수의 변화만으로 삶의 손실이 없다고 결론낼 수 없습니다. 경준의 0.0022는 특정 모형에서 계산한 계수의 변화이지 0.0022%나 확정된 국가 전체 실측치가 아닙니다. 소득계층별 부담률, 소비구성, 발언권 지표를 함께 보되 각 지표의 정의와 측정한계를 따로 밝혀야 합니다."], "follow": ["그러면 지니계수를 쓰지 않아도 됩니까?  전체 분포를 비교하는 데에는 여전히 유용합니다. 다만 특정 정책이 어느 집단에 부담을 주는지 보려면 집단별 부담률 같은 보완지표가 필요합니다.", "발언권이 약해서 관세가 높다고 결론냈습니까?  그렇게 확정하지 않았습니다. 관세산정식에 발언권 변수가 없다는 점을 확인하고 무역구조가 두 변수에 영향을 줄 가능성을 고려해 해석을 수정했습니다."], "memory": "부담률과 분포지표 구분 → 보완지표 → 인과 신중", "caution": "2.8배와 0.0022는 탐구의 자료와 가정에 의존하는 값입니다. 최신 국가통계나 모든 관세의 일반효과로 제시하지 않습니다. 2.8배의 정확한 분모와 부담 지표의 계산조건은 원보고서에서 확인합니다.", "source_refs": [], "university": "공통", "kind": "답변", "glossary": [47, 64]}, {"id": 130, "question": "환율정책을 현실주의와 구성주의로 함께 분석한 이유는 무엇입니까?", "category": "학생부 확장 Ⅲ · 규범·언어·학교생활", "answer": ["국가 사이의 힘과 정책을 해석하는 말이 서로 다른 측면을 보여 준다고 생각했기 때문입니다. 현실주의에서는 누가 기준을 요구하고 비용을 부과할 수 있는지 살폈고, 구성주의에서는 같은 개입도 어떤 이름으로 불리느냐에 따라 정당성의 인식이 달라질 수 있다는 점을 봤습니다.", "환율보고서와 실제 외환거래 자료를 함께 보면서, 이름만 비교해서도 안 되고 숫자만 봐서도 놓치는 부분이 있다고 느꼈습니다. 다만 환율의 잔차를 곧바로 정치적 압력의 크기로 해석하지는 않겠습니다. 저는 경제적 효과와 제도적 설명을 교차 확인해 불필요한 불확실성을 줄이는 방향에 관심이 있습니다."], "evidence": ["3학년 · 국제 정치 | PDF 19쪽 / 인쇄 20쪽\n3학년 국제 정치에서 현실주의·구성주의, 명명과 낙인, 고유 변동 폭 축소의 외교목표를 검토했습니다.", "3학년 · 동아리활동 글로브 | PDF 4쪽 / 인쇄 5쪽\n3학년 동아리에서 환율보고서의 관찰대상국 기준과 정책자율성을 분석했습니다.", "3학년 · 경제 | PDF 16–17쪽 / 인쇄 17–18쪽\n3학년 경제에서 외환당국 순거래와 외환안전망의 제약을 검토했습니다."], "concepts": ["1. 현실주의와 구성주의의 서로 다른 초점  현실주의는 국가의 안보와 이익, 힘의 분포와 제약에 주목합니다. 구성주의는 국가가 이익과 위협을 이해하는 방식이 규범·정체성·상호인식 속에서 형성되는 점에 주목합니다. 예를 들어 외환개입의 압력을 분석할 때 현실주의는 상대에게 요구를 관철할 수 있는 힘을, 구성주의는 특정 행동을 조작이나 안정화로 부르는 의미를 살피게 합니다. 두 관점은 무엇이든 설명하는 만능 정답이 아니라 다른 질문을 제시하는 분석틀이며, 실제 정책의 효과는 별도의 자료로 확인해야 합니다.", "2. 명명과 잔차를 해석하는 한계  정책의 이름은 정당성 판단에 영향을 줄 수 있지만 이름이 다르다는 사실만으로 같은 행동에 이중기준이 적용됐다고 증명되지는 않습니다. 개입의 방향·규모·목적과 경제상황도 비교해야 합니다. 회귀의 잔차 역시 모형이 설명하지 못한 부분이지 정치적 위험만 모아둔 수치가 아닙니다. 또한 관찰대상국과 환율조작국은 같은 분류가 아닙니다. 경준의 탐구는 경제자료와 정치적 해석을 연결하되 각각의 증거가 설명할 수 있는 범위를 구분해야 완성됩니다."], "follow": ["원화가 약해진 원인은 결국 미국의 압력입니까?  그렇게 단정할 수 없습니다. 환율에는 글로벌 달러 흐름과 자금 이동 등 여러 요인이 작용합니다. 정치적 압력의 영향을 보려면 다른 요인을 구분할 수 있는 추가 자료와 분석이 필요합니다."], "memory": "힘의 관계 + 정책의 이름 → 경제자료와 교차확인", "caution": "생기부의 과거 보고서 수치와 현재 제도상 지위를 섞지 않습니다. 관찰대상국은 환율조작국과 다릅니다.", "source_refs": [], "university": "공통", "kind": "답변", "glossary": []}, {"id": 131, "question": "헌법적 AI의 규범 공백과 점유율 가중 채택률을 어떻게 설명하겠습니까?", "category": "학생부 확장 Ⅲ · 규범·언어·학교생활", "answer": ["기업의 AI 원칙이 널리 채택되면 법이 아니어도 시장의 기준처럼 작동할 수 있다는 질문에서 출발했습니다. 생기부 탐구에서는 이를 규범의 사각지대라는 가설로 설명하고, 정부정책 중심의 지표가 민간의 채택을 얼마나 담는지 살폈습니다. 법적 분류와 실제 영향력을 나눠 보려는 시도였습니다.", "그래서 기업 수만 세기보다 시장점유율을 반영한 채택률을 제안했습니다. 다만 이것은 제가 구상한 보완지표이며 공식 WTO 지표가 아닙니다. 면접을 준비하며 비정부 표준화기관 관련 규정도 확인했기 때문에, 민간이라는 이유만으로 적용 밖이라고 단정하는 설명은 더 정교하게 고치려 합니다. 제 가설도 새로운 근거 앞에서 수정할 수 있어야 한다고 생각합니다."], "evidence": ["3학년 · 과목명 없이 이어지는 추가 세특 문단 | PDF 17–18쪽 / 인쇄 18–19쪽\n3학년 과목명 없는 추가 세특에 헌법적 AI, TBT 부속서1, WTO AI 정책지표와 점유율 가중 채택률 제안이 기록되어 있습니다."], "concepts": ["1. 헌법적 AI가 의미하는 학습 방식  헌법적 AI는 국가의 헌법을 그대로 적용한다는 뜻이 아니라 작성된 원칙을 바탕으로 모델의 응답을 비판·수정하고 평가하도록 학습하는 접근입니다. Anthropic의 원 연구는 수정된 응답을 활용하는 지도학습과 AI의 비교평가를 활용하는 강화학습을 설명합니다. 원칙을 사용한다고 내용의 법적 정당성이나 사회적 대표성이 자동으로 보장되는 것은 아닙니다. 경준은 이 원칙의 채택이 다른 기업의 선택조건에 미치는 영향에 질문을 확장했습니다.", "2. 법적 정의와 사실상 표준의 구분  TBT 부속서1의 표준은 인정된 기관의 승인 등 정의요건을 따지며, 협정은 비정부 표준화기구에 관한 회원국의 의무도 다룹니다. 따라서 민간 원칙이면 언제나 적용범위 밖이라고 단정할 수 없습니다. 상품·서비스의 범위와 관련 조항을 검토해야 합니다. 법적 표준 여부와 별개로 많은 기업이 따르며 거래조건이 되는 현상은 경제적 영향으로 분석할 수 있습니다.", "3. 점유율 가중 채택률의 계산 예시  기업별 시장점유율에 채택 여부를 곱해 더하는 방식으로 생각할 수 있습니다. 가상의 시장에서 점유율 60%인 기업만 채택하고 40% 기업은 채택하지 않았다면 가중 채택률은 60%입니다. 기업 수로만 보면 절반이라는 결과와 다릅니다. 다만 시장의 경계, 부분채택의 기준, 다중 이용과 비용전가까지는 이 수치 하나로 알 수 없습니다. 이는 제안한 보완지표이며 WTO의 공식 지표가 아닙니다."], "follow": ["규범 공백이 있다고 확정한 것입니까?  적용 여부를 확정한 것은 아닙니다. 기존의 정의와 측정이 민간 원칙의 영향을 얼마나 포착하는지 질문한 것이고, 관련 조항과 실제 채택조건을 추가로 검토해야 합니다."], "memory": "원칙 학습 → 법적 지위와 경제효과 → 가중 채택", "caution": "추가 세특 문단의 정확한 과목명은 원문에 표시되지 않습니다. 임의로 특정 과목에 배정하지 않습니다.", "source_refs": [14, 63, 64, 79], "university": "공통", "kind": "답변", "glossary": [7, 8, 17, 20, 27], "note": "원기록의 탐구 가설과 이번 면접 대비에서 보충한 규범 해설을 구분합니다. DS512·TBT 관련 보충 학습을 당시 모두 수행했다고 말하지 않습니다."}, {"id": 132, "question": "사다리 걷어차기를 읽은 뒤 AI 규제에 대한 대안을 어떻게 수정했습니까?", "category": "학생부 확장 Ⅲ · 규범·언어·학교생활", "answer": ["처음에는 국제표준에 맞추는 것이 중요한 대응이라고 생각했습니다. 그런데 『사다리 걷어차기』를 읽으며 공통 규칙이 있다는 사실과 그 규칙을 만드는 과정이나 준수할 능력이 공정한지는 다른 질문이라는 생각이 들었습니다.", "그래서 이미 정해진 기준을 따르는 것뿐 아니라 규칙을 만드는 초기부터 참여할 기회가 필요하다고 봤습니다. 대응 비용이 큰 기업에는 어떤 비용지원과 이행유예가 필요한지도 검토했습니다. 저는 안전을 위한 규제를 없애자는 것이 아니라 그 목적을 달성할 현실적인 조건을 만들고 싶습니다. 처음 제시한 대안의 전제를 다시 살펴봤다는 점이 이 활동의 의미입니다."], "evidence": ["3학년 · 화법과 작문 | PDF 16쪽 / 인쇄 17쪽\n3학년 화법과 작문에서 국제표준 연계 대안의 전제를 검토하고 규칙형성 초기 참여, 비용지원과 이행유예로 수정했습니다."], "concepts": ["1. 규칙의 공통성과 참여의 공정성  여러 나라가 같은 규칙을 사용하면 서로 다른 기준에 대응하는 비용을 줄일 수 있습니다. 그러나 공통 규칙이라는 형식만으로 모든 이해관계자가 동등하게 의견을 냈거나 비용을 감당할 수 있다는 뜻은 아닙니다. 사다리 걷어차기의 문제의식은 발전경로와 정책기회를 역사적으로 비교하도록 이끕니다. 경준은 이를 AI 규제에 적용해 기존 기준을 따르는 비용뿐 아니라 기준을 만드는 과정의 참여를 질문했습니다. 모든 국제표준이 부당하다는 결론으로 단순화해서는 안 됩니다.", "2. 같은 의무가 다른 부담이 되는 이유  규제준수에 고정비용이 들면 규모가 작은 기업은 제품 하나에 배분되는 부담이 더 클 수 있습니다. 가상으로 같은 검사비 100을 판매량 10에 나누면 단위당 10이지만 판매량 100에 나누면 1입니다. 비용지원이나 이행유예는 이런 대응능력 차이를 완화할 수 있으나 안전목표를 계속 미루거나 특정 기업만 특혜를 받는 부작용도 살펴야 합니다. 지원대상과 기간, 준수할 핵심기준을 분명히 해야 한다는 점이 중요하며, 이 탐구의 대안은 학생의 정책 제안입니다."], "follow": ["규모가 작으면 규제를 덜 지켜도 된다는 뜻입니까?  핵심 안전기준을 없애자는 뜻은 아닙니다. 기준을 충족할 역량을 갖추도록 비용과 시간을 지원하되, 어떤 의무와 위험에 지원이 필요한지 구체적으로 구분해야 한다고 생각합니다."], "memory": "표준을 따르기 → 형성에 참여하기 → 대응능력 보완", "caution": "규제의 역외 적용이 언제나 부당하거나 WTO 위반이라는 주장을 하지 않습니다. 원문의 표현은 이행 유예입니다.", "source_refs": [], "university": "공통", "kind": "답변", "glossary": []}, {"id": 133, "question": "무역 담론에서 은유 75건을 분류한 방법과 한계는 무엇입니까?", "category": "학생부 확장 Ⅲ · 규범·언어·학교생활", "answer": ["미국 기사와 정부 문서 14건에서 무역을 다른 대상에 빗댄 표현 75건을 골라 분류했습니다. 여기서 코딩은 프로그램을 만든다는 뜻이 아니라 기준에 따라 표현을 범주에 넣는 작업입니다. 제 자료에서는 전쟁 은유가 56%였고, 정부 문서를 설명하기 위해 기업 장부라는 범주도 만들었습니다.", "다만 무엇을 은유로 보고 어느 범주에 넣을지는 해석이 개입합니다. 그래서 발표에서 청중도 분류해 보게 하며 의견이 달라지는 지점을 살폈습니다. 저는 이 활동을 통해 말이 내용을 전달할 뿐 아니라 어떤 전제를 강조한다는 점을 배웠습니다. 이 비율은 수집한 표현의 특징이지 미국 언론 전체의 비율은 아닙니다."], "evidence": ["3학년 · 영어 독해와 작문 | PDF 16쪽 / 인쇄 17쪽\n3학년 영어 독해와 작문에 14개 문서·75개 은유·전쟁 은유 56%, 기업 장부 범주와 청중 분류가 명시됩니다."], "concepts": ["1. 은유가 논증에 관여하는 방식  은유는 어떤 대상을 다른 익숙한 대상에 빗대 이해하는 표현입니다. 무역을 전쟁으로 말하면 승패와 적의 행동이 중요해 보이고, 기업 장부로 말하면 수출과 수입을 수익과 손실처럼 보기 쉽습니다. 이런 표현은 복잡한 문제를 이해하기 쉽게 하지만 일부 관계를 강조하고 다른 관계를 가릴 수 있습니다. 경준은 단어의 장식적 효과보다 그 표현이 전제로 삼는 경제관점을 살폈습니다. 표현의 효과를 해석하는 것과 청중의 태도변화를 실제로 측정하는 것은 별개입니다.", "2. 내용분석의 분류와 재현성  내용분석의 코딩은 문장이나 표현을 명확한 범주에 배정하는 작업입니다. 다른 사람도 비슷하게 분류할 수 있도록 포함기준과 경계사례를 정해야 합니다. 하나의 문서에 은유가 여러 개 들어가므로 14개 문서와 75개 표현은 다른 분석단위입니다. 56%는 이 표현표본 안의 비율이며 문서를 어떻게 골랐는지에 따라 달라질 수 있습니다. 청중 분류는 해석차이를 살피는 보완이지만, 독립된 코더들의 정식 일치도 검증을 이미 완료했다는 뜻은 아닙니다."], "follow": ["청중도 같은 범주로 분류했다면 객관적인 것입니까?  해석의 일치 가능성을 살필 수는 있지만 그것만으로 완전히 객관적이라고 하기는 어렵습니다. 분류기준과 경계사례를 공개하고 독립적인 분류 결과를 비교하는 절차가 더 필요합니다.", "은유를 쓰지 않아야 한다는 결론입니까?  은유를 없애자는 뜻은 아닙니다. 설명을 쉽게 하는 장점이 있지만 어떤 전제를 강조하는지 알고 쓰고 읽어야 한다는 뜻입니다."], "memory": "14개 문서 → 75개 표현 → 분류의 기준과 한계", "caution": "전쟁 은유 56%를 미국 전체 언론의 비중으로 확대하지 않습니다. 코딩은 내용분석의 분류입니다.", "source_refs": [], "university": "공통", "kind": "답변", "glossary": []}, {"id": 134, "question": "AI가 시민불복종의 정당성을 판정하기 어렵다고 본 이유는 무엇입니까?", "category": "학생부 확장 Ⅲ · 규범·언어·학교생활", "answer": ["사실을 확인하는 것과 어떤 가치를 우선할지 정하는 것은 다른 일이기 때문입니다. TAC의 의약품 접근권 운동을 살피며 처음에는 이익과 피해를 비교하면 판단할 수 있을지 생각했습니다. 그런데 생명과 재산권, 장기적 영향을 어떤 비중으로 볼지부터 가치판단이 필요했습니다.", "제 도구에 가치의 무게를 계산하는 기능을 넣으려던 구상도 이 문제 때문에 멈췄습니다. 숫자로 만들었다고 그 기준이 객관적으로 정당해지는 것은 아니었습니다. 저는 AI가 사실과 여러 판단 기준을 비교하는 데 도움을 줄 수 있다고 봅니다. 다만 어떤 기준을 채택하고 그 결과에 책임질지는 사람과 제도의 문제로 남겨야 한다고 생각합니다."], "evidence": ["3학년 · 생활과 윤리 | PDF 17쪽 / 인쇄 18쪽\n3학년 생활과 윤리에 TAC, 싱어·흄·롤스·요나스, 형량 계산 기능 중단과 책임귀속의 구분이 기록됩니다.", "3학년 · 자율활동 | PDF 4쪽 / 인쇄 5쪽\n근거를 검색하고 한계를 공개하는 도구 활동과 연결됩니다."], "concepts": ["1. 사실과 가치판단의 구분  어떤 조치로 몇 명이 도움을 받는지는 사실에 관한 질문이고, 그 이익이 특정 권리의 제한을 정당화하는지는 가치판단을 포함하는 질문입니다. 흄의 사실·가치 구분은 사실만 나열한 상태에서 당위의 결론이 자동으로 나오지 않는다는 점을 생각하게 합니다. 피해와 이익을 계산할 때도 무엇을 포함하고 얼마나 중요하게 볼지 규범적 전제가 필요합니다. 경준은 도구의 계산결과가 객관적으로 보이는 것과 그 기준이 정당한 것을 구분했습니다.", "2. 시민불복종과 윤리적 기준  롤스가 다루는 시민불복종은 법이나 정책을 바꾸려는 공개적이고 비폭력적인 법 위반으로 설명됩니다. 모든 시위나 소송이 시민불복종인 것은 아닙니다. TAC 활동에도 다양한 저항·법적 대응이 있으므로 운동 전체를 단일한 법 위반으로 단순화하지 않습니다. 결과를 중시하는 공리주의와 절차·권리를 살피는 관점, 장기적 책임은 서로 다른 검토 질문을 제공합니다.", "3. AI가 도울 수 있는 판단의 범위  AI는 어떤 사실이 근거인지 찾고 서로 다른 윤리기준을 적용했을 때 쟁점이 어떻게 달라지는지 정리할 수 있습니다. 그러나 사람이 정한 가중치를 계산한 결과는 그 기준에 따른 결과일 뿐 누구나 받아들일 도덕적 정답이 아닙니다. UNESCO의 AI 윤리 권고도 최종적인 인간의 책임을 강조합니다. 기술적 추적가능성과 윤리적 책임을 함께 갖춰야 한다는 방향으로 자신의 활동을 설명합니다."], "follow": ["그럼 윤리문제에서 AI는 쓸모가 없습니까?  관련 사실과 원문 근거를 정리하고 서로 다른 기준의 쟁점을 비교하는 데 활용할 수 있습니다. 다만 어떤 기준을 채택할지와 그 결과에 누가 책임질지는 사람의 판단으로 남습니다."], "memory": "사실 확인 → 가치기준 선택 → 사람의 책임", "caution": "형량은 여기서 서로 다른 가치와 이익을 저울질한다는 의미로 설명합니다. 법원의 형벌 기간을 자동으로 계산했다는 뜻이 아닙니다.", "source_refs": [33], "university": "공통", "kind": "답변", "glossary": [73, 79]}, {"id": 135, "question": "논증에 오류가 있다는 것과 결론이 틀렸다는 것은 어떻게 다릅니까?", "category": "학생부 확장 Ⅲ · 규범·언어·학교생활", "answer": ["논증에 오류가 있다는 것은 그 근거만으로 결론이 충분히 뒷받침되지 않는다는 뜻이지, 결론이 반드시 거짓이라는 뜻은 아닙니다. 저는 통상 관련 주장의 오류를 분류하면서 오류 이름을 찾는 것만으로 정책의 옳고 그름을 판단할 수 없다는 한계를 느꼈습니다.", "그래서 전제와 결론을 논리맵으로 정리하고 숨은 전제를 확인했습니다. 제 주장도 하나의 연결에만 기대기보다 여러 근거와 반론을 검토하는 방향으로 고쳤습니다. 특히 무역의 전체 이익과 전환 과정에서 손해를 보는 사람의 비용은 함께 봐야 했습니다. 상대를 반박하는 능력보다 제 결론을 제대로 뒷받침하는 능력을 키우고 싶었습니다."], "evidence": ["3학년 · 논리학 | PDF 17쪽 / 인쇄 18쪽\n3학년 논리학에서 비형식 오류 분석의 한계, 흄의 논리맵, 연쇄형에서 수렴형 논증으로의 수정과 전환비용 문제를 검토했습니다."], "concepts": ["1. 논증의 타당성과 결론의 참거짓  논증은 전제가 결론을 뒷받침하는 구조입니다. 예를 들어 비가 오면 땅이 젖는다는 말과 땅이 젖었다는 관찰만으로 비가 왔다고 확정하면, 물을 뿌렸을 가능성을 놓친 후건긍정의 오류가 됩니다. 그래도 실제로 그날 비가 왔을 가능성은 남습니다. 추론이 잘못됐다는 사실과 결론이 거짓이라는 사실이 다른 이유입니다. 정책주장에서도 오류를 찾았다는 이유만으로 반대 정책이 옳다고 결론내리면 다시 논리적 비약이 생길 수 있습니다.", "2. 연쇄형과 수렴형 논증  연쇄형 논증은 앞선 결론이 다음 단계의 근거가 되어 이어지는 구조입니다. 중요한 연결고리가 충분하지 않으면 뒤의 결론도 약해질 수 있습니다. 수렴형은 서로 다른 근거가 각각 같은 결론을 뒷받침하는 구조로, 근거들이 실제로 독립적이고 관련이 있는지 살펴야 합니다. 가령 정책대안을 검토할 때 경제효과와 집행가능성, 권리침해를 각각 검토할 수 있습니다. 여러 이유를 나열했다고 자동으로 논증이 강해지는 것은 아니며, 각 근거의 사실성과 숨은 전제를 확인해야 합니다."], "follow": ["자유무역이 이익이면 산업 전환비용은 무시해도 됩니까?  전체 이익이 생긴다는 설명과 영향을 받는 사람의 손실을 어떻게 다룰지는 다른 질문입니다. 전환을 돕는 교육이나 지원제도의 비용과 효과까지 함께 검토해야 한다고 생각합니다."], "memory": "오류 발견 ≠ 결론의 거짓 → 숨은 전제 → 근거 재구성", "caution": "생기부에 있는 3단계 입증 의무 프레임워크의 정확한 단계명은 제공된 기록만으로 확인되지 않습니다. 본인의 원보고서와 일치하는 내용으로만 확장해 설명합니다.", "source_refs": [80], "university": "공통", "kind": "답변", "glossary": [94, 95, 96]}, {"id": 136, "question": "통상 웹사이트 광고에서 SWOT STP BCG를 어떻게 활용하고 비판했습니까?", "category": "학생부 확장 Ⅲ · 규범·언어·학교생활", "answer": ["SWOT로 서비스의 내부 강점·약점과 외부 기회·위협을 나누고, STP로 어떤 이용자에게 어떤 가치를 전달할지 정리했습니다. 제가 만든 통상정보 웹사이트를 광고하는 과제에서 조장을 맡아 분석과 역할분배, 발표를 진행했습니다. 기능을 나열하기보다 이용자의 필요에 맞는 메시지를 만들고 싶었습니다.", "BCG 모형을 활용할 때는 현재 위치를 분류해도 어떻게 다른 위치로 이동할지는 충분히 설명되지 않는다는 의문이 생겼습니다. 그래서 『포지셔닝』을 읽고 후속 탐구로 확장했습니다. 저는 분석틀이 생각을 정리해 주지만 전략의 정답까지 주는 것은 아니라고 배웠습니다. 표에 넣은 뒤에는 그 판단을 뒷받침할 자료와 행동이 필요했습니다."], "evidence": ["3학년 · 마케팅과 광고 | PDF 19쪽 / 인쇄 20쪽\n3학년 마케팅과 광고에서 통상자문 웹사이트 광고, SWOT·STP·BCG, 조장 역할과 BCG 비판적 후속 보고서가 기록됩니다."], "concepts": ["1. SWOT와 STP의 역할  SWOT는 내부의 강점·약점과 외부의 기회·위협을 나누어 상황을 정리합니다. 예를 들어 근거제시 기능은 내부의 특성이고 무료 공공정보의 존재는 외부환경입니다. STP는 시장을 구분하고 목표집단을 고른 뒤 그 집단이 서비스를 어떤 가치로 이해할지 정하는 과정입니다. 기능을 모두 광고하기보다 실제 이용자의 문제에 맞춰 메시지를 만드는 데 활용할 수 있습니다. 제안된 이용자상이 실제 고객이라는 뜻은 아니며 수요 검증이 필요합니다.", "2. BCG 모형의 두 축과 네 위치  BCG 성장점유율 모형은 시장성장률과 상대적 시장점유율로 사업이나 제품군을 분류합니다. 두 값이 높은 스타, 낮은 성장과 높은 점유율의 캐시카우, 높은 성장과 낮은 점유율의 물음표, 두 값이 낮은 범주를 구분합니다. 상대적 점유율은 경쟁자와 비교한 위치이므로 절대 판매량과 다릅니다. 각 위치를 바탕으로 자원배분을 검토하지만 현금흐름과 투자위험을 모든 경우에 정확히 예측하는 공식은 아닙니다.", "3. 진단과 변화의 원인  현재 위치를 분류하는 도구는 왜 그 위치에 있는지, 어떤 행동이 이동을 만들지까지 자동으로 알려주지 않습니다. 낮은 점유율의 원인이 기술, 유통, 가격 중 무엇인지에 따라 대안은 달라집니다. 경준은 이 차이를 질문하며 포지셔닝과 수출품목 분석으로 확장했습니다. 시장을 어떻게 정의하고 자료의 기간을 어떻게 잡는지에 따라 사분면도 바뀔 수 있으므로 모형의 기준과 실제 행동계획을 함께 검토해야 합니다."], "follow": ["스타로 분류된 사업에는 무조건 투자해야 합니까?  그렇게 결정할 수는 없습니다. 높은 성장과 점유율 외에도 필요한 투자금, 실제 현금흐름, 경쟁과 위험을 확인해야 합니다. 분류는 검토의 출발점이라고 생각합니다."], "memory": "상황 정리 → 대상과 메시지 → 위치와 원인 구분", "caution": "", "source_refs": [65], "university": "공통", "kind": "답변", "glossary": [56, 57, 58]}, {"id": 137, "question": "통합과학과 과학탐구실험에서 전공과 연결해 배운 점은 무엇입니까?", "category": "학생부 확장 Ⅲ · 규범·언어·학교생활", "answer": ["기술의 경제적 가치를 말하려면 작동 원리와 측정 조건부터 이해해야 한다는 점을 배웠습니다. 연료전지에서는 화학에너지가 전기에너지로 바뀌는 원리와 생산방식에 따른 환경 영향을 살폈고, mRNA 기술에서는 원리와 함께 기술 접근성의 문제에도 관심을 가졌습니다.", "과학탐구실험에서는 기후자료를 그래프로 만들고 전압과 전류를 살피며 단위와 오차, 비교 조건의 중요성을 배웠습니다. 저는 통상을 공부한다고 기술을 경쟁력이나 수익으로만 설명하고 싶지는 않습니다. 무엇이 실제로 가능한 기술이고 어떤 조건에서 나온 자료인지 이해해야 제도와 기업의 선택도 더 정확히 볼 수 있다고 생각합니다."], "evidence": ["1학년 · 통합과학 1학기 | PDF 8쪽 / 인쇄 9쪽\n1학년 통합과학 1학기에 연료전지·청정수소·해양환경·재생에너지 대체 분석이 기록됩니다.", "1학년 · 통합과학 2학기 | PDF 8쪽 / 인쇄 9쪽\n1학년 통합과학 2학기에 SOFC·mRNA 기술과 경제적 접근성을 탐구했습니다.", "1학년 · 과학탐구실험 1학기 | PDF 8쪽 / 인쇄 9쪽\n1학년 과학탐구실험에서 소켓볼·CO2 자료·전압과 전류 및 오차를 다뤘습니다.", "1학년 · 과학탐구실험 2학기 | PDF 8쪽 / 인쇄 9쪽\n1학년 과학탐구실험에서 SI 단위·주기율표·레디와 파스퇴르 실험을 비교했습니다."], "concepts": ["1. 연료전지와 기술의 환경평가  연료전지는 연료의 화학에너지를 전기화학 반응으로 전기에너지로 바꿉니다. 수소 연료전지에서는 수소와 산소의 반응을 활용하며, SOFC는 고체산화물 전해질을 사용하는 유형입니다. 사용단계의 배출만으로 전체 환경성을 판단할 수 없고 연료 생산과정도 봐야 합니다. 해양산성화는 바다에 녹는 이산화탄소와 관련되고, 온난화에 따른 해수 열팽창·육상빙하 감소는 해수면 상승과 관련되어 구분해야 합니다.", "2. mRNA와 기술의 가치 및 접근성  mRNA는 단백질을 만드는 정보의 전달에 쓰이며, mRNA 백신은 이러한 정보를 통해 면역반응의 대상을 만들게 하는 접근입니다. 기술을 공유하는 플랫폼 방식은 개발의 유연성을 높일 수 있지만 제조·보관·특허·비용의 조건도 중요합니다. 경준은 화이자·모더나 사례에서 경제적 가치와 접근성을 함께 살폈습니다. 기업 사례를 조사했다는 것과 직접 실험해 효능이나 비용절감을 검증했다는 것은 다릅니다.", "3. 측정과 대조 조건  전압과 전류의 관계를 볼 때에는 저항 등 조건을 일정하게 두고 단위와 측정오차를 확인해야 합니다. 안면도 CO2 자료의 그래프도 관측기간과 축을 확인해야 추세를 과장하지 않습니다. 레디와 파스퇴르의 실험 비교에서는 외부 생물이나 미생물의 유입을 통제하는 설계가 중요합니다. 이것은 생명 기원의 모든 문제를 해결한 실험이라는 뜻이 아닙니다. 비교가 가능한 조건을 만드는 태도는 경제자료 해석에도 적용됩니다."], "follow": ["소켓볼과 50% 재생에너지 대체 분석은 무엇입니까?  소켓볼은 움직임의 에너지를 전기로 바꾸는 적정기술 사례로 지속가능성과 실용성을 살폈습니다. 재생에너지 분석에서는 4인 가구 전기사용량의 50%를 대체하는 가정을 두었습니다. 실제 보급이나 측정된 탄소감축 실적을 주장한 것은 아닙니다.", "SI 기본단위와 주기율표에서 무엇을 익혔습니까?  SI의 기본단위는 미터·킬로그램·초·암페어·켈빈·몰·칸델라입니다. 단위를 맞춰 실험자료를 비교했고, 주기율표에서는 같은 족과 주기의 원소 성질을 비교했습니다."], "memory": "기술 원리 → 비용과 접근성 → 측정 조건", "caution": "", "source_refs": [66, 67, 68, 69], "university": "공통", "kind": "답변", "glossary": [69, 70, 71, 72, 86]}, {"id": 138, "question": "정보의 프로그래밍과 기술 가정의 설계 경험에서 실제로 한 일은 무엇입니까?", "category": "학생부 확장 Ⅲ · 규범·언어·학교생활", "answer": ["정보에서는 알고리즘을 설계하고 오류를 찾아 수정하는 과정을 경험했습니다. 센서와 구동기의 원리를 배우며 간단한 시스템도 설계했고, 금융 빅데이터의 활용과 정보윤리를 조사했습니다. 원하는 결과를 얻으려면 입력·처리·출력을 나눠 확인해야 한다는 점을 배웠습니다.", "기술·가정에서는 로켓과 발사대의 디지털 3D 모형을 만들며 형태와 격자구조를 수정했습니다. 실제 발사나 성능 검증을 한 활동은 아닙니다. 두 활동에서 제가 가져온 배움은 아이디어를 구체적인 구조로 만들고 결과를 보며 다시 고치는 과정입니다. 이후 통상정보 도구를 만들 때도 한 번에 완성하려 하기보다 문제를 나눠 살피는 태도로 연결할 수 있었습니다."], "evidence": ["1학년 · 정보 | PDF 8–9쪽 / 인쇄 9–10쪽\n1학년 정보에 알고리즘·디버깅, 센서·구동기의 간단한 시스템, 금융 빅데이터와 정보윤리 탐구가 기록됩니다.", "1학년 · 기술·가정 | PDF 8쪽 / 인쇄 9쪽\n1학년 기술·가정에 로켓·발사대 3D 모델링과 반복 수정, 인문 건축 기행 독서가 기록됩니다."], "concepts": ["1. 알고리즘과 디버깅  알고리즘은 입력을 받아 원하는 결과를 얻기 위한 절차이고, 디버깅은 기대한 결과와 실제 결과가 다른 원인을 찾아 수정하는 과정입니다. 가상의 예로 센서값이 기준을 넘으면 장치를 작동시키는 절차에서는 입력값, 조건판단, 출력명령을 나누어 확인할 수 있습니다. 오류가 났을 때 전체를 무작정 바꾸기보다 어느 단계에서 차이가 생겼는지 살피는 것이 중요합니다. 이 예시는 설명용이며 실제 사용한 장치나 프로그램의 세부 구성은 생기부에 없는 내용을 덧붙이지 않습니다.", "2. 센서와 구동기 및 설계 제약  센서는 주변의 물리적 상태를 읽어 신호로 바꾸고, 구동기는 명령에 따라 움직임이나 빛처럼 물리적 출력을 만듭니다. 소프트웨어와 하드웨어를 연결하려면 신호의 범위와 작동조건을 맞춰야 합니다. 3D 설계에서는 형태를 바꾸는 일과 실제 강도·비행성능을 검증하는 일이 다릅니다. 격자구조와 로켓형태를 설계한 기록은 있지만 실제 발사나 정량적 강도실험을 했다고 말할 근거는 없습니다.", "3. 효율성과 공간을 바라보는 관점  효율적인 설계는 자원을 적게 쓰는 것만이 아니라 필요한 기능과 품질을 조건 안에서 달성하는 선택입니다. 재료를 줄여도 구조가 목적을 수행하지 못하면 좋은 설계가 아닙니다. 인문 건축 기행 독서에서는 공간이 감정·창의성과 연결되고 건축가에게 사회문화적 책임이 있다는 관점도 다뤘습니다. 기술의 성능과 사람이 사용하는 조건을 함께 봐야 한다는 배움으로 설명할 수 있습니다."], "follow": ["직접 금융예측 모델을 완성한 것입니까?  정보 과목에서는 금융 빅데이터의 활용을 조사하고 프로그래밍의 처리·설계 경험을 쌓았습니다. 실제 금융시장에서 예측성능이 검증된 모델을 완성했다고 말할 수는 없습니다.", "3D 설계를 경제학의 최적화와 어떻게 연결했습니까?  재료를 줄이는 것만으로 좋은 설계가 되지는 않고 필요한 기능과 품질을 함께 만족해야 한다고 생각했습니다. 제한된 자원 안에서 여러 조건을 고려해 선택한다는 점을 경제학의 최적화와 연결했습니다."], "memory": "입력과 출력 → 오류 수정 → 기능과 자원 조건", "caution": "사용 보드·센서·프로그래밍 언어·설계 프로그램 이름은 원문에 없으므로 실제 기억이나 작업파일로 확인한 경우에만 말합니다.", "source_refs": [], "university": "공통", "kind": "답변", "glossary": []}, {"id": 139, "question": "문학과 역사 수업에서 사람과 사회를 바라보는 시각이 어떻게 달라졌습니까?", "category": "학생부 확장 Ⅲ · 규범·언어·학교생활", "answer": ["사람을 결과만으로 판단하기보다 그 사람이 놓인 조건을 함께 보려는 생각이 커졌습니다. 『여승』을 읽을 때는 제가 낙담했을 때 친구에게 위로받은 경험을 떠올렸고, 다른 사람에게 필요한 말을 건네는 삶을 생각했습니다. 문학은 제 주변의 관계를 돌아보게 했습니다.", "한국사에서는 신분에 따른 기회 제한을, 『도둑맞은 가난』에서는 약자를 바라보는 시선과 존엄을 생각했습니다. 『노인과 바다』에서는 결과와 별개로 남는 태도도 읽었습니다. 이런 활동을 모두 진로를 위한 계획으로 설명할 필요는 없다고 생각합니다. 다만 경제문제를 볼 때도 숫자 뒤에 있는 사람과 조건을 놓치지 않으려는 제 관점에 영향을 줬습니다."], "evidence": ["1학년 · 국어 1학기 | PDF 6쪽 / 인쇄 7쪽\n1학년 국어의 여승 감상과 친구의 위로를 떠올린 성찰입니다.", "1학년 · 한국사 1학기 | PDF 7쪽 / 인쇄 8쪽\n1학년 한국사의 서얼차대법과 기회제약 분석입니다.", "1학년 · 한국사 2학기 | PDF 7쪽 / 인쇄 8쪽\n1학년 한국사의 인물비교와 4·19혁명·몽고메리 보이콧 비교입니다.", "2학년 · 독서 | PDF 11쪽 / 인쇄 12쪽\n2학년 독서의 콘크리트 산책법 감상입니다.", "2학년 · 문학 | PDF 11쪽 / 인쇄 12쪽\n2학년 문학의 도둑맞은 가난·노인과 바다 감상입니다."], "concepts": ["1. 성과와 기회를 구분하는 관점  두 사람의 결과가 다를 때 노력의 차이만으로 설명하면 출발조건과 제도적 제한을 놓칠 수 있습니다. 서얼차대법 탐구는 신분질서의 안정이라는 측면과 능력발휘 기회를 제한하는 측면을 함께 검토한 활동입니다. 이를 현대의 경제적 배경과 연결하더라도 시대와 제도가 같다고 보는 것은 아닙니다. 누가 참여할 수 있고 어떤 기회가 막혀 있는지라는 질문을 가져온 것으로 설명하면 역사와 경제를 성급하게 동일시하지 않을 수 있습니다.", "2. 문학의 해석과 개인적 성찰  여승은 친구에게 위로받은 경험을 돌아보는 계기가 되었고, 콘크리트 산책법의 실금·모래성 이미지는 내면의 균열과 회복으로 읽었습니다. 도둑맞은 가난에서는 타인의 시선이 약자의 존엄을 훼손하는 문제를, 노인과 바다에서는 태도와 책임이 남기는 품위를 생각했습니다. 이는 작품을 읽고 학생이 구성한 해석이며 작가의 의도를 유일하게 확정한 정답은 아닙니다. 구체적 장면을 질문받으면 실제로 기억하는 작품내용과 자신의 생각을 나누어 설명합니다.", "3. 시민참여와 역사 비교의 범위  윤봉길과 이완용의 비교는 개인이 공익과 역사에 어떤 선택을 남기는지 살피는 활동이었고, 4·19혁명과 몽고메리 보이콧 비교는 시민참여와 저항에 주목했습니다. 두 운동은 배경과 제도, 참여집단과 전개과정이 다르므로 똑같은 사건으로 설명할 수 없습니다. 공통 질문을 찾은 뒤 차이를 확인해야 비교가 의미를 가집니다. 자신의 참여와 책임을 생각하는 계기로 연결하되 구체적인 역사적 사실은 분리해 말합니다."], "follow": ["경제학에서 효율보다 존엄이 언제나 우선입니까?  모든 상황의 우선순위를 한 문장으로 정하기는 어렵습니다. 다만 효율을 계산할 때 어떤 사람의 기회와 존엄이 비용에서 빠져 있는지 먼저 확인하고, 대안과 보호할 기준을 함께 논의해야 한다고 생각합니다."], "memory": "결과와 상황 → 제도와 기회 → 존엄과 책임", "caution": "작품의 문장이나 친구의 말은 실제로 기억하고 확인한 경우에만 인용합니다.", "source_refs": [], "university": "공통", "kind": "답변", "glossary": []}, {"id": 140, "question": "음악 미술 체육 활동은 본인의 협업 방식에 어떤 영향을 주었습니까?", "category": "학생부 확장 Ⅲ · 규범·언어·학교생활", "answer": ["함께 좋은 결과를 내려면 각자가 잘할 수 있는 방식과 속도를 이해해야 한다는 걸 배웠습니다. 음악에서는 피아노 연주와 조장 역할을 맡고, 모둠원의 음역과 연주 수준을 고려해 편곡했습니다. 제 기준만 밀어붙이기보다 함께 표현할 수 있는 형태를 만드는 것이 중요했습니다.", "체육에서는 친구의 연습을 돕고 제 동작도 반복해서 익혔습니다. 미술에서는 자세히 관찰한 내용을 표현으로 옮기는 경험을 했습니다. 저는 이런 활동을 통해 의견을 말하는 능력과 다른 사람을 살피는 능력이 함께 필요하다고 느꼈습니다. 대학의 팀 활동에서도 결과만 재촉하지 않고 구성원이 참여할 수 있는 방법을 찾겠습니다."], "evidence": ["1학년 · 체육 | PDF 9–10쪽 / 인쇄 10–11쪽\n1학년 체육의 배드민턴·멀리뛰기와 스포츠맨십입니다.", "1학년 · 음악 | PDF 10쪽 / 인쇄 11쪽\n1학년 음악의 지역축제 기획과 베토벤 탐구입니다.", "1학년 · 미술 1학기와 2학기 | PDF 10쪽 / 인쇄 11쪽\n1학년 미술의 인물·캐리커처·풍경 표현입니다.", "2학년 · 운동과 건강 | PDF 15쪽 / 인쇄 16쪽\n2학년 운동과 건강의 기술적 어려움과 반복연습입니다.", "2학년 · 음악 | PDF 15쪽 / 인쇄 16쪽\n2학년 음악의 합주 편곡·국악 해외유통 제안·뮤지컬 창작입니다.", "3학년 · 스포츠 생활 | PDF 19쪽 / 인쇄 20쪽\n3학년 스포츠 생활의 동료지원·기술공유·격려입니다."], "concepts": ["1. 합주와 협업의 조정  합주는 여러 소리가 함께 들릴 때의 균형을 고려해야 하므로 개인의 연주능력만으로 완성되지 않습니다. 음역과 난도를 조정하는 편곡은 구성원이 참여할 수 있는 조건을 맞추는 행동입니다. 아르페지오는 화음의 음을 한꺼번에 누르지 않고 순서대로 연주하는 방식입니다. 경준은 피아노 반주와 모둠장 역할을 했고 운수 좋은 날 뮤지컬에서 영숙 역할과 신체표현 창작에도 참여했습니다. 무대의 완성도와 각자의 수행을 함께 살핀 경험으로 설명할 수 있습니다.", "2. 관찰과 반복 연습의 의미  인물 드로잉의 비례, 캐리커처의 특징 강조, 풍경의 원근감은 대상의 요소를 나누어 관찰하는 경험입니다. 체육에서는 농구의 공 조절에 강점이 있었지만 배드민턴 라켓 각도와 배구의 타이밍에는 어려움이 있었습니다. 모든 종목을 잘했다고 꾸미기보다 어떤 요소를 반복해서 익혔는지 설명할 수 있습니다. 3학년의 리바운드와 공 전달, 뜀틀·2단뛰기 요령 공유는 자신이 돋보이는 역할 밖에서도 동료의 연습을 지원한 구체적 행동입니다.", "3. 문화의 접근성과 전달  지역 음악축제 기획은 지방 주민의 문화접근 문제에서 출발했고 축제 필요성 설명과 부스 제안에 참여했습니다. 베토벤 교향곡9번 감상에서는 악장의 전개와 역경의 의미를 살폈습니다. 이후 국악을 해외에 소개할 유통망·저작권 묶음을 제안하며 표현물의 가치와 전달경로를 함께 생각했습니다. 영웅의 누가 죄인인가에서는 엄중한 음색과 반복 리듬의 강조효과를 분석했습니다. 이들은 실제 축제 개최나 해외계약 실적과 구분되는 수업의 기획·분석 활동입니다."], "follow": ["리더가 직접 중심 역할을 하지 않아도 됩니까?  공동의 결과에 필요한 역할을 하는 것이 중요하다고 생각합니다. 친구가 계속 연습할 수 있도록 공을 건네는 일처럼 눈에 잘 띄지 않는 지원도 팀에 필요한 행동입니다.", "국악의 해외유통 제안은 무엇을 함께 고려한 것입니까?  음악의 특징을 소개하는 브랜딩과 유통경로, 저작권을 함께 보자는 제안이었습니다. 실제 계약을 맺은 것은 아니며 문화적 특징을 어떻게 전달하고 지속 가능한 구조를 만들지 생각한 활동입니다."], "memory": "각자의 조건 → 역할 조정 → 관찰과 지원", "caution": "예술·체육 활동을 모두 처음부터 통상 진로를 위해 계획했다고 연결하지 않습니다. 각 활동에서 배운 협업과 관찰의 의미를 살립니다.", "source_refs": [], "university": "공통", "kind": "답변", "glossary": []}, {"id": 141, "question": "1학년의 원화 가치 뉴스와 미국 국채 탐구에서 무엇을 배웠습니까?", "category": "학생부 확장 Ⅳ · 1학년의 출발점", "answer": ["환율과 국채를 따로 외우기보다 금리와 자금 이동의 관계 속에서 보게 됐습니다. 1학년 국어에서 원화 가치 관련 기사를 읽고 중요한 내용을 다시 쓰면서, 숫자가 왜 변했는지 설명하려면 그 배경을 함께 알아야 한다고 느꼈습니다.", "통합사회에서는 미국 국채와 국제금융 질서, 금융위기의 관계를 조사했습니다. 다만 안전자산이라는 말이 가격이 절대 변하지 않는다는 뜻은 아닙니다. 이후 환율 탐구로 이어지면서 금리 하나로 모든 움직임을 설명하기 어려운 점도 알게 됐습니다. 처음의 뉴스 읽기가 경제적 관계를 묻고 자료로 확인하는 관심으로 발전했습니다."], "evidence": ["1학년 · 진로활동 뉴스 큐레이션 활동 | PDF 2쪽 / 인쇄 3쪽\n1학년 진로활동 뉴스 큐레이션에서 원화 가치와 미국 고금리·무역갈등·국내 불안, 수출·수입·내수 영향을 분석했습니다.", "1학년 · 국어 2학기 | PDF 7쪽 / 인쇄 8쪽\n1학년 국어 2학기에 미국 국채·글로벌 자본흐름을 주제로 매체 평가와 고쳐쓰기를 했습니다."], "concepts": ["1. 환율과 자본이동의 연결  환율은 한 통화로 표시한 다른 통화의 가격입니다. 미국 자산의 기대수익이 상대적으로 높아지면 달러 자산을 사려는 수요가 늘 수 있지만, 환율 기대와 위험·환헤지 비용도 함께 작용합니다. 가상의 예로 달러당 1,000원이 1,100원이 되면 원화는 약해져 같은 100달러 수입품의 원화 가격이 10만 원에서 11만 원이 됩니다. 실제 기업은 외화매출과 외화비용이 함께 있으므로 원화 약세가 모든 수출기업에 같은 이익을 주지는 않습니다.", "2. 국채 수요와 성장의 관계  국채는 정부가 돈을 빌리며 발행하는 채무증서입니다. 다른 조건이 같을 때 국채 수요가 늘면 가격이 오르고 수익률이 낮아져 자금조달 부담을 줄일 수 있습니다. 그러나 외국인이 기존 보유자에게 국채를 사는 거래는 정부에 곧바로 새 자금이 들어오는 발행시장 거래와 다릅니다. 조달한 돈을 어디에 쓰는지, 이자와 상환 부담이 얼마나 되는지에 따라 성장 효과도 달라집니다. 경준의 글은 이러한 관계를 쉽게 설명한 활동이며 외국 보유 증가가 반드시 성장을 만든다는 증명은 아닙니다."], "follow": ["미국 금리가 오르면 원달러 환율은 반드시 오릅니까?  반드시 그렇지는 않습니다. 이미 예상된 인상인지, 다른 나라의 금리와 위험이 어떻게 변하는지, 앞으로의 환율을 어떻게 예상하는지에 따라 자금의 선택이 달라질 수 있습니다."], "memory": "환율의 경로 → 국채와 자금 → 독자에게 설명", "caution": "1학년 기사 분석에 3학년 회귀의 수치나 특정 정치사건의 인과효과를 소급해서 넣지 않습니다.", "source_refs": [70], "university": "공통", "kind": "답변", "glossary": []}, {"id": 142, "question": "천원술과 사원술을 탐구하며 수학의 표기법에서 무엇을 배웠습니까?", "category": "학생부 확장 Ⅳ · 1학년의 출발점", "answer": ["천원술과 사원술을 탐구하며 수학의 표기법이 복잡한 관계를 다루는 데 중요한 도구라는 점을 배웠습니다. 천원술은 미지수를 두고 문제를 다항식으로 나타내는 전통적 방법이고, 사원술은 여러 미지수가 있는 관계를 다루는 방향으로 이해했습니다. 옛 표기와 현대 기호를 비교해 봤습니다.", "저는 같은 관계도 어떻게 표현하느냐에 따라 계산하고 설명하는 부담이 달라진다는 점이 흥미로웠습니다. 경제자료를 함수로 바꿀 때도 무엇을 변수로 둘지 정해야 합니다. 다만 역사 속 방법과 현대 회귀분석이 같은 기법이라는 뜻은 아닙니다. 복잡한 문제를 명확한 표현으로 바꿔 생각한다는 태도에서 연결점을 찾았습니다."], "evidence": ["1학년 · 수학 | PDF 7쪽 / 인쇄 8쪽\n1학년 수학에서 수학의 역사를 바탕으로 천원술·사원술과 현대 문자·기호 표기의 유용성을 탐구했습니다."], "concepts": ["1. 천원술과 사원술의 비교  천원술은 하나의 미지수를 두고 문제의 조건을 방정식으로 나타내 다루는 중국 수학의 방법입니다. 사원술은 여러 미지수의 관계를 함께 표현하고 소거하며 문제를 푸는 방향으로 확장됩니다. 핵심은 단순히 미지수의 개수가 많아졌다는 점보다 여러 조건을 잃지 않고 연결해 다뤄야 한다는 점입니다. 경준의 활동은 두 풀이 방식과 표기법의 차이를 비교한 것이며, 특정 고전 원문을 직접 번역하거나 모든 소거 알고리즘을 구현했다는 경험은 아닙니다.", "2. 기호가 사고를 돕는 원리  기호는 같은 대상을 문장마다 길게 다시 쓰지 않고 일관되게 가리키도록 돕습니다. 가상의 예로 2x+y=7과 x−y=2를 더하면 y가 사라져 3x=9가 됩니다. 여기서 문자와 연산규칙은 어떤 정보를 유지하고 무엇을 제거하는지 보여줍니다. 다만 x가 무엇인지, 단위와 가능한 값은 무엇인지 정하지 않으면 식만 간단해질 뿐 문제는 분명해지지 않습니다. 이 역사 탐구는 이후 경제모형에서도 변수의 의미를 먼저 정하고 식의 구조를 설명해야 한다는 태도와 연결할 수 있습니다."], "follow": ["표기만 바꾸면 어려운 문제도 풀 수 있습니까?  표기는 관계를 드러내지만 필요한 조건이나 올바른 추론을 대신 만들어주지는 않습니다. 미지수와 조건을 정리한 뒤 어떤 변형이 가능한지 설명할 수 있어야 합니다."], "memory": "미지수와 관계 → 표기 → 소거와 의미", "caution": "구체적인 고전 문제나 계산판 배치법은 기록에 없으므로 실제로 공부한 내용을 확인한 경우에만 추가합니다.", "source_refs": [], "university": "공통", "kind": "답변", "glossary": []}, {"id": 143, "question": "유리함수로 수요와 공급을 표현하려 한 이유는 무엇입니까?", "category": "학생부 확장 Ⅳ · 1학년의 출발점", "answer": ["수요와 공급을 무조건 직선으로만 보는 대신, 가격 변화에 대한 반응이 구간에 따라 다를 수 있다는 점을 함수로 생각해 보고 싶었습니다. 그래서 유리함수의 정의역과 점근선 같은 성질을 경제적 관계에 어떻게 연결할 수 있을지 탐구했습니다.", "이 과정에서 그래프가 그럴듯하다고 실제 시장을 설명하는 것은 아니라는 점도 중요했습니다. 함수가 정의되지 않는 값이나 현실적으로 가능한 가격·수량의 범위를 확인해야 합니다. 저는 이 활동을 실제 수요함수를 추정한 연구보다 수학적 표현을 경제현상에 적용해 본 탐구로 이해합니다. 이후 자료로 모형을 점검할 필요를 생각하는 출발점이 됐습니다."], "evidence": ["1학년 · 수학 | PDF 7쪽 / 인쇄 8쪽\n1학년 수학에서 유리함수로 비선형적 수요·공급을 표현하는 사례를 탐색하고 균형가격·가격정책 분석으로의 확장을 제안했습니다."], "concepts": ["1. 유리함수의 정의와 경제적 정의역  유리함수는 두 다항식의 비로 나타내는 함수이며 분모가 0인 값은 정의역에서 제외합니다. 가상의 수요모형을 가격 p에 대해 100/p로 두면 가격이 높아질수록 수요량이 줄지만 같은 가격 변화의 효과가 일정하지 않습니다. 경제적으로는 p가 양수인 범위를 따로 정해야 합니다. 점근선이나 음수 결과가 나오는 구간을 실제 시장 현상으로 그대로 읽을 수는 없습니다. 이 함수는 이해를 위한 예시이며 경준이 실제 자료에 추정한 식이라는 뜻은 아닙니다.", "2. 균형과 모형의 적합성  가상의 공급량을 가격 p와 같다고 두면 수요량 100/p와 공급량 p가 일치하는 양의 가격은 10이고 거래량도 10입니다. 이런 균형은 다른 조건이 고정되고 두 함수가 해당 시장을 나타낸다는 가정 아래 계산됩니다. 정책이 수요나 공급을 바꾸면 두 식의 관계도 다시 살펴야 합니다. 더 복잡한 함수를 선택했다고 모형이 자동으로 좋아지지는 않습니다. 실제 자료와 비교하고 적용 구간·단위·가정을 밝혀야 하며, 경준의 기록에는 특정 추정식과 예측검증 성과까지 제시되어 있지는 않습니다."], "follow": ["왜 수요함수는 꼭 유리함수여야 합니까?  꼭 그럴 필요는 없습니다. 직선이나 다른 함수도 문제와 자료에 따라 적합할 수 있습니다. 먼저 어떤 관계를 설명하려는지 정하고 실제 자료와 경제적 의미에 맞는 형태를 선택해야 합니다."], "memory": "비선형 관계 → 정의역 → 균형과 자료 확인", "caution": "예시의 100/p, 가격 10과 거래량 10은 설명용 가상 수치입니다. 실제 탐구의 식이나 결과로 말하지 않습니다.", "source_refs": [], "university": "공통", "kind": "답변", "glossary": []}, {"id": 144, "question": "영어 수업에서 강조한 존중과 의사소통을 실제로 어떻게 표현했습니까?", "category": "학생부 확장 Ⅳ · 1학년의 출발점", "answer": ["저는 존중이 의견을 무조건 받아주는 것이 아니라 상대가 왜 그렇게 생각하는지 듣고 근거로 대화하는 태도라고 생각합니다. 영어 수업에서 소셜미디어 제한과 관련된 주장을 쓰며 보호의 필요성과 표현·정보 접근의 문제를 함께 살폈습니다. 제 주장에 불리한 관점도 확인하려고 했습니다.", "말하기와 글쓰기에서는 제 생각을 분명하게 표현하되 상대가 이해할 수 있는 순서가 필요했습니다. 이런 경험은 이후 발표와 동아리 활동에서도 중요했습니다. 저는 의견을 조율할 때 결론부터 누가 맞는지 정하기보다 서로 중요하게 보는 조건을 먼저 확인하고 싶습니다. 분명하게 말하는 힘과 듣는 태도를 함께 갖추겠습니다."], "evidence": ["1학년 · 영어 | PDF 7쪽 / 인쇄 8쪽\n1학년 영어에서 의사소통·존중을 주장·근거·결론 구조로 발표하고, 어린이 소셜미디어 금지에 반대하는 두 근거의 논증문을 작성했습니다."], "concepts": ["1. 존중과 동의는 구분된다  존중은 상대를 동등한 대화 상대자로 대하고 주장과 이유를 이해하려는 태도입니다. 모든 결론에 동의한다는 뜻은 아니므로 근거를 들어 반대하는 일과 양립할 수 있습니다. 가상의 토론에서 상대가 안전을 걱정한다면 그 우려를 먼저 정확히 요약한 뒤 다른 대안을 제시할 수 있습니다. 상대의 주장을 실제보다 약하게 바꾸어 공격하면 논박이 쉬워져도 대화는 정확해지지 않습니다. 경준의 발표는 공동생활에 필요한 존중을 의사소통의 방식으로 설명한 활동입니다.", "2. 주장·근거·결론과 정책 대안  논증에서는 근거가 사실인지뿐 아니라 그 근거가 왜 해당 결론을 지지하는지도 설명해야 합니다. 가령 소셜미디어에 위험이 있다는 사실만으로 모든 이용을 금지해야 한다는 결론이 자동으로 나오지는 않습니다. 위험의 크기, 이용자의 차이, 교육이나 보호기능 같은 대안을 비교해야 합니다. 반대로 금지에 반대한다고 위험을 부정할 수도 없습니다. 이들은 현재 답변을 이해하기 위한 논증 예시이며, 학생부에 적히지 않은 당시 두 가지 반대근거를 새로 복원한 것은 아닙니다."], "follow": ["상대 의견을 존중하면서 끝까지 반대할 수 있습니까?  가능하다고 생각합니다. 상대가 걱정하는 문제를 정확히 이해한 뒤 제가 동의하지 않는 판단과 그 이유를 구분해 설명하겠습니다. 상대의 인격을 평가하는 방식으로 반대하지는 않겠습니다."], "memory": "존중은 동의와 구별 → 이유 설명 → 목적과 수단", "caution": "당시 논증문의 두 반대근거의 정확한 내용은 생기부에 없습니다. 원문 확인 전 특정 근거를 사용했다고 말하지 않습니다.", "source_refs": [], "university": "공통", "kind": "답변", "glossary": []}, {"id": 145, "question": "반도체 독과점 탐구에서 어떤 경쟁정책이 필요하다고 생각했습니까?", "category": "학생부 확장 Ⅳ · 1학년의 출발점", "answer": ["시장집중도가 높다는 사실과 경쟁을 부당하게 막는 행동은 구분해야 한다고 생각했습니다. 반도체는 연구개발과 설비투자 비용이 커서 규모의 이점이 있을 수 있습니다. 그래서 기업이 크다는 이유만으로 경쟁을 해친다고 결론내리기보다 진입을 막는 행동이나 특혜가 있는지 봐야 합니다.", "1학년 통합사회에서 기술개발 지원, 경쟁을 왜곡하는 지원의 점검, 국제협력 같은 방안을 검토했습니다. 저는 혁신의 유인을 살리면서 다른 기업이 도전할 기회도 지키는 것이 중요하다고 생각합니다. 정책을 평가할 때도 큰 기업을 약하게 만드는 것 자체보다 공정하게 경쟁하고 더 나은 기술이 나올 조건을 만드는 데 초점을 두고 싶습니다."], "evidence": ["1학년 · 통합사회 | PDF 7쪽 / 인쇄 8쪽\n1학년 통합사회에서 반도체 독과점의 비용·성장 영향을 분석하고 조사·공정거래 제도·기술지원 대안을 제시했습니다.", "1학년 · 통합사회 | PDF 7–8쪽 / 인쇄 8–9쪽\n이어지는 통합사회 원문에서 복수 기업의 경쟁력 확보와 독과점 문제의 탐구가 확인됩니다."], "concepts": ["1. 시장지배력과 시장의 범위  시장지배력은 경쟁의 압력을 크게 받지 않으며 가격이나 거래조건에 영향을 줄 수 있는 힘입니다. 점유율을 계산하려면 소비자가 다른 제품으로 바꿀 수 있는지 등을 고려해 관련 시장을 정해야 합니다. 가령 반도체 전체를 하나로 묶으면 용도가 달라 쉽게 대체되지 않는 제품 사이의 차이를 놓칠 수 있습니다. 높은 점유율은 검토할 단서이지만 혁신이나 효율로 얻은 지위와 경쟁을 배제하는 행위는 구별해야 합니다. 경준의 기록에는 특정 시장획정이나 기업별 위법성 판단이 없습니다.", "2. 경쟁정책과 기술지원의 관계  경쟁정책은 단순히 기업의 수를 늘리는 목표보다 가격·품질·혁신에서 경쟁할 조건을 지키는 데 초점을 둘 수 있습니다. 가상의 시장에서 새로운 기업이 기술을 개발해도 거래 접근을 부당하게 차단당한다면 연구지원만으로 경쟁이 살아나기 어렵습니다. 반대로 기존 기업을 약화시키는 조치만으로 새로운 경쟁자의 기술이 생기지도 않습니다. 경준은 행위 조사와 기술지원을 함께 제안했습니다. 다만 지원이 장기적인 특혜가 되거나 비효율을 유지하지 않도록 목적과 효과를 따져야 합니다."], "follow": ["규모의 경제가 중요하면 독과점을 인정해야 하지 않습니까?  규모가 커서 비용이 낮아지는 효과는 고려해야 합니다. 다만 그 효율과 별개로 경쟁을 부당하게 막는 행위가 있는지 살펴야 합니다. 기업 규모 하나로 허용과 규제를 모두 결정하기는 어렵습니다."], "memory": "시장 범위 → 경쟁의 압력 → 조사와 역량 지원", "caution": "FTC 자료는 시장지배력과 배제행위의 구분을 이해하는 참고입니다. 미국의 개별 법적 기준을 한국 공정거래법의 동일 기준이라고 적용하지 않습니다.", "source_refs": [71], "university": "공통", "kind": "답변", "glossary": [88]}, {"id": 146, "question": "베버의 프로테스탄티즘 윤리와 자본주의 정신을 어떻게 이해했습니까?", "category": "학생부 확장 Ⅳ · 1학년의 출발점", "answer": ["저는 베버의 설명을 경제활동이 가격과 제도뿐 아니라 사람들이 일과 삶에 부여하는 의미와도 연결된다는 관점으로 이해했습니다. 소명으로서의 직업, 절제된 생활, 이익의 재투자가 특정한 자본주의적 태도와 어떻게 이어질 수 있는지 살펴봤습니다.", "그렇다고 어떤 종교가 경제성공을 보장한다거나 가난이 개인의 도덕성 부족이라는 뜻으로 받아들이지는 않습니다. 역사적 조건과 함께 읽어야 합니다. 이 탐구는 경제행동을 설명할 때 사람들의 가치관도 중요하다는 생각으로 남았습니다. 제 성취를 바라는 마음도 어떤 방식으로 일하고 어떤 책임을 질지와 함께 생각하고 싶습니다."], "evidence": ["1학년 · 통합사회 연계 독서 | PDF 7쪽 / 인쇄 8쪽\n1학년 통합사회 연계 독서에서 베버의 프로테스탄티즘 윤리와 자본주의 정신을 읽은 사실이 시작됩니다.", "1학년 · 통합사회 | PDF 7–8쪽 / 인쇄 8–9쪽\n다음 쪽의 통합사회에 합리적 경영태도·금욕적 노동·재투자에 관한 해석과 별도의 군 인권 탐구가 이어집니다."], "concepts": ["1. 직업윤리와 금욕이 축적에 연결되는 경로  베버의 논의는 단순히 사람들이 돈을 좋아해서 자본주의가 생겼다는 설명과 다릅니다. 직업을 소명으로 받아들이고 규칙적으로 노동하면서 사치성 소비를 절제하는 태도가 지속적인 이윤추구·재투자와 연결되는 경로를 살핍니다. 가상의 예로 같은 이익을 얻어도 모두 소비하는 경우와 생산설비에 다시 넣는 경우에는 이후의 사업 규모가 달라질 수 있습니다. 이런 관계를 설명했다고 특정 신앙만이 경제발전의 유일한 원인이라거나 부가 신앙의 우월성을 증명한다는 뜻은 아닙니다.", "2. 설명과 정당화, 보편적 권리  어떤 가치관이 경제적 행동을 낳았는지 설명하는 일과 그 행동이 옳다고 평가하는 일은 다릅니다. 재투자가 경쟁력에 기여할 수 있어도 타인의 기회를 막는 행위까지 정당화하지는 않습니다. 경준의 별도 군 인권 탐구에도 조직의 목적을 이해하는 것과 권리침해를 허용하는 것을 구분하는 질문을 연결할 수 있습니다. 보편적 인권은 지위나 소속에 앞서 모든 사람에게 존엄과 권리가 있다는 원칙입니다. 조직의 효율이나 규율을 위해 필요한 조치도 사람의 생명·안전과 존엄을 고려해야 합니다."], "follow": ["베버가 기업의 독점을 바람직하다고 주장했다는 뜻입니까?  아닙니다. 저는 노동윤리와 재투자의 관계를 읽고 기업의 시장지위까지 생각을 확장했습니다. 그 해석을 베버 자신의 독점 옹호 주장으로 돌릴 수는 없습니다.", "같은 과목의 군 인권 탐구는 어떤 생각으로 연결됩니까?  군의 폐쇄적·위계적 문화와 인권 의식의 문제를 살펴보고 훈련계획과 상황대처, 인권교육의 개선을 제안했습니다. 군의 규율이 필요해도 구성원의 생명과 존엄이 사라지는 것은 아니며, 조직의 목적과 권리보호를 함께 검토해야 한다고 생각합니다."], "memory": "가치관 → 노동과 재투자 → 설명과 정당화 구분", "caution": "군 인권은 같은 과목의 별도 탐구입니다. 베버의 책 자체가 해당 군 인권 대안을 제시한 것처럼 연결하지 않습니다.", "source_refs": [72, 73], "university": "공통", "kind": "답변", "glossary": []}, {"id": 147, "question": "AI 시대에 본인을 선발해야 하는 이유는 무엇입니까?", "category": "AI 시대의 실행·검증·협업", "answer": ["저는 AI를 잘 활용하는 데서 그치지 않고, 무엇을 해결할지 정하고 사람들과 함께 실행하는 학생이라는 점을 강점으로 말씀드리고 싶습니다. 수출기업의 정보 문제를 발견한 뒤 통상정보 도구를 만들었고, 학교 학술제에서는 검색 원리와 한계를 직접 설명했습니다. 경제 동아리를 만들어 다른 학생이 배울 수 있는 자료도 제작했습니다.", "저는 AI 시대에 결과를 빨리 만드는 능력과 그 결과를 판단하고 전달하는 능력이 함께 필요하다고 생각합니다. 제가 구현한 기능도 믿을 근거가 부족하면 다시 검토했습니다. 대학에서도 전공의 기초를 배우며 질문을 구체화하고, 팀원들의 의견을 모아 확인할 수 있는 결과물로 만드는 학생으로 기여하겠습니다."], "evidence": ["3학년 · 자율활동 | PDF 4쪽 / 인쇄 5쪽\n기업 정보문제에서 출발한 통상정보 도구 구현·배포, 검색점수와 한계의 설명, 학술제 시연.", "2학년 · 동아리활동 경제해부학2 | PDF 3쪽 / 인쇄 4쪽\n경제 동아리 창설과 개념 학습지 제작.", "2학년 · 행동특성 및 종합의견 | PDF 20쪽 / 인쇄 21쪽\n디지털·AI 도구 활용, 자료의 오류 검증, 의견 표현·소통, 동아리 창설·선발 운영."], "concepts": ["1. 문제를 정하는 능력과 도구를 다루는 능력은 다릅니다. 질문이 잘못 정해지면 빠른 자동화도 다른 문제의 답을 생산할 수 있습니다. 기업 인터뷰에서 정보 접근의 어려움을 듣고 근거 검색으로 기능을 좁힌 행동이 문제 설정의 근거입니다. 이것은 모든 기업의 문제를 해결했다는 실적과 구별됩니다.", "2. 실행·검증·협업은 서로 다른 증거로 보여줍니다. 구현은 웹사이트 배포, 검증은 점수와 신뢰도의 차이 확인, 협업은 동아리·팀 논의 운영, 전달은 학술제 시연으로 설명합니다. 이 네 행동이 AI 시대에 중요하다는 것은 지원자의 가치판단이며, 대학의 공식 인재상 문구나 합격 보장 조건을 대신하지 않습니다."], "follow": ["AI를 잘 쓰는 학생과 어떻게 다른가요? 도구의 사용 자체보다 문제를 정한 이유와 결과를 믿을 근거를 설명할 수 있다는 점을 보여드리고 싶습니다. 경제 동아리 운영처럼 사람들과 함께 실행한 경험도 있습니다."], "memory": "문제 설정 → 구현 → 검증 → 협업과 전달", "caution": "", "source_refs": [28], "university": "공통", "kind": "답변", "glossary": [1, 3]}, {"id": 148, "question": "AI에 맡길 일과 직접 판단할 일은 어떻게 나누겠습니까?", "category": "AI 시대의 실행·검증·협업", "answer": ["문제의 목적과 판단의 책임은 AI에 그대로 맡기지 않겠습니다. 어떤 자료를 정리할지, 어떤 코드를 작성할지에는 도움을 받을 수 있지만, 누구에게 필요한 문제인지와 무엇을 기준으로 좋은 결과라고 할지는 제가 설명할 수 있어야 한다고 생각합니다.", "통상정보 도구에서도 검색점수를 신뢰도처럼 보게 되면 문제가 생겼습니다. 점수의 의미를 다시 검토하고 한계를 알리는 것은 사람이 책임져야 할 판단이었습니다. 앞으로도 AI가 제안한 답을 참고하되 적용 대상과 근거를 확인하겠습니다. 모든 일을 혼자 하겠다는 뜻이 아니라, 제가 내린 결정을 도구의 이름 뒤에 숨기지 않겠다는 뜻입니다."], "evidence": ["3학년 · 자율활동 | PDF 4쪽 / 인쇄 5쪽\nTF-IDF 점수 공개와 객관적 신뢰도 기준 부재를 인식한 자율활동 기록입니다. 근거를 검색하고 한계를 공개하는 도구 활동과 연결됩니다.", "3학년 · 생활과 윤리 | PDF 17쪽 / 인쇄 18쪽\n3학년 생활과 윤리에 TAC, 싱어·흄·롤스·요나스, 형량 계산 기능 중단과 책임귀속의 구분이 기록됩니다."], "concepts": ["1. 사람의 검토는 승인 버튼을 누르는 것과 다릅니다. 통상 규정이라면 적용 대상, 시행 시점, 예외 조건과 원문 근거를 이해해야 합니다. 설명할 수 없는 결과를 승인하면 판단을 맡긴 것과 크게 다르지 않을 수 있습니다.", "2. 사실 확인과 가치 선택을 나누어야 합니다. AI는 여러 기준에 따른 결과를 비교하는 데 도움을 줄 수 있지만 어떤 기준을 채택할지에는 사람의 규범적 판단이 들어갑니다. 생활과 윤리의 가치 형량 구상을 중단한 경험이 이 구별과 연결됩니다."], "follow": ["사람이 마지막에 확인하면 충분한가요? 내용을 이해할 지식과 검토할 시간, 잘못된 결과를 바꿀 권한이 있어야 실제 확인이 된다고 생각합니다."], "memory": "작업의 도움 / 목표·기준·책임의 설명", "caution": "", "source_refs": [29, 33], "university": "공통", "kind": "답변", "glossary": [1, 16, 79]}, {"id": 149, "question": "탐구에서 AI를 구체적으로 어떻게 활용했습니까?", "category": "AI 시대의 실행·검증·협업", "answer": ["제가 분명히 설명할 수 있는 AI 활용은 통상정보 검색도구를 만든 과정입니다. 질문을 나누고 관련 조항을 여러 경로로 검색한 뒤 결과를 점검하는 절차를 구현했습니다. 처음 방식으로 내부 판단을 설명하기 어려워 직접 코딩하는 설계로 바꿨고, 웹사이트 배포와 학술제 시연까지 진행했습니다.", "다만 어떤 모델에 어떤 코드를 도움받았는지는 실제 작업기록에 맞춰 구체적으로 말씀드려야 합니다. 모든 구현을 혼자 했다고 주장하고 싶지는 않습니다. 제가 강조하고 싶은 부분은 문제를 정하고 설계를 바꾸며 결과의 한계를 확인한 판단입니다. 도움을 받은 사실과 제가 이해하고 결정한 몫을 분명히 나누겠습니다."], "evidence": ["3학년 · 자율활동 | PDF 4쪽 / 인쇄 5쪽\n문제설정, 노코드에서 직접 코딩 전환, 검색·검증 구현과 한계발견의 기록입니다. 3학년 자율활동의 검색도구 구현·배포·시연과 한계고지입니다.", "2학년 · 독서활동상황 및 행동특성 종합의견 | PDF 20쪽 / 인쇄 21쪽\n디지털·AI 활용과 자료의 오류 검증 태도에 대한 행동특성 기록입니다.", "2학년 · 문학 | PDF 11쪽 / 인쇄 12쪽\n2학년 문학의 데이터 현지화와 규범 예측가능성 탐구가 선행 활동입니다.", "3학년 · 진로활동 | PDF 4–5쪽 / 인쇄 5–6쪽\n3학년 진로의 기업 정보격차 발견입니다.", "2학년 · 행동특성 및 종합의견 | PDF 20쪽 / 인쇄 21쪽\n디지털·AI 리터러시 활용, 자료 분석과 오류 검증, 근거 있는 의사 표현, 학급 의견을 대변하는 소통, 동아리 창설·선발 운영이 기록됩니다."], "concepts": ["1. 기여는 작업 단위로 구분합니다. 질문 설정, 문서 선정, 코드 작성, 오류 진단, 결과 해석, 발표는 서로 다른 역할입니다. 자료 정리나 코딩 도움을 받았더라도 직접 선택한 기준을 보여줄 수 있으며, 반대로 실행만 했다고 모든 원리를 이해한 것은 아닙니다.", "2. 본인 확인이 꼭 필요한 문항입니다. 학생부는 설계 전환과 구현·배포를 확인해 주지만, 모델명·프롬프트·코드 작성 비중을 모두 알려 주지는 않습니다. 면접 전에 실제 코드 한 부분과 실패·수정 사례 하나를 확인해야 이 답변이 구체적인 본인 경험으로 완성됩니다."], "follow": ["코드의 어느 부분을 직접 작성했나요? 실제 작업파일에서 설명 가능한 기능을 하나 골라 입력, 처리, 출력과 수정 이유를 말씀드리겠습니다. 확인하지 않은 작성 비율을 숫자로 말하지 않겠습니다."], "memory": "도움받은 작업 / 직접 결정한 설계 / 확인한 한계", "caution": "필수 본인 확인: 실제 사용 모델·코딩 도움 범위·직접 수정한 코드 한 부분. 생기부는 구현 과정을 확인하지만 이 세부 사항은 확정하지 않습니다.", "source_refs": [28], "university": "공통", "kind": "답변", "glossary": [3, 4]}, {"id": 150, "question": "AI 결과를 검토하며 발견한 문제는 무엇입니까?", "category": "AI 시대의 실행·검증·협업", "answer": ["제 탐구에서 직접 확인한 핵심 문제는 검색점수와 신뢰도를 같은 것으로 볼 수 없다는 점이었습니다. 점수가 높아도 실제 답이 맞는지 판단할 객관적인 기준이 부족했습니다. 화면에 숫자가 보인다는 이유만으로 검증됐다고 말할 수 없었습니다.", "그래서 저는 도구가 작동한다는 사실과 답의 정확성이 확인됐다는 사실을 나누고 한계를 알렸습니다. 제가 겪지 않은 특정 오답 사례를 만들어 말씀드리기보다, 이 검증상의 문제를 어떻게 발견하고 설명을 바꿨는지 말씀드리고 싶습니다. 앞으로는 확인된 질문과 근거를 준비해 검색 오류와 해석 오류를 따로 평가하겠습니다."], "evidence": ["3학년 · 자율활동 | PDF 4쪽 / 인쇄 5쪽\nTF-IDF 점수 공개와 객관적 신뢰도 기준 부재를 인식한 자율활동 기록입니다. 객관적 기준 없이 신뢰도를 검증할 수 없음을 발견하고 한계고지로 반영한 기록입니다."], "concepts": ["1. 검색점수는 무엇을 측정했는지가 핵심입니다. TF-IDF 기반 유사도는 질문과 문서의 표현상 관련성을 나타내는 수치이지 법적 적용의 정답 확률이 아닙니다. 같은 표현이 있어도 다른 시기의 조항이나 다른 품목의 규정일 수 있습니다.", "2. 한계 공개는 검증의 대체물이 아닙니다. 실제 개선 여부는 확인된 질문·근거 자료에서 검색 실패와 생성 실패를 나누어 평가해야 합니다. 이 평가체계를 이미 완성했다고 말하지 않고, 구현한 부분과 추가할 부분을 분리합니다."], "follow": ["그 문제를 어떻게 해결했나요? 점수의 의미와 한계를 알리는 기능은 넣었습니다. 독립적인 정답 자료로 정확도를 검증하는 일은 남은 과제로 구분했습니다."], "memory": "높은 검색점수 ≠ 검증된 정답", "caution": "", "source_refs": [28, 29], "university": "공통", "kind": "답변", "glossary": [4, 12, 16]}, {"id": 151, "question": "AI 없이도 본인의 탐구를 설명할 수 있습니까?", "category": "AI 시대의 실행·검증·협업", "answer": ["AI 없이도 제가 설정한 문제와 분석의 핵심 원리는 설명할 수 있어야 한다고 생각합니다. 예를 들어 관세를 누가 내는지와 누가 부담하는지가 왜 다른지, 검색점수가 왜 정답확률이 아닌지는 제 말과 간단한 사례로 설명해야 합니다. 그렇지 못하면 결과를 사용해도 제대로 이해했다고 보기 어렵습니다.", "다만 모든 코드를 기억해서 처음부터 작성하거나 복잡한 계산을 손으로 빠르게 하는 것과는 다른 문제입니다. 도구를 활용하더라도 자료의 출처와 계산의 의미, 오류가 생길 지점을 이해해야 합니다. 대학에서는 기초를 더 충실히 배워 AI를 사용하기 때문에 오히려 결과를 더 꼼꼼히 판단할 수 있는 사람이 되고 싶습니다."], "evidence": ["3학년 · 경제 수학 | PDF 18쪽 / 인쇄 19쪽\n경제 수학에 61개월, 설명력 54%→88%, 계수 크기 절반 감소, 정규방정식 계산이 기록되어 있습니다.", "3학년 · 자율활동 | PDF 4쪽 / 인쇄 5쪽\nTF-IDF 검색 채택과 정보 추적가능성을 높인 설계가 기록됩니다. 문제설정, 노코드에서 직접 코딩 전환, 검색·검증 구현과 한계발견의 기록입니다.", "2학년 · 독서활동상황 및 행동특성 종합의견 | PDF 20쪽 / 인쇄 21쪽\n디지털·AI 활용과 자료의 오류 검증 태도에 대한 행동특성 기록입니다."], "concepts": ["1. 설명 가능성은 모든 코드를 암기한다는 뜻이 아닙니다. 입력이 무엇인지, 어떤 절차를 거쳐 결과가 나오는지, 왜 그 방법을 골랐는지와 실패할 조건을 자신의 말로 설명할 수 있어야 합니다. 함수 이름을 외우는 것보다 간단한 예를 처리해 보는 방식이 이해를 확인하기 좋습니다.", "2. 재현은 실제 자료와 절차가 있어야 가능합니다. 코드·분석파일·설문지를 다시 열어 설명할 수 있는 범위를 점검합니다. 현재 해설집에 등장하는 예시 수치나 후속 개선안을 당시 구현한 사실로 바꾸어 말하지 않습니다."], "follow": ["지금 TF-IDF를 한 문장으로 설명해 보세요. 한 문서에서는 중요하게 등장하지만 여러 문서에 흔하지는 않은 단어에 가중치를 주어 관련 문서를 찾는 방식입니다."], "memory": "정의 → 작동 순서 → 내 선택 → 한계", "caution": "", "source_refs": [21, 29], "university": "공통", "kind": "답변", "glossary": [4, 36]}, {"id": 152, "question": "AI가 있는데 경제·수학·통계의 기초를 왜 배워야 합니까?", "category": "AI 시대의 실행·검증·협업", "answer": ["AI가 계산과 정리를 도와줄수록 기초학문이 더 필요하다고 생각합니다. 결과가 빠르게 나오면 잘못된 가정을 그대로 믿고 넘어갈 수도 있기 때문입니다. 제 환율 탐구에서도 R²가 높아졌다는 사실만 알았다면 예측력이 검증됐다고 오해할 수 있었습니다.", "경제학은 어떤 변수를 볼지, 수학과 통계는 계산이 무엇을 뜻하는지, 통상규범은 적용할 조건을 판단하는 데 필요합니다. 저는 AI를 기초공부의 대체재로 삼고 싶지 않습니다. 반복 작업의 도움을 받은 만큼 원리를 이해하고 다른 설명을 검토하는 데 시간을 쓰겠습니다. 도구의 속도와 제 판단의 정확성을 함께 높이고 싶습니다."], "evidence": ["3학년 · 경제 수학 | PDF 18쪽 / 인쇄 19쪽\nR² 상승과 계수 변화 및 VIF 확인의 실제 근거입니다. 3학년 경제 수학에서 금리차 모형의 잔차, 달러지수 추가와 계수 변화 및 VIF 검토가 기록되어 있습니다.", "3학년 · 심화 수학Ⅰ | PDF 18쪽 / 인쇄 19쪽\n3학년 심화 수학Ⅰ에 개념 발표와 비용전가 모형 분석이 기재되어 있습니다.", "2학년 · 교과 성적 | PDF 10쪽 / 인쇄 11쪽\n2학년 수학Ⅰ 3등급·수학Ⅱ 4등급을 함께 고려해야 합니다.", "3학년 · 3학년 1학기 교과 성적 | PDF 16, 18쪽 / 인쇄 17, 19쪽\n3학년 1학기 성적표에 경제 수학 97점 A와 심화 수학Ⅰ 74점 B가 기재되어 있습니다. 서로 다른 과목의 성적이므로 동일 평가의 향상 폭으로 계산하지 않습니다."], "concepts": ["1. 자동 계산과 올바른 질문은 별개입니다. 회귀를 실행하는 도구가 있어도 변수의 정의, 관측 기간, 누락요인과 인과적 해석의 조건은 사용자가 이해해야 합니다. 경준의 달러지수 추가 후 계수 변화는 기초 공부의 필요를 보여 주는 구체적인 사례입니다.", "2. 정량분석은 단위와 가정을 읽는 일까지 포함합니다. 관세율 15%와 기업의 부담 비중 40%처럼 분모가 다르면 계산을 바로 연결할 수 없습니다. 결과를 검토할 수 있는 기초를 갖추겠다는 계획과 이미 대학 수준 분석을 숙달했다는 주장은 구별합니다."], "follow": ["기초 없이도 결과를 얻을 수는 있지 않나요? 결과는 얻을 수 있지만 무엇을 믿어야 할지 판단하기 어렵습니다. R²가 높다는 사실과 정책 효과를 알아냈다는 주장을 구별하려면 통계의 기본이 필요합니다."], "memory": "계산의 자동화 / 해석의 기초", "caution": "", "source_refs": [21], "university": "공통", "kind": "답변", "glossary": [37, 39]}, {"id": 153, "question": "AI를 활용하는 팀 프로젝트를 어떻게 이끌겠습니까?", "category": "AI 시대의 실행·검증·협업", "answer": ["먼저 팀이 해결하려는 질문과 AI를 사용할 범위를 함께 정하겠습니다. 결과물을 빨리 만드는 사람에게 모든 역할이 몰리기보다 자료 확인, 분석, 표현과 검토를 나누고 서로 설명할 수 있게 하고 싶습니다. AI의 결과를 검토하는 사람에게도 필요한 시간과 역할이 있어야 합니다.", "저는 경제동아리에서 학습지를 만들고, 질문탐구에서 역할과 의견을 조율한 경험이 있습니다. 그 경험을 살려 구성원의 이해와 참여를 확인하겠습니다. 팀의 결과물이 좋은 이유를 한 사람만 설명할 수 있다면 협업이 충분하지 않다고 생각합니다. 도구의 도움을 받더라도 각자가 판단한 부분과 공동의 결론을 설명하는 팀을 만들고 싶습니다."], "evidence": ["2학년 · 동아리활동 경제해부학2 | PDF 3쪽 / 인쇄 4쪽\n2학년 동아리활동의 창설·기장·학습지 제작이 핵심 근거입니다.", "2학년 · 독서활동상황 및 행동특성 종합의견 | PDF 20쪽 / 인쇄 21쪽\n신규 동아리 창설과 부원선발 전 과정 운영의 행동특성 기록입니다.", "2학년 · 자율활동 질문탐구 활동 | PDF 3쪽 / 인쇄 4쪽\n질문탐구의 역할 배분·데이터 분석 총괄·논의 수렴·대표 질의응답이 직접 근거입니다.", "2학년 · 행동특성 및 종합의견 | PDF 20쪽 / 인쇄 21쪽\n디지털·AI 리터러시 활용, 자료 분석과 오류 검증, 근거 있는 의사 표현, 학급 의견을 대변하는 소통, 동아리 창설·선발 운영이 기록됩니다."], "concepts": ["1. 협업의 목표는 결과물 한 개만 만드는 것이 아닙니다. 각자가 맡은 근거를 설명하고 다른 사람이 점검할 수 있어야 공동 책임이 가능합니다. 질문탐구의 역할 배분과 논의 수렴은 실제 경험이며, AI 팀 운영의 구체적 절차는 앞으로의 적용 계획입니다.", "2. 공동 검토에서는 동일한 AI 답을 여러 명이 다시 읽는 것만으로 충분하지 않습니다. 원문 대조, 계산 확인, 반대 사례 검토처럼 서로 다른 확인 역할을 나누면 공통 오류를 놓칠 가능성을 줄일 수 있습니다. 이러한 효과를 이미 측정했다는 뜻은 아닙니다."], "follow": ["AI를 잘 다루는 사람에게 일을 몰아주는 게 효율적이지 않나요? 일부 작업은 빠를 수 있지만 팀 전체가 결과를 설명하지 못하면 검토가 약해집니다. 자료 확인과 판단 기준을 공유하는 역할 분담이 필요하다고 생각합니다."], "memory": "공동 질문 → 역할 분담 → 함께 검토", "caution": "", "source_refs": [], "university": "공통", "kind": "답변", "glossary": [1]}, {"id": 154, "question": "본인의 의견이나 AI의 답과 팀원의 의견이 다르면 어떻게 하겠습니까?", "category": "AI 시대의 실행·검증·협업", "answer": ["제 의견이 분명하더라도 먼저 어떤 기준에서 다른 결론이 나왔는지 듣겠습니다. 질문탐구에서 불평등을 논의할 때도 보상과 기회라는 서로 다른 기준을 함께 살펴야 했습니다. 의견을 반씩 섞는 것보다 어떤 조건에서 각 주장이 타당한지 정리하는 것이 중요했습니다.", "AI가 제시한 결론과 팀원의 생각이 다를 때도 같은 방식으로 접근하겠습니다. 출처와 가정, 측정한 대상을 맞추고 확인 가능한 것은 자료로 검토하겠습니다. 근거가 부족하면 제안 단계로 남기거나 추가로 조사하겠습니다. 저는 자신감 있게 말하는 것과 제 의견을 수정하지 않는 것은 다르다고 생각합니다."], "evidence": ["2학년 · 자율활동 질문탐구 활동 | PDF 3쪽 / 인쇄 4쪽\n질문탐구의 역할 배분·데이터 분석 총괄·논의 수렴·대표 질의응답이 직접 근거입니다.", "2학년 · 자율활동 팀별 주제 탐구 | PDF 2–3쪽 / 인쇄 3–4쪽\n팀 리더로 네 관점을 제안하고 경제보고서·학술자료를 비교하며 단기 부양과 재정·공급망 효과를 분석.", "2학년 · 행동특성 및 종합의견 | PDF 20쪽 / 인쇄 21쪽\n디지털·AI 리터러시 활용, 자료 분석과 오류 검증, 근거 있는 의사 표현, 학급 의견을 대변하는 소통, 동아리 창설·선발 운영이 기록됩니다."], "concepts": ["1. 의견의 차이는 사실의 차이와 가치 기준의 차이에서 생길 수 있습니다. 감세를 평가할 때 단기 투자와 장기 재정, 환경 비용 중 무엇을 보는지가 다를 수 있습니다. 같은 자료를 두고도 질문이 다르면 결론을 직접 비교하기 어렵습니다.", "2. 근거를 받아들여 수정하는 것과 무조건 다수에 따르는 것은 다릅니다. 반대 자료가 자신의 주장을 바꾸는 이유를 설명하고, 확인되지 않은 쟁점은 보류할 수 있습니다. 실제로 겪지 않은 큰 다툼이나 극적인 화해 장면을 추가하지 않습니다."], "follow": ["토론이 길어져 결정을 못 하면요? 지금 결정에 꼭 필요한 쟁점을 좁히고, 확인된 부분과 추가 확인이 필요한 부분을 구분하겠습니다. 임시 결정을 한다면 조건과 다시 검토할 시점을 함께 정하겠습니다."], "memory": "대상·기준 확인 → 근거 비교 → 수정", "caution": "", "source_refs": [], "university": "공통", "kind": "답변", "glossary": [1, 95]}, {"id": 155, "question": "AI를 모르는 사람에게 도구를 어떻게 설명하겠습니까?", "category": "AI 시대의 실행·검증·협업", "answer": ["저는 먼저 그 사람이 실제로 궁금해하는 질문으로 설명하겠습니다. 제 통상정보 도구라면 ‘기업이 관세 규정의 근거를 찾기 어렵다’는 문제부터 말하고, 관련 문서를 찾은 뒤 답변에 참고하게 한다고 설명할 것입니다. 기술 이름은 그 흐름을 이해한 다음에 붙이겠습니다.", "학술제에서 도구의 검색 원리와 점수체계를 설명했고, 동아리에서는 경제 개념을 학습지로 풀어 쓴 경험이 있습니다. 이런 과정에서 쉬운 표현과 정확한 설명을 함께 지켜야 한다고 느꼈습니다. 예를 들어 검색점수를 시험점수처럼 비유하면 오해할 수 있어 무엇을 재는 숫자인지 직접 설명하겠습니다. 제가 아는 것을 상대가 판단할 수 있게 바꾸는 능력을 키우고 싶습니다."], "evidence": ["3학년 · 자율활동 | PDF 4쪽 / 인쇄 5쪽\n3학년 학술제에서 전교생을 대상으로 도구를 실시간 시연하고 원리와 한계를 설명한 기록입니다. 전교생 대상 검색원리·점수체계·한계 설명입니다.", "2학년 · 영어Ⅱ | PDF 12쪽 / 인쇄 13쪽\n2학년 영어Ⅱ에서 영어강연 분석과 발표 재설계·시연이 확인됩니다. 영어강연 분석, 훅과 논리적 스토리라인을 활용한 발표 재설계입니다.", "2학년 · 행동특성 및 종합의견 | PDF 20쪽 / 인쇄 21쪽\n디지털·AI 리터러시 활용, 자료 분석과 오류 검증, 근거 있는 의사 표현, 학급 의견을 대변하는 소통, 동아리 창설·선발 운영이 기록됩니다."], "concepts": ["1. 설명은 상대의 판단에 필요한 정보를 고르는 일입니다. 사용자 질문, 찾아온 근거, 생성된 설명, 확인이 필요한 조건의 순서로 이야기하면 기술용어를 몰라도 도구의 역할을 이해할 수 있습니다. 학술제에서 원리와 점수체계를 설명한 기록이 근거입니다.", "2. 쉬운 설명과 과장은 다릅니다. ‘관련 문서를 찾아준다’는 기능을 ‘법적 정답을 판정한다’고 바꾸면 단순화가 아니라 의미의 변경입니다. 청중이 직접 확인할 수 있는 근거와 불확실한 부분을 함께 보여주는 방식이 좋습니다."], "follow": ["쉽게 설명하다가 정확성을 잃을 수 있지 않나요? 비유를 쓰더라도 원래 개념과 다른 부분을 함께 설명하겠습니다. 검색점수를 시험 정답률에 빗대기보다 어떤 관련성을 계산한 값인지 말하겠습니다."], "memory": "생활 질문 → 검색 과정 → 점수의 한계", "caution": "", "source_refs": [], "university": "공통", "kind": "답변", "glossary": [3, 4]}, {"id": 156, "question": "실행하다가 멈추거나 방향을 바꾼 경험이 있습니까?", "category": "AI 시대의 실행·검증·협업", "answer": ["윤리적 판단을 수치로 자동화하려던 구상을 멈춘 경험을 말씀드리고 싶습니다. 처음에는 이익과 피해를 비교하면 AI가 판단을 도울 수 있을지 생각했지만, 어떤 가치에 더 큰 비중을 둘지 정하는 것 자체가 판단이었습니다. 숫자로 표현해도 그 기준이 정당해지는 것은 아니었습니다.", "저는 실행력이 시작한 일을 무조건 밀어붙이는 능력은 아니라고 생각합니다. 목적과 맞지 않는 부분은 멈추고, 근거를 정리하는 기능처럼 책임질 수 있는 범위로 다시 정하는 것도 실행의 일부입니다. 대학에서도 새로운 기술을 활용하되 무엇을 할 수 있는지와 무엇을 맡겨도 되는지를 나눠 판단하고 싶습니다."], "evidence": ["3학년 · 생활과 윤리 | PDF 17쪽 / 인쇄 18쪽\n가치판단을 RAG에 결합하려다 가치의 객관화 한계를 인식해 중단한 과정. 3학년 생활과 윤리에 TAC, 싱어·흄·롤스·요나스, 형량 계산 기능 중단과 책임귀속의 구분이 기록됩니다.", "3학년 · 실용 경제 | PDF 17쪽 / 인쇄 18쪽\n자기 시간의 기회비용 반영과 제한된 시간의 지불의사 검증 계획.", "3학년 · 자율활동 | PDF 4쪽 / 인쇄 5쪽\n근거를 검색하고 한계를 공개하는 도구 활동과 연결됩니다."], "concepts": ["1. 중단은 실패를 미화하는 말이 아니라 판단의 이유를 설명하는 일입니다. 가치의 무게를 객관적인 숫자로 정하기 어렵다는 문제를 발견해 기능의 범위를 바꾼 것이 기록된 행동입니다. 실제 구현 여부가 확인되지 않는 기능을 만들었다가 삭제했다고 말하지 않습니다.", "2. 가치를 계산하는 모형은 선택한 가중치에 따른 결과를 보여줄 수 있습니다. 그 가중치가 정당한지까지 계산이 증명하지는 않습니다. 사실 판단의 추적가능성과 가치 판단의 책임을 구별하는 것이 이 활동의 핵심입니다."], "follow": ["중단한 것을 실행력이라고 할 수 있나요? 처음 목표를 무조건 밀어붙이는 것보다 목적에 맞지 않는 기능을 줄이고 필요한 기능에 집중하는 판단도 실행에 포함된다고 생각합니다."], "memory": "기능 확장 → 기준의 문제 → 범위 조정", "caution": "", "source_refs": [33], "university": "공통", "kind": "답변", "glossary": [79]}, {"id": 157, "question": "만든 도구가 실제로 도움이 됐다는 것을 어떻게 확인하겠습니까?", "category": "AI 시대의 실행·검증·협업", "answer": ["우선 제가 만든 도구가 기업의 문제를 해결했다고 단정하지 않겠습니다. 배포하고 시연한 사실은 있지만 실제 기업의 비용을 얼마나 줄였는지까지 측정한 것은 아닙니다. 도움이 되기를 바랐다는 의도와 효과가 확인됐다는 결과는 구분해야 한다고 생각합니다.", "다시 검증한다면 어떤 규정의 근거를 찾는 상황인지 범위를 정하고, 도구 사용 전후의 확인 시간과 오류, 원문까지 확인할 수 있는지를 비교하고 싶습니다. 또 기업이 반복해서 쓰는지와 비용을 지불할지도 따로 살피겠습니다. 제가 만든 것이라는 이유로 좋게 평가하기보다 사용자가 실제로 어떤 결정을 더 잘하게 됐는지 묻겠습니다."], "evidence": ["3학년 · 자율활동 | PDF 4쪽 / 인쇄 5쪽\n객관적 기준 없이 신뢰도를 검증할 수 없음을 발견하고 한계고지로 반영한 기록입니다.", "3학년 · 실용 경제 | PDF 17쪽 / 인쇄 18쪽\n3학년 실용 경제의 월 4명→20명 재계산과 유지관리 시간, 유효수요 검토가 직접 근거입니다."], "concepts": ["1. 성능과 사용자 가치는 다른 기준입니다. 검색한 문서가 질문과 관련 있는지, 설명이 근거를 충실히 반영하는지, 사용자가 원문 확인 시간을 줄였는지 등을 나누어 평가할 수 있습니다. 무엇을 성공으로 볼지 먼저 정해야 결과를 유리하게 해석하는 일을 줄일 수 있습니다.", "2. 경제적 검증에는 대체재와 유지비도 들어갑니다. 무료 공공정보가 충분하면 정확한 도구여도 유료수요는 작을 수 있습니다. 손익분기 4명에서 20명으로의 변화는 비용범위 수정에 따른 계산이며 실제 확보 고객 수가 아닙니다."], "follow": ["사용자 수가 많으면 유용한 도구 아닌가요? 관심을 받은 근거는 되지만 실제로 판단을 도왔는지는 별도입니다. 오류와 확인시간, 반복 사용의 이유를 함께 살펴야 합니다."], "memory": "정확성 / 시간 절감 / 실제 활용", "caution": "", "source_refs": [28], "university": "공통", "kind": "답변", "glossary": [54, 16, 62]}, {"id": 158, "question": "AI가 제안한 생각을 자신의 생각이라고 말할 수 있습니까?", "category": "AI 시대의 실행·검증·협업", "answer": ["처음 떠올린 아이디어라는 사실보다 제가 이해하고 판단해 책임질 수 있는지가 중요하다고 생각합니다. AI가 제안한 문장이나 방법을 참고할 수는 있지만, 왜 제 문제에 맞는지 설명하지 못한다면 그대로 제 생각이라고 말하기 어렵습니다.", "저는 통상정보 도구의 목적과 구현 방식을 선택하고 검색점수의 한계를 다시 검토했습니다. 이런 선택의 이유를 제 말로 설명하는 것이 제 몫입니다. 다른 사람이나 AI의 도움을 받은 부분은 밝히고, 검토한 결과 제 판단이 바뀌었다면 그 과정도 설명하겠습니다. 좋은 생각을 얻는 것과 그 생각을 자기 책임 아래 실행하는 것은 다른 단계라고 봅니다."], "evidence": ["3학년 · 자율활동 | PDF 4쪽 / 인쇄 5쪽\n문제설정, 노코드에서 직접 코딩 전환, 검색·검증 구현과 한계발견의 기록입니다.", "2학년 · 독서활동상황 및 행동특성 종합의견 | PDF 20쪽 / 인쇄 21쪽\n디지털·AI 활용과 자료의 오류 검증 태도에 대한 행동특성 기록입니다.", "3학년 · 논리학 | PDF 17쪽 / 인쇄 18쪽\n3학년 논리학에서 비형식 오류 분석의 한계, 흄의 논리맵, 연쇄형에서 수렴형 논증으로의 수정과 전환비용 문제를 검토했습니다."], "concepts": ["1. 아이디어의 출처와 최종 판단의 책임은 구분합니다. 초안을 참고했다면 그 사실을 숨기지 않고, 선택·수정·검증에서 자신이 한 행동을 설명합니다. 출처를 밝히는 것만으로 내용의 정확성이 확보되는 것은 아니므로 근거 확인도 필요합니다.", "2. 평가 목적에 따라 허용되는 도움의 범위가 달라질 수 있습니다. 수업이나 대학이 정한 AI 사용 규정을 먼저 따라야 합니다. 이 문항은 정직한 기여 설명을 연습하는 것이며, 실제로 하지 않은 독자적 추론 과정을 만들어 내는 기술이 아닙니다."], "follow": ["AI가 먼저 제안했다면 본인의 역할은 없나요? 역할이 없다고 보지는 않습니다. 어떤 제안을 채택했고 무엇을 고쳤으며 어떤 근거로 결론을 냈는지 설명해야 한다고 생각합니다."], "memory": "출발의 도움 → 근거 검토 → 판단 책임", "caution": "", "source_refs": [], "university": "공통", "kind": "답변", "glossary": [1, 95]}, {"id": 159, "question": "AI가 정보와 기회의 격차를 줄일 수 있다고 생각합니까?", "category": "AI 시대의 실행·검증·협업", "answer": ["AI를 사용할 수 있다는 사실만으로 모두 같은 기회를 갖는 것은 아니라고 생각합니다. 어떤 문제를 물어야 할지 아는 지식과 결과를 검토할 시간, 이용할 수 있는 자료가 다르면 활용의 효과도 달라질 수 있습니다. 기업 인터뷰에서 정보 접근의 차이가 대응의 차이로 이어지는 문제를 봤습니다.", "그래서 저는 도구를 제공하는 것과 함께 사용자가 이해할 설명도 중요하다고 생각합니다. 동아리에서 초심자를 위한 학습지를 만들었던 경험처럼, 어려운 원리와 한계를 쉽게 전달하는 역할을 하고 싶습니다. AI의 편리함을 활용하면서 그 혜택이 어떤 조건의 사람에게만 집중되는지도 살피는 태도를 갖추겠습니다."], "evidence": ["3학년 · 진로활동 | PDF 4–5쪽 / 인쇄 5–6쪽\n기업별 관세 부담과 정보시차의 차이를 인터뷰로 탐구.", "2학년 · 동아리활동 경제해부학2 | PDF 3쪽 / 인쇄 4쪽\n경제 개념을 어려워하는 학생을 위한 학습지 제작.", "1학년 · 자율활동 사회 돋보기 활동 | PDF 1쪽 / 인쇄 2쪽\nAI·로봇의 노동시장 영향과 숙련 격차, 재교육·전환 비용에 대한 탐구."], "concepts": ["1. 접근성은 도구에 접속할 수 있는지를 넘어섭니다. 필요한 언어, 디지털 기초, 정보의 신뢰를 판단할 능력, 의사결정 권한이 있어야 정보를 행동으로 바꿀 수 있습니다. 기업 인터뷰의 정보시차와 동아리 학습지의 눈높이 설명을 연결할 수 있습니다.", "2. 기술의 효과는 집단마다 다를 수 있습니다. 이미 자료와 전문 인력이 있는 조직이 더 큰 이익을 얻을 가능성도 있습니다. AI가 무조건 평등을 만든다거나 격차를 반드시 확대한다는 결론 대신 어떤 조건을 개선할지 말합니다."], "follow": ["무료로 제공하면 격차가 해결되나요? 비용 장벽은 줄일 수 있지만 정확한 질문을 하고 결과를 이해할 능력, 대응할 자원은 여전히 필요합니다. 교육과 사용 환경도 함께 봐야 합니다."], "memory": "접근의 확대 / 활용 조건의 격차", "caution": "", "source_refs": [36], "university": "공통", "kind": "답변", "glossary": [1, 62]}, {"id": 160, "question": "AI의 원칙과 가치 기준은 누가 정해야 한다고 생각합니까?", "category": "AI 시대의 실행·검증·협업", "answer": ["저는 원칙을 정할 때 영향을 받는 사람들의 관점이 반영되고, 그 기준을 공개하고 수정할 수 있는지가 중요하다고 생각합니다. Constitutional AI를 공부하며 원칙이 있다는 사실과 그 원칙이 모두에게 정당하다는 것은 다르다고 느꼈습니다.", "예를 들어 편리한 답변을 제공하는 것과 불확실한 판단을 신중하게 하는 것은 충돌할 수 있습니다. 어떤 분야에서 어떤 위험을 더 중요하게 볼지 설명이 필요합니다. 제가 혼자 보편적인 정답을 정하기보다 사용자와 전문가의 의견을 듣고, 문제가 확인되면 기준을 고칠 수 있는 구조를 생각하겠습니다. 원칙의 내용과 만드는 과정 모두에 관심을 갖고 싶습니다."], "evidence": ["3학년 · 자율활동 | PDF 4쪽 / 인쇄 5쪽\n자신의 RAG 검색도구와 근거공개 활동입니다. 근거를 검색하고 한계를 공개하는 도구 활동과 연결됩니다.", "3학년 · 과목명 없이 이어지는 추가 세특 문단 | PDF 17–18쪽 / 인쇄 18–19쪽\n헌법적 AI의 원칙 내재화와 WTO 규범·측정공백을 비교한 추가 세특 기록입니다. 3학년 과목명 없는 추가 세특에 헌법적 AI, TBT 부속서1, WTO AI 정책지표와 점유율 가중 채택률 제안이 기록되어 있습니다.", "3학년 · 생활과 윤리 | PDF 17쪽 / 인쇄 18쪽\n3학년 생활과 윤리에 TAC, 싱어·흄·롤스·요나스, 형량 계산 기능 중단과 책임귀속의 구분이 기록됩니다."], "concepts": ["1. 헌법적 AI의 원칙은 국가 헌법의 법적 지위와 다릅니다. 개발자가 선택한 원칙을 비판·수정과 선호학습에 활용하는 방식입니다. 원칙을 명시하면 점검할 실마리가 생기지만 대표성이나 중립성이 자동으로 보장되지는 않습니다.", "2. 이해관계자 참여는 절차와 책임의 문제입니다. 개발자뿐 아니라 사용자와 영향을 받는 집단의 관점이 다를 수 있습니다. 학생의 제안은 투명성과 이의제기·수정 가능성을 높이자는 방향이며, 이미 운영한 공론화 제도로 묘사하지 않습니다."], "follow": ["모든 사람의 의견을 다 넣으면 결정이 어렵지 않나요? 그렇기 때문에 쟁점별 참여 방식과 결정 책임을 분명히 해야 한다고 생각합니다. 모든 의견이 같은 결론이 될 필요는 없지만 어떤 의견을 왜 반영했는지는 설명해야 합니다."], "memory": "원칙의 공개 → 영향받는 사람의 참여 → 수정 절차", "caution": "", "source_refs": [14, 17, 28, 33, 63, 64], "university": "공통", "kind": "답변", "glossary": [7, 8, 79]}, {"id": 161, "question": "기업 자료를 AI로 분석할 때 무엇을 주의하겠습니까?", "category": "AI 시대의 실행·검증·협업", "answer": ["기업이나 개인의 정보를 AI에 입력하기 전에 그 정보가 꼭 필요한지부터 판단하겠습니다. 계약과 거래가격처럼 민감한 자료는 공개된 정보와 다르게 다뤄야 합니다. 필요하지 않은 식별정보는 제외하고, 사용 권한과 보관·공유 조건을 확인하는 방향으로 설계하고 싶습니다.", "기업의 판단을 돕는 도구가 오히려 정보를 노출한다면 목적에 맞지 않습니다. 제 기존 도구가 이러한 보호체계를 모두 구현했다는 뜻은 아닙니다. 앞으로 현장 자료를 다룰 때 준비해야 할 과제로 생각합니다. 분석의 정확성만큼 자료를 맡긴 사람이 어떤 위험을 지는지도 책임 있게 살피겠습니다."], "evidence": ["2학년 · 문학 | PDF 11쪽 / 인쇄 12쪽\n자아와 기억 데이터에 관한 문학 에세이에서 데이터 현지화 규제와 디지털무역으로 확장한 탐구. 2학년 문학의 데이터 현지화와 규범 예측가능성 탐구가 선행 활동입니다.", "3학년 · 자율활동 | PDF 4쪽 / 인쇄 5쪽\n문학의 데이터 현지화 비용분석을 통상정보 도구 구축으로 연결한 기록. 3학년 자율활동의 검색도구 구현·배포·시연과 한계고지입니다.", "3학년 · 진로활동 | PDF 4–5쪽 / 인쇄 5–6쪽\n3학년 진로의 기업 정보격차 발견입니다."], "concepts": ["1. 개인정보와 영업비밀은 구별되면서 함께 보호해야 하는 대상입니다. 식별자 삭제만으로 재식별 가능성이나 계약상 비밀유지 의무가 사라지지 않을 수 있습니다. 실제 법적 의무는 자료와 계약, 관할 규정에 따라 검토해야 하며 이 문항은 법률 자문이 아닙니다.", "2. 이 답변은 앞으로의 업무 원칙입니다. 학생부에 별도의 보안 시스템을 구현하거나 기업의 민감자료 처리 승인을 받았다는 기록은 없습니다. 공개자료 우선, 허용된 도구·범위 확인, 필요한 정보만 사용, 결과의 사람 검토라는 계획을 이미 실행한 보안 실적으로 바꾸지 않습니다."], "follow": ["이름만 지우면 안전한가요? 다른 정보와 결합해 기업이나 거래를 알아볼 수 있고 영업비밀도 남을 수 있습니다. 이름 삭제만으로 충분하다고 보지 않고 이용 목적과 자료 범위를 먼저 확인하겠습니다."], "memory": "허용 범위 → 최소 자료 → 검토·책임", "caution": "미래의 업무 원칙입니다. 기업 자료의 안전한 처리나 규정 준수를 이미 검증한 실적으로 말하지 않습니다.", "source_refs": [28, 46, 47], "university": "공통", "kind": "답변", "glossary": [11]}, {"id": 162, "question": "중앙대에서 금융과 AI를 어떻게 연결해 공부하고 싶습니까?", "category": "AI 시대의 실행·검증·협업", "answer": ["중앙대에서는 금융의 기초와 AI를 연결하되, 제가 무엇을 더 배우려는지 분명히 하고 싶습니다. 금융통계와 국제재무관리로 기업의 자료와 의사결정을 이해하고, 금융AI 융합전공의 이수 조건을 확인해 금융데이터분석과 금융인공지능실습 같은 공부로 확장하는 데 관심이 있습니다.", "제가 해 본 통상정보 검색과 기업의 재무분석은 같은 과제는 아닙니다. 그래서 기술을 가져다 붙이기보다 어떤 금융 문제에서 어떤 자료가 필요한지부터 배우겠습니다. 기업의 관세·환율 위험을 분석하고 그 결과의 근거를 설명하는 프로젝트를 해 보고 싶습니다. 생각을 구현해 본 경험을 전공의 깊이와 연결하는 것이 목표입니다."], "evidence": ["3학년 · 경제 수학 | PDF 18쪽 / 인쇄 19쪽\n환율 회귀 경험을 금융수학·통계·시계열 학습으로 이어가는 근거. 누락변수 가능성을 살피며 환율 모형을 수정한 과정.", "3학년 · 진로활동 | PDF 4–5쪽 / 인쇄 5–6쪽\n기업별 관세 부담을 재무 시나리오로 확장할 근거. 현장 인터뷰로 분석의 범위를 확장한 경험.", "2학년 · 동아리활동 경제해부학2 | PDF 3쪽 / 인쇄 4쪽\n경제 학습지를 제작하고 동아리에서 함께 배운 경험."], "concepts": ["1. 학업계획의 역할 분담입니다. 금융통계는 자료의 불확실성을, 국제재무관리는 해외 거래의 자금과 위험을 공부하는 데 연결됩니다. 검색도구 경험이 금융 예측 능력을 바로 증명하는 것은 아니므로 전공 기초가 먼저 필요합니다.", "2. 2026년 10월 22일 확인한 중앙대 금융AI 융합전공 공식 페이지에는 금융데이터분석, 금융기계학습, 금융인공지능, 금융인공지능실습(1)·(2) 등이 안내됩니다. 별도 융합전공이며 개설·이수·선발 조건은 적용 학사 안내를 따라야 합니다. 입학 즉시 참여가 확정됐다고 말하지 않습니다."], "follow": ["글로벌금
