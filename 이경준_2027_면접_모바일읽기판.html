ce_refs": [26], "university": "공통", "kind": "답변", "glossary": [99]}, {"id": 55, "question": "세 건의 사례로 전체 수출기업을 일반화할 수 있습니까?", "category": "관세와 기업 인터뷰", "answer": ["세 건으로 전체 수출기업의 평균을 일반화할 수는 없습니다. 응답한 기업이 전체 기업을 대표한다고 볼 수 없고, 기업마다 부담을 설명하는 기준도 다를 수 있습니다. 그래서 제 활동은 평균 효과를 추정한 연구보다 어떤 조건을 추가로 조사해야 하는지 찾은 사례연구로 설명하는 것이 정확합니다.", "그렇지만 실제 기업에 물었기 때문에 정보시차와 거래관계처럼 이론만 읽을 때 놓치기 쉬운 질문을 얻었습니다. 다음에는 업종과 규모를 나눠 사례를 늘리고, 가격과 계약 자료도 가능한 범위에서 비교하고 싶습니다. 저는 이번 탐구의 의미가 모든 기업의 답을 찾은 데보다, 다음 조사를 더 정확하게 설계할 단서를 만든 데 있다고 생각합니다."], "evidence": ["3학년 · 진로활동 | PDF 4–5쪽 / 인쇄 5–6쪽\n표본규모와 자기보고 자료의 한계를 스스로 밝힌 진로활동 기록입니다."], "concepts": ["1. 대표성과 사례연구의 목적  대표성은 조사대상이 설명하려는 모집단을 얼마나 적절하게 반영하는가의 문제입니다. 가상 예시로 인터뷰에 응한 기업이 정보부족을 특히 크게 느낀 기업들이라면 그 경험을 모든 기업의 평균으로 볼 수 없습니다. 사례연구는 특정 현상이 어떤 과정으로 발생하는지 살피는 데 유용하지만, 표본 수가 작다고 자동으로 깊은 설명이 보장되는 것도 아닙니다.", "2. 자기보고와 자료 대조  자기보고는 응답자가 기억과 판단으로 제공한 자료입니다. 부담을 계산하는 기준이 서로 다르거나 중요한 조건을 빠뜨릴 수 있습니다. 동일한 질문틀을 사용하고 계약·가격·회계자료와 대조하면 신뢰성을 높일 수 있지만, 기업의 비밀과 자료접근 제한도 고려해야 합니다. 경준의 후속 계획은 인터뷰를 무시하는 것이 아니라 그 해석범위를 더 분명하게 만드는 방법입니다. 예외적인 사례도 이론의 빠진 조건을 발견하는 데 가치가 있지만, 사례를 고른 이유를 설명해야 합니다. 결론에 맞는 응답만 남기면 탐색 자체가 편향될 수 있습니다. 반대되는 사례가 있었는지와 응답하지 않은 기업의 범위를 기록하는 것이 도움이 됩니다."], "follow": ["그렇다면 이 연구의 성과는 무엇입니까?  전체 비율을 추정한 성과보다, 단순한 세율 비교로 놓치기 쉬운 정보시차와 거래조건을 다음 조사변수로 구체화한 성과가 있습니다."], "memory": "전체 평균보다 다음 조사변수", "caution": "현재 기록은 이메일 포함 세 건입니다. 기존 문서의 직접 두 건과 공개자료 한 건이라는 설명을 섞지 않습니다.", "source_refs": [], "university": "공통", "kind": "답변", "glossary": [99]}, {"id": 56, "question": "정보 시차를 비용이라고 부른 이유는 무엇입니까?", "category": "관세와 기업 인터뷰", "answer": ["정보를 늦게 알면 선택을 바꿀 기회가 줄어들 수 있기 때문입니다. 기업 인터뷰에서 정책을 뒤늦게 파악해 가격을 조정할 시기를 놓친 사례를 봤습니다. 결국 같은 정보를 알게 되더라도 계약을 정하기 전인지 후인지에 따라 활용할 수 있는 범위는 달랐습니다.", "그래서 저는 통상정보의 가치를 문서의 양보다 실제 결정을 돕는 시점과 관련성에서 찾고 싶습니다. 다만 제 인터뷰로 정보시차의 손실액을 따로 계산한 것은 아닙니다. 앞으로는 정보인지일과 계약일, 가격변경일을 나눠 조사해 보고 싶습니다. 정보를 제공하는 사람이라면 언제 필요한 정보인지까지 생각해야 한다고 느꼈습니다."], "evidence": ["3학년 · 진로활동 | PDF 4–5쪽 / 인쇄 5–6쪽\n정보인지 시점이 가격조정 기회와 연결된 인터뷰 사례입니다.", "3학년 · 자율활동 | PDF 4쪽 / 인쇄 5쪽\n법적 근거를 확인하는 검색도구의 개발 동기입니다."], "concepts": ["1. 거래비용과 정보비용  거래비용에는 물건값 외에도 상대를 찾고, 조건을 확인하고, 계약을 협상하고, 이행을 감시하는 비용이 포함됩니다. 정보비용은 이 과정에서 정보를 찾고 해석하는 시간과 자원입니다. 가상 예시로 같은 규정을 읽는 데 기업마다 반나절과 여러 날이 걸린다면 대응속도가 달라질 수 있습니다. 이 예시는 설명용이며 경준의 실제 인터뷰 시간 측정값이 아닙니다.", "2. 정보의 가치가 생기는 조건  정보는 선택을 바꿀 가능성이 있을 때 경제적 가치를 가질 수 있습니다. 이미 변경 불가능한 계약이거나 기업에 대응자원이 없다면 정보만 빨라져도 편익이 작을 수 있습니다. 따라서 통상정보 서비스의 가치는 문서 수보다 사용자가 결정을 내리는 시점에 필요한 근거를 제공하는지로 평가해야 합니다. 경준의 후속 사업성 탐구와도 이어지는 관점입니다. 정보를 일찍 알아도 이번 계약을 바꾸지 못할 수 있습니다. 그 경우 다음 계약이나 재고 계획에 활용될 가능성은 따로 평가할 수 있습니다. 정보가 도착한 순간의 효과와 이후 의사결정에 남는 효과를 구분하면 서비스의 가치를 더 정확하게 살필 수 있습니다."], "follow": ["정보를 많이 제공할수록 가치가 큰가요?  양이 많아도 관련성이 낮거나 서로 충돌하면 해석비용이 커질 수 있습니다. 필요한 정보의 정확성과 시점이 더 중요할 수 있습니다."], "memory": "정보가 행동을 바꿀 때 가치가 생긴다", "caution": "", "source_refs": [26], "university": "공통", "kind": "답변", "glossary": [22, 83, 99]}, {"id": 57, "question": "공급망 다변화는 효율성을 떨어뜨리지 않습니까?", "category": "관세와 기업 인터뷰", "answer": ["공급망을 다변화하면 평상시 비용이 높아질 수 있습니다. 새 공급처를 찾고 품질을 확인하고 관리하는 비용이 생기기 때문입니다. 다만 한 공급처가 멈췄을 때의 손실도 비용으로 봐야 하므로, 단가가 가장 낮은 선택이 항상 가장 유리한 선택은 아닐 수 있습니다.", "반도체와 배터리 공급망을 공부하면서 저는 공급처의 숫자보다 어떤 위험을 나누는지에 관심을 갖게 됐습니다. 두 나라에서 조달해도 같은 원재료나 물류 경로에 의존하면 함께 영향을 받을 수 있습니다. 다변화를 무조건 확대하기보다 중단위험과 전환비용을 함께 비교해 기업에 맞는 수준을 찾는 것이 중요하다고 생각합니다."], "evidence": ["2학년 · 진로활동 진로 연계 심층 탐구 프로젝트 | PDF 3쪽 / 인쇄 4쪽\n반도체 수출전환과 국제정세를 연결한 탐구가 배경입니다.", "2학년 · 국제 관계와 국제기구 | PDF 14쪽 / 인쇄 15쪽\n전기차 배터리 공급망의 취약한 참여자와 국제협력 탐구가 근거입니다."], "concepts": ["1. 효율성과 복원력의 비교  효율성은 주어진 자원으로 비용을 낮추거나 산출을 높이는 문제이고, 복원력은 충격을 견디고 회복할 능력입니다. 가상 예시로 예비 공급처 유지비가 연 100만 원이고 큰 공급중단의 예상손실을 300만 원 줄인다면 다변화를 검토할 이유가 생깁니다. 그러나 확률과 손실 추정이 불확실하고, 비용과 편익이 누구에게 돌아가는지도 확인해야 합니다.", "2. 상관된 위험과 실제 다변화  공급자가 둘이라는 사실만으로 위험이 반으로 줄지 않습니다. 같은 항구, 전력망, 원재료 공급처에 의존하면 한 충격에 함께 멈출 수 있습니다. 반대로 국제적으로 분산된 조달이 국내집중보다 안전할 수도 있습니다. 경준의 공급망 질문은 국산화나 해외이전 중 하나를 자동 선택하기보다 공통 취약성과 전환비용을 구체적으로 분석하는 데서 깊어집니다. 위험을 나눌 때는 공급자의 국적보다 실제 생산과 물류 경로가 중요할 수 있습니다. 다른 나라의 두 기업이 같은 상위 공급자에게 부품을 받는다면 표면적으로만 다변화된 것입니다. 하위단계까지 파악하려면 비용과 정보접근의 한계도 함께 고려해야 합니다."], "follow": ["그러면 모두 국내에서 생산하면 안전하지 않나요?  국내 집중도 재난과 비용상승 같은 공통위험을 만들 수 있습니다. 국내외를 나누기보다 중단위험과 대체가능성을 비교해야 합니다."], "memory": "공급처 수보다 함께 멈출 위험", "caution": "", "source_refs": [27], "university": "공통", "kind": "답변", "glossary": [96]}, {"id": 58, "question": "비교우위가 있는데 왜 공급망 다변화가 필요합니까?", "category": "관세와 기업 인터뷰", "answer": ["비교우위의 이익을 인정하면서도 공급중단 위험에 대비할 수 있다고 생각합니다. 비교우위는 다른 생산을 포기하는 기회비용이 상대적으로 낮은 분야에 특화할 때 교역의 이익이 생길 수 있다는 설명입니다. 현실에서는 그 거래가 계속 가능할지도 함께 고려해야 합니다.", "예를 들어 평소에 저렴한 공급처라도 중단됐을 때 손실이 크면 일부 대체 공급처를 유지할 이유가 생깁니다. 반대로 위험을 이유로 모든 거래를 국내로 돌리면 큰 비용이 들 수 있습니다. 저는 특화와 다변화 중 하나를 고르는 것보다, 교역의 이익을 유지하면서 어떤 위험을 얼마나 줄일지 품목별로 판단하고 싶습니다."], "evidence": ["2학년 · 진로활동 진로 연계 심층 탐구 프로젝트 | PDF 3쪽 / 인쇄 4쪽\n반도체 수출전환과 중력모형 탐구를 바탕으로 한 확장 답변입니다.", "2학년 · 국제 관계와 국제기구 | PDF 14쪽 / 인쇄 15쪽\n배터리 공급망과 취약한 참여자의 조건을 함께 검토한 기록입니다."], "concepts": ["1. 절대우위와 비교우위  절대우위는 같은 자원으로 더 많이 생산하는 능력이고 비교우위는 다른 재화 생산을 포기하는 기회비용이 더 낮은 상태입니다. 가상 예시로 한 나라가 두 제품 모두 잘 만들어도, 제품별 상대적 효율 차이가 있으면 특화와 교역의 이익이 생길 수 있습니다. 비교우위를 단순히 임금이 낮거나 모든 생산비가 싼 나라라는 뜻으로 설명하면 핵심을 놓칩니다.", "2. 위험을 포함한 거래비용  기본모형은 특정 조건에서의 교역이익을 보여주지만 현실에는 운송, 규제, 공급중단과 전환비용도 있습니다. 가상 예시로 단가 100원의 공급처가 자주 멈추어 큰 손실을 만든다면 단가 105원의 안정적인 공급처가 더 나을 수 있습니다. 다만 위험을 과대평가하면 불필요하게 비싼 구조가 됩니다. 경준이 살펴볼 것은 특화의 이익과 위험관리의 추가비용입니다. 비교우위는 나라 전체의 우열을 매기는 개념이 아닙니다. 같은 나라 안에서도 품목별 기회비용이 다르고 기술·교육·인프라가 바뀌면 구조도 변할 수 있습니다. 따라서 현재 거래구조를 영원히 고정해야 한다는 주장과도 구분할 필요가 있습니다."], "follow": ["다변화는 비교우위를 포기하는 선택입니까?  일부 비용상승이 있을 수 있지만 위험까지 포함해 거래조건을 조정하는 선택일 수 있습니다. 편익과 비용의 크기를 실제 자료로 비교해야 합니다."], "memory": "상대적 효율에 중단위험 더하기", "caution": "", "source_refs": [27], "university": "공통", "kind": "답변", "glossary": [96]}, {"id": 59, "question": "왜 중소기업 지원이 필요한가요? 시장왜곡 아닌가요?", "category": "관세와 기업 인터뷰", "answer": ["중소기업이라는 이유만으로 모든 지원이 필요하다고 보지는 않습니다. 제가 관심을 가진 것은 기업의 규모 자체보다 정보를 찾고 해석하는 데 드는 비용과 대응 여력의 차이입니다. 인터뷰를 하며 같은 정책도 어떤 정보를 언제 활용할 수 있는지에 따라 다른 부담이 될 수 있다는 점을 봤습니다.", "그래서 손실을 계속 대신 부담하는 방식보다, 여러 기업이 필요한 규정과 근거에 접근하도록 돕는 방법에 관심이 있습니다. 물론 정보지원도 실제로 쓰이는지 확인해야 합니다. 저는 좋은 취지를 내세우는 데서 그치지 않고, 기업의 확인 시간을 줄였는지 판단을 도왔는지로 성과를 살피고 싶습니다. 지원의 목적과 효과를 구체적으로 묻는 것이 중요하다고 생각합니다."], "evidence": ["3학년 · 진로활동 | PDF 4–5쪽 / 인쇄 5–6쪽\n정보격차와 협상조건을 본 기업 인터뷰가 배경입니다.", "3학년 · 자율활동 | PDF 4쪽 / 인쇄 5쪽\n통상정보 도구를 통한 근거 접근성 개선 시도입니다.", "3학년 · 실용 경제 | PDF 17쪽 / 인쇄 18쪽\n필요성과 지불여력 및 유효수요를 구분한 사업성 검토가 근거입니다."], "concepts": ["1. 고정 정보비용과 규모의 차이  규정을 한 번 조사하는 비용이 같아도 거래규모가 작으면 매출 대비 부담이 커질 수 있습니다. 가상 예시로 규정검토비가 100만 원일 때 수출액 1천만 원 기업과 10억 원 기업의 상대적 부담은 다릅니다. 정보비용이 진입을 막는 조건을 줄이는 지원은 검토할 수 있지만, 모든 작은 기업이 같은 어려움을 겪는다고 가정해서는 안 됩니다.", "2. 정책의 목적과 효과검증  지원의 목적이 정보격차 완화라면 배포 문서 수보다 정보확인 시간, 오류, 실제 활용 여부를 살펴야 합니다. 가상 예시로 자료조회는 늘어도 계약결정에 사용되지 않는다면 효과를 다시 봐야 합니다. 무료 제공은 접근성을 높일 수 있지만 유지비와 민간서비스 대체효과도 생깁니다. 경준의 사업성 탐구는 필요한 서비스와 돈을 지불할 수 있는 수요가 다르다는 점을 보여줍니다. 정보가 여러 기업에 반복 활용될 수 있으면 공동 제공이 비용을 줄일 수 있습니다. 다만 기업별 계약과 영업비밀까지 공개되어도 된다는 뜻은 아닙니다. 공통으로 나눌 규정정보와 개별적으로 보호할 자료를 구분하는 설계가 필요합니다."], "follow": ["정부가 무료로 제공하면 본인의 서비스는 필요 없지 않나요?  무료정보와 구별되는 정확한 사용자 문제가 있는지부터 확인해야 합니다. 근거 탐색시간이나 적용조건 정리에서 추가 가치가 검증될 때만 의미가 있습니다."], "memory": "지원대상보다 줄이려는 비용을 먼저", "caution": "", "source_refs": [26], "university": "공통", "kind": "답변", "glossary": [62]}, {"id": 60, "question": "관세 인하가 소비자가격에 바로 반영되지 않는 이유는 무엇입니까?", "category": "관세와 기업 인터뷰", "answer": ["관세가 내려가는 시점과 소비자가격이 바뀌는 시점은 다를 수 있기 때문입니다. 이미 높은 비용으로 들여온 재고가 있거나 기존 계약의 가격이 정해져 있을 수 있습니다. 환율이나 운송비가 동시에 오르면 관세 인하로 줄어든 비용을 일부 상쇄할 수도 있습니다.", "저는 기업 인터뷰에서 가격을 조정할 수 있는 조건이 중요하다는 점을 배웠습니다. 이 관점을 소비자가격에도 적용하면 세율에서 수입원가, 유통가격으로 이어지는 단계를 나눠 봐야 합니다. 직접 소비자가격을 추적한 연구는 아니지만, 바로 내리지 않았다는 사실만으로 효과가 없다고 결론내리지 않고 비교기간과 다른 비용을 확인하겠습니다."], "evidence": ["3학년 · 진로활동 | PDF 4–5쪽 / 인쇄 5–6쪽\n가격조정 시점과 거래조건을 확인한 인터뷰를 바탕으로 한 개념적 확장입니다."], "concepts": ["1. 가격 전가율과 전가 속도  전가율은 비용변화가 판매가격에 얼마나 반영되는가이고, 전가 속도는 그 조정에 걸리는 시간입니다. 가상 예시로 수입원가가 10원 줄어도 소비자가격은 처음에 2원, 뒤에 추가로 3원 내릴 수 있습니다. 이때 어느 시점에서 측정하느냐에 따라 관찰한 전가율이 달라집니다. 관세율, 과세가격, 최종판매가격은 서로 다른 기준이므로 같은 비율로 비교하면 안 됩니다.", "2. 다른 비용과 경쟁의 역할  환율 상승이나 운송비 증가가 동시에 발생하면 관세인하의 비용감소를 일부 상쇄할 수 있습니다. 시장경쟁이 강하면 기업이 비용절감을 가격에 반영할 압력이 커질 수 있지만, 수요와 제품차별화도 영향을 줍니다. 경준의 면접에서는 소비자가격의 한 번의 변화를 관세 하나의 효과로 읽지 않고, 계약·재고·환율을 함께 확인하겠다고 설명하는 것이 적절합니다. 가격의 변화를 관세효과로 보려면 정책이 없었어도 어떻게 변했을지를 생각해야 합니다. 관세가 내렸는데 가격이 그대로여도 다른 비용상승을 막아준 효과가 있을 수 있습니다. 관찰된 변화와 반사실적 효과를 구분하는 이유입니다."], "follow": ["관세 인상과 인하의 전가가 똑같을까요?  반드시 대칭적이지는 않습니다. 가격을 바꾸는 비용과 경쟁상황, 수요의 반응에 따라 인상과 인하의 속도·크기가 다를 수 있습니다."], "memory": "세율에서 소비자가격까지의 단계", "caution": "", "source_refs": [25], "university": "공통", "kind": "답변", "glossary": [59, 99]}, {"id": 61, "question": "왜 통상정보 도구를 만들었습니까?", "category": "통상정보 도구와 AI", "answer": ["기업의 정보 문제를 설명하는 데서 더 나아가 실제로 줄여 보고 싶어서 만들었습니다. 기업 인터뷰에서 필요한 관세의 법적 근거를 확인하기 어렵다는 점을 알게 됐습니다. 정보를 늦게 얻으면 대응 기회도 줄어들 수 있어, 원문 근거를 찾는 과정을 돕고 싶었습니다.", "그래서 검색한 조항을 답변과 연결하는 도구를 만들고 웹사이트로 배포했습니다. 내부 판단을 설명하기 어려웠던 방식은 직접 코딩하는 설계로 바꿨습니다. 또 작동한다는 것과 믿을 수 있다는 것은 다르다는 점을 확인하고 한계도 알렸습니다. 저에게 이 활동은 생각을 실행한 경험이면서, 제가 만든 결과물에 어떤 책임을 져야 하는지 배운 경험이었습니다."], "evidence": ["2학년 · 문학 | PDF 11쪽 / 인쇄 12쪽\n2학년 문학의 데이터 현지화와 규범 예측가능성 탐구가 선행 활동입니다.", "3학년 · 진로활동 | PDF 4–5쪽 / 인쇄 5–6쪽\n3학년 진로의 기업 정보격차 발견입니다.", "3학년 · 자율활동 | PDF 4쪽 / 인쇄 5쪽\n3학년 자율활동의 검색도구 구현·배포·시연과 한계고지입니다."], "concepts": ["1. 문제정의에서 기능으로 연결하기  도구를 만든다는 것은 사용자의 어려움을 처리할 기능으로 바꾸는 일입니다. 가상 예시로 사용자가 근거조항을 찾지 못한다면 긴 요약을 생성하는 기능보다 원문과 해당 위치를 찾는 기능이 먼저 필요할 수 있습니다. 경준의 기록에서는 법적 근거 접근의 어려움이 검색과 근거공개 기능으로 연결됩니다. 기능 수가 많아지는 것과 실제 문제가 해결되는 것은 구분해야 합니다.", "2. 작동 확인과 신뢰 검증  작동 확인은 입력을 받으면 정해진 절차가 실행되는지를 보는 것이고, 신뢰 검증은 적절한 질문에서 정확하고 제한된 답을 주는지 평가하는 것입니다. 예외조항을 놓쳐도 화면은 정상적으로 작동할 수 있습니다. 경준은 객관적인 비교기준이 부족함을 발견하고 한계를 알렸습니다. 사용자가 근거를 추적할 수 있는 설계는 오류를 확인하는 데 도움이 되지만 정확도를 보증하지는 않습니다. 검색도구의 범위는 사용자가 어떤 질문을 할지와 문서가 어디까지 준비됐는지에 따라 정해집니다. 범위 밖 질문을 알아차리는 기능도 중요합니다. 자료가 없는 질문에 매끄러운 답을 만드는 것보다 근거부족을 알려주는 것이 목적에 더 맞을 수 있습니다."], "follow": ["도구의 가장 큰 성과는 무엇입니까?  웹사이트 배포와 시연까지 실행한 것과 함께, 검색점수를 신뢰도처럼 오해할 수 있다는 한계를 스스로 발견하고 공개한 점이라고 생각합니다."], "memory": "기업의 정보문제를 근거 검색으로", "caution": "", "source_refs": [28], "university": "공통", "kind": "답변", "glossary": [1, 3, 4]}, {"id": 62, "question": "RAG와 일반 LLM의 차이는 무엇입니까?", "category": "통상정보 도구와 AI", "answer": ["LLM은 Large Language Model, 대규모 언어모델이고, RAG는 Retrieval-Augmented Generation, 검색 증강 생성입니다. RAG는 관련 외부 자료를 찾아 언어모델이 답할 때 참고하도록 연결하는 방식입니다. 둘은 서로 대체되는 기술이라기보다 함께 사용할 수 있는 관계입니다.", "저는 통상정보를 다룰 때 말이 자연스럽다는 것보다 어떤 조항을 근거로 말하는지가 중요하다고 생각해 RAG를 활용했습니다. 다만 자료를 찾았다고 해석까지 맞는 것은 아닙니다. 오래된 규정을 가져오거나 적용 대상을 잘못 읽을 수 있습니다. 그래서 저는 검색된 근거와 만들어진 답변을 구분하고, 사용자가 원문으로 돌아가 확인할 수 있게 하는 데 의미를 뒀습니다."], "evidence": ["3학년 · 자율활동 | PDF 4쪽 / 인쇄 5쪽\nRAG 구조, TF-IDF 검색, 근거조항 제시와 한계 검증의 기록입니다."], "concepts": ["1. 검색 증강 생성의 흐름  보통 질문을 바탕으로 관련 문서나 문서조각을 검색하고, 선택된 자료를 질문과 함께 모델에 넣어 답을 생성합니다. 가상 예시로 관세의 적용대상을 물었을 때 해당 규정과 예외조항을 함께 검색해 설명에 활용할 수 있습니다. 모든 RAG가 같은 검색기나 모델을 쓰는 것은 아니며, 검색 문서의 최신성과 출처 관리가 결과에 영향을 줍니다.", "2. 검색오류와 생성오류  검색오류는 필요한 근거를 못 찾거나 무관한 근거를 가져오는 문제입니다. 생성오류는 적절한 자료가 있어도 조건을 생략하거나 근거 밖 주장을 만드는 문제입니다. 언어모델에 사용자가 직접 문서를 넣어주는 경우도 있으므로 일반 LLM을 언제나 외부정보 없는 상태로 정의하면 안 됩니다. 경준의 도구는 두 단계의 문제를 구분해 검증할 필요가 있습니다. RAG의 답에는 검색된 자료와 모델이 이미 학습한 지식이 함께 반영될 수 있습니다. 따라서 출처목록이 달렸다는 이유만으로 모든 문장이 그 출처에서 나온다고 보장할 수 없습니다. 개별 주장과 근거문장이 실제로 연결되는지 확인해야 합니다."], "follow": ["RAG는 모델을 다시 학습시키는 방법인가요?  문서를 검색해 입력문맥을 보강하는 구조이며 활용 방식에 따라 구성요소를 학습할 수도 있습니다. 문서를 추가할 때마다 반드시 본체 모델을 재학습해야 하는 것은 아닙니다."], "memory": "검색한 근거를 생성의 문맥으로", "caution": "", "source_refs": [28], "university": "공통", "kind": "답변", "glossary": [2, 3, 10, 15]}, {"id": 63, "question": "왜 TF-IDF를 사용했습니까?", "category": "통상정보 도구와 AI", "answer": ["검색된 이유를 비교적 설명하기 쉽다는 점 때문에 TF-IDF를 선택했습니다. Term Frequency–Inverse Document Frequency의 약자로, 문서 안에서 자주 등장하면서 전체 문서에는 상대적으로 드문 단어에 높은 가중치를 주는 방식입니다. 어떤 단어가 관련 조항을 찾는 데 쓰였는지 보여 주고 싶었습니다.", "처음부터 가장 뛰어난 검색방법이라고 판단해서 고른 것은 아닙니다. 의미가 같아도 표현이 다르면 놓칠 수 있다는 한계가 있습니다. 저는 이 선택을 통해 기술을 쓸 때 성능뿐 아니라 결과를 어떻게 설명할지도 생각하게 됐습니다. 점수를 공개하더라도 그것이 정답확률은 아니라는 점까지 전달해야 한다고 봅니다."], "evidence": ["3학년 · 자율활동 | PDF 4쪽 / 인쇄 5쪽\nTF-IDF 검색 채택과 정보 추적가능성을 높인 설계가 기록됩니다."], "concepts": ["1. TF와 IDF가 하는 일  TF는 문서 안에서 단어가 나타나는 정도이고, IDF는 문서집합 전체에서 흔한 단어의 영향력을 낮추는 역할을 합니다. 가상 예시로 모든 자료에 나오는 규정이라는 단어보다 특정 자료에서만 자주 나오는 원산지라는 단어가 구분에 더 도움이 될 수 있습니다. 실제 계산에는 로그와 정규화 등을 적용할 수 있으므로 정확한 수식은 사용한 구현을 확인해야 합니다.", "2. 벡터와 유사도 점수  가중치들을 모으면 문서를 단어별 숫자목록인 벡터로 나타낼 수 있습니다. 질문과 문서의 벡터 방향이 얼마나 비슷한지 코사인 유사도 등으로 비교하여 순위를 정합니다. 이는 표현의 겹침을 재는 방식이며 조항의 법적 효력이나 적용가능성을 직접 판단하지 않습니다. 경준이 공개한 점수의 의미를 설명할 때 무엇을 계산했고 무엇은 측정하지 않았는지를 구분해야 합니다. 문서가 매우 길면 단어가 자주 나오는 이유가 중요성 때문인지 길이 때문인지 구분하기 어렵습니다. 정규화는 이런 차이를 조정하는 데 쓰일 수 있습니다. 다만 전처리와 정규화 방법에 따라 순위가 달라지므로 실제 구현조건을 함께 설명해야 합니다."], "follow": ["흔한 단어는 모두 제거해야 하나요?  항상 그렇지는 않습니다. 부정어처럼 짧고 자주 나와도 의미를 바꾸는 단어가 있으므로 검색목적에 맞춰 전처리 영향을 확인해야 합니다."], "memory": "중요한 단어의 겹침을 보이는 검색", "caution": "", "source_refs": [29], "university": "공통", "kind": "답변", "glossary": [4, 5, 6, 10, 12]}, {"id": 64, "question": "TF-IDF의 한계는 무엇입니까?", "category": "통상정보 도구와 AI", "answer": ["단어의 겹침은 잘 볼 수 있지만 문장의 의미와 적용 조건을 충분히 이해하지 못한다는 점입니다. 같은 내용을 다른 표현으로 물으면 관련 문서를 놓칠 수 있고, 같은 단어가 많아도 다른 시기나 대상의 규정을 가져올 수 있습니다.", "개선한다면 의미를 반영하는 검색방법과 결합해 비교해 보고 싶습니다. 다만 새로운 기술을 붙였다는 사실만으로 좋아졌다고 말하지 않겠습니다. 확인된 질문과 근거를 먼저 만들고, 필요한 조항을 찾는 비율과 틀린 답을 내는 경우를 나눠 살펴보겠습니다. 저는 기능을 추가하는 것보다 어떤 오류가 실제로 줄었는지 확인하는 단계가 더 중요하다고 생각합니다."], "evidence": ["3학년 · 자율활동 | PDF 4쪽 / 인쇄 5쪽\nTF-IDF 검색의 설명가능성과 객관적 검증기준 부족을 확인한 활동입니다."], "concepts": ["1. 단어기반 검색의 두 가지 오류  필요한 문서를 놓치는 누락과 관련 없는 문서를 높게 올리는 오검색을 구분할 수 있습니다. 가상 예시로 수입 제한과 수입 금지가 유사한 맥락이어도 표현이 다르면 낮게 평가될 수 있고, 같은 관세라는 단어를 쓰는 다른 시기의 규정은 높게 나올 수 있습니다. 단어빈도는 의미와 시점, 적용범위를 충분히 나타내지 못합니다.", "2. 의미기반 검색을 추가할 때의 기준  임베딩은 문장이나 문서를 의미적 특징을 반영한 숫자벡터로 표현하려는 방식입니다. 어휘가 달라도 관련성을 찾는 데 도움이 될 수 있지만 유사한 문장의 차이를 무시할 위험도 있습니다. 경준의 개선에서는 기존 검색과 새로운 검색을 같은 질문셋으로 비교하고, 정답근거를 찾았는지와 답변이 조건을 지켰는지를 따로 평가하는 것이 필요합니다. 개선할 때 누락을 줄이려고 후보를 너무 많이 가져오면 무관한 정보가 늘어 생성단계가 혼란스러워질 수 있습니다. 따라서 필요한 근거를 얼마나 찾는지와 가져온 근거 중 얼마나 적절한지를 함께 봐야 하며, 검색결과 개수만 늘리는 방식은 충분하지 않습니다."], "follow": ["정확도와 설명가능성 중 무엇이 우선인가요?  사용목적에 따라 기준을 정해야 합니다. 통상정보에서는 오류가 중요한 만큼 둘을 함께 평가하고, 성능이 부족하면 설명이 쉽다는 이유만으로 채택하지 않겠습니다."], "memory": "표현이 다르면 놓치고 같아도 오해한다", "caution": "", "source_refs": [29, 28], "university": "공통", "kind": "답변", "glossary": [4, 5, 6, 13, 14]}, {"id": 65, "question": "검색점수가 높으면 답이 맞다는 뜻입니까?", "category": "통상정보 도구와 AI", "answer": ["아닙니다. 검색점수는 제가 사용한 방식에서 질문과 문서가 얼마나 비슷한지를 나타내지, 답이 맞을 확률을 뜻하지는 않습니다. 단어가 비슷해도 다른 시점의 규정이거나 적용 대상이 다르면 답은 틀릴 수 있습니다.", "제가 만든 도구에서 이 차이를 확인한 것이 중요한 배움이었습니다. 숫자를 보여 주면 객관적으로 보이지만, 그 숫자가 무엇을 측정하는지부터 설명해야 했습니다. 그래서 점수와 근거를 공개하는 것에 더해 한계도 알렸습니다. 앞으로는 별도로 확인한 평가자료와 비교해 정확성을 검토하고 싶습니다. 신뢰는 숫자가 있다는 사실보다 그 의미를 확인할 수 있는 데서 나온다고 생각합니다."], "evidence": ["3학년 · 자율활동 | PDF 4쪽 / 인쇄 5쪽\nTF-IDF 점수 공개와 객관적 신뢰도 기준 부재를 인식한 자율활동 기록입니다."], "concepts": ["1. 유사도와 확률의 차이  유사도는 선택한 표현방식에서 두 항목이 가까운 정도입니다. 가상 예시로 검색점수 0.9가 나온 문서라도 90% 확률로 법적으로 맞는 답이라는 뜻은 아닙니다. 코사인 유사도 같은 수치의 범위와 분포는 데이터와 표현방식에 따라 달라집니다. 점수 옆에 별점을 붙여도 의미가 자동으로 정확도나 신뢰도로 바뀌지는 않습니다.", "2. 점수를 정확도와 연결하려면  점수별 실제 정답비율을 독립적인 평가자료로 살펴야 확률적 해석을 검토할 수 있습니다. 이때 평가문항의 난도와 분야가 바뀌면 관계도 달라질 수 있습니다. 경준의 기록은 그런 기준 없이 신뢰를 수치화하기 어렵다는 발견을 담고 있습니다. 근거를 보여주는 추적가능성은 중요한 장점이지만, 근거가 타당하다는 판단을 대신하지는 않습니다. 여러 질문에서 모두 0.9가 나와도 문서집합과 질문의 형태가 다르면 난도가 같지 않을 수 있습니다. 높은 점수를 낼 수 있는 자료가 존재하는지와 실제 질문에 답할 근거가 있는지는 별개이므로 점수만으로 질문 간 난도를 비교하기도 어렵습니다."], "follow": ["점수는 쓸모없는 것 아닙니까?  후보 문서의 순위를 정하고 검색과정을 점검하는 데 유용합니다. 다만 그 용도와 정답확률을 구분해야 합니다."], "memory": "검색의 가까움과 답의 맞음", "caution": "", "source_refs": [29], "university": "공통", "kind": "답변", "glossary": [4, 12]}, {"id": 66, "question": "RAG를 쓰면 할루시네이션이 없어집니까?", "category": "통상정보 도구와 AI", "answer": ["RAG를 사용해도 할루시네이션, 즉 사실이나 근거와 맞지 않는 생성 오류는 남을 수 있습니다. 필요한 조항을 검색하지 못할 수도 있고, 올바른 조항을 가져와도 조건을 빼고 설명할 수 있습니다. 검색과 답변 생성이 각각 틀릴 수 있는 것입니다.", "제 도구에는 질문분해와 다중검색, 자체검증을 넣었지만 그것만으로 독립적인 정확도 검증이 끝난 것은 아닙니다. 다시 개선한다면 검색 실패와 설명 실패를 나눠 기록하고, 근거가 부족할 때 답을 보류하는 경우도 평가하겠습니다. 저는 답을 많이 만드는 것보다 확인할 수 있는 답을 제공하는 것이 이 도구의 목적에 맞다고 생각합니다."], "evidence": ["3학년 · 자율활동 | PDF 4쪽 / 인쇄 5쪽\n질문분해·다중검색·자체검증·한계고지가 실제 구현 범위로 기록되어 있습니다."], "concepts": ["1. 환각이 생기는 두 지점  생성모델은 문맥에 맞는 문장을 만들면서 사실이나 근거와 일치하지 않는 내용을 낼 수 있습니다. 가상 예시로 특정 품목 예외를 담은 조항을 검색하지 못하면 누락된 정보 때문에 답이 틀리고, 그 조항을 가져왔는데 예외를 무시하면 해석 때문에 틀립니다. RAG는 외부근거 접근을 보강하지만 두 오류가 생길 가능성을 없애지는 않습니다.", "2. 자체검증과 독립검증  같은 모델이 답을 다시 읽는 절차는 일부 오류를 찾는 데 도움이 될 수 있지만 동일한 오해를 반복할 수도 있습니다. 다른 기준과 확인자가 근거를 대조하는 독립검증이 필요한 이유입니다. 경준이 향후 검증자료를 만든다면 정답만 아니라 적용시점, 예외, 답변보류가 필요한 조건도 포함해야 합니다. 한계를 알리는 문구만 추가했다고 오류의 영향을 모두 막을 수 있는 것도 아닙니다. 최신 문서를 찾았더라도 조항의 시행일이나 경과규정 때문에 적용결론이 달라질 수 있습니다. 근거의 작성일과 효력이 발생하는 날짜를 나누어 관리해야 하는 이유입니다. 경준의 도구가 이 기능까지 구현했다는 뜻이 아니라 추가검증에서 점검할 조건입니다."], "follow": ["답변을 보류하면 도구의 가치가 떨어지지 않나요?  모르는 답을 확신 있게 주는 비용이 큰 분야에서는 적절한 보류가 필요합니다. 다만 지나친 보류도 불편하므로 정확성과 답변가능 범위를 함께 평가해야 합니다."], "memory": "검색오류와 설명오류를 따로 보기", "caution": "", "source_refs": [28], "university": "공통", "kind": "답변", "glossary": [2, 3, 14, 15]}, {"id": 67, "question": "골드스탠더드가 없다는 것이 왜 문제입니까?", "category": "통상정보 도구와 AI", "answer": ["골드스탠더드가 없으면 제 도구의 답을 무엇과 비교해 맞다고 판단할지 불분명하기 때문입니다. 높은 검색점수나 자연스러운 설명을 다시 기준으로 삼으면, 제가 만든 결과를 제가 만든 기준으로만 좋게 평가할 수 있습니다.", "이 문제를 확인하면서 저는 도구가 실행되는 것과 신뢰성이 검증되는 것을 나누게 됐습니다. 다음에는 질문의 범위를 좁히고 공식 원문과 검토를 통해 기대되는 답, 필요한 근거, 답을 보류해야 할 조건을 정리하고 싶습니다. 한계를 찾았다는 이유로 활동의 의미가 줄었다기보다, 다음에 무엇을 검증해야 하는지가 분명해졌다고 생각합니다."], "evidence": ["3학년 · 자율활동 | PDF 4쪽 / 인쇄 5쪽\n객관적 기준 없이 신뢰도를 검증할 수 없음을 발견하고 한계고지로 반영한 기록입니다."], "concepts": ["1. 골드스탠더드의 의미  골드스탠더드는 평가에서 신뢰할 만한 기준으로 사용하는 검증된 정답이나 판정자료입니다. 절대적으로 오류가 없는 진리라는 뜻은 아닙니다. 가상 예시로 법규 질문이라면 정답문장 하나뿐 아니라 적용 법령의 버전, 해당 조건, 인정할 대체표현을 함께 정리할 수 있습니다. 기준을 만든 사람 사이에 의견이 다를 때 조정한 이유도 남기는 것이 좋습니다.", "2. 평가자료의 독립성과 범위  개발 중 계속 본 질문만으로 평가하면 그 질문에 맞추어진 성능을 실제 성능으로 오해할 수 있습니다. 아직 보지 않은 질문과 예외상황을 분리해 평가하고, 근거를 찾았는지와 설명이 충실한지를 구별해야 합니다. 경준의 한계는 기준자료가 부족하다는 점이며 이를 정확히 밝히면 다음 개선계획도 구체적이 됩니다. 평가가 좁은 분야에서 잘 됐다고 모든 통상질문에 일반화해서는 안 됩니다. 평가의 정답이 바뀌는 분야라면 기준자료에도 버전이 필요합니다. 예전 질문의 답이 당시에는 맞고 지금은 틀릴 수 있기 때문입니다. 질문과 근거가 어느 시점을 가정하는지 고정해야 도구의 오류와 제도변경의 영향을 구분할 수 있습니다."], "follow": ["정답이 여러 개인 질문은 평가할 수 없나요?  가능합니다. 필수 근거와 허용할 해석범위, 빠지면 안 되는 조건을 정하고 복수의 검토자가 기준에 따라 평가할 수 있습니다."], "memory": "내 점수를 검증할 바깥 기준", "caution": "", "source_refs": [28], "university": "공통", "kind": "답변", "glossary": [14, 16]}, {"id": 68, "question": "Constitutional AI와 RAG의 차이는 무엇입니까?", "category": "통상정보 도구와 AI", "answer": ["RAG는 어떤 외부 근거를 참고해 답할지에 초점을 두고, Constitutional AI는 어떤 원칙에 따라 답을 평가하고 수정하도록 학습할지에 초점을 둡니다. Constitutional AI는 보통 헌법적 AI라고 부르지만 여기서 헌법은 국가의 법이 아니라 모델을 지도하는 원칙 목록을 뜻합니다.", "저는 근거를 공개하는 제 도구와 원칙을 학습에 반영하는 방식을 비교하면서, 사실이 정확한지와 판단 기준이 정당한지는 다른 질문이라는 점에 관심을 가졌습니다. 두 방법은 함께 사용할 수도 있습니다. 저는 AI를 신뢰한다고 말할 때도 무엇의 신뢰인지 나눠 묻고 싶습니다. 근거가 맞는지뿐 아니라 누가 원칙을 정했고 어떤 관점이 빠졌는지도 살펴야 한다고 생각합니다."], "evidence": ["3학년 · 자율활동 | PDF 4쪽 / 인쇄 5쪽\n자신의 RAG 검색도구와 근거공개 활동입니다.", "3학년 · 과목명 없이 이어지는 추가 세특 문단 | PDF 17–18쪽 / 인쇄 18–19쪽\n헌법적 AI의 원칙 내재화와 WTO 규범·측정공백을 비교한 추가 세특 기록입니다."], "concepts": ["1. 원칙을 이용한 학습과 검색의 결합  Constitutional AI의 대표 연구에서는 명시된 원칙으로 답을 비판·수정한 자료와 AI의 선호평가를 학습에 활용합니다. 이는 법률의 헌법을 그대로 실행한다는 뜻이 아닙니다. RAG는 외부문서를 찾아 생성에 쓰는 구조이므로, 원칙으로 학습한 모델에 RAG를 붙이는 식으로 함께 사용할 수도 있습니다. 두 방법을 서로 배타적인 대안으로 볼 필요는 없습니다.", "2. 사실의 정확성과 가치의 정당성  가상 예시로 어떤 정책의 조항을 정확히 찾더라도 누구의 부담을 더 중하게 볼지에는 가치판단이 들어갑니다. 반대로 공정성을 원칙으로 내세워도 잘못된 자료를 읽으면 사실오류가 생깁니다. 경준의 비교는 근거 추적가능성과 원칙 선택을 분리하는 데 의미가 있습니다. 기업의 원칙이 확산됐다는 사실만으로 곧바로 WTO상의 법적 표준이 된다고 단정할 수는 없습니다. 원칙 사이에도 충돌이 있을 수 있습니다. 가상 예시로 유용한 정보를 자세히 주라는 원칙과 불확실한 주장은 제한하라는 원칙이 긴장할 수 있습니다. 어떤 조건에서 답을 줄이고 확인을 요청할지의 판단도 설계와 평가의 대상입니다."], "follow": ["Constitutional AI의 원칙은 중립적입니까?  원칙을 고르고 충돌할 때 우선순위를 정하는 과정에 가치판단이 들어갑니다. 참여자의 범위와 공개성, 수정절차를 함께 보아야 합니다."], "memory": "무엇을 근거로 말하는가와 어떤 원칙인가", "caution": "", "source_refs": [17, 28], "university": "공통", "kind": "답변", "glossary": [3, 7, 8, 9]}, {"id": 69, "question": "AI는 진로의 핵심입니까, 도구입니까?", "category": "통상정보 도구와 AI", "answer": ["제 진로의 중심은 국제통상 문제를 이해하고 기업의 판단을 돕는 일이며, AI는 그 목적에 맞게 활용하는 도구입니다. 기업의 근거 확인이 어렵다는 문제를 발견했기 때문에 검색도구를 만든 것이지, AI를 쓰기 위해 통상문제를 고른 것은 아닙니다.", "그렇다고 AI는 사용법만 알면 된다고 생각하지는 않습니다. 무엇을 검색하고 어떤 오류가 생기는지 이해해야 결과를 검토할 수 있습니다. 저는 문제를 정하고, 도구를 구현하고, 다른 사람에게 그 의미를 설명하는 능력을 함께 키우고 싶습니다. 기술이 바뀌어도 제가 풀려는 문제와 판단의 근거를 분명히 말할 수 있는 것이 제 강점이 되길 바랍니다."], "evidence": ["3학년 · 진로활동 | PDF 4–5쪽 / 인쇄 5–6쪽\n정보격차를 발견한 기업 인터뷰가 도구 개발의 출발입니다.", "3학년 · 자율활동 | PDF 4쪽 / 인쇄 5쪽\nRAG·TF-IDF 구현과 신뢰 한계 검토입니다.", "3학년 · 과목명 없이 이어지는 추가 세특 문단 | PDF 17–18쪽 / 인쇄 18–19쪽\nAI 원칙과 통상규범의 연결을 비판적으로 확장했습니다."], "concepts": ["1. 문제에 따라 도구를 고르기  문제중심 접근은 해결하려는 어려움을 먼저 정한 뒤 필요한 방법을 선택하는 것입니다. 가상 예시로 필요한 문서가 몇 개뿐이라면 사람이 정리한 안내표가 복잡한 AI보다 정확하고 빠를 수 있습니다. 반대로 자료가 많고 자주 바뀌면 검색 자동화가 도움이 될 수 있습니다. 경준은 도구의 화려함보다 정보확인이라는 목적과 실제 사용조건을 설명하는 것이 좋습니다.", "2. 도메인 지식과 기술 이해  통상지식은 어떤 조항과 경제조건이 중요한지 판단하는 데, 기술 이해는 검색과 생성이 어디서 틀릴 수 있는지 점검하는 데 필요합니다. 둘 중 하나만 있으면 그럴듯한 결과를 과신하기 쉽습니다. AI가 결정을 지원하더라도 최종 적용과 검토의 책임은 별도로 정해야 합니다. 경준의 대학 학업계획도 기술용어를 늘리는 것보다 부족한 이론과 검증능력을 구체화하면 설득력이 높아집니다. 도구의 효율은 처리량만으로 평가되지 않습니다. 잘못된 결론을 빠르게 많이 내면 검토비용이 더 늘어날 수 있습니다. 사용 전후의 작업시간과 오류, 근거확인 가능성을 함께 비교해야 AI가 실제 업무에 어떤 도움을 주는지 판단할 수 있습니다."], "follow": ["AI가 필요 없는 문제라면 어떻게 하겠습니까?  그 문제에 더 정확하고 효율적인 방법을 쓰겠습니다. 제가 고집할 것은 특정 기술보다 기업의 판단에 도움이 되는 근거입니다."], "memory": "진로는 통상이고 기술은 문제에 맞게", "caution": "", "source_refs": [28], "university": "공통", "kind": "답변", "glossary": [1]}, {"id": 70, "question": "AI가 탐구를 대신한 것 아닌가요?", "category": "통상정보 도구와 AI", "answer": ["AI의 도움을 활용했으며, 도움받은 부분과 제가 판단한 부분을 나눠 설명하는 것이 맞다고 생각합니다. 제 역할은 기업의 근거 접근 문제를 탐구 과제로 정하고, 설명하기 어려운 구현 방식을 바꾸며, 검색점수를 신뢰도로 볼 수 있는지 다시 검토한 데 있습니다.", "AI가 코드를 도와주거나 문장을 정리해 주더라도 왜 그 기능이 필요한지, 결과가 어떤 조건에서 틀리는지를 제가 설명할 수 있어야 제 탐구라고 생각합니다. 그래서 도구를 시연할 때도 화면만 보여 주지 않고 원리와 한계를 설명했습니다. 구체적인 사용범위는 실제 작업기록에 맞춰 밝히고, 이해하지 못한 부분까지 제 능력이라고 말하지 않겠습니다."], "evidence": ["3학년 · 자율활동 | PDF 4쪽 / 인쇄 5쪽\n문제설정, 노코드에서 직접 코딩 전환, 검색·검증 구현과 한계발견의 기록입니다.", "2학년 · 독서활동상황 및 행동특성 종합의견 | PDF 20쪽 / 인쇄 21쪽\n디지털·AI 활용과 자료의 오류 검증 태도에 대한 행동특성 기록입니다.", "2학년 · 행동특성 및 종합의견 | PDF 20쪽 / 인쇄 21쪽\n디지털·AI 리터러시 활용, 자료 분석과 오류 검증, 근거 있는 의사 표현, 학급 의견을 대변하는 소통, 동아리 창설·선발 운영이 기록됩니다."], "concepts": ["1. 도움의 사용과 기여의 구분  탐구에는 질문설정, 자료선택, 구현, 오류확인, 해석이라는 서로 다른 작업이 있습니다. 가상 예시로 코드의 문법을 도움받았더라도 어떤 결과를 확인할지 정하고 오류를 설명한 역할은 따로 평가할 수 있습니다. 반대로 코드를 실행했다는 이유만으로 그 원리를 이해했다고 볼 수는 없습니다. 실제 사용한 도움과 직접 판단한 작업을 구체적으로 나누는 것이 중요합니다.", "2. 재현성과 설명 가능 범위  재현성은 같은 자료와 절차로 결과를 다시 확인할 수 있는가의 문제입니다. 경준은 입력과 검색결과, 점수의 의미, 한계고지까지 한 사례로 설명하면 자신의 이해를 보여줄 수 있습니다. 다만 현재 자료에 없는 모델명·코드 작성비중·정확도 수치를 만들어서는 안 됩니다. 설명하지 못하는 부분은 학습이 더 필요한 영역으로 인정하고 확인계획을 말하는 편이 낫습니다. 결과물을 다시 설명할 때는 성공한 화면만 외우기보다 실패한 입력에서 왜 그런 결과가 나오는지도 살펴보면 좋습니다. 실패의 원인을 이해하고 설계를 바꾼 과정은 자신이 어떤 판단을 했는지를 보여주는 근거가 될 수 있습니다."], "follow": ["검색이 이루어지는 흐름을 간단히 설명해보세요.  입력된 질문을 나누어 관련 조항을 검색하고 검색점수와 근거를 보여주는 구조입니다. TF-IDF는 질문과 문서에 등장한 단어에 가중치를 주어 관련 문서를 찾는 데 사용했습니다."], "memory": "도움을 밝히고 판단의 몫을 설명하기", "caution": "AI의 구체적 사용범위와 개발환경은 실제 작업기록으로 확인합니다. 모든 구현을 혼자 했다는 절대적 표현은 피합니다.", "source_refs": [], "university": "공통", "kind": "답변", "glossary": [1, 2, 11]}, {"id": 71, "question": "본인의 리더십에서 가장 뛰어난 부분은 무엇입니까?", "category": "리더십과 공동체", "answer": ["제 리더십의 강점은 필요한 일을 먼저 시작하고, 다른 사람이 함께 참여할 수 있는 형태로 만드는 것입니다. 경제를 함께 공부할 동아리를 만들고 기장을 맡았으며, 개념을 어려워하는 친구들을 위해 학습지를 제작했습니다. 제가 관심 있는 것을 혼자 잘하는 것과 함께 배울 환경을 만드는 것은 다르다는 걸 느꼈습니다.", "저는 리더가 모든 답을 혼자 내는 사람이라고 생각하지 않습니다. 구성원이 무엇을 이해하고 어떤 역할을 할 수 있는지 살피며 공동의 활동을 이어 가는 사람에 가깝습니다. 대학에서도 팀원들의 생각을 듣고 역할과 목표를 구체화하겠습니다. 아이디어가 실제 결과물로 이어지도록 돕는 역할을 하고 싶습니다."], "evidence": ["2학년 · 동아리활동 경제해부학2 | PDF 3쪽 / 인쇄 4쪽\n2학년 동아리활동의 창설·기장·학습지 제작이 핵심 근거입니다.", "2학년 · 독서활동상황 및 행동특성 종합의견 | PDF 20쪽 / 인쇄 21쪽\n신규 동아리 창설과 부원선발 전 과정 운영의 행동특성 기록입니다.", "2학년 · 행동특성 및 종합의견 | PDF 20쪽 / 인쇄 21쪽\n디지털·AI 리터러시 활용, 자료 분석과 오류 검증, 근거 있는 의사 표현, 학급 의견을 대변하는 소통, 동아리 창설·선발 운영이 기록됩니다."], "concepts": ["1. 리더십을 행동으로 설명하기  리더십이라는 성격평가보다 필요를 발견하고 어떤 선택을 했는지, 다른 사람이 참여할 조건을 어떻게 만들었는지 설명하면 경험이 구체적입니다. 가상 예시로 어려운 개념을 혼자 발표하는 것과 초심자가 질문할 수 있도록 자료를 만드는 것은 기여의 방식이 다릅니다. 경준에게는 경제동아리가 없는 상황과 학습지 제작이 연결된 사례가 실제 근거입니다.", "2. 책임 있는 운영과 성과의 범위  공동체 활동의 성과는 규모뿐 아니라 참여의 지속성, 학습기회, 역할의 공정성 등 여러 기준으로 볼 수 있습니다. 다만 확인하지 않은 만족도나 성적향상을 결과로 말해서는 안 됩니다. 경준은 자신이 만든 자료와 운영과정을 설명하고 개선할 점을 덧붙이면 됩니다. 창설 인원·지원자·선발자 수는 기존 전략서의 개인진술과 생기부를 구분해 확인해야 합니다. 리더십 질문에서 배운 점만 말하면 경험이 추상적으로 들릴 수 있습니다. 경제를 어려워하는 부원이 있었다는 문제, 학습지를 만들었다는 행동, 이해를 돕는 운영의 중요성을 느꼈다는 성찰을 연결하면 확인되는 사실만으로도 구체성이 생깁니다."], "follow": ["본인이 없어도 동아리가 이어지려면 무엇이 필요합니까?  개인 설명에만 의존하지 않도록 자료와 운영방식을 공유하고 부원들이 역할을 맡는 구조가 필요하다고 생각합니다. 이미 그런 제도를 완성했다는 뜻은 아닙니다."], "memory": "없던 학습기회를 만들고 책임지기", "caution": "", "source_refs": [], "university": "공통", "kind": "답변", "glossary": []}, {"id": 72, "question": "동아리 부원선발에서 어떤 기준과 공정성이 중요하다고 생각합니까?", "category": "리더십과 공동체", "answer": ["함께 배우는 동아리라면 이미 경제를 잘 아는지만으로 선발해서는 안 된다고 생각합니다. 저는 동아리를 만들고 부원선발 과정을 운영하면서, 어떤 학생에게 참여 기회를 줄지 결정하는 책임도 맡았습니다. 실제 활동에서는 경제를 어려워하는 친구들을 돕는 학습지도 만들었습니다.", "지금 돌아보면 활동의 목적에 맞는 기준을 미리 설명하고 일관되게 적용하는 것이 중요합니다. 관심과 참여의지도 살피되, 초심자라는 이유만으로 배울 기회를 닫지 않아야 한다고 봅니다. 운영할 수 있는 규모는 고려해야 하지만 자료를 공유하는 등 기회를 넓힐 방법도 함께 생각하겠습니다. 좋은 운영과 공정한 기회를 같이 고민하는 것이 리더의 책임이라고 생각합니다."], "evidence": ["2학년 · 독서활동상황 및 행동특성 종합의견 | PDF 20쪽 / 인쇄 21쪽\n부원선발 전 과정 운영은 행동특성에 확인됩니다.", "2학년 · 동아리활동 경제해부학2 | PDF 3쪽 / 인쇄 4쪽\n경제를 어려워하는 학생에게 학습지를 제공한 동아리의 실제 활동입니다."], "concepts": ["1. 기준의 공정성과 결과의 공정성  기준이 공정하다는 것은 활동목적에 맞고 지원자에게 일관되게 적용되며 불필요한 차별을 줄인다는 뜻입니다. 결과에 대한 아쉬움이 없다는 뜻은 아닙니다. 가상 예시로 초심자를 위한 학습동아리에서 사전지식만으로 선발하면 활동목적과 충돌할 수 있습니다. 참여의지 같은 기준도 어떻게 확인할지 설명하지 않으면 자의적인 평가가 될 수 있습니다.", "2. 수용 가능한 규모와 기회 확대  인원을 늘리면 지도와 운영에 드는 시간이 커질 수 있지만, 인원을 줄이는 것만이 해결책은 아닙니다. 활동자료 공개, 역할분담, 공개행사 등 기회를 넓히는 대안도 검토할 수 있습니다. 이는 경준이 앞으로 적용할 개선방향이며 실제로 모두 시행했다는 진술은 아닙니다. 면접에서는 수치의 방어보다 당시 목적과 선택기준, 지금 돌아본 개선점을 구분하는 것이 중요합니다. 결과를 모두에게 똑같이 주는 것과 동등하게 지원할 기회를 주는 것은 다를 수 있습니다. 다만 제한된 정원이라는 조건이 있다고 절차의 설명책임까지 줄어드는 것은 아닙니다. 목적에 맞는 기준과 지원자가 이해할 수 있는 안내가 함께 필요합니다."], "follow": ["경제 지식이 많은 학생만 뽑는 것이 맞을까요?  함께 경제를 배우는 동아리라면 사전지식만으로 판단하는 것은 맞지 않다고 생각합니다. 관심과 참여의지를 살피고 초심자도 이해할 수 있도록 자료를 마련하는 것이 중요합니다. 저는 활동 중 개념을 어려워하는 친구들을 위한 학습지를 만들었습니다."], "memory": "운영의 한계와 배울 기회를 함께", "caution": "기존 Q72의 질문은 40명 중 15명 선발에 관한 것이지만, 숫자는 생기부에 없습니다. 본인 경험으로 확인된 경우에만 숫자와 실제 기준을 덧붙입니다. 실제 선발기준을 묻는 경우에는 당시 안내문·질문지와 본인의 기억을 대조해야 합니다. 지금 생각하는 바람직한 기준을 당시 적용한 사실로 바꾸지 않습니다.", "source_refs": [], "university": "공통", "kind": "답변", "glossary": []}, {"id": 73, "question": "반장으로서 가장 기억에 남는 일은 무엇입니까?", "category": "리더십과 공동체", "answer": ["친구들이 수업과 학습에 참여할 수 있도록 돕는 역할이 기억에 남습니다. 학급 실장을 맡았고 영어 수업 준비와 활동 도우미로도 참여했습니다. 이런 역할을 하면서 눈에 띄는 일을 하는 것만큼, 수업이 원활하게 진행되도록 필요한 일을 챙기는 것도 중요하다고 느꼈습니다.", "동아리에서 학습지를 만들 때도 제가 이해한 내용을 그대로 말하는 것보다 상대가 어디서 어려움을 느끼는지 생각해야 했습니다. 저는 리더십을 직책으로만 설명하고 싶지는 않습니다. 함께하는 사람이 필요한 도움을 받을 수 있도록 제가 아는 내용과 시간을 쓰는 것이 제 방식의 기여였습니다. 대학에서도 이런 기본적인 책임을 놓치지 않겠습니다."], "evidence": ["2학년 · 자율활동 | PDF 2쪽 / 인쇄 3쪽\n2학년 학급 실장과 선도부 역할이 확인됩니다.", "2학년 · 봉사활동실적 | PDF 5쪽 / 인쇄 6쪽\n2학년 영어 수업 준비·활동 도우미가 학기별로 기록됩니다.", "2학년 · 동아리활동 경제해부학2 | PDF 3쪽 / 인쇄 4쪽\n학습지 제작은 동아리활동의 직접 근거입니다.", "1학년 · 자율활동 | PDF 1쪽 / 인쇄 2쪽\n1학년 자율활동의 학급 실장 역할이 학급 운영 경험의 출발점입니다."], "concepts": ["1. 학습지원에서 상대의 이해 확인  설명은 정보 전달만이 아니라 상대가 실제로 이해할 수 있게 표현과 순서를 조정하는 일입니다. 가상 예시로 개념정의를 먼저 읽어주는 것보다 쉬운 예를 든 뒤 자신의 말로 설명하게 하면 막히는 지점을 확인할 수 있습니다. 이 예시는 권장되는 방법이며 경준이 그 절차를 그대로 시행했다는 기록은 아닙니다.", "2. 공동체 기여를 전공과 연결하는 범위  학습도우미 경험을 억지로 전문 통상업무와 같다고 할 필요는 없습니다. 복잡한 정보를 상대의 언어로 바꾸려는 공통 태도를 설명하면 충분합니다. 경준의 근거는 실제 도우미 활동과 학습지 제작입니다. 특정 장소에서 설명한 장면이나 시험 일주일 전 준비, 친구들의 반응 등은 기존 개인진술을 확인한 뒤에만 구체화해야 합니다. 도움을 받는 친구를 수동적인 대상으로 묘사하지 않는 것도 중요합니다. 같은 내용을 함께 확인하고 서로 질문하는 관계로 설명하면 협력의 성격이 더 잘 드러납니다. 자신의 기여를 밝히면서 친구가 이해하고 참여한 몫까지 대신 성과로 가져오지 않아야 합니다."], "follow": ["친구가 이해하지 못하면 어떻게 하겠습니까?  같은 말을 반복하기보다 어떤 부분에서 막혔는지 먼저 물어보고 예시나 설명순서를 바꾸겠습니다. 저도 모르는 내용이면 확인해서 다시 설명하겠습니다."], "memory": "내 이해를 다른 사람의 이해로", "caution": "중앙현관 설명, 시험 일주일 전 시작 등 기존 문서의 구체적인 장면은 생기부에서 확인되지 않습니다. 실제 기억과 일치할 때만 사용합니다.", "source_refs": [], "university": "공통", "kind": "답변", "glossary": []}, {"id": 74, "question": "갈등을 해결한 경험이 있습니까?", "category": "리더십과 공동체", "answer": ["질문탐구 활동에서 서로 다른 관점을 하나의 결론으로 정리한 경험이 있습니다. 주제는 사회계층화와 불평등이 반드시 나쁜가였습니다. 저는 역할을 나누고 자료 분석을 총괄하며 팀의 논의를 정리했고, 대표로 질의응답을 맡았습니다. 단순히 찬반으로 나누기보다 각 의견이 어떤 조건을 강조하는지 살펴야 했습니다.", "결론은 성과에 대한 보상은 필요하지만 교육과 정보의 기회 격차는 보완해야 한다는 방향으로 모았습니다. 저는 의견을 조율한다는 것이 모두를 같은 생각으로 만드는 일은 아니라고 느꼈습니다. 서로 다른 기준을 분명히 하고 함께 설명할 수 있는 결론을 찾는 과정이었습니다. 심한 다툼을 해결했다기보다는 관점의 차이를 조정한 경험입니다."], "evidence": ["2학년 · 자율활동 질문탐구 활동 | PDF 3쪽 / 인쇄 4쪽\n질문탐구의 역할 배분·데이터 분석 총괄·논의 수렴·대표 질의응답이 직접 근거입니다.", "2학년 · 행동특성 및 종합의견 | PDF 20쪽 / 인쇄 21쪽\n디지털·AI 리터러시 활용, 자료 분석과 오류 검증, 근거 있는 의사 표현, 학급 의견을 대변하는 소통, 동아리 창설·선발 운영이 기록됩니다."], "concepts": ["1. 의견의 충돌을 기준의 차이로 보기  사람들이 다른 결론을 말할 때는 사실에 대한 판단뿐 아니라 중요하게 여기는 기준이 다를 수 있습니다. 가상 예시로 한 사람은 노력에 대한 보상을, 다른 사람은 출발기회의 격차를 강조할 수 있습니다. 두 기준이 언제 충돌하고 어디에서 함께 성립할 수 있는지 나누면 논의가 구체적입니다. 경준의 탐구결론도 유인과 교육·정보격차를 구분했습니다.", "2. 조율과 갈등해결을 과장하지 않기  역할을 나누고 논의를 수렴한 기록은 협력과 조정의 근거가 됩니다. 그러나 심한 다툼이 있었고 자신이 해결했다는 극적 서사까지 증명하지는 않습니다. 질문에 맞는 실제 사건이 떠오르면 당시 쟁점과 자신의 행동, 결과를 구체화하고, 아니라면 확인되는 조율경험을 솔직하게 설명하는 것이 좋습니다. 체육대회 갈등의 세부사항은 별도의 개인확인이 필요합니다. 토론의 결론을 합친다고 논리적 모순이 사라지는 것은 아닙니다. 보상 유인을 인정할 조건과 기회격차를 보정할 기준을 분리해 제시해야 합니다. 서로 다른 말을 절반씩 섞는 타협과 근거에 따라 적용범위를 나누는 조정은 구별됩니다."], "follow": ["상대 의견이 명백히 틀렸다면 어떻게 하겠습니까?  사람을 평가하기보다 어떤 근거나 계산이 맞지 않는지 확인하겠습니다. 제가 놓친 조건이 있을 수 있으므로 반론의 이유도 먼저 듣겠습니다."], "memory": "서로 다른 기준을 한 결론에 담기", "caution": "기존 체육대회 갈등 장면 대신 기록이 확인되는 팀 논의 조율을 사용했습니다. 실제 체육대회 경험이 확인되면 별도로 구체화할 수 있습니다.", "source_refs": [], "university": "공통", "kind": "답변", "glossary": []}, {"id": 75, "question": "가장 긴장됐던 발표와 극복방법은 무엇입니까?", "category": "리더십과 공동체", "answer": ["전교생 앞에서 통상정보 도구를 실시간으로 시연한 경험을 말씀드리고 싶습니다. 제가 만든 도구라도 청중에게는 검색방식과 점수가 낯설기 때문에, 화면을 보여 주는 것만으로는 충분하지 않았습니다. 무엇을 입력하면 어떤 근거를 찾고, 점수는 무엇을 뜻하는지 순서를 잡아 설명했습니다.", "발표에서는 장점만 강조하기보다 한계도 함께 전달하려고 했습니다. 저는 잘하는 사람처럼 보이는 것보다 제가 이해한 것을 분명하게 전달하는 데 집중하는 것이 중요하다고 느꼈습니다. 영어Ⅱ에서 강연을 분석하고 발표를 재구성했던 경험도 도움이 되는 연결점입니다. 면접에서도 준비한 문장을 다 말하기보다 질문에 맞는 핵심부터 전달하겠습니다."], "evidence": ["3학년 · 자율활동 | PDF 4쪽 / 인쇄 5쪽\n3학년 학술제에서 전교생을 대상으로 도구를 실시간 시연하고 원리와 한계를 설명한 기록입니다.", "2학년 · 영어Ⅱ | PDF 12쪽 / 인쇄 13쪽\n2학년 영어Ⅱ에서 영어강연 분석과 발표 재설계·시연이 확인됩니다."], "concepts": ["1. 실시간 시연의 설명 책임  시연은 결과를 눈앞에서 보여줄 수 있지만 화면만 움직인다고 이해가 생기지는 않습니다. 가상 예시로 검색결과와 점수가 뜰 때 어떤 질문이 들어갔고 점수가 무엇을 나타내는지 순서대로 설명해야 합니다. 예상과 다른 결과가 나와도 조건과 한계를 설명할 수 있어야 합니다. 경준의 기록에서는 검색점수와 근거공개를 함께 설명한 점이 강점입니다.", "2. 긴장 대처와 실제 경험의 범위  청중이 기억할 핵심과 설명순서를 익히면 말의 방향을 잃었을 때 돌아올 기준이 생깁니다. 다만 이것을 경준이 실제 수행한 호흡법이나 무대동선으로 바꾸어 쓰면 안 됩니다. 무대조명, 다리 떨림, 특정 제품발표 모방, 교사의 구체적인 칭찬은 현재 생기부 근거와 구분해야 합니다. 면접에서 본인이 기억하는 실제 행동을 한 가지 보태면 답변이 더 자연스러워집니다. 면접에서 발표의 긴장 자체보다 준비와 대응을 묻는 이유를 생각하면 답이 정리됩니다. 청중이 이해해야 할 핵심을 어떻게 정했고 예상과 다른 상황에서 무엇을 확인했는지를 설명하되, 실제로 겪지 않은 돌발상황을 극복사례로 만들지 않아야 합니다."], "follow": ["시연 중 결과가 틀리면 어떻게 대응하겠습니까?  결과를 숨기거나 즉석에서 정답인 척하지 않고 어떤 근거가 검색됐는지 함께 확인하겠습니다. 확인이 필요한 부분은 분리해서 설명하겠습니다."], "memory": "화면을 보여주고 판단근거를 설명하기", "caution": "긴장 당시 몸의 반응이나 무대동선은 원문에 없는 구체적 경험입니다. 본인 기억이 확인될 때만 보탭니다.", "source_refs": [], "university": "공통", "kind": "답변", "glossary": []}, {"id": 76, "question": "발표를 잘하기 위해 가장 중요한 것은 무엇입니까?", "category": "리더십과 공동체", "answer": ["저는 듣는 사람이 이해할 수 있는 순서로 설명하는 것이 가장 중요하다고 생각합니다. 영어Ⅱ에서 강연을 분석하고 제 발표를 다시 구성하면서, 흥미로운 시작과 근거·결론이 이어져야 내용이 남는다는 점을 배웠습니다. 말을 유창하게 하는 것만으로는 충분하지 않았습니다.", "통상정보 도구를 시연할 때도 전문용어보다 실제 질문과 검색 결과를 먼저 보여 주고 의미를 설명하는 것이 중요했습니다. 저는 상대가 어떤 부분에서 궁금해할지 생각하며 말하고 싶습니다. 면접에서도 질문에 대한 답을 먼저 드리고, 그 답을 뒷받침하는 경험과 제 생각을 이어서 설명하겠습니다."], "evidence": ["2학년 · 영어Ⅱ | PDF 12쪽 / 인쇄 13쪽\n영어강연 분석, 훅과 논리적 스토리라인을 활용한 발표 재설계입니다.", "3학년 · 자율활동 | PDF 4쪽 / 인쇄 5쪽\n전교생 대상 검색원리·점수체계·한계 설명입니다."], "concepts": ["1. 훅과 논리적 흐름  훅은 청중이 내용을 듣고 싶게 만드는 시작 장치입니다. 가상 예시로 복잡한 기술의 정의부터 나열하는 대신 왜 근거가 붙은 AI 답도 틀릴 수 있는가를 질문하면 관심과 주제를 연결할 수 있습니다. 그러나 자극적인 시작이 본문과 이어지지 않으면 혼란을 줍니다. 경준의 경험에서는 질문, 실제 작동, 해석과 한계가 자연스럽게 연결되는 것이 중요합니다.", "2. 정보량과 이해의 균형  듣는 사람은 글처럼 앞 문장으로 쉽게 돌아갈 수 없으므로 낯선 개념을 한꺼번에 많이 주면 이해가 끊길 수 있습니다. 핵심을 먼저 말하고 예시와 근거를 붙이면 흐름을 잡기 쉽습니다. 이것은 무조건 짧게 말하라는 뜻이 아닙니다. 경준의 면접답변도 질문의 깊이에 맞추어 설명을 확장하되, 확인한 사실과 자신의 해석이 어디서 갈리는지 들리게 하는 것이 좋습니다. 발표 중 쓰는 예시는 설명하려는 개념과 정확히 대응해야 합니다. 쉬운 비유가 이해를 돕더라도 중요한 조건을 지워버리면 오해가 생깁니다. 검색점수를 시험점수나 정답확률에 빗대는 대신 무엇을 재는 숫자인지 직접 설명하는 것이 그 사례입니다."], "follow": ["내용이 많아 시간을 넘기면 어떻게 하겠습니까?  질문에 대한 결론과 가장 중요한 근거부터 정리하겠습니다. 추가 설명이 필요한 부분은 면접관의 후속질문에 맞춰 이어가겠습니다."], "memory": "질문과 근거와 한계가 들리는 순서", "caution": "", "source_refs": [], "university": "공통", "kind": "답변", "glossary": []}, {"id": 77, "question": "선행이나 공동체 기여를 어떻게 생각합니까?", "category": "리더십과 공동체", "answer": ["저는 제가 가진 것을 다른 사람이 활용할 수 있는 형태로 나누는 것이 공동체 기여라고 생각합니다. 경제동아리에서 개념을 어려워하는 친구들을 위해 학습지를 만든 경험이 있습니다. 저만 이해하고 끝내는 것이 아니라 함께 공부할 수 있게 바꾸는 일이었습니다.", "영어 수업 도우미와 또래학습 지도, 교육과정 박람회에서 후배에게 교과목을 설명한 경험도 있습니다. 이런 일을 하며 제가 주고 싶은 도움과 상대가 필요한 도움은 다를 수 있다는 점을 생각했습니다. 앞으로도 큰 성과를 내는 일만 찾기보다 주변에 필요한 일이 무엇인지 듣고, 제가 맡을 수 있는 역할을 꾸준히 하겠습니다."], "evidence": ["2학년 · 동아리활동 경제해부학2 | PDF 3쪽 / 인쇄 4쪽\n2학년 동아리활동에 경제동아리 창설과 개념·이론 학습지 제작이 기록되어 있습니다.", "2학년 · 봉사활동실적 | PDF 5쪽 / 인쇄 6쪽\n2학년 봉사활동에 영어 수업 준비·활동 도우미가 기재되어 있습니다.", "3학년 · 봉사활동실적 | PDF 5–6쪽 / 인쇄 6–7쪽\n3학년 봉사활동에 또래학습 지도와 교과목 설명·후배 상담이 기록되어 있습니다.", "1학년 · 봉사활동실적 | PDF 5쪽 / 인쇄 6쪽\n1학년에도 방송·수업·급식 및 학교행사 지원을 꾸준히 수행한 봉사 기록이 있습니다."], "concepts": ["1. 상대가 활용할 수 있는 도움  도움은 제공한 양뿐 아니라 상대가 실제로 사용할 수 있었는지로 살펴볼 수 있습니다. 설명을 많이 했더라도 처음 배우는 사람이 핵심을 이해하지 못하면 학습의 어려움은 그대로 남습니다. 가령 관세를 설명할 때 정의만 읽어 주기보다 수입가격이 오르는 가상 사례를 함께 제시하면 개념을 적용하기 쉽습니다. 학습지 제작 경험에서는 자료를 만든 사실과 상대의 성적이 올랐다는 성과를 구분해야 합니다. 후자의 효과를 확인한 기록이 없다면 성과를 덧붙이지 않습니다.", "2. 공동체 기여를 설명하는 방법  면접에서는 직책이나 봉사시간에 앞서 누구에게 어떤 필요가 있었고 자신이 무엇을 했는지를 말하면 행동의 의미가 드러납니다. 동아리에서는 경제 개념을 어려워하는 친구를 위해 자료를 만들었고, 박람회에서는 교과 선택에 필요한 설명을 맡았다는 식입니다. 이는 같은 도움도 대상에 따라 내용이 달라진다는 예입니다. 모든 활동을 희생이나 특별한 리더십으로 포장할 필요는 없으며, 일상적인 역할을 책임 있게 수행한 과정 자체가 근거가 됩니다."], "follow": ["도움을 받는 사람이 원하지 않으면 어떻게 하겠습니까?  제가 도움이 된다고 판단하는 것과 상대가 필요한 것은 다를 수 있습니다. 먼저 어떤 부분이 어려운지 묻고, 원하지 않는 방식의 도움을 계속 강요하지 않겠습니다."], "memory": "필요 발견 → 학습지와 설명 → 상대의 활용", "caution": "도움받은 학생의 성적 향상이나 구체적인 감사 발언은 확인된 기록이 없으므로 추가하지 않습니다.", "source_refs": [], "university": "공통", "kind": "답변", "glossary": []}, {"id": 78, "question": "수학 성적이 내려간 이유는 무엇입니까?", "category": "성적·한계·압박 질문", "answer": ["수학에서 관심만큼 안정적인 성적을 보여 주지 못한 점은 제가 보완해야 할 부분입니다. 특히 수학Ⅱ에서 4등급을 받았습니다. 탐구를 많이 했다는 사실로 그 결과를 대신 설명하기보다는, 기본 개념을 평가 상황에서 정확하게 활용하는 실력도 갖춰야 한다고 생각합니다.", "이후에도 수학을 피하지 않고 환율 회귀와 탄소비용 모형을 다뤘으며, 심화 수학Ⅰ에서는 어려운 개념의 발표에도 자원했습니다. 경제 수학에서 97점 A를 받았지만 다른 과목까지 약점이 모두 해결된 것은 아닙니다. 대학에서는 응용에 대한 관심을 유지하면서 미적분과 통계의 기초를 체계적으로 보완하겠습니다."], "evidence": ["1학년 · 교과학습발달상황 성적표 | PDF 6쪽 / 인쇄 7쪽\n1학년 성적표에 수학 1학기 2등급·2학기 3등급이 기재되어 있습니다.", "2학년 · 교과 성적 | PDF 10쪽 / 인쇄 11쪽\n2학년 1학기 수학Ⅰ 3등급·수학Ⅱ 4등급입니다. 두 과목은 같은 학기에 이수했습니다.", "3학년 · 경제 수학 | PDF 18쪽 / 인쇄 19쪽\n3학년 경제 수학의 환율회귀와 직접 계산 활동이 근거입니다. 97점 A는 별도 성적표 대조 수치입니다.", "3학년 · 심화 수학Ⅰ | PDF 18쪽 / 인쇄 19쪽\n3학년 심화 수학Ⅰ의 발표 참여와 탄소비용 모형 활동이 근거입니다. 74점 B는 별도 성적표 대조 수치입니다.", "3학년 · 3학년 1학기 교과 성적 | PDF 16, 18쪽 / 인쇄 17, 19쪽\n3학년 1학기 성적표에 경제 수학 97점 A와 심화 수학Ⅰ 74점 B가 기재되어 있습니다. 서로 다른 과목의 성적이므로 동일 평가의 향상 폭으로 계산하지 않습니다."], "concepts": ["1. 성적과 수행 경험을 함께 해석하기  성적은 해당 과목의 평가기준에 따른 학업 성취의 증거이고, 탐구는 특정 문제에 개념을 적용한 경험의 증거입니다. 회귀모형을 다뤘다고 해서 수학의 모든 기본기가 충분하다고 결론낼 수 없으며, 한 과목의 낮은 성적만으로 이후 모든 응용 경험이 사라지는 것도 아닙니다. 따라서 수학Ⅱ 4등급을 인정하면서 경제 수학의 계산·분석과 심화 수학Ⅰ 발표를 함께 설명해야 합니다. 서로 다른 과목의 점수는 난도·수강집단·평가방식도 달라 단순한 한 줄 상승 그래프로 합치지 않습니다.", "2. 원인 진술과 보완 행동의 구분  성적표는 결과를 보여주지만 하락의 원인까지 알려주지는 않습니다. 시간배분 실패나 시험 당시 건강문제를 실제로 확인하지 않았다면 그럴듯한 이유로 넣을 수 없습니다. 이 답변은 원인을 꾸미는 대신 성적과 확인된 보완 행동을 말하도록 설계했습니다. 발표에 자원했다는 과거 행동과 앞으로 기초를 보완하겠다는 계획도 구별합니다. 면접관이 구체적 원인을 재차 물으면 자신의 실제 공부 방식과 당시 상황 중 기억하고 설명할 수 있는 사실만 덧붙여야 합니다."], "follow": ["탐구로 수학 공부를 대신한 것 아닌가요?  탐구만으로 교과의 기본기를 충분히 갖췄다고 말할 수는 없습니다. 적용 경험은 이어가되 기본 개념을 정확히 설명하고 여러 유형의 문제에 적용하는 학습도 함께 해야 한다고 생각합니다."], "memory": "성적 인정 → 기록된 보완 → 남은 과제", "caution": "성적 하락의 구체적 원인은 원기록만으로 확인되지 않습니다. 실제 공부 방식과 당시 상황을 본인이 확인해 한 문장으로 추가해야 합니다. 진로 몰입·건강·시간배분을 임의의 원인으로 넣지 않습니다.", "source_refs": [], "university": "공통", "kind": "답변", "glossary": []}, {"id": 79, "question": "수학 성적이 완벽하지 않은데 정량분석이 강점이라고 할 수 있습니까?", "category": "성적·한계·압박 질문", "answer": ["제 강점은 정량분석을 이미 완성했다는 데보다, 경제적 설명을 숫자로 확인하고 결과를 다시 점검해 본 데 있다고 생각합니다. 수학 성적에서 보완할 부분이 있다는 점은 인정합니다. 그렇지만 그 때문에 자료를 다루는 질문을 피하지는 않았습니다.", "환율 모형의 잔차가 한쪽으로 이어지는 것을 보고 달러지수를 추가했고, 설명력과 계수가 함께 달라지는 이유를 살폈습니다. 이 과정은 기초를 더 배워야 할 이유를 분명하게 해 줬습니다. 대학에서는 제가 해 본 분석을 출발점으로 삼되, 미적분과 통계의 원리를 다시 익혀 계산과 해석을 함께 설명할 수 있는 능력을 쌓겠습니다."], "evidence": ["3학년 · 경제 수학 | PDF 18쪽 / 인쇄 19쪽\n3학년 경제 수학에서 금리차 모형의 잔차, 달러지수 추가와 계수 변화 및 VIF 검토가 기록되어 있습니다.", "3학년 · 심화 수학Ⅰ | PDF 18쪽 / 인쇄 19쪽\n3학년 심화 수학Ⅰ에 개념 발표와 비용전가 모형 분석이 기재되어 있습니다.", "2학년 · 교과 성적 | PDF 10쪽 / 인쇄 11쪽\n2학년 수학Ⅰ 3등급·수학Ⅱ 4등급을 함께 고려해야 합니다.", "3학년 · 3학년 1학기 교과 성적 | PDF 16, 18쪽 / 인쇄 17, 19쪽\n3학년 1학기 성적표에 경제 수학 97점 A와 심화 수학Ⅰ 74점 B가 기재되어 있습니다. 서로 다른 과목의 성적이므로 동일 평가의 향상 폭으로 계산하지 않습니다."], "concepts": ["1. 정량분석의 강점은 계산과 해석에 함께 있다  정량분석은 숫자를 계산하는 일과 그 숫자가 무엇을 뜻하는지 판단하는 일을 포함합니다. 예를 들어 두 변수의 관계를 회귀식으로 구하는 것은 계산이며, 계수가 원인효과인지 단순한 동행관계인지 따지는 것은 해석입니다. 계산만 정확해도 잘못된 가정으로 결론을 과장할 수 있습니다. 금리차 모형에 다른 변수를 넣고 계수와 잔차가 어떻게 바뀌는지 살핀 경험은 해석을 점검한 근거가 되지만, 고급 분석을 독립적으로 완수할 능력이 모두 검증됐다는 뜻은 아닙니다.", "2. 설명력과 검증된 능력의 범위  결정계수는 현재 표본에서 모형이 종속변수 변동을 얼마나 설명하는지를 나타냅니다. 변수를 추가하면 이 값이 높아질 수 있으므로 표본 밖 예측이나 변수의 타당성을 별도로 확인해야 합니다. 시험 점수에도 비슷한 범위의 문제가 있습니다. 특정 과목에서 좋은 평가를 받은 사실은 의미가 있지만 모든 수학 영역의 숙달을 보장하지 않습니다. 자신의 강점을 답할 때에는 구체적인 수행 내용과 그 내용이 증명하지 못하는 범위를 함께 말하면 주장과 근거가 일치합니다."], "follow": ["대학 수준의 계량경제학을 따라갈 수 있겠습니까?  고교에서 다뤄 본 개념이 출발점은 될 수 있지만 대학 과정을 이미 안다고 생각하지는 않습니다. 미적분과 확률·통계를 기초부터 익히고, 모형의 가정을 증명과 실제 자료 양쪽에서 확인하며 배우겠습니다."], "memory": "완성된 실력보다 검증하는 학습 태도", "caution": "", "source_refs": [], "university": "공통", "kind": "답변", "glossary": []}, {"id": 80, "question": "약점을 묻는 질문에서 가장 보여주고 싶은 점은 무엇입니까?", "category": "성적·한계·압박 질문", "answer": ["저는 부족한 결과를 인정하면서도 그 뒤에 어떤 행동을 했는지 보여 드리고 싶습니다. 약점을 잘 포장하는 것보다 제가 어디까지 할 수 있고 무엇을 더 배워야 하는지 정확히 아는 것이 중요하다고 생각합니다. 수학 탐구 경험이 있다고 해서 수학의 기본기가 모두 충분하다고 말할 수는 없습니다.", "일본어에서도 관심만으로 실력이 생기지는 않았습니다. 회화 수업에서는 맡은 더빙 영상을 반복해서 보고 들으며 발음과 타이밍을 연습했습니다. 저는 이런 구체적인 행동으로 답하고 싶습니다. 앞으로도 부족함을 숨기기보다 작은 과제로 나눠 보완하고, 나아졌는지 확인하는 태도를 이어 가겠습니다."], "evidence": ["2학년 · 교과 성적 | PDF 10쪽 / 인쇄 11쪽\n2학년 수학·일본어 성적의 실제 수준이 확인됩니다.", "2학년 · 일본어 회화Ⅰ | PDF 15쪽 / 인쇄 16쪽\n2학년 일본어 회화Ⅰ에서 장음과 박의 적용, 반복 시청·듣기를 통한 더빙 연습이 기록됩니다.", "3학년 · 심화 수학Ⅰ | PDF 18쪽 / 인쇄 19쪽\n3학년 심화 수학Ⅰ에서 어려운 개념 발표에 자원한 학습 행동이 기록됩니다."], "concepts": ["1. 자기점검은 평가와 행동을 연결하는 과정  자기점검은 자신을 낮게 평가하는 말이나 자신감을 보이는 말 자체가 아니라, 현재 결과를 근거로 다음 행동을 조정하는 과정입니다. 일본어 성적이 낮다는 사실을 확인한 뒤 발음과 타이밍을 반복 연습한 과정을 설명하는 것은 점검의 한 예가 될 수 있습니다. 다만 연습이 모든 성적 차이를 만들었다는 인과관계까지 증명하지는 않습니다. 결과·행동·남은 한계를 구분하면 개선을 실제보다 크게 포장하지 않으면서도 학습 태도를 드러낼 수 있습니다.", "2. 약점 답변의 구체성과 책임  책임을 인정한다는 것은 확인되지 않은 원인을 억지로 만들어 자신을 비난하는 일이 아닙니다. 성적이나 수행에서 부족했던 결과를 받아들이고, 남의 탓으로 돌리지 않은 채 자신이 할 수 있는 행동을 설명하는 것입니다. 예컨대 앞으로 기초 개념을 복습하겠다는 계획과 이미 발표에 자원했다는 경험은 시제가 다릅니다. 면접에서는 두 내용을 섞어 아직 하지 않은 일을 했다고 말하지 않아야 합니다. 짧은 답변에도 과거의 사실과 미래의 실행계획이 구별되어야 합니다."], "follow": ["약점을 고쳤다고 볼 근거가 부족한 것 아닌가요?  완전히 고쳤다고 말하기는 어렵습니다. 반복 연습과 발표 참여는 확인되는 행동이지만 남은 부족함도 있으므로, 개선의 과정과 앞으로의 계획을 함께 말씀드리는 것이 정확하다고 생각합니다."], "memory": "결과 인정 → 행동 제시 → 해결 범위", "caution": "", "source_refs": [], "university": "공통", "kind": "답변", "glossary": []}, {"id": 81, "question": "일본어 성적이 왜 낮았습니까?", "category": "성적·한계·압박 질문", "answer": ["일본에 대한 관심을 언어 실력으로 충분히 연결하지 못한 점이 아쉬웠습니다. 일본의 경제정책을 조사했지만 일본어Ⅰ에서는 76점, 5등급을 받았습니다. 관심 있는 주제를 조사하는 것과 기본 표현을 정확히 익히는 공부를 함께 해야 한다고 생각합니다.", "이후 일본어 회화Ⅰ에서는 장음과 박을 의식해 말하고, 더빙할 배역의 영상을 반복해서 보고 들으며 발음과 타이밍을 맞췄습니다. 회화 과목에서는 89점 A를 받았고, 실제로 듣고 말하는 연습의 필요성을 느꼈습니다. 두 과목은 평가방식이 다르지만 그 연습 경험은 분명히 남았습니다. 앞으로도 관심을 꾸준한 기초학습으로 연결하겠습니다."], "evidence": ["2학년 · 교과 성적 | PDF 10쪽 / 인쇄 11쪽\n2학년 1학기 일본어Ⅰ 76점·C·5등급입니다.", "2학년 · 진로선택 교과 성적 | PDF 14쪽 / 인쇄 15쪽\n2학년 2학기 진로선택 일본어 회화Ⅰ 89점·A이며 석차등급은 없습니다.", "2학년 · 일본어 회화Ⅰ | PDF 15쪽 / 인쇄 16쪽\n일본어 회화Ⅰ에서 장음·박을 적용하고 하울의 움직이는 성의 병사 2 배역을 반복 시청·듣기로 연습했습니다.", "2학년 · 일본어Ⅰ | PDF 13쪽 / 인쇄 14쪽\n2학년 일본어Ⅰ에서 일본의 금융·환율정책과 버블경제를 탐구한 관심의 근거입니다."], "concepts": ["1. 장음과 박을 왜 구분해야 하는가  일본어의 박은 말소리의 길이를 나누어 인식하는 기본적인 리듬 단위입니다. 장음은 앞 모음을 길게 이어 발음하는 것으로 보통 두 박의 길이를 갖습니다. 길이를 달리하면 다른 단어로 들릴 수 있으므로 단어 뜻을 아는 것과 정확하게 발음하는 것은 별개의 연습이 필요합니다. 생기부에는 장음 단어를 자기소개에서 사용하고 더빙의 타이밍을 맞춘 활동이 있습니다. 이 경험을 이야기하면 막연히 열심히 했다는 말보다 무엇을 어떻게 연습했는지 구체적으로 드러납니다.", "2. 성취도와 석차등급의 차이  성취도는 교육과정의 성취수준에 따른 평가이고, 석차등급은 수강집단 안의 상대적 위치를 나타내는 지표입니다. 일본어Ⅰ의 C·5등급과 일본어 회화Ⅰ의 A를 비교할 때에는 과목 내용과 평가체계가 달라 같은 시험의 상승폭으로 계산할 수 없습니다. 회화 과목에서 좋은 성취를 보였다는 사실은 말할 수 있지만 5등급에서 1등급으로 올랐다는 표현은 잘못입니다. 전자의 부족함을 인정하면서 후자의 구체적인 발음·듣기 활동을 별도의 보완 경험으로 제시해야 합니다."], "follow": ["일본어를 잘한다고 자신 있게 말할 수 있습니까?  수업에서 연습한 자기소개와 더빙 표현을 익힌 경험은 있지만 일본어 전반에 능숙하다고 말할 수준은 아닙니다. 익숙하지 않은 표현을 정확하게 이해하고 말하는 기초를 더 쌓아야 합니다."], "memory": "일본어Ⅰ C5 → 회화Ⅰ A → 과목과 척도 구분", "caution": "시험 당시 건강문제·매일 단어복습·영어와 같은 단기암기 방식 등은 원문에서 확인되지 않습니다.", "source_refs": [], "university": "공통", "kind": "답변", "glossary": []}, {"id": 82, "question": "통상·금융·AI까지 너무 많은 것 아닌가요?", "category": "성적·한계·압박 질문", "answer": ["제 관심이 여러 분야에 걸쳐 있지만 중심 질문은 같습니다. 국제환경이 바뀔 때 기업은 무엇을 근거로 선택해야 하는가입니다. 관세와 규범을 보다가 실제 비용이 궁금해졌고, 환율을 분석하다가 자료 해석의 문제가 생겼으며, 기업 인터뷰에서는 정보 접근의 어려움을 발견했습니다.", "그래서 금융과 데이터, AI는 각각 다른 진로를 추가했다기보다 그 질문을 풀기 위해 필요해진 공부였습니다. 물론 범위가 넓다고 깊이가 저절로 생기는 것은 아닙니다. 대학에서는 지원 전공의 기초를 중심에 두고, 한 문제를 충분히 설명하는 데 필요한 방법을 단계적으로 배우겠습니다. 분야의 수보다 연결의 이유를 분명히 하겠습니다."], "evidence": ["3학년 · 진로활동 | PDF 4–5쪽 / 인쇄 5–6쪽\n3학년 진로활동의 관세귀착 인터뷰와 정보시차 문제입니다.", "3학년 · 경제 수학 | PDF 18쪽 / 인쇄 19쪽\n3학년 경제 수학의 환율모형 분석입니다.", "3학년 · 자율활동 | PDF 4쪽 / 인쇄 5쪽\n3학년 자율활동에서 정보문제를 통상정보 도구 구축으로 확장했습니다."], "concepts": ["1. 분야의 융합과 학습 범위  융합은 서로 다른 분야의 용어를 많이 사용하는 것이 아니라 하나의 문제에서 각 분야가 맡는 역할을 분명히 하는 것입니다. 수출기업의 가격결정을 예로 들면 통상규범은 가능한 선택의 범위를, 경제학은 비용과 수요의 반응을, 통계는 자료 속 관계를, 정보기술은 자료를 찾는 과정을 다룹니다. 각 역할을 이해하면 필요한 학습이 구체화됩니다. 반대로 관련 분야를 모두 자신의 전문영역이라고 주장하면 현재 수행 범위를 넘어설 수 있으므로 중심 전공과 보조 도구를 구별합니다.", "2. 정보도구와 경제적 판단의 관계  정보를 빨리 찾는 기능과 좋은 의사결정을 내리는 기능은 같지 않습니다. 도구가 관세 조항을 찾아도 적용 시점·예외·상품분류를 사람이 검토해야 하고, 기업이 비용을 가격에 반영할 수 있는지는 계약과 수요에 달려 있습니다. 자신의 RAG 도구 경험은 이 중 근거를 찾고 확인하는 절차와 관련됩니다. AI 도입이 통상문제를 자동으로 해결한다고 말하기보다 어떤 단계를 줄이고 어떤 판단은 남는지 설명해야 기술과 전공의 연결이 설득력을 갖습니다."], "follow": ["한 분야만 선택해야 한다면 무엇입니까?  국제통상을 선택하겠습니다. 제가 가장 오래 붙잡아 온 질문이 국경을 넘는 거래의 규칙과 비용이 기업에 미치는 영향이기 때문이고, 금융과 데이터는 그 질문을 더 정확히 다루기 위해 배우고 싶습니다."], "memory": "중심은 통상 → 필요한 금융과 데이터 → 검증 도구", "caution": "", "source_refs": [], "university": "공통", "kind": "답변", "glossary": []}, {"id": 83, "question": "활동이 너무 많아 깊이가 얕아 보입니다.", "category": "성적·한계·압박 질문", "answer": ["모든 활동의 깊이가 같다고 말씀드리지는 않겠습니다. 다만 관세와 정보 문제는 질문을 바꾸어 가며 여러 번 확인한 흐름이 있습니다. 관세 부담을 기업에 물었고, 정보시차를 발견한 뒤에는 근거를 찾는 도구를 만들었습니다. 이후에는 그 도구의 점수를 믿을 수 있는지, 실제 유료수요가 있는지까지 다시 검토했습니다.", "저는 이 과정이 제 탐구의 깊이를 보여 준다고 생각합니다. 결과물을 만들었다고 끝내지 않고 기술의 신뢰성과 경제적 필요성을 따로 물었습니다. 처음 생각을 유지하는 것보다 부족한 설명을 고치는 일이 더 중요했습니다. 면접에서도 활동 이름을 많이 나열하기보다 한 탐구에서 제가 어떤 판단을 바꿨는지 구체적으로 말씀드리겠습니다."], "evidence": ["3학년 · 진로활동 | PDF 4–5쪽 / 인쇄 5–6쪽\n관세귀착 사례에서 협상력·거래관계·정보시차를 검토했습니다.", "3학년 · 자율활동 | PDF 4쪽 / 인쇄 5쪽\n검색과 신뢰의 차이를 점검하고 한계고지를 구현했습니다.", "3학년 · 실용 경제 | PDF 17쪽 / 인쇄 18쪽\n정보 앱 사업성에서 잠재수요와 지불능력, 기회비용을 재검토했습니다."], "concepts": ["1. 탐구의 깊이를 설명하는 증거  탐구의 깊이는 어려운 개념의 수보다 최초 질문, 자료선택, 가정, 반례, 수정 내용을 얼마나 구체적으로 설명할 수 있는지에서 드러납니다. 예를 들어 정보가 부족하다는 사실을 발견했다고 곧바로 유료정보 수요가 충분하다고 결론내릴 수는 없습니다. 정보의 필요와 구매의사는 다르다는 점을 사업성 분석에서 다시 검토했다면 앞선 결론을 더 세밀하게 만든 것입니다. 면접에서는 여러 활동명을 나열하기보다 한 활동의 수정 전후를 비교하는 편이 이런 과정을 보여주기 쉽습니다.", "2. 연결성은 사후에 과장하지 않는다  여러 활동이 같은 관심과 관련될 수 있어도 모든 활동이 처음부터 정교하게 계획된 순서로 진행됐다는 뜻은 아닙니다. 자료에는 기업 인터뷰의 정보문제가 도구 구축으로 이어지고 도구를 사업 아이템으로 검토한 연결이 확인됩니다. 이처럼 기록된 연결은 설명하되, 음악이나 미술까지 모두 통상전략가를 위한 계획이었다고 만들 필요는 없습니다. 각 활동의 독립적인 배움도 인정해야 서사가 사실에 맞고, 깊이 질문에서 실제 수행한 범위를 안정적으로 답할 수 있습니다."], "follow": ["가장 깊게 준비한 활동 하나를 바로 설명해보세요.  관세귀착 인터뷰를 말씀드리겠습니다. 같은 정책조건에서도 기업부담이 달라지는 이유를 물었고, 소수 사례에서 거래관계와 정보시차라는 변수를 발견했지만 전체 기업으로 일반화할 수 없다는 한계를 함께 정리했습니다."], "memory": "관세 인터뷰 → 정보도구 신뢰 → 사업성 재검토", "caution": "", "source_refs": [], "university": "공통", "kind": "답변", "glossary": []}, {"id": 84, "question": "기업 인터뷰 세 건으로 무슨 결론을 낼 수 있습니까?", "category": "성적·한계·압박 질문", "answer": ["전체 기업의 평균 부담을 결론낼 수는 없지만, 추가로 조사할 조건은 발견할 수 있었습니다. 세 기업의 이야기를 들으며 같은 관세라도 거래관계와 정보시차에 따라 부담이 달라질 수 있다는 점을 살폈습니다. 제가 한 연구의 범위는 그런 작동 과정을 탐색하는 데 있습니다.", "저는 적은 사례라는 이유로 결과를 과장해서도, 무의미하다고 버려서도 안 된다고 생각합니다. 다음에는 업종과 규모를 나누고 부담의 분모와 계약 시점을 맞춰 비교하고 싶습니다. 처음부터 많은 자료를 가진 연구는 아니었지만, 실제 기업에 질문했기 때문에 이론만으로 떠올리지 못했던 후속 질문을 만들 수 있었습니다."], "evidence": ["3학년 · 진로활동 | PDF 4–5쪽 / 인쇄 5–6쪽\n3학년 진로활동에 이메일 포함 세 건의 인터뷰와 소표본·자기보고 한계가 명시됩니다.", "3학년 · 실용 경제 | PDF 17쪽 / 인쇄 18쪽\n3학년 실용 경제에서도 대미수출 중소기업 3사 인터뷰의 사업성 활용이 기록됩니다."], "concepts": ["1. 사례연구와 통계적 일반화  사례연구는 적은 수의 사례를 자세히 살펴 사건이 발생하는 과정이나 새로운 변수를 찾는 방법입니다. 반면 전체 기업의 평균 부담을 추정하려면 모집단을 대표하는 표본과 일관된 측정이 필요합니다. 세 기업의 부담비율을 단순 평균내더라도 표본선택·업종·계약조건이 달라 한국 기업 전체의 평균이 되지는 않습니다. 이 탐구의 의미는 관세율 외에 정보시차와 거래관계도 질문해야 한다는 가설을 얻은 데 있으며, 그 가설이 얼마나 널리 적용되는지는 다음 연구의 문제입니다.", "2. 자기보고 자료와 교차확인  자기보고 자료는 조사대상이 자신의 경험이나 수치를 설명한 자료입니다. 내부 사정을 알 수 있다는 장점이 있지만 기억오차, 유리한 방향의 표현, 서로 다른 계산기준이 개입할 수 있습니다. 예를 들어 관세를 절반 부담했다는 말이 추가관세액의 절반인지 이윤감소율인지 확인해야 비교가 가능합니다. 이메일·인터뷰 진술을 가격변경 기록, 계약시점, 거래조건과 대조하면 해석을 보완할 수 있습니다. 여러 자료가 일치해도 소표본이라는 제한까지 없어지는 것은 아닙니다."], "follow": ["그렇다면 인터뷰 결과는 별 의미가 없는 것 아닙니까?  평균효과를 추정하는 데에는 부족하지만 후속 조사의 질문을 더 정확하게 만드는 데 의미가 있습니다. 무엇을 조사해야 하는지 찾는 단계와 그 영향의 크기를 일반화하는 단계를 구분하고 있습니다."], "memory": "세 건 → 메커니즘 탐색 → 일반화 유보", "caution": "기존 전략서의 직접 인터뷰 2건과 공개사례 1건이라는 표현은 현재 생기부의 이메일 포함 세 건과 다릅니다. 현재 원문 표현을 사용합니다.", "source_refs": [], "university": "공통", "kind": "답변", "glossary": []}, {"id": 85, "question": "회귀분석으로 환율의 원인을 설명했다고 볼 수 있습니까?", "category": "성적·한계·압박 질문", "answer": ["제가 확인한 것은 환율과 설명변수의 관계이며, 원인을 확정한 것은 아닙니다. 금리차만 넣은 모형에서 잔차가 한쪽으로 이어져 달러지수를 추가했고, 설명력과 계수가 함께 달라졌습니다. 이것은 최초 설명을 다시 검토해야 할 근거였습니다.", "저는 이 결과를 분석의 실패라기보다 해석을 더 정확히 만드는 과정으로 받아들이고 싶습니다. 약 88%의 설명력을 얻었다고 해도 다른 시기의 예측이나 인과효과는 별도로 검증해야 합니다. 대학에서는 시계열과 계량경제학을 배워 어떤 조건에서 원인을 말할 수 있는지 익히겠습니다. 제 결과를 크게 말하는 것보다 설명할 수 있는 범위를 분명히 하는 것이 중요합니다."], "evidence": ["3학년 · 경제 수학 | PDF 18쪽 / 인쇄 19쪽\n3학년 경제 수학의 61개월 분석, 설명력 54%에서 88%, 금리차 계수 크기 변화와 VIF 확인이 근거입니다."], "concepts": ["1. 누락변수와 회귀계수의 해석  회귀식에 포함하지 않은 변수가 결과에 영향을 주면서 설명변수와도 관련되면 추정계수에 그 영향이 섞일 수 있습니다. 가령 환율에 영향을 주는 글로벌 달러 움직임이 금리차와 함께 변한다면 금리차만 넣은 계수가 순수한 금리차 효과를 나타내지 않을 수 있습니다. 달러지수 추가 후 금리차 계수가 달라졌다는 사실은 이 가능성을 검토할 계기입니다. 하지만 한 변수를 더 넣었다는 이유만으로 모든 교란을 제거했다거나 인과효과를 식별했다고 말할 수는 없습니다.", "2. 시계열 자료의 추가적인 주의점  매달 관찰한 환율은 시간 순서가 있는 자료이므로 서로 독립인 관측치처럼만 다루면 문제가 생길 수 있습니다. 잔차의 자기상관은 이전 오차와 다음 오차가 관련되는 경우이고, 비정상성은 평균이나 분산 등의 성질이 시간에 따라 달라지는 문제입니다. 공통 추세 때문에 실제 관계보다 강한 상관이 나타날 수도 있습니다. VIF는 설명변수끼리의 선형 관련성을 살피는 지표이므로 이러한 문제를 대신 검증하지 않습니다. 표본 밖 예측이나 인과해석에는 별도의 진단이 필요합니다."], "follow": ["88%면 나머지 12%가 정치적 위험입니까?  그렇게 볼 수 없습니다. 설명하지 못한 변동에는 누락변수, 측정오차, 우연한 충격과 모형설정의 영향이 함께 들어갈 수 있습니다. 잔차만으로 정치적 위험의 크기를 분리할 수는 없습니다."], "memory": "모형 수정 → 설명력 상승 → 인과관계는 별도", "caution": "", "source_refs": [], "university": "공통", "kind": "답변", "glossary": [37]}, {"id": 86, "question": "돈을 많이 벌고 싶은데 사회문제 해결은 명분 아닌가요?", "category": "성적·한계·압박 질문", "answer": ["경제적으로 성취하고 싶은 마음은 있습니다. 다만 그 마음과 다른 사람의 문제를 해결하려는 관심이 반드시 반대라고 생각하지는 않습니다. 중요한 것은 사회적 가치를 말하는 데서 그치지 않고, 제가 제공한 것이 이용자에게 실제로 도움이 되는지 확인하는 일입니다.", "무역정보 앱의 사업성을 검토하면서 정보가 필요한 기업과 돈을 지불할 수 있는 기업이 다를 수 있다는 점을 봤습니다. 무료 정보가 있는 상황에서 무엇을 더 제공할지도 고민했습니다. 저는 정보를 과장해서 얻는 수익보다 근거를 확인하고 설명하는 전문성으로 인정받고 싶습니다. 제 성취가 다른 사람에게 어떤 가치로 연결되는지 계속 묻겠습니다."], "evidence": ["3학년 · 실용 경제 | PDF 17쪽 / 인쇄 18쪽\n3학년 실용 경제에서 낮은 지불여력, 무료 공공정보, 잠재시장과 유효수요의 차이를 검토했습니다.", "3학년 · 자율활동 | PDF 4쪽 / 인쇄 5쪽\n3학년 자율활동에서 정보도구의 근거공개와 한계고지 기능을 구현했습니다."], "concepts": ["1. 사회적 필요와 유효수요의 차이  어떤 문제가 심각하다는 사실만으로 유료서비스 시장이 성립하지는 않습니다. 유효수요에는 필요뿐 아니라 지불의사와 지불능력이 있어야 합니다. 예를 들어 관세정보가 절실한 작은 기업이 오히려 비용을 부담하기 어려울 수 있고, 무료 공공자료가 충분하다면 단순한 정보모음에 돈을 내지 않을 수도 있습니다. 실용 경제 탐구는 이 차이를 확인한 경험입니다. 공익을 강조하거나 잠재고객 수만 세기보다 이용자가 어떤 추가 가치를 얻는지 살펴야 사업성과 사회적 효용을 함께 판단할 수 있습니다.", "2. 수익과 사회적 가치가 연결되는 조건  수익은 고객이 돈을 지불했다는 결과를 보여주지만 그 자체로 모든 사회적 가치를 증명하지는 않습니다. 정보의 품질을 확인하기 어려우면 과장된 광고로도 일시적인 판매가 생길 수 있기 때문입니다. 통상정보 서비스라면 출처의 정확성, 적용범위, 오류 수정과 한계 고지 같은 기준이 필요합니다. 자신의 도구에서 신뢰 검증의 어려움을 밝힌 경험은 이런 책임과 연결됩니다. 사회문제를 해결한다는 주장은 선한 동기뿐 아니라 이용자의 실제 편익과 비용을 근거로 평가해야 합니다."], "follow": ["수익이 나지 않아도 그 일을 계속하겠습니까?  의미가 있어도 지속할 수 있는 자원은 필요하다고 생각합니다. 같은 목표를 공공정보와 연계하거나 기능과 비용을 조정하는 방식으로 달성할 수 있는지 검토하겠습니다. 수익성과 필요를 모두 확인하며 선택하겠습니다."], "memory": "성취 동기 인정 → 실제 편익 → 신뢰 책임", "caution": "개인 소득목표나 현재 운영하는 별도 판매 서비스의 실적은 이 답변에 끌어오지 않습니다.", "source_refs": [], "university": "공통", "kind": "답변", "glossary": [62]}, {"id": 87, "question": "가장 인상 깊은 책은 무엇입니까?", "category": "독서와 가치관", "answer": ["진로와 연결해 가장 인상 깊었던 책은 피에트라 리볼리의 『티셔츠 경제학』입니다. 상품 하나가 이동하는 과정을 따라가면 무역이 가격과 생산성만으로 설명되지 않고 정책과 기업의 선택, 거래관계와 연결된다는 점이 인상적이었습니다. 저도 실제 거래의 과정을 따라가 보고 싶었습니다.", "그래서 관세를 공부할 때 세율을 정리하는 데서 멈추지 않고 기업에 직접 부담을 물었습니다. 그 과정에서 정보시차와 계약조건을 함께 봐야 한다는 질문을 얻었습니다. 책에서 정해진 결론을 가져왔다기보다 현실의 당사자와 거래 경로를 따라가는 방법을 배운 것입니다. 제가 관심 있는 문제를 어떻게 조사할지 바꿔 준 책으로 기억합니다."], "evidence": ["3학년 · 진로활동 | PDF 4–5쪽 / 인쇄 5–6쪽\n3학년 진로활동에 리볼리의 티셔츠 경제학의 상품추적 방식을 관세귀착 인터뷰에 응용했다고 기록되어 있습니다."], "concepts": ["1. 상품을 따라가며 무역을 이해하는 접근  상품의 이동을 추적하면 생산·운송·판매처럼 서로 다른 단계의 선택을 한 흐름 안에서 볼 수 있습니다. 티셔츠 경제학은 면화와 의류의 이동을 통해 시장, 정치와 권력이 함께 작동하는 모습을 다룹니다. 예를 들어 최종가격이 낮다는 사실만으로 생산자가 충분한 보상을 받았는지 알 수 없으며, 가격이 형성된 계약과 제도를 확인해야 합니다. 경준의 관세탐구는 이 방식을 참고해 세율이라는 숫자에서 실제 기업의 가격조정과 비용부담으로 질문을 옮긴 사례입니다.", "2. 비교우위와 현실의 거래조건  비교우위는 다른 생산을 포기하는 비용이 상대적으로 낮은 분야에 특화할 때 교환의 이익이 생길 수 있다는 개념입니다. 그러나 현실의 무역량과 이익배분은 운송비, 관세, 보조금, 계약과 시장지배력의 영향도 받습니다. 무역 전체에 이익이 생기는지와 그 이익을 누가 가져가는지는 별도의 질문입니다. 책을 통해 이 구분을 배웠다고 설명하면 이론을 부정하지 않으면서 현실의 조건을 살핀 이유를 말할 수 있습니다. 이론만으로 기업별 부담비율을 바로 계산할 수는 없습니다."], "follow": ["책과 인터뷰 결과가 같았다는 뜻입니까?  같은 결론을 확인하려 한 것은 아닙니다. 책에서 영향을 받은 것은 상품과 거래의 실제 경로를 따라가는 방법이었고, 기업 인터뷰의 결과는 제가 만난 사례의 범위에서 따로 해석했습니다."], "memory": "상품의 이동 → 제도와 거래조건 → 기업 인터뷰", "caution": "", "source_refs": [30], "university": "공통", "kind": "답변", "glossary": [96]}, {"id": 88, "question": "『국부론』에서 무엇을 배웠습니까?", "category": "독서와 가치관", "answer": ["『국부론』을 읽으며 개인의 이익 추구가 분업과 교환을 통해 사회의 생산성을 높일 수 있다는 점을 배웠습니다. 동시에 어떤 규칙 아래에서 경쟁하는지도 중요하다고 생각했습니다. 특정 집단의 이익만 보호하는 정책이 있다면 같은 이익 추구라도 결과가 달라질 수 있기 때문입니다.", "그래서 저는 시장을 믿는다는 말을 모든 상황을 그대로 두자는 뜻으로 받아들이지 않습니다. 경쟁할 기회가 열려 있는지, 정보를 얻는 조건은 어떤지 함께 봐야 한다고 생각합니다. 기업의 정보격차와 통상규범에 관심을 가진 것도 그 질문과 연결됩니다. 사람들의 선택을 비난하기 전에 어떤 제도가 그 선택에 보상을 주는지 살펴보고 싶습니다."], "evidence": ["2학년 · 진로활동 진로 독서 프로젝트 | PDF 3쪽 / 인쇄 4쪽\n2학년 진로독서에서 국부론과 특정 계층의 이익을 대변하는 정부정책의 문제를 탐구했습니다.", "2학년 · 독서활동상황 및 행동특성 종합의견 | PDF 20쪽 / 인쇄 21쪽\n2학년 공통 독서활동상황에도 국부론이 기재되어 있습니다."], "concepts": ["1. 분업이 생산성을 높이는 원리  분업은 작업을 여러 과정으로 나누고 각자가 일부를 맡는 방식입니다. 반복을 통해 숙련이 쌓이고 작업을 바꾸는 시간이 줄며 특정 공정에 맞는 도구를 발전시킬 수 있습니다. 예를 들어 모든 사람이 물건의 설계부터 포장까지 각각 하는 것과 단계별로 협력하는 방식은 필요한 기술과 조정비용이 다릅니다. 분업에는 서로의 생산물을 교환할 시장도 필요합니다. 다만 분업을 늘릴수록 항상 이익이 커지는 것은 아니며 협력·소통의 비용과 단조로운 노동의 문제도 고려해야 합니다.", "2. 보이지 않는 손을 해석할 때의 조건  개인의 이익 추구가 사회적으로 유용한 결과와 연결될 수 있다는 설명은 모든 사적 이익이 자동으로 공익이 된다는 주장이 아닙니다. 경쟁을 막거나 다른 사람에게 비용을 떠넘겨 얻는 이익은 별도로 검토해야 합니다. 경준의 독서기록은 정부가 특정 계층의 이익만 대변할 때 생기는 효율성과 공정성의 문제에 주목합니다. 따라서 스미스를 정부의 모든 역할을 부정한 학자로 단순화하지 않고, 어떤 규칙이 생산적 경쟁과 교환을 가능하게 하는지 질문하는 방식으로 설명합니다."], "follow": ["정부 개입에 찬성합니까 반대합니까?  개입 자체보다 어떤 문제를 해결하며 누구에게 비용과 이익이 돌아가는지 보겠습니다. 경쟁이나 정보의 문제를 보완할 수도 있지만 특정 집단의 이익을 보호하는 방향으로 작동할 수도 있기 때문입니다."], "memory": "분업과 교환 → 경쟁 조건 → 편향된 정책 점검", "caution": "", "source_refs": [], "university": "공통", "kind": "답변", "glossary": [77]}, {"id": 89, "question": "『불평등의 대가』와 본인의 탐구는 어떻게 연결됩니까?", "category": "독서와 가치관", "answer": ["『불평등의 대가』는 결과의 차이뿐 아니라 그 결과를 만드는 규칙도 보게 해 준 책입니다. 저는 관세의 부담을 분석하면서 전체 지니계수의 변화가 작더라도 특정 계층의 부담이 클 수 있다는 점에 주목했습니다. 숫자 하나로 정책의 영향을 충분히 설명했다고 생각하면 놓치는 사람이 있을 수 있었습니다.", "그래서 소득별 부담과 정책에 의견을 낼 조건을 함께 보는 평가표를 구상했습니다. 다만 발언권과 관세율이 관련된다는 사실만으로 인과관계를 주장할 수는 없어 산정방식과 다른 요인을 다시 살폈습니다. 이 활동으로 저는 불평등을 비판하는 태도만큼 제 비판의 근거를 검토하는 태도도 중요하다고 배웠습니다."], "evidence": ["3학년 · 사회문제 탐구 | PDF 18–19쪽 / 인쇄 19–20쪽\n3학년 사회문제 탐구에서 불평등의 대가, 소득·발언권 평가표, 제3요인을 고려한 인과해석 수정이 기록되어 있습니다.", "2학년 · 수학Ⅱ | PDF 11쪽 / 인쇄 12쪽\n2학년 수학Ⅱ의 지니계수 탐구가 선행 활동입니다."], "concepts": ["1. 제도와 분배의 관계  소득분배는 시장에서 벌어들인 소득과 조세·이전 이후의 소득을 구별해 살펴볼 수 있습니다. 교육 접근, 노동시장의 협상조건, 경쟁과 조세제도는 사람들이 소득을 얻고 유지하는 기회에 영향을 줄 수 있습니다. 이것이 모든 격차를 하나의 제도 탓으로 돌린다는 뜻은 아닙니다. 경준은 관세의 전체 효과만 묻기보다 부담이 집중되는 계층과 정책에 의견을 전달할 수 있는 조건을 함께 보려 했습니다. 이러한 질문은 분배를 결과의 숫자와 그 결과를 만드는 과정으로 나누어 검토하게 합니다.", "2. 발언권 지표의 측정과 인과해석  발언권처럼 직접 관찰하기 어려운 개념은 참여기회나 대표성 같은 대리변수로 측정해야 하므로 무엇을 포함할지 판단이 개입합니다. 가령 정책회의 참여 횟수가 많아도 실제 영향력이 큰지는 별도로 확인해야 합니다. 또한 발언권과 관세율이 함께 변해도 무역구조가 두 변수에 동시에 영향을 줬을 수 있습니다. 이 탐구는 상관에서 원인으로 바로 넘어가지 않고 산정식과 제3요인을 확인한 데 의미가 있습니다. 평가표의 제안과 타당성이 검증된 지표의 완성은 구별해야 합니다."], "follow": ["본인이 만든 발언권 지수는 객관적입니까?  어떤 항목을 선택하고 가중치를 줄지에 판단이 들어가기 때문에 완전히 객관적이라고 말할 수 없습니다. 제안한 지표의 기준을 공개하고 다른 기준을 적용해도 결론이 유지되는지 확인해야 합니다."], "memory": "분배 결과와 규칙 → 발언권 측정 → 인과해석 수정", "caution": "", "source_refs": [31], "university": "공통", "kind": "답변", "glossary": []}, {"id": 90, "question": "좌우명은 무엇입니까?", "category": "독서와 가치관", "answer": ["지금 제 태도를 한 문장으로 표현하면 ‘궁금하면 직접 확인하고, 다르면 고치자’입니다. 기업의 관세 부담이 궁금해 실제로 연락했고, 환율 모형의 설명이 부족하면 변수를 다시 살폈습니다. 생각만으로 결론을 내리지 않고 확인할 수 있는 행동으로 옮기려고 했습니다.", "동시에 제가 만든 결과도 수정의 대상이라고 생각합니다. 통상정보 도구가 작동해도 검색점수를 신뢰도라고 말할 근거가 부족해 한계를 공개했습니다. 저는 처음부터 틀리지 않는 사람보다, 확인한 내용에 따라 생각을 바꿀 수 있는 사람이 되고 싶습니다. 실행력과 검증하는 태도를 함께 갖추는 것이 제가 지키고 싶은 기준입니다."], "evidence": ["3학년 · 경제 수학 | PDF 18쪽 / 인쇄 19쪽\n환율모형의 잔차와 누락변수를 검토한 활동입니다.", "3학년 · 자율활동 | PDF 4쪽 / 인쇄 5쪽\n통상정보 도구의 객관적 신뢰기준 부재를 발견하고 한계고지를 구현했습니다."], "concepts": ["1. 확인하는 태도와 검증 방법  확인한다는 말이 의미를 가지려면 무엇을 근거로 판단을 바꿀지 설명할 수 있어야 합니다. 회귀식이 현실과 어긋나면 잔차의 패턴과 변수 구성을 살피고, 검색도구의 답이 맞는지 알려면 비교할 기준답안이나 원문 근거가 필요합니다. 단순히 다시 검색한 사실만으로 검증이 끝나지는 않습니다. 자신의 두 활동을 연결하는 공통점은 결과가 나오면 멈추는 대신 그 결과를 믿을 조건을 따졌다는 데 있습니다. 새로운 자료가 기존 생각과 다를 때 결론을 수정할 가능성도 열어두어야 합니다.", "2. 모른다고 답할 때 설명할 수 있는 경계  면접에서 모른다는 말만 하고 멈추면 이해 범위를 드러내기 어렵지만, 모르는 사실을 추측해 단정하면 신뢰가 낮아집니다. 예컨대 특정 판례의 세부요건은 기억나지 않더라도 조항의 목적과 쟁점을 알고 있다면 그 범위를 구분해 말할 수 있습니다. 이어 원문이나 공식 판정문으로 확인해야 한다고 덧붙이는 방식입니다. 이 답변의 좌우명은 현재 제안하는 자기표현이며 오래전부터 같은 문장을 삶의 좌우명으로 삼았다는 새로운 경험을 뜻하지 않습니다."], "follow": ["끝까지 확인할 시간이 없으면 어떻게 합니까?  판단에 꼭 필요한 부분을 우선 확인하고 확인하지 못한 부분은 남아 있다고 밝히겠습니다. 시간에 맞추기 위해 불확실한 내용을 확정된 사실처럼 말하지는 않겠습니다."], "memory": "결과보다 확인 조건 → 한계 인정 → 수정", "caution": "", "source_refs": [], "university": "공통", "kind": "답변", "glossary": []}, {"id": 91, "question": "존경하는 인물은 누구입니까?", "category": "독서와 가치관", "answer": ["폴 크루그먼을 존경합니다. 영어Ⅱ에서 그의 생애와 업적을 발표했고, 이후 국가경쟁력이라는 표현을 비판적으로 다룬 글을 읽었습니다. 국가를 기업처럼 보면 무역적자를 곧 손실로 받아들이기 쉽다는 문제의식이 특히 기억에 남습니다.", "이 관심은 기사와 정부 문서의 무역 은유를 분석하는 활동으로 이어졌습니다. 전쟁이나 기업 장부에 빗대는 말이 어떤 전제를 강조하는지 살펴봤습니다. 저는 그의 모든 결론을 그대로 따르기보다 익숙한 설명도 다시 질문하는 태도를 배우고 싶습니다. 숫자뿐 아니라 그 숫자를 설명하는 말이 무엇을 보여 주고 무엇을 가리는지도 살피겠습니다."], "evidence": ["2학년 · 영어Ⅱ | PDF 12쪽 / 인쇄 13쪽\n2학년 영어Ⅱ에서 크루그먼의 생애와 주요 업적을 발표했습니다.", "3학년 · 영어 독해와 작문 | PDF 16쪽 / 인쇄 17쪽\n3학년 영어 독해와 작문에서 Competitiveness A Dangerous Obsession 원문을 읽고 무역 은유를 분석했습니다."], "concepts": ["1. 크루그먼의 무역이론에서 규모의 경제  규모의 경제는 생산량이 늘어날 때 평균비용이 낮아지는 현상입니다. 제품의 다양성을 원하는 소비자와 규모의 경제를 함께 고려하면 기술이나 자원이 비슷한 나라들 사이에서도 같은 산업의 서로 다른 제품을 교환하는 이유를 설명할 수 있습니다. 예를 들어 두 나라가 모두 자동차를 생산하면서 다른 종류의 자동차를 수입하는 산업내무역이 가능합니다. 이는 전통적 비교우위 설명을 무조건 폐기하는 것이 아니라 무역의 다른 특징을 설명하는 틀을 더한 것으로 이해하면 됩니다.", "2. 국가와 기업을 같은 단위로 볼 때의 한계  기업의 이익은 매출에서 비용을 뺀 값이지만 국가의 후생은 국민의 소비·소득·생산성 등 여러 요소와 관련됩니다. 따라서 국가의 수입을 기업의 비용처럼, 수출을 매출처럼 놓고 무역적자를 곧 적자로 연결하면 중요한 차이를 놓칩니다. 수입은 생산에 필요한 투입재나 소비자의 선택이 될 수도 있습니다. 경준의 은유분석은 이러한 언어가 어떤 전제를 강조하는지 살핀 활동입니다. 특정 표현이 자주 쓰인다는 관찰만으로 그 표현이 정책을 바꾼 인과효과까지 확인한 것은 아닙니다."], "follow": ["존경하는 사람의 의견과 다르면 어떻게 하겠습니까?  그 사람이 유명하다는 이유로 따르기보다 사용한 자료와 전제가 제 문제에도 맞는지 확인하겠습니다. 제가 배우려는 것은 결론을 그대로 받아들이는 방식이 아니라 질문하고 검증하는 태도입니다."], "memory": "이론의 조건 → 언어의 전제 → 독립적인 검토", "caution": "", "source_refs": [32], "university": "공통", "kind": "답변", "glossary": []}, {"id": 92, "question": "자유란 무엇이라고 생각합니까?", "category": "독서와 가치관", "answer": ["저는 자유가 선택지가 있는 상태를 넘어, 그 선택의 의미를 이해하고 책임질 조건이 있는 상태라고 생각합니다. 형식적으로 선택할 수 있어도 중요한 정보를 얻기 어렵다면 결과를 모두 개인의 책임으로 돌리는 설명은 부족할 수 있습니다.", "윤리와 사상에서 사르트르의 자유와 책임을 금융의 정보비대칭 문제에 연결해 봤습니다. 개인의 책임을 없애자는 것이 아니라 책임 있게 선택할 수 있는 조건도 마련해야 한다고 생각했습니다. 저에게 경제적 자유도 무엇을 소비할지뿐 아니라 무엇을 배우고 어떤 일을 하며 누구를 도울지 선택할 기반입니다. 제 선택의 범위를 넓히면서 다른 사람의 선택 조건도 살피고 싶습니다."], "evidence": ["2학년 · 윤리와 사상 | PDF 13쪽 / 인쇄 14쪽\n2학년 윤리와 사상의 사르트르·고위험 금융상품·정보비대칭·연대자기결정사회 탐구가 직접 근거입니다."], "concepts": ["1. 자유와 책임을 연결하는 방식  사르트르의 실존주의에서 인간은 미리 정해진 본질을 그대로 따르기보다 자신의 선택과 행동으로 자신을 만들어 가는 존재로 이해됩니다. 이 관점은 상황 탓으로만 선택을 회피하지 않는 책임의 문제와 연결됩니다. 경준은 이를 금융선택에 적용하면서 사회적 조건도 충분히 검토해야 한다는 자신의 비판을 덧붙였습니다. 따라서 사르트르가 직접 정보공개 의무나 금융인가제도를 제안했다고 설명해서는 안 됩니다. 철학자의 기본 입장과 학생이 확장한 정책적 생각을 구분해야 합니다.", "2. 정보가 있는 선택과 형식적인 선택  선택지가 있다는 것과 그 선택의 의미를 이해할 수 있다는 것은 다릅니다. 예를 들어 고위험상품에 가입할 권한이 있어도 손실구조를 이해할 설명이 부족하면 판단조건이 불리합니다. 그렇다고 정보가 부족했다는 이유로 모든 개인 책임이 사라지는 것도 아닙니다. 정보제공자의 책임, 제도의 보호수준, 개인의 주의의무를 나누어 검토해야 합니다. 생기부의 연대자기결정사회는 이러한 조건을 개선하자는 이상사회 제안이며 실제 제도로 시행되거나 효과가 검증된 것은 아닙니다."], "follow": ["선택을 보호한다며 규제를 늘리면 자유가 줄지 않습니까?  그럴 수 있습니다. 그래서 위험을 이해할 정보를 제공하는 방법과 선택 자체를 제한하는 방법의 차이를 따져야 합니다. 보호의 효과와 선택권의 비용을 비교해 필요한 수준을 판단하겠습니다."], "memory": "선택 기회 → 정보와 조건 → 책임", "caution": "", "source_refs": [], "university": "공통", "kind": "답변", "glossary": [78]}, {"id": 93, "question": "영어로 자기소개를 해보세요.", "category": "선택 외국어 연습", "answer": ["I want to help Korean exporters make better decisions by connecting trade rules with data. At school, I studied exchange rates and interviewed exporting companies about tariffs. I learned that the same policy can affect companies differently, depending on their contracts and access to information.", "I also built a tool that finds trade-related sources and presented it at a school event. This taught me to turn an idea into something people can use, while checking its limits. At university, I want to strengthen my knowledge of trade, finance, and statistics. I hope to become someone who can use AI responsibly and explain complex issues clearly."], "evidence": ["3학년 · 진로활동 | PDF 4–5쪽 / 인쇄 5–6쪽\n3학년 진로활동의 수출기업 인터뷰를 영어로 요약했습니다.", "3학년 · 자율활동 | PDF 4쪽 / 인쇄 5쪽\n3학년 자율활동의 통상정보 검색도구와 근거공개 경험을 요약했습니다.", "3학년 · 경제 수학 | PDF 18쪽 / 인쇄 19쪽\n환율자료 분석 경험의 근거입니다."], "concepts": ["1. 답변의 우리말 의미  저는 무역규칙과 환율이 기업의 의사결정에 미치는 영향에 관심이 있습니다. 학교 탐구와 자료분석, 수출기업 인터뷰를 통해 이를 살펴봤고, 거래관계와 정보접근도 중요하다는 점을 배웠습니다. 또한 통상정보를 검색하고 출처를 보여주는 도구를 만들면서 작동하는 도구라고 자동으로 신뢰할 수 있는 것은 아니라는 점을 이해했습니다. 대학에서 국제통상·금융·통계의 기초를 쌓아 한국 수출기업이 불확실한 상황에서 근거 있는 결정을 내리도록 돕고 싶다는 내용입니다.", "2. 핵심 표현과 말하는 방법  affect business decisions는 기업의 결정에 영향을 준다는 뜻이며 access to information은 정보에 접근할 수 있는 조건을 뜻합니다. make informed decisions는 정보를 충분히 고려한 결정을 내린다는 표현으로, 미래를 완벽하게 예측한다는 의미가 아닙니다. 이 답변은 인터뷰·도구·대학의 학습계획을 짧은 문장으로 연결했습니다. 긴 전문용어를 덧붙이기보다 문장 사이에서 호흡하고 sources나 uncertainty처럼 의미가 중요한 단어를 분명하게 말하면 됩니다. 자신의 영어 수준에서 이해하고 다시 설명할 수 있어야 합니다."], "follow": ["What did you learn from the interviews?  I learned that the same tariff can affect companies differently. Their bargaining power, business relationships, and access to information can change how they share the cost."], "memory": "trade rules → interviews → reliable information → study", "caution": "선택적인 영어 연습입니다. 한국외대 해당 면접의 실제 진행 언어는 한국어이므로 필수 외국어 면접으로 오해하지 않습니다.", "source_refs": [], "university": "공통", "kind": "선택 외국어", "glossary": []}, {"id": 94, "question": "일본어 성적이 낮았던 이유를 일본어로 설명해보세요.", "category": "선택 외국어 연습", "answer": ["日本の経済に関心がありましたが、日本語の基礎はまだ十分ではありませんでした。二年生の一学期の日本語Ⅰでは五等級でした。関心を持つだけでなく、言葉を正確に覚えて使う練習が必要だと考えています。", "二学期の日本語会話Ⅰでは、担当した役の動画を何度も見たり聞いたりして、発音と話すタイミングを練習しました。長音や拍にも気をつけました。この科目では八十九点で、評価はAでした。これからも、聞くことと話すことを通して、基礎を身につけたいです。"], "evidence": ["2학년 · 교과 성적 | PDF 10쪽 / 인쇄 11쪽\n2학년 1학기 일본어Ⅰ 76점·C·5등급입니다.", "2학년 · 진로선택 교과 성적 | PDF 14쪽 / 인쇄 15쪽\n2학년 2학기 일본어 회화Ⅰ 89점·A입니다.", "2학년 · 일본어 회화Ⅰ | PDF 15쪽 / 인쇄 16쪽\n더빙을 위한 영상 반복 시청·듣기와 장음·박의 적용이 기록되어 있습니다."], "concepts": ["1. 답변의 우리말 의미와 성적 구분  고등학교 2학년 1학기 일본어Ⅰ은 76점과 5등급이었고 그 결과를 자신의 과제로 받아들인다는 내용입니다. 이 과목의 성취도는 C입니다. 이후 일본어 회화Ⅰ에서 장음·박을 의식해 자기소개를 하고, 더빙을 위해 배역 영상을 반복해서 보고 들으며 연습했습니다. 회화 과목은 89점 A였으나 과목과 평가방법이 달라 같은 시험 성적의 상승으로 말할 수 없다는 점을 포함합니다. 원문에 없던 건강문제나 매일 복습했다는 생활습관을 넣지 않은 답변입니다.", "2. 표현을 자신의 수준으로 익히기  受け止めています는 받아들이고 있다는 뜻이고、繰り返し는 반복해서、吹き替え는 더빙을 뜻합니다. 拍는 여기서 일본어 말소리의 리듬 단위를 가리킵니다. 担当する役の動画는 자신이 맡은 배역이 나오는 영상을 뜻하며, 실제 기록에 있는 반복 시청·듣기와 연결됩니다. 긴 문장을 소리만 외우기보다 각 문장의 한국어 뜻을 설명한 뒤 말하는 연습이 필요합니다. 일본어 답변은 선택 연습이고, 같은 내용을 한국어로 사실에 맞게 설명하는 것이 기본 준비입니다."], "follow": ["日本語の勉強で大切だと思うことは何ですか。  言葉の意味を覚えるだけでなく、音の長さやリズムを聞いて、実際に声に出して練習することが大切だと思います。"], "memory": "二年生 → 繰り返し練習 → 科目と評価の違い", "caution": "선택적인 일본어 연습입니다. 一年生·건강문제·같은 과목의 등급 향상이라는 기존 문장은 사용하지 않습니다.", "source_refs": [], "university": "공통", "kind": "선택 외국어", "glossary": []}, {"id": 95, "question": "정량분석과 현장 인터뷰 결과가 충돌하면 무엇을 믿겠습니까?", "category": "종합 판단과 마무리", "answer": ["어느 쪽이 더 객관적인지부터 정하기보다 같은 대상을 같은 기준으로 본 자료인지 확인하겠습니다. 통계는 여러 사례의 관계를 보여 주고, 인터뷰는 그 관계가 실제로 어떤 과정을 거치는지 알려 줄 수 있습니다. 두 자료의 역할이 다를 수 있습니다.", "예를 들어 평균 부담은 낮은데 어떤 기업은 대부분을 부담했다고 한다면 업종과 계약기간, 부담의 계산기준부터 비교하겠습니다. 그다음 협상력이나 정보시차가 빠졌는지 살펴보겠습니다. 저는 결과를 억지로 일치시키기보다 차이가 생긴 이유를 다음 질문으로 삼고 싶습니다. 제 사회·문화 탐구에서도 예상과 다른 집단을 추가로 조사하며 설명을 고쳤습니다."], "evidence": ["3학년 · 진로활동 | PDF 4–5쪽 / 인쇄 5–6쪽\n3학년 관세귀착 인터뷰가 거래관계·정보시차를 찾는 데 활용됐고 자기보고 한계도 기록되었습니다.", "3학년 · 경제 수학 | PDF 18쪽 / 인쇄 19쪽\n환율모형을 변수 추가로 수정한 경험입니다.", "2학년 · 사회·문화 | PDF 13쪽 / 인쇄 14쪽\n2학년 사회·문화에서 설문 뒤 추가 설문·면접으로 설명을 보완했습니다."], "concepts": ["1. 정량자료와 정성자료의 역할  정량자료는 같은 기준으로 측정한 값을 비교하여 크기나 관계를 살피는 데 유용합니다. 정성자료는 참여자가 어떻게 판단하고 행동했는지 맥락과 과정을 이해하는 데 도움이 됩니다. 둘의 차이는 숫자가 객관적이고 말은 주관적이라는 이분법으로 정리되지 않습니다. 설문 수치도 문항과 표본의 영향을 받고, 인터뷰도 질문과 기록을 체계화할 수 있습니다. 사회·문화 활동에서 높은 신뢰도와 낮은 구매의향이 함께 나타난 집단을 면접으로 다시 살핀 것은 자료의 설명범위를 보완한 예입니다.", "2. 충돌을 확인하는 순서  자료가 다르게 보이면 먼저 관찰대상, 기간, 변수정의를 맞춰야 합니다. 기업의 관세부담이라는 말이 납부세액인지 이윤손실인지 가격인하분인지 다르면 결과를 직접 비교할 수 없습니다. 정의가 같은데도 차이가 남으면 표본의 차이나 누락된 조건을 검토하고 새로운 가설을 만듭니다. 여러 자료가 비슷한 설명을 지지하면 신뢰가 높아질 수 있지만 동일한 편향을 공유할 가능성도 남습니다. 교차확인은 서로 다른 결과를 무조건 하나로 합치는 절차가 아니라 차이의 이유를 밝히는 과정입니다."], "follow": ["기업 관계자의 말과 공식 통계가 다르면요?  측정범위와 단위를 먼저 맞추겠습니다. 공식 통계는 전체 업종을, 기업은 특정 계약을 설명할 수 있기 때문에 어느 쪽이 틀렸다고 하기 전에 서로 다른 대상을 말하는지 확인해야 합니다."], "memory": "같은 질문인가 → 정의와 표본 → 빠진 조건", "caution": "", "source_refs": [], "university": "공통", "kind": "답변", "glossary": []}, {"id": 96, "question": "AI가 발전하면 통상분석가의 역할은 줄어들지 않습니까?", "category": "종합 판단과 마무리", "answer": ["자료를 찾고 요약하는 업무는 AI의 발전에 따라 크게 달라질 수 있다고 생각합니다. 그래서 저는 같은 일을 사람도 할 수 있다는 점보다, 기업에 필요한 문제를 정하고 결과를 검토해 실제 선택과 연결하는 능력을 갖추고 싶습니다. AI가 더 잘하는 부분은 활용하는 것이 맞다고 봅니다.", "통상정보 도구를 만들며 답이 나온다는 것과 그 답을 믿을 수 있다는 것이 다르다는 걸 배웠습니다. 기업의 조건을 듣고 다른 의견을 조율하며 불확실한 결과를 설명하는 일도 중요했습니다. 저는 AI와 경쟁해 모든 계산을 직접 하는 사람보다, 전공 지식으로 도구를 판단하고 사람들과 실행을 이끄는 분석가로 성장하고 싶습니다."], "evidence": ["3학년 · 자율활동 | PDF 4쪽 / 인쇄 5쪽\n통상정보 도구의 검색점수와 신뢰기준의 차이를 확인한 활동입니다.", "3학년 · 생활과 윤리 | PDF 17쪽 / 인쇄 18쪽\n3학년 생활과 윤리에서 사실판단의 추적가능성과 가치판단의 책임귀속을 구별했습니다."], "concepts": ["1. 자료처리와 의사결정의 차이  자료처리는 문서를 찾고 정리하거나 일정한 규칙에 따라 수치를 계산하는 과정입니다. 의사결정은 그 정보를 어떤 목표와 기준에 맞춰 사용할지 선택하는 과정까지 포함합니다. 예를 들어 AI가 관세 관련 조항을 찾아도 어떤 조항이 현재 계약과 상품에 적용되는지 확인해야 하고, 비용을 고객에게 얼마나 전가할지는 거래관계와 목표에 따라 달라집니다. 자동화가 가능한 단계가 늘어도 판단기준과 오류의 책임을 누가 갖는지 설명해야 합니다. 이는 미래 직업 수를 확정적으로 예측하는 주장과 구별됩니다.", "2. 사람의 검토가 의미를 가지려면  사람이 마지막에 승인했다는 형식만으로 검토가 충분한 것은 아닙니다. 출처를 이해할 능력, 오류를 발견할 시간, 결과를 거부하거나 수정할 권한이 있어야 실제 검토가 가능합니다. 예를 들어 검색점수를 확률처럼 잘못 읽으면 사람이 확인해도 오류가 이어집니다. UNESCO의 AI 윤리 권고 역시 최종적인 책임과 책무성을 인간에게 남겨야 한다는 방향을 제시합니다. 경준의 활동에서는 원문 근거를 공개하고 확실하지 않은 범위를 알리는 장치가 검토를 돕는 조건과 연결됩니다."], "follow": ["AI가 더 정확하면 사람의 판단을 없애도 됩니까?  특정 과업의 정확도가 높아도 목표와 책임의 문제까지 해결되는 것은 아닙니다. 오류의 영향이 큰 결정일수록 검토 가능성과 이의제기 절차를 함께 설계해야 한다고 생각합니다."], "memory": "자동화되는 일 → 남는 판단 → 검증 책임", "caution": "", "source_refs": [33], "university": "공통", "kind": "답변", "glossary": [84]}, {"id": 97, "question": "10년 뒤 어떤 일을 하고 싶습니까?", "category": "종합 판단과 마무리", "answer": ["10년 뒤에는 기업이 해외에서 거래할 때 정책과 환율의 변화를 자신의 문제로 이해하도록 돕는 일을 하고 싶습니다. 새로운 규정을 요약하는 데서 끝내지 않고, 어느 비용과 계약조건을 확인해야 하며 어떤 대응이 가능한지 설명할 수 있는 사람이 목표입니다.", "고등학교에서는 인터뷰와 자료 분석, 정보 도구 제작을 통해 그 출발을 경험했습니다. 대학에서는 통상과 금융의 기초를 배우고 실제 기업의 업무를 경험하며 제 분석이 필요한 지점을 찾고 싶습니다. 장기적으로 정보 접근을 돕는 서비스도 생각하고 있지만, 먼저 상대가 신뢰할 수 있는 분석과 설명을 제공하는 실력을 갖추겠습니다."], "evidence": ["3학년 · 진로활동 | PDF 4–5쪽 / 인쇄 5–6쪽\n기업의 실제 관세부담과 정보문제를 조사한 경험입니다.", "3학년 · 경제 수학 | PDF 18쪽 / 인쇄 19쪽\n환율과 금융자료 분석 경험입니다.", "3학년 · 자율활동 | PDF 4쪽 / 인쇄 5쪽\n정보문제를 도구로 구현하고 검증한 경험입니다.", "3학년 · 실용 경제 | PDF 17쪽 / 인쇄 18쪽\n정보서비스의 사업성을 검토한 경험입니다."], "concepts": ["1. 통상분석에서 기업의 문제로 좁히기  통상정책은 국가 수준에서 발표되지만 기업이 판단할 때에는 품목, 거래지역, 계약조건과 비용구조로 구체화해야 합니다. 같은 정책변화라도 원재료를 수입하는 기업과 완제품을 수출하는 기업의 영향은 다를 수 있습니다. 환율도 외화매출뿐 아니라 외화비용과 결제시점을 함께 봐야 합니다. 경준이 말하는 진로는 모든 국제현상을 예측하는 역할이 아니라 특정 기업이 검토할 조건과 대안을 정리하는 방향입니다. 이 차이를 이해하면 장기포부가 실제 학습목표와 연결됩니다.", "2. 진로계획을 경험과 계획으로 구분하기  진로계획에는 이미 확인한 관심, 앞으로 배울 역량, 경험을 통해 조정할 선택이 함께 들어갑니다. 기업 인터뷰와 도구제작은 실제 경험이고, 대학에서 통계와 금융을 배우거나 해외 실무를 경험하는 일은 앞으로의 계획입니다. 미래의 직함이나 창업 성공을 보장하듯 말하기보다 어떤 문제를 다루고 어떤 역량을 갖출지 설명하는 편이 구체적입니다. 서비스 구상도 이용자의 지불능력과 자료 신뢰를 확인한 뒤 발전시킬 과제로 남겨두어야 합니다."], "follow": ["기업에 취업할 것입니까 창업할 것입니까?  두 가능성을 열어두고 있습니다. 먼저 실제 기업이 어떤 정보를 필요로 하는지 배우고 분석 경험을 쌓은 뒤, 기존 조직에서 해결할 문제와 별도 서비스가 필요한 문제를 구분해 판단하고 싶습니다."], "memory": "기업의 결정 → 기초와 실무 → 검증된 서비스", "caution": "", "source_refs": [], "university": "공통", "kind": "답변", "glossary": []}, {"id": 98, "question": "마지막으로 하고 싶은 말이 있습니까?", "category": "종합 판단과 마무리", "answer": ["제 이야기를 들어주셔서 감사합니다. 저는 궁금한 문제를 직접 확인하고, 알게 된 내용을 실제 결과물로 만들어 온 학생이라는 점을 말씀드리고 싶습니다. 기업에 연락해 관세 부담을 물었고, 정보 도구를 만들어 다른 사람에게 설명하면서 제 생각의 한계도 확인했습니다.", "대학에서는 이 경험을 바탕으로 전공의 기초를 더 단단히 쌓겠습니다. 혼자 좋은 아이디어를 내는 데서 멈추지 않고, 사람들과 의견을 나누고 근거를 검토해 함께 실행하는 학생이 되고 싶습니다. 배운 지식이 실제로 필요한 사람에게 도움이 되도록 성장하겠습니다. 감사합니다."], "evidence": ["3학년 · 진로활동 | PDF 4–5쪽 / 인쇄 5–6쪽\n관세귀착 기업 인터뷰가 실제 행동의 근거입니다.", "3학년 · 경제 수학 | PDF 18쪽 / 인쇄 19쪽\n환율모형 수정과 한계 검토의 근거입니다.", "3학년 · 자율활동 | PDF 4쪽 / 인쇄 5쪽\n통상정보 도구 제작과 신뢰 검증의 근거입니다."], "concepts": ["1. 마지막 말의 목적  마지막 말은 앞선 답변을 모두 반복하기보다 면접에서 기억되길 바라는 태도와 입학 후 학습방향을 정리하는 기회로 활용할 수 있습니다. 이 답변은 기업·모형·도구를 나열하는 데서 그치지 않고 직접 확인하고 한계를 점검한 공통점을 묶습니다. 다만 면접이 진행된 방식에 따라 이미 충분히 말한 내용은 줄여도 됩니다. 특정 대학에서 무엇을 배울지 한 가지가 분명하다면 그 연결을 넣을 수 있지만 다른 대학 이름이나 검증되지 않은 프로그램을 끌어오지 않습니다.", "2. 검증할 수 있는 포부  좋은 포부는 성실하겠다는 다짐에 그치지 않고 어떤 기초를 배우고 무엇에 적용할지 드러냅니다. 예를 들어 기업의 관세부담을 더 정확히 분석하려면 국제통상 이론과 통계, 실제 계약조건의 이해가 필요합니다. 이는 고교의 소수 인터뷰가 갖는 한계를 대학에서 보완하겠다는 연결입니다. 마지막 말에서도 이미 대학 수준의 전문성을 완성했다는 인상을 만들 필요는 없습니다. 현재의 경험과 앞으로 배울 과제를 함께 설명하면 성장 가능성을 구체적으로 전달할 수 있습니다."], "follow": ["한 문장으로만 마무리해보세요.  기업과 자료에서 생긴 질문을 끝까지 확인해 온 경험을 바탕으로, 대학에서는 국제통상과 금융의 기초를 더 단단히 쌓겠습니다."], "memory": "직접 확인한 경험 → 대학의 기초학습 → 감사", "caution": "", "source_refs": [], "university": "공통", "kind": "답변", "glossary": []}, {"id": 99, "question": "공통질문에서 이전 활동을 모두 억지로 연결해야 합니까?", "category": "답변 운영 코칭 · 면접 답변이 아닌 준비 코칭", "answer": ["공통질문에서는 질문에 가장 잘 맞는 경험 하나를 고릅니다. 진로를 물으면 기업 인터뷰, 검증 태도를 물으면 환율 모형이나 검색점수, 공동체 기여를 물으면 동아리 학습지가 더 직접적인 근거입니다. 활동을 여러 개 넣는 것보다 그 경험에서 내가 무엇을 판단하고 했는지가 분명해야 합니다.", "답변은 ‘제 생각은 이것입니다 → 이 경험에서 이렇게 행동했습니다 → 그래서 이렇게 배우고 앞으로 이어 가고 싶습니다’의 흐름으로 준비합니다. 다른 질문의 답을 통째로 끼워 넣지 않습니다. 음악과 체육처럼 독립적인 배움도 존중하며, 전공 연결은 실제로 의미가 있을 때만 한 문장으로 덧붙입니다."], "evidence": ["3학년 · 진로활동 | PDF 4–5쪽 / 인쇄 5–6쪽\n진로·현장조사 질문에서 선택할 수 있는 예시 근거이며 면접 답변법 자체를 기록한 자료는 아닙니다.", "2학년 · 동아리활동 경제해부학2 | PDF 3쪽 / 인쇄 4쪽\n공동체 기여 질문에서 사용할 수 있는 학습지 제작의 예시입니다.", "3학년 · 스포츠 생활 | PDF 19쪽 / 인쇄 20쪽\n배려 질문에서 사용할 수 있는 동료 연습 지원의 예시입니다."], "concepts": ["1. 질문과 근거의 관련성  좋은 근거라도 현재 질문과 관련이 약하면 답변의 핵심이 흐려집니다. 협업을 묻는데 환율회귀의 설명력만 길게 말하면 계산 경험은 드러나도 타인과 어떻게 일했는지는 알기 어렵습니다. 반대로 모둠원에 맞춰 편곡한 활동은 협업의 판단과 행동을 직접 보여줍니다. 같은 학생부에서도 질문에 따라 고를 근거가 달라지는 이유입니다. 먼저 질문이 지식·행동·가치판단 중 무엇을 요구하는지 확인하고 그에 맞는 사례를 고르는 연습을 하면 공통질문에 대응하기 쉽습니다.", "2. 서사의 연결과 실제 순서  활동을 이야기로 정리하면 기억하기 쉽지만 기억하기 좋은 순서와 실제 경험의 순서가 항상 같지는 않습니다. 보고서를 나중에 연결해 해석한 경우에는 지금 돌아보니 관련이 있다고 말할 수 있고, 당시 앞선 탐구의 한계 때문에 후속 활동을 한 경우에는 그 계기를 설명할 수 있습니다. 두 경우를 구분해야 처음부터 모든 것을 계획했다는 과장이 생기지 않습니다. 활동별로 시작한 질문과 새로 생긴 질문을 적어 두면 연결할 부분과 독립적으로 설명할 부분이 분명해집니다."], "follow": ["사례가 여러 개 떠오르면 무엇부터 고를까요?  질문에 가장 직접적으로 답하고 본인의 행동을 구체적으로 설명할 수 있는 사례를 먼저 고르세요. 유명하거나 어려워 보이는 활동이라는 이유만으로 우선할 필요는 없습니다."], "memory": "질문 하나 → 가장 맞는 근거 하나 → 필요할 때 확장", "caution": "", "source_refs": [], "university": "공통", "kind": "코칭", "glossary": []}, {"id": 100, "question": "학업계획에서 학교에 대한 진심을 어떻게 보여줄 수 있습니까?", "category": "답변 운영 코칭 · 면접 답변이 아닌 준비 코칭", "answer": ["학교에 대한 진심은 칭찬의 크기보다 배우려는 이유의 구체성에서 드러나도록 준비합니다. 내 탐구에서 아직 설명하지 못한 질문을 하나 고르고, 그 질문에 필요한 수업 두 개와 경험 기회 한 개를 연결합니다. 과목명보다 무엇을 더 알게 될지가 핵심입니다.", "지원동기는 두 문단으로 말하고 직접 녹음해 1분 이내로 조정합니다. 대학별 답변 안에서는 해당 대학만 언급합니다. 선택 프로그램은 참여가 보장된 것처럼 말하지 않고 준비해 지원하겠다고 합니다. 문장이 너무 길면 수업 목록을 줄이고, 내가 왜 이 공부를 하고 싶은지를 남깁니다."], "evidence": ["3학년 · 경제 수학 | PDF 18쪽 / 인쇄 19쪽\n금융·통계 학습의 필요를 설명할 수 있는 환율회귀 활동의 예시입니다.", "3학년 · 진로활동 | PDF 4–5쪽 / 인쇄 5–6쪽\n통상이론·현장 이해의 필요를 설명할 수 있는 인터뷰 활동의 예시입니다.", "1학년 · 국제 경제 2학기 공동교육과정 | PDF 9쪽 / 인쇄 10쪽\n통상규범 학습의 필요를 설명할 수 있는 국제 경제 활동의 예시입니다."], "concepts": ["1. 현재의 한계에서 학업계획 만들기  학업계획은 공부할 과목의 목록에 이유를 붙이는 과정입니다. 단순회귀로 환율의 원인을 확정할 수 없었다면 통계와 계량의 가정을 배우겠다는 목표가 생기고, 계약에 따라 관세부담이 달랐다면 무역거래의 구조를 더 배우겠다는 목표가 생깁니다. 경험의 한계를 정확히 이해할수록 대학에서의 공부가 구체화됩니다. 고교에서 모든 분석을 끝냈다고 주장하면 오히려 대학에서 무엇을 배울지 설명하기 어려워질 수 있습니다. 현재 수준과 다음 학습단계를 연결하는 것이 핵심입니다.", "2. 대학의 자원을 말할 때 확인할 조건  교육과정과 비교과 프로그램은 서로 다르며 개설시기·선수과목·학년·선발기준이 있을 수 있습니다. 공식 소개에서 운영이 확인돼도 모든 입학생의 참여가 보장되는 것은 아닙니다. 예를 들어 해외교류에 관심이 있다면 선발조건에 맞춰 언어와 학업을 준비하고 참여기회를 알아보겠다고 말하는 것이 정확합니다. 대학별 차이는 막연한 명성 비교보다 자신이 필요한 학습내용과 연결해야 합니다. 이 코칭은 준비방법이며 특정 프로그램의 현재 운영 여부는 대학별 공식자료를 기준으로 확인합니다."], "follow": ["과목명을 기억하지 못하면 지원동기가 약해지나요?  정확하지 않은 과목명을 말하기보다 배우려는 내용과 그 이유를 분명히 설명하세요. 다만 준비할 때에는 공식 교육과정의 실제 과목 한두 개를 확인해 연결해 두면 더 구체적으로 말할 수 있습니다."], "memory": "남은 한계 → 공식 교육과정 → 다음 질문", "caution": "", "source_refs": [], "university": "공통", "kind": "코칭", "glossary": []}, {"id": 101, "question": "본인을 선발해야 하는 이유를 한 문장으로 요약하면 무엇입니까?", "category": "답변 운영 코칭 · 면접 답변이 아닌 준비 코칭", "answer": ["한 문장 요청에는 ‘관심의 대상 + 실제로 반복한 행동’을 남깁니다. 예를 들어 ‘저는 수출기업의 문제를 직접 묻고, 데이터와 정보 도구로 확인한 뒤 다른 사람에게 설명해 온 학생입니다’라고 답할 수 있습니다. 스스로 납득하지 못하는 거창한 수식어는 빼는 편이 낫습니다.", "후속 질문을 받으면 이 문장을 뒷받침하는 경험 하나를 구체적으로 말합니다. 기업 인터뷰, 도구 배포, 학술제 설명 중 질문에 맞는 것을 고릅니다. ‘AI 시대에 꼭 필요한 인재’라는 결론을 먼저 선언하기보다 문제를 정하고 구현·검증·협업한 과정을 보여 주면 그 강점이 자연스럽게 전달됩니다."], "evidence": ["3학년 · 진로활동 | PDF 4–5쪽 / 인쇄 5–6쪽\n요약문 속 기업의 경험을 확인했다는 표현의 예시 근거입니다.", "3학년 · 경제 수학 | PDF 18쪽 / 인쇄 19쪽\n요약문 속 모형을 수정했다는 표현의 예시 근거입니다.", "3학년 · 자율활동 | PDF 4쪽 / 인쇄 5쪽\n요약문 속 도구의 신뢰조건을 점검했다는 표현의 예시 근거입니다."], "concepts": ["1. 한 문장 안에 남길 정보  한 문장에는 관심의 대상과 반복해서 드러난 행동을 남기는 편이 전달하기 쉽습니다. 국제통상이라는 관심만 말하면 다른 학생과 차이가 잘 드러나지 않고, 실행력이 있다는 성격표현만 말하면 무엇을 했는지 알기 어렵습니다. 관심과 확인·수정의 행동을 결합하면 설명할 방향이 생깁니다. 다만 한 문장에 협상력·회귀·AI·규범·창업을 모두 넣으면 듣는 사람이 핵심을 잡기 어렵습니다. 구체적인 활동명과 수치는 뒤의 질문에서 풀어낼 근거로 준비합니다.", "2. 압축한 주장과 근거의 일치  요약문은 짧아도 사실의 범위를 넘으면 안 됩니다. 기업 인터뷰를 했다는 사실은 기업을 실제로 구제했다는 성과와 다르고, 도구를 배포했다는 사실은 높은 정확도가 검증됐다는 뜻과 다릅니다. 따라서 문제를 해결한 전문가라는 과장보다 문제를 확인하고 탐구를 수정해 온 학생이라는 범위가 기록과 맞습니다. 한 문장을 만든 뒤 각 동사에 대응하는 근거를 한 개씩 확인하면 압축하면서 의미가 커지는 오류를 줄일 수 있습니다. 이는 암기 문구의 완성보다 설명 가능한 자기소개를 만드는 연습입니다."], "follow": ["한 문장에 대학과 진로까지 넣어야 하나요?  요청의 맥락에 따라 다릅니다. 본인의 강점을 한 문장으로 말하라는 질문이라면 행동에 집중하고, 지원동기를 묻는 경우라면 그 행동이 대학에서 어떤 학습으로 이어질지 연결하면 됩니다."], "memory": "관심 대상 + 반복한 행동 + 근거 하나", "caution": "", "source_refs": [], "university": "공통", "kind": "코칭", "glossary": []}, {"id": 102, "question": "장단점 질문에서 무엇을 평가한다고 생각합니까?", "category": "답변 운영 코칭 · 면접 답변이 아닌 준비 코칭", "answer": ["장점은 성격 이름보다 행동으로 설명합니다. 실행력이라면 노코드에서 직접 코딩으로 바꾸고 배포한 과정, 소통이라면 학습지와 발표, 조율이라면 팀의 기준과 역할을 정리한 경험을 고릅니다. 마지막에 그 행동이 어떤 대학 공부에 도움이 될지 한 문장으로 연결합니다.", "단점은 실제 불편이나 손실이 있는 점을 인정하고 개선 행동을 설명합니다. ‘목표가 높아서 장점이 됐다’로 끝내지 않고 범위를 넓혀 검증이 어려워졌던 사례와 기능을 줄인 판단을 말합니다. 이미 한 행동과 앞으로 하려는 계획을 구분하며, 성적의 원인처럼 확인되지 않은 사유를 좋은 이야기로 채우지 않습니다."], "evidence": ["3학년 · 경제 수학 | PDF 18쪽 / 인쇄 19쪽\n결과를 점검하고 변수를 추가한 행동은 장점 설명의 예시입니다.", "3학년 · 심화 수학Ⅰ | PDF 18쪽 / 인쇄 19쪽\n학습의 어려움과 발표 참여는 보완 행동의 예시입니다.", "2학년 · 일본어 회화Ⅰ | PDF 15쪽 / 인쇄 16쪽\n반복 듣기·말하기는 언어학습 보완의 예시입니다."], "concepts": ["1. 성격표현을 행동으로 바꾸기  책임감·성실함·실행력 같은 말은 여러 사람이 쓸 수 있으므로 그 말만으로 행동의 차이를 알기 어렵습니다. 예를 들어 책임감은 맡은 일의 범위를 어떻게 지켰는지, 실행력은 어떤 필요를 발견하고 실제로 무엇을 만들었는지로 설명할 수 있습니다. 같은 행동을 너무 많은 장점의 근거로 반복하기보다 질문에 맞는 한 가지 의미를 뽑아내는 것이 좋습니다. 경준의 경우 환율모형 수정은 검증태도, 학습지 제작은 공동체 기여, 동료의 리바운드 지원은 배려의 사례로 나누어 연습할 수 있습니다.", "2. 보완 계획의 구체성  단점 답변에서 개선하겠다는 의지만 반복하면 행동이 보이지 않습니다. 어떤 상황에서 문제가 나타나는지, 자신이 통제할 수 있는 행동이 무엇인지, 개선을 무엇으로 확인할지 생각하면 계획이 구체화됩니다. 예를 들어 개념 설명이 불명확하다면 스스로 예시와 한계를 말해 보는 연습을 할 수 있습니다. 이는 앞으로 실행할 제안이지 이미 해 온 습관으로 꾸며야 하는 내용은 아닙니다. 대학의 평가기준은 공식 안내에서 별도로 확인하고, 모든 면접관이 같은 요소만 평가한다고 단정하지 않습니다."], "follow": ["단점을 말하면 불리하지 않을까요?  단점을 숨기기 위해 사실과 다른 장점을 말하는 것은 피하세요. 질문에 해당하는 부족함을 인정하고 실제 보완 행동이나 계획을 설명하면 자신의 수준을 이해하는 모습을 보여줄 수 있습니다."], "memory": "성격 이름 → 실제 행동 → 보완 범위", "caution": "", "source_refs": [], "university": "공통", "kind": "코칭", "glossary": []}, {"id": 103, "question": "마지막 말에서 무엇을 반드시 포함해야 합니까?", "category": "답변 운영 코칭 · 면접 답변이 아닌 준비 코칭", "answer": ["마지막 말에서는 감사와 함께 남기고 싶은 인상 하나, 입학 후 배우고 싶은 내용 하나를 정리합니다. 이미 충분히 말한 활동의 숫자와 과정을 다시 나열하지 않습니다. 시간 여유가 짧으면 두세 문장으로 끝내도 됩니다.", "면접을 했다는 이유만으로 ‘모든 가치가 완전히 일치한다는 확신을 얻었다’고 말할 필요는 없습니다. 실제로 느낀 내용만 짧게 붙입니다. 답변이 조금 아쉬웠어도 마지막 전체를 사과로 채우지 말고 앞으로 공부할 방향을 분명히 말합니다. 마무리는 자기평가를 강요하는 자리가 아니라 내 관심과 태도를 선명하게 남기는 기회입니다."], "evidence": ["3학년 · 진로활동 | PDF 4–5쪽 / 인쇄 5–6쪽\n마무리에 활용할 수 있는 현장조사의 예시 근거입니다.", "3학년 · 경제 수학 | PDF 18쪽 / 인쇄 19쪽\n대학에서 이어갈 정량학습 과제를 보여주는 예시입니다.", "3학년 · 자율활동 | PDF 4쪽 / 인쇄 5쪽\n직접 구현하고 한계를 점검한 행동의 예시입니다."], "concepts": ["1. 마무리와 반복의 차이  마무리는 앞서 나온 내용을 짧게 묶어 의미를 분명히 하는 것이고, 반복은 같은 세부정보를 다시 길게 나열하는 것입니다. 예를 들어 기업 인터뷰의 업종과 부담비율을 모두 되풀이하는 대신 실제 기업의 선택을 이해하고 싶어졌다고 정리하면 경험의 의미가 남습니다. 마지막 말에서 필요한 것은 새로운 이력을 추가하는 일보다 면접관이 들은 내용을 이해할 중심을 제시하는 일일 수 있습니다. 다만 어떤 표현이 합격을 보장한다는 공식은 없으므로 대화의 흐름과 시간을 고려해야 합니다.", "2. 계획을 과장 없이 말하기  입학 후의 포부는 해내겠다는 확약과 해보고 싶은 계획을 구분해야 합니다. 특정 연구를 완성하거나 해외프로그램에 반드시 선발되겠다고 약속하기보다 필요한 기초를 배우고 조건에 맞춰 기회를 준비하겠다고 말할 수 있습니다. 경준은 고교에서 경험한 소표본과 모형의 한계를 대학의 통계·통상학습으로 보완하겠다는 방향을 제시할 수 있습니다. 이 정도의 연결만으로도 막연히 열심히 하겠다는 말보다 구체적이며, 검증되지 않은 프로그램 정보를 길게 넣을 필요는 없습니다."], "follow": ["감사인사만 해도 되나요?  할 말이 충분히 전달됐거나 시간이 매우 짧다면 가능합니다. 다만 여유가 있고 강조할 점이 남았다면 한 가지 포부를 짧게 덧붙이세요. 시간을 늘리기 위한 새로운 이야기는 필요하지 않습니다."], "memory": "남은 핵심 하나 → 다음 학습 → 짧은 감사", "caution": "", "source_refs": [], "university": "공통", "kind": "코칭", "glossary": []}, {"id": 104, "question": "면접관에게 조언을 부탁하는 말로 끝내도 됩니까?", "category": "답변 운영 코칭 · 면접 답변이 아닌 준비 코칭", "answer": ["기본 마무리는 포부와 감사로 끝내고, 조언 요청은 면접관이 질문 기회를 주었을 때만 고려합니다. 정해진 평가시간이 있으므로 마지막에 반드시 질문을 덧붙이는 기술로 외우지 않습니다. 합격 가능성이나 평가 결과를 묻는 말도 넣지 않습니다.", "질문할 기회가 있고 실제로 궁금하다면 ‘제가 했던 환율 분석을 더 깊게 공부하려면 입학 전에 어떤 기초를 준비하는 것이 좋을까요?’처럼 학습에 관한 질문을 할 수 있습니다. 다만 공식 교육과정에서 확인할 수 있는 내용을 다시 묻기보다, 자신의 경험에서 남은 학습 과제와 연결하는 것이 좋습니다."], "evidence": ["3학년 · 경제 수학 | PDF 18쪽 / 인쇄 19쪽\n추가로 준비할 정량기초를 질문할 때 참고할 자신의 학습 경험입니다. 조언 요청의 적절성 자체를 증명하는 자료는 아닙니다.", "1학년 · 국제 경제 2학기 공동교육과정 | PDF 9쪽 / 인쇄 10쪽\n국제통상 규범 학습에 대한 질문을 구체화할 때 참고할 경험입니다."], "concepts": ["1. 질문의 목적과 대화의 맥락  대화에서 같은 질문도 목적과 시점에 따라 의미가 달라집니다. 학습 조언을 구하는 것은 이후 공부의 방향을 알아보려는 행동이지만, 면접 종료 직전에 갑자기 질문하면 준비된 평가절차를 늘리는 요청으로 들릴 수 있습니다. 상대가 질문할 기회를 주었는지와 시간이 있는지를 살피는 이유입니다. 모든 대학이나 면접관의 반응을 하나의 규칙으로 예측할 수는 없으므로 예의와 상황 판단의 문제로 준비해야 합니다. 질문을 하지 않았다고 관심이 없는 것으로 단정할 근거도 없습니다.", "2. 정보를 얻는 질문과 평가를 요구하는 질문  기초학습의 방향을 묻는 질문은 이후 행동에 필요한 정보를 얻는 질문입니다. 반면 자신이 합격할 만한지 묻는 질문은 면접관에게 평가를 공개하거나 예측해 달라는 요구가 될 수 있습니다. 둘의 목적은 다릅니다. 경준은 환율분석에서 한계를 느꼈으므로 통계의 어떤 기반을 준비하면 좋을지처럼 자신의 실제 과제와 연결할 수 있습니다. 다만 공식 안내나 교육과정에서 바로 확인할 수 있는 사실은 먼저 조사하고, 상대에게 묻는 질문은 그 자료만으로 해결되지 않는 학습 방향에 맞추는 편이 자연스럽습니다."], "follow": ["질문할 기회를 주면 무엇을 묻는 게 좋을까요?  실제 관심이 있고 이후 학습에 도움이 되는 한 가지를 고르세요. 예를 들어 고교의 환율분석 경험을 대학에서 이어가려면 어떤 기초를 먼저 준비하면 좋을지 정중하게 물을 수 있습니다."], "memory": "기본은 포부와 감사 → 질문 기회가 있을 때 조언", "caution": "", "source_refs": [], "university": "공통", "kind": "코칭", "glossary": []}, {"id": 105, "question": "신용통화와 구독경제를 탐구하며 어떤 점을 배웠습니까?", "category": "학생부 확장 Ⅰ · 기초 탐구와 경제적 시각", "answer": ["돈과 소비가 개인의 선택만이 아니라 금융과 거래의 구조 안에서 움직인다는 점을 배웠습니다. 『EBS 다큐프라임 자본주의』를 읽고 신용통화와 지급준비율을 살펴보면서 은행의 대출과 예금이 어떻게 연결되는지 궁금해졌습니다. 이후에는 단순한 통화승수만으로 현실의 대출이 자동 결정되는 것은 아니라는 점도 보완해 이해했습니다.", "구독경제에서는 소유보다 이용에 비용을 내는 방식이 기업과 소비자의 선택을 바꾼다는 점이 흥미로웠습니다. 반복 매출은 기업의 장점이지만 소비자에게는 쓰지 않는 서비스의 비용이 계속될 수 있습니다. 저는 사업모델을 볼 때 수익 구조뿐 아니라 이용자가 계속 선택할 이유와 부담을 함께 봐야 한다고 생각하게 됐습니다."], "evidence": ["1학년 · 자율활동 독서 활동 | PDF 1쪽 / 인쇄 2쪽\n신용통화·지급준비율과 구독경제의 개념·장단점·성장 분야 탐구.", "2학년 · 창의 경영 | PDF 15쪽 / 인쇄 16쪽\n청년층의 금융관리 불편과 소비·예산을 연결한 플랫폼 기획."], "concepts": ["1. 은행 대출과 신용통화  현대의 은행 대출은 일반적으로 차입자의 예금을 동시에 만들어 내는 방식으로 작동합니다. 가령 가상의 은행이 100을 대출하면 자산에 대출채권, 부채에 예금이 함께 생길 수 있습니다. 대출을 무한히 늘릴 수 있는 것은 아니며 자본·유동성·신용위험·자금조달 비용과 대출 수요 등의 제약을 받습니다. 경준은 지급준비율을 탐구했지만 단순한 통화승수 모형이 현실을 그대로 설명한다고 말하면 부정확합니다. 이 부분은 독서에서 출발한 관심을 현대 통화의 작동 방식으로 보완하는 설명입니다.", "2. 구독경제와 고객 유지  구독경제는 이용자가 일정 기간마다 대가를 내고 재화나 서비스에 접근하는 거래 방식입니다. 기업은 반복 매출을 기대하지만 고객 이탈과 서비스 제공 비용도 관리해야 합니다. 가령 월 1만 원인 가상의 서비스를 1년 쓰면 12만 원이므로 소비자는 실제 이용량과 대안을 비교해야 합니다. 경준의 기록에는 구독경제의 장단점과 활용 분야를 설명한 활동이 있으나 특정 상품의 실적을 검증했다는 내용은 없습니다. 반복 결제가 있다는 사실이 지속 가능한 수익이나 소비자 편익을 자동 보장하지 않습니다."], "follow": ["지급준비율이 낮아지면 대출이 반드시 늘어나나요?  반드시 그렇지는 않습니다. 대출 수요와 신용위험, 은행의 자본·유동성 조건, 정책금리 같은 요인도 함께 작용하므로 자동적인 비례관계로 설명하기 어렵습니다."], "memory": "신용은 대출·예금의 관계 → 현실의 제약 → 구독은 반복 매출과 유지 비용", "caution": "", "source_refs": [34, 35], "university": "공통", "kind": "답변", "glossary": [91]}, {"id": 106, "question": "AI와 로봇이 일자리에 미치는 영향을 어떻게 보았습니까?", "category": "학생부 확장 Ⅰ · 기초 탐구와 경제적 시각", "answer": ["저는 AI가 일자리를 늘리는지 줄이는지 하나로 답하기보다 어떤 업무가 바뀌고 누가 전환 비용을 부담하는지 보고 싶었습니다. 1학년 탐구에서 생산성 향상과 새 직업의 가능성, 숙련과 소득 격차가 커질 가능성을 함께 살폈습니다. 같은 기술도 활용 환경에 따라 다른 결과가 될 수 있다고 생각했습니다.", "그래서 재교육을 제안할 때도 교육을 받으라는 말만으로 충분한지 질문했습니다. 시간과 비용의 제약을 함께 고려해야 하기 때문입니다. 이후 직접 AI 도구를 만들며 어떤 작업은 자동화하고 어떤 판단은 검토해야 하는지 더 구체적으로 생각하게 됐습니다. 기술의 가능성을 활용하면서 변화에 참여할 조건도 살피고 싶습니다."], "evidence": ["1학년 · 자율활동 사회 돋보기 활동 | PDF 1쪽 / 인쇄 2쪽\nAI·로봇의 생산성·직업 창출과 불평등·숙련 격차를 함께 분석하고 재교육·책임 분담을 제안.", "3학년 · 자율활동 | PDF 4쪽 / 인쇄 5쪽\nAI 정보 도구를 직접 구현하며 기능과 신뢰 판단의 역할을 구별."], "concepts": ["1. 업무의 대체와 보완  하나의 직업은 여러 업무로 구성되며 기술이 일부 업무를 자동화해도 직업 전체가 사라지는 것은 아닙니다. 가령 가상의 상담 직무에서 AI가 자료 검색을 줄여 주면 사람은 복잡한 설명과 관계 조정에 더 시간을 쓸 수 있습니다. 반대로 조직이 인력을 줄이는 선택도 가능하므로 결과는 수요와 제도에 달려 있습니다. 경준의 탐구는 생산성 향상과 격차를 함께 살폈다는 점이 핵심입니다. 기술에 노출될 가능성을 실제 실업률이나 확정된 일자리 감소 수치와 동일시하지 않습니다.", "2. 전환 비용과 재교육  전환 비용에는 새로운 기술을 배우는 돈과 시간, 직무 이동 중의 소득 손실 등이 포함됩니다. 가령 가상의 근로자가 교육을 받을 수 있어도 생계 때문에 시간을 낼 수 없다면 형식적인 교육 기회만으로는 전환이 어렵습니다. 기업의 훈련, 공공 지원, 시간 보장 같은 설계를 함께 검토할 수 있습니다. 경준은 정부와 기업의 책임 분담을 제안했지만 실제 정책의 효과를 계량 검증한 것은 아닙니다. 생산성 증가가 모든 사람의 임금 상승으로 자동 연결된다고 보기보다 이익이 분배되는 경로를 살펴야 합니다."], "follow": ["AI를 규제하면 일자리가 보호되나요?  일부 위험을 줄일 수 있지만 규제의 내용과 산업에 따라 효과가 다를 것입니다. 기술의 활용과 전환 지원을 함께 보고, 어떤 업무와 근로자가 영향을 받는지부터 확인해야 합니다."], "memory": "직업보다 업무 → 대체와 보완 → 숙련 격차 → 전환 비용을 나누는 제도", "caution": "", "source_refs": [36], "university": "공통", "kind": "답변", "glossary": [85]}, {"id": 107, "question": "방송부에서 카메라 원리를 탐구한 경험을 설명해보세요.", "category": "학생부 확장 Ⅰ · 기초 탐구와 경제적 시각", "answer": ["행사 촬영을 하며 좋은 결과를 얻으려면 장비뿐 아니라 촬영 조건을 이해해야 한다는 걸 배웠습니다. 어두운 곳에서 셔터를 느리게 하면 밝기는 확보할 수 있지만 움직임이 흐려질 수 있습니다. ISO를 높이는 선택도 화질과 함께 고려해야 해서 여러 설정의 관계를 살펴봤습니다.", "저는 원하는 결과가 나오지 않을 때 어떤 조건을 바꿔야 하는지 알아보는 과정이 재미있었습니다. 방송반에서는 경제를 생활 사례와 퀴즈로 설명하는 프로그램도 기획했습니다. 촬영 경험을 억지로 진로에 연결하기보다, 하나는 조건을 이해하며 수정하는 경험이고 다른 하나는 지식을 쉽게 전달하려는 시도였다고 설명하고 싶습니다."], "evidence": ["1학년 · 동아리활동 방송반 | PDF 1–2쪽 / 인쇄 2–3쪽\n행사 촬영, DSLR ISO·셔터 속도와 노이즈 조정 탐구, 경제 방송 프로그램 기획.", "2학년 · 동아리활동 경제해부학2 | PDF 3쪽 / 인쇄 4쪽\n경제 개념을 학습지로 설명하고 공유한 활동."], "concepts": ["1. 셔터 속도·조리개·ISO  셔터 속도는 빛을 받는 시간, 조리개는 렌즈로 들어오는 빛의 양과 심도에 관련되고, ISO 설정은 이미지 신호의 처리와 밝기 표현에 관련됩니다. 가령 가상의 실내 운동 장면에서 셔터를 느리게 하면 빛을 더 받을 수 있지만 움직임이 흐려질 수 있습니다. 빠른 셔터를 유지하려 ISO를 높일 때는 화질과 노이즈도 살펴야 합니다. 경준은 이런 촬영 조건을 탐구했습니다. ISO를 올리면 센서에 들어오는 빛 자체가 늘어난다거나, 낮추기만 하면 모든 문제가 해결된다고 설명하지 않습니다.", "2. 제약 속의 선택과 전달 방식  촬영에서는 밝기, 움직임의 선명함, 노이즈 등 여러 목표가 동시에 충족되기 어려울 수 있어 상황에 맞는 선택이 필요합니다. 이는 경제학의 제약과 상충을 이해하는 데 사용할 수 있는 비유입니다. 가령 가상의 축제 기록에서는 순간을 놓치지 않는 것이 약간의 노이즈보다 중요할 수 있습니다. 다만 촬영 선택과 경제 모형이 완전히 같은 원리라고 단정할 필요는 없습니다. 경준은 경제 방송을 기획하면서 퀴즈와 시각자료로 설명 방식을 바꿔 보려 했으며, 기획과 실제 방송 실행은 구분합니다."], "follow": ["어두운 곳에서는 ISO를 무조건 낮추면 되나요?  그렇지 않습니다. 낮추면 필요한 밝기를 확보하기 위해 셔터를 느리게 하거나 조리개를 조절해야 할 수 있습니다. 대상의 움직임과 흔들림까지 함께 고려해야 합니다."], "memory": "어두운 행사 촬영 → 밝기·움직임·노이즈의 선택 → 경제를 쉽게 설명하는 기획", "caution": "", "source_refs": [37, 38], "university": "공통", "kind": "답변", "glossary": [67, 68]}, {"id": 108, "question": "퀀트 투자와 모의투자를 할 때 무엇을 기준으로 판단했습니까?", "category": "학생부 확장 Ⅰ · 기초 탐구와 경제적 시각", "answer": ["저는 판단의 근거를 숫자와 자료로 설명할 수 있는지에 관심을 뒀습니다. 1학년에는 퀀트 투자와 분산투자를 조사해 창업을 기획했고, 2학년 모의투자에서는 기사와 주가의 변동폭, 산업의 성장성, 매출총이익률 같은 지표를 살폈습니다. 실제 투자상품을 운용하거나 수익성을 검증한 활동은 아닙니다.", "이 과정에서 좋은 산업이라는 설명과 좋은 투자 판단은 다를 수 있다는 점을 배웠습니다. 성장 기대가 이미 가격에 들어 있을 수 있고, 여러 기업을 골라도 같은 위험에 노출될 수 있습니다. 그래서 결과 수익률만으로 판단하기보다 당시의 근거와 위험을 돌아보고 싶었습니다. 대학에서는 재무와 통계를 배워 이런 지표를 더 정확하게 해석하겠습니다."], "evidence": ["1학년 · 진로활동 진로 연계 프로젝트 활동 | PDF 2쪽 / 인쇄 3쪽\n퀀트 트레이딩과 분산투자 자료를 조사한 창업 기획.", "2학년 · 동아리활동 경제해부학2 | PDF 3쪽 / 인쇄 4쪽\n모의투자에서 기사·변동폭·성장성·매출총이익률 등을 판단 기준으로 사용."], "concepts": ["1. 퀀트 전략과 검증  퀀트 투자는 자료와 수량화된 규칙을 활용해 투자 판단을 구성하는 접근입니다. 가령 가상의 전략이 특정 재무지표를 기준으로 종목을 고를 수 있습니다. 그러나 과거 자료에 잘 맞도록 규칙을 반복 조정하면 과최적화가 생길 수 있어 새 자료와 거래비용도 고려해야 합니다. 경준의 기록은 기획과 자료 조사이며 실제 알고리즘 운용이나 검증된 수익률 실적은 아닙니다.", "2. 매출총이익률과 기업 평가  매출총이익률은 매출에서 매출원가를 뺀 매출총이익을 매출로 나눈 비율입니다. 가령 가상의 매출 100과 매출원가 60이면 40%입니다. 여기에는 판매관리비와 금융비용 등이 모두 반영되지 않으므로 순이익률과 다릅니다. 경준은 모의투자에서 정량지표를 활용했지만 높은 비율 하나만으로 좋은 투자라고 판단할 수는 없습니다. 성장 전망과 현재 가격, 산업의 특성도 살펴야 합니다.", "3. 분산투자의 범위  분산투자는 서로 다른 위험 특성을 가진 자산을 나눠 보유해 특정 자산의 위험을 줄이려는 방법입니다. 가령 가상의 기술주 여러 개를 보유해도 금리나 산업 충격에 함께 움직일 수 있습니다. 따라서 종목 수가 많다는 사실만으로 충분히 분산됐다고 볼 수 없으며 시장 전체의 위험도 남습니다. 경준의 활동에서는 분산 효과를 고려했다는 사실과 실제 손실을 막았다는 성과를 구별합니다."], "follow": ["그 판단 기준만으로 투자 성과를 보장할 수 있나요?  그럴 수는 없습니다. 성장성과 수익성이 좋아 보여도 이미 주가에 반영됐을 수 있고 시장 전체의 위험도 남습니다. 지표의 의미와 가격, 분산 정도를 함께 살펴야 한다고 생각합니다."], "memory": "퀀트는 기획 → 모의투자는 근거와 지표
